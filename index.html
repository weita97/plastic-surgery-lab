<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1565C0">
<meta name="description" content="整形外科博士生的单文件科研与学习工作台：科研语录、科研英语、文献指南、科研进展、实验排期、科研体能、账本、科普热点、选题与科研复盘。">
<title>整形外科科研工作台</title>
<style>
:root{
  --blue:#1565C0;
  --blue-700:#0D47A1;
  --blue-800:#0A3470;
  --blue-50:#EAF3FC;
  --blue-100:#D6E8FA;
  --ink:#13243A;
  --muted:#61748C;
  --faint:#8A9BB0;
  --line:#DEE9F5;
  --line-2:#EDF3FA;
  --bg:#F4F8FD;
  --card:#FFFFFF;
  --ok:#0E9F6E;
  --warn:#D98A00;
  --danger:#D64545;
  --purple:#6D5BD0;
  --r:14px;
  --shadow:0 1px 2px rgba(16,52,94,.04),0 10px 28px rgba(21,101,192,.055);
  --shadow-sm:0 1px 2px rgba(16,52,94,.05);
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body:has(#__bp_widget){padding-right:44px}
body{
  font-family:var(--font);
  background:
    radial-gradient(900px 400px at 88% -10%,rgba(21,101,192,.08),transparent 62%),
    linear-gradient(180deg,#F7FAFE 0%,var(--bg) 100%);
  color:var(--ink);
  font-size:13.5px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:rgba(21,101,192,.18)}
.app{display:flex;min-height:100vh}

/* ---------------- sidebar ---------------- */
.sidebar{
  width:226px;flex:0 0 226px;background:#fff;border-right:1px solid var(--line);
  height:100vh;position:sticky;top:0;display:flex;flex-direction:column;
  padding:14px 12px 10px;z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px 12px;border-bottom:1px solid var(--line-2)}
.brand-mark{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--blue),#0B4A96);color:#fff;font-weight:800;
  font-size:18px;letter-spacing:-1px;box-shadow:0 4px 10px rgba(21,101,192,.22);flex:none;
}
.brand-name{font-size:13.5px;font-weight:800;letter-spacing:.2px;line-height:1.3}
.brand-sub{font-size:10.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.identity{
  margin:11px 2px 10px;padding:9px 10px;border-radius:11px;
  background:linear-gradient(135deg,#F1F7FE,#F8FBFF);border:1px solid #E3EEFA;
}
.identity-top{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--blue-700)}
.identity-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(14,159,110,.12)}
.identity-field{font-size:10.5px;line-height:1.5;color:var(--muted);margin-top:4px}
.identity-date{font-size:10.5px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between;gap:4px}
.nav-label{font-size:10px;letter-spacing:.12em;color:var(--faint);padding:2px 8px 5px;font-weight:700}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;padding-right:2px;flex:1;scrollbar-width:thin}
.nav::-webkit-scrollbar{width:4px}
.nav::-webkit-scrollbar-thumb{background:#DCE7F3;border-radius:4px}
.nav-item{
  display:flex;align-items:center;gap:9px;border:0;background:transparent;border-radius:9px;
  padding:7px 9px;text-align:left;color:#3A4E66;transition:.16s;width:100%;
}
.nav-item:hover{background:var(--blue-50);color:var(--blue-700)}
.nav-item.active{background:linear-gradient(135deg,var(--blue),#0E57A6);color:#fff;box-shadow:0 3px 8px rgba(21,101,192,.2)}
.nav-ico{width:20px;text-align:center;font-size:14px;line-height:1}
.nav-text{font-size:12.3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-count{margin-left:auto;font-size:9.5px;opacity:.7;font-variant-numeric:tabular-nums}
.sidebar-foot{border-top:1px solid var(--line-2);padding:9px 4px 0;margin-top:8px}
.mini-progress{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted)}
.mini-track{height:5px;flex:1;background:#E8F1FA;border-radius:99px;overflow:hidden}
.mini-fill{height:100%;background:linear-gradient(90deg,var(--blue),#49A0F0);border-radius:99px;transition:width .3s}
.sidebar-note{font-size:9.5px;color:var(--faint);line-height:1.5;margin-top:6px}

/* ---------------- main / topbar ---------------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:52px;flex:none;display:flex;align-items:center;gap:12px;
  padding:0 20px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;
}
.menu-btn{display:none}
.topbar-crumb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;min-width:0}
.topbar-crumb b{color:var(--ink);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb-sep{opacity:.45}
.topbar-spacer{flex:1}
.topbar-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);white-space:nowrap}
.topbar-date{font-variant-numeric:tabular-nums}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;
  background:var(--blue-50);color:var(--blue-700);font-size:10.5px;font-weight:700;border:1px solid #D9E9F9;
  white-space:nowrap;
}
.pill.green{background:#E9F8F2;color:#087A55;border-color:#CDEFE2}
.pill.amber{background:#FFF6E5;color:#9A6200;border-color:#F6E3B8}
.pill.gray{background:#F1F5FA;color:#5B6D82;border-color:#E2EAF3}
.content{flex:1;padding:16px 20px 28px;max-width:1360px;width:100%;margin:0 auto}
.page-foot{max-width:1360px;width:100%;margin:0 auto;padding:0 20px 20px;font-size:10px;color:var(--faint);display:flex;justify-content:space-between;gap:12px}

/* ---------------- generic ---------------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.card-pad{padding:14px 16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line-2)}
.card-head h3{margin:0;font-size:13.5px}
.card-head .hint{font-size:10.5px;color:var(--muted)}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:10px}
.rowline{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:11px}
.tiny{font-size:10px}
.mono{font-family:var(--mono);font-size:11px}
.strong{font-weight:700}
.center{text-align:center}
.nowrap{white-space:nowrap}
.hr{height:1px;background:var(--line-2);margin:10px 0}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

.page-head{
  display:flex;align-items:flex-start;gap:13px;margin:2px 0 13px;flex-wrap:wrap;
}
.page-ico{
  width:43px;height:43px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:21px;
  background:linear-gradient(145deg,#EAF3FC,#D8E9FA);border:1px solid #D3E6F8;
}
.page-title{font-size:20px;font-weight:800;letter-spacing:-.2px;line-height:1.25;margin:0}
.page-sub{font-size:11.5px;color:var(--muted);margin-top:3px;max-width:760px}
.page-head-main{flex:1;min-width:200px}
.page-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);
  background:#fff;border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:600;color:#334A63;
  transition:.15s;white-space:nowrap;line-height:1.4;
}
.btn:hover{border-color:#B9D2EC;background:#F8FBFF;color:var(--blue-700);text-decoration:none}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:#0E57A6;border-color:#0E57A6;color:#fff}
.btn-soft{background:var(--blue-50);border-color:#D6E8FA;color:var(--blue-700)}
.btn-soft:hover{background:#E0EFFC}
.btn-xs{padding:3px 7px;font-size:10.5px;border-radius:6px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--blue-50);color:var(--blue-700)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{
  width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);background:#fff;
  border-radius:8px;color:#40566F;font-size:15px;line-height:1;
}
.icon-btn:hover{background:var(--blue-50);color:var(--blue-700)}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{
  display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:99px;
  font-size:10px;font-weight:700;line-height:1.7;white-space:nowrap;
}
.tag-blue{background:#E9F3FD;color:#145EA8}
.tag-purple{background:#F0EDFD;color:#5946B8}
.tag-green{background:#E8F8F1;color:#087A55}
.tag-amber{background:#FFF5E3;color:#956000}
.tag-red{background:#FDECEC;color:#B53030}
.tag-gray{background:#F1F5FA;color:#566A80}
.kv{display:grid;grid-template-columns:64px 1fr;gap:3px 8px;font-size:11.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.text-block{font-size:12.3px;line-height:1.72}
.trans{color:#50647C;font-size:11.8px;line-height:1.75;border-left:2px solid #DCE9F7;padding-left:9px;margin-top:7px}
.callout{background:#F7FAFE;border:1px solid #E5EFFA;border-radius:10px;padding:9px 11px;font-size:11.5px;color:#3F556E}
.callout b{color:var(--blue-700)}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:12px}

/* ---------------- dashboard strip ---------------- */
.stat-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:13px}
.stat{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;
  display:flex;align-items:center;gap:9px;min-width:0;box-shadow:var(--shadow-sm);
}
.stat-ico{width:30px;height:30px;border-radius:9px;background:var(--blue-50);display:grid;place-items:center;font-size:15px;flex:none}
.stat-label{font-size:9.8px;color:var(--muted);line-height:1.3}
.stat-value{font-size:15px;font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums}
.stat-value small{font-size:10px;font-weight:600;color:var(--muted)}

/* ---------------- quotes ---------------- */
.quote-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.quote-card{
  color:#fff;border-radius:15px;padding:15px 15px 12px;min-height:182px;display:flex;flex-direction:column;
  position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(30,60,120,.12);
}
.quote-card:after{
  content:"";position:absolute;width:120px;height:120px;border-radius:50%;
  right:-40px;top:-50px;background:rgba(255,255,255,.12);
}
.quote-card.q-purple{background:linear-gradient(140deg,#5B4BC4,#8A78E8)}
.quote-card.q-blue{background:linear-gradient(140deg,#0D47A1,#2F8ADF)}
.quote-card.q-green{background:linear-gradient(140deg,#087A55,#25B58A)}
.quote-cat{font-size:9.5px;font-weight:800;letter-spacing:.08em;opacity:.82;text-transform:uppercase}
.quote-text{font-size:14.5px;font-weight:700;line-height:1.65;margin:8px 0 6px;letter-spacing:.05px}
.quote-author{font-size:11px;font-weight:700;opacity:.92;margin-top:auto}
.quote-note{font-size:10.6px;line-height:1.6;opacity:.82;margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.22)}
.quote-actions{display:flex;gap:4px;margin-top:7px;position:relative;z-index:2}
.qbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:2px 7px;font-size:10px}
.qbtn:hover{background:rgba(255,255,255,.28)}

/* ---------------- tabs ---------------- */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:3px;background:#EDF4FB;border:1px solid #E1ECF8;border-radius:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:0;background:transparent;border-radius:7px;padding:5px 10px;font-size:11.5px;font-weight:700;color:#536980;
  white-space:nowrap;line-height:1.5;
}
.tab:hover{color:var(--blue-700)}
.tab.active{background:#fff;color:var(--blue-700);box-shadow:0 1px 4px rgba(16,52,94,.1)}
.subtabs{display:flex;gap:5px;flex-wrap:wrap}
.seg{display:inline-flex;background:#F0F5FB;border:1px solid #E4EDF7;border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:3px 8px;font-size:10.5px;font-weight:700;color:#61748C}
.seg button.active{background:#fff;color:var(--blue-700);box-shadow:0 1px 3px rgba(16,52,94,.1)}

/* ---------------- list rows ---------------- */
.list{display:flex;flex-direction:column}
.list-row{padding:9px 0;border-bottom:1px dashed #E7EFF8}
.list-row:last-child{border-bottom:0}
.list-row:hover{background:#FBFDFF}
.row-title{font-size:12.5px;font-weight:700;line-height:1.5;color:#1B3550}
.row-title.en{font-size:12.8px;letter-spacing:.05px}
.row-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:10.3px;color:var(--muted);margin-top:2px}
.row-main{display:flex;align-items:flex-start;gap:10px}
.row-body{flex:1;min-width:0}
.row-actions{display:flex;gap:4px;align-items:center;flex:none;margin-top:2px}
.learned{opacity:.55}
.learned .row-title{text-decoration:line-through}
.ipa{font-family:var(--mono);font-size:10.6px;color:#7A8FA6}
.enquote{font-style:italic}
.phrase-grid{display:block;column-count:2;column-gap:22px}
.phrase-grid .list-row{break-inside:avoid;padding:7px 2px}
details.clean{border:0}
details.clean>summary{list-style:none;cursor:pointer}
details.clean>summary::-webkit-details-marker{display:none}
details.clean>summary .chev{transition:.2s;display:inline-block;color:var(--faint);font-size:10px;margin-left:2px}
details.clean[open]>summary .chev{transform:rotate(90deg)}
.expand-body{padding:9px 0 2px;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}
.lesson{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}
.lesson+.lesson{margin-top:7px}
.lesson summary .row-title{display:inline}
.vocab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;margin-top:7px}
.vocab-item{display:flex;align-items:baseline;gap:5px;font-size:10.8px;border-bottom:1px dotted #EDF3FA;padding:2px 0;min-width:0}
.vocab-item b{font-size:11.3px;color:#193753;white-space:nowrap}
.vocab-item .ipa{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vocab-item span:last-child{color:#5B7087;margin-left:auto;text-align:right}

/* ---------------- literature ---------------- */
.lit-row{padding:11px 0;border-bottom:1px solid var(--line-2)}
.lit-row:last-child{border-bottom:0}
.lit-title{font-size:12.8px;font-weight:700;line-height:1.5}
.lit-title a{color:#183651}
.lit-title a:hover{color:var(--blue)}
.lit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin-top:6px;font-size:11.2px}
.lit-field{display:flex;gap:5px;min-width:0}
.lit-field b{color:var(--muted);font-weight:600;flex:none}
.progress-line{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.track{height:6px;background:#E9F2FB;border-radius:99px;overflow:hidden;flex:1}
.track>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#54A8EF);border-radius:99px;transition:width .3s}

/* ---------------- research ---------------- */
.journal-row{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px dashed #E7EFF8}
.journal-row:last-child{border-bottom:0}
.ifstar{color:#E8A200;font-size:10px;letter-spacing:1px;white-space:nowrap}
.abs{font-size:11.4px;line-height:1.7;color:#415A73;margin-top:5px}
.abs.en{font-size:11.8px;color:#334C66}
.dir-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dir-card{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
.dir-card h4{margin:0 0 3px;font-size:11.5px;color:var(--blue-700)}
.dir-card .row-title{font-size:11.4px}
.vocab-cloud{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.word-card{border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:#fff;display:flex;align-items:center;gap:6px;min-width:0}
.word-card b{font-size:11.4px;color:#183651;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.word-card .ipa{font-size:9.8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.word-card span:last-child{font-size:10px;color:#60758B;margin-left:auto;white-space:nowrap}
.word-card .speak{flex:none}

/* ---------------- schedule ---------------- */
.cal-toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.cal-month{font-size:13px;font-weight:800;min-width:112px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-head{font-size:9.5px;text-align:center;color:var(--muted);font-weight:700;padding:2px 0}
.cal-day{min-height:58px;border:1px solid var(--line);border-radius:9px;padding:5px 6px;background:#fff;position:relative;overflow:hidden}
.cal-day.out{opacity:.35}
.cal-day.today{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:#FBFDFF}
.cal-num{font-size:10.5px;font-weight:800;color:#40566F;display:flex;justify-content:space-between;align-items:center}
.cal-day.today .cal-num{color:var(--blue)}
.cal-shift{font-size:9.2px;font-weight:700;border-radius:5px;padding:1px 4px;margin-top:5px;display:inline-block;line-height:1.5}
.shift-24{background:#FDE7E7;color:#B32626}
.shift-night{background:#E9E8FB;color:#4D3DA8}
.shift-day{background:#E6F6EE;color:#087A55}
.shift-cell{background:#E9E8FB;color:#4D3DA8}
.shift-animal{background:#FDE7E7;color:#B32626}
.shift-assay{background:#E6F6EE;color:#087A55}
.shift-hist{background:#E3F2FD;color:#1565C0}
.shift-analysis{background:#FFF4E0;color:#9A5A00}
.shift-rest{background:#F1F5FA;color:#6A7D92}
.weekend .cal-num{color:#B32626}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:9.8px;color:var(--muted);margin-top:8px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:3px}
.upcoming{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:8px}
.up-day{border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;font-size:9.5px;background:#fff}
.up-day b{display:block;font-size:10.5px;margin:1px 0}

/* ---------------- fitness ---------------- */
.fit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.fit-card{border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff}
.fit-card h4{margin:0 0 2px;font-size:12px;display:flex;align-items:center;gap:5px}
.fit-card .fit-intro{font-size:10.5px;color:var(--muted);line-height:1.55;min-height:32px}
.fit-moves{margin:5px 0 0;padding:0;list-style:none;font-size:10.6px;color:#3F556E}
.fit-moves li{padding:2px 0;border-bottom:1px dotted #EDF3FA;display:flex;justify-content:space-between;gap:6px}
.fit-moves li:last-child{border-bottom:0}
.fit-moves b{font-weight:700;color:#233E58}
.fit-moves span{color:#7A8FA6;white-space:nowrap;font-size:9.8px}
.fit-links{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.week-table{width:100%;border-collapse:collapse;font-size:10.8px}
.week-table th,.week-table td{border-bottom:1px solid var(--line-2);padding:6px 7px;text-align:left;vertical-align:top}
.week-table th{color:var(--muted);font-size:9.8px;font-weight:700;background:#F8FBFE}
.week-table tr.today td{background:#EFF7FF;font-weight:700;color:var(--blue-700)}

/* ---------------- ledger ---------------- */
.ledger-form{display:grid;grid-template-columns:122px 104px minmax(140px,1fr) minmax(100px,.9fr) minmax(150px,1.2fr);gap:6px;align-items:end}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:9.5px;color:var(--muted);font-weight:700}
.input,select.input,textarea.input{
  border:1px solid #D8E5F3;border-radius:7px;background:#fff;padding:6px 8px;font-size:11.5px;outline:none;
  width:100%;min-width:0;transition:.15s;
}
.input:focus{border-color:#7FB3E8;box-shadow:0 0 0 3px rgba(21,101,192,.08)}
textarea.input{resize:vertical;line-height:1.6}
.money-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.money{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:linear-gradient(180deg,#fff,#FAFCFF)}
.money .l{font-size:9.8px;color:var(--muted)}
.money .v{font-size:19px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.money .v small{font-size:10px;color:var(--muted);font-weight:600}
.bar-list{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:54px 1fr 58px;gap:7px;align-items:center;font-size:10.5px}
.bar-track{height:9px;border-radius:99px;background:#EDF4FB;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#1565C0,#5FB0F2)}
.ledger-history{max-height:260px;overflow:auto;scrollbar-width:thin}
.ledger-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #E8F0F8;font-size:11px}
.ledger-item:last-child{border-bottom:0}
.ledger-item .amt{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.del{border:0;background:transparent;color:#B8C6D6;font-size:12px;padding:2px 4px;border-radius:4px}
.del:hover{color:var(--danger);background:#FDF0F0}

/* ---------------- video / topics ---------------- */
.video-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.video-card{border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff}
.video-card h4{margin:0;font-size:12.2px;display:flex;align-items:center;gap:6px}
.video-card .vdesc{font-size:10.5px;color:var(--muted);line-height:1.55;margin:3px 0 5px}
.vmeta{font-size:10.4px;line-height:1.6;color:#3E556E}
.vmeta b{color:#203C57}
.example-title{font-size:10.5px;background:#F7FAFE;border:1px solid #E8F1FA;border-radius:6px;padding:4px 7px;margin:3px 0;color:#28445F}
.topic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.topic-card{border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff;display:flex;flex-direction:column}
.topic-card h4{margin:0 0 4px;font-size:12.2px;line-height:1.5}
.topic-line{font-size:10.5px;line-height:1.6;color:#40566F;margin:1px 0}
.topic-line b{color:#1F3C58}
.fav-active{color:#C58A00!important;border-color:#F1D79A!important;background:#FFF9EA!important}

/* ---------------- review ---------------- */
.review-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:10px}
.star-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.star-item{display:flex;flex-direction:column;gap:2px}
.star-item label{font-size:9.8px;font-weight:800;color:var(--blue-700)}
.review-history{max-height:360px;overflow:auto;scrollbar-width:thin}
.review-item{border:1px solid var(--line);border-radius:9px;padding:8px 9px;margin-bottom:6px;background:#fff}
.review-item .d{font-size:9.8px;color:var(--muted);font-weight:700}
.review-item .s{font-size:10.7px;line-height:1.55;margin-top:2px;color:#3D556F;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ---------------- quiz ---------------- */
.quiz{margin-top:14px}
.quiz-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.quiz-head h3{margin:0;font-size:12.8px}
.q{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px;background:#fff}
.q-title{font-size:11.8px;font-weight:700;margin-bottom:5px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px}
.opt{display:flex;gap:5px;align-items:flex-start;font-size:10.9px;color:#3E556E;padding:2px 0;cursor:pointer}
.opt input{margin:2px 0 0;accent-color:var(--blue)}
.quiz-result{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;background:#F2FAF7;border:1px solid #D5EEE4;font-size:11.5px;color:#086B4D}
.quiz-result b{font-size:18px}
.exp{font-size:10.5px;color:#6A7E93;margin-top:3px;display:none}
.q.graded .exp{display:block}
.q.correct{border-color:#BDE7D8;background:#FBFEFC}
.q.wrong{border-color:#F3C9C9;background:#FFFCFC}

/* ---------------- toast / modal-free ---------------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);background:#123A66;color:#fff;
  padding:8px 14px;border-radius:9px;font-size:11.5px;box-shadow:0 8px 28px rgba(9,35,65,.25);
  opacity:0;pointer-events:none;transition:.22s;z-index:100;max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}
.en-only .zh-toggle{display:none!important}
.ledger-form .field-submit{grid-column:1/-1;display:flex;flex-direction:row;align-items:center;justify-content:flex-end}
.review-form .field{margin-bottom:7px}
.review-form textarea.input{min-height:62px}
.star-item textarea.input{min-height:54px}
.section-title{font-size:12px;font-weight:800;color:#26435F;margin:12px 0 5px;display:flex;align-items:center;gap:6px}
.section-title:first-child{margin-top:0}
.cat-pills{display:flex;gap:4px;flex-wrap:wrap}
.cat-pill{border:1px solid #DFEAF6;background:#fff;color:#57708A;border-radius:99px;padding:3px 9px;font-size:10px;font-weight:700}
.cat-pill:hover{border-color:#9EC5EA;color:var(--blue-700)}
.cat-pill.active{background:var(--blue);border-color:var(--blue);color:#fff}
.mini-list{margin:4px 0 0;padding-left:16px;font-size:10.8px;line-height:1.65;color:#3F556E}
.mini-list li{margin:1px 0}

@media(max-width:1100px){
  .stat-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quote-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-104%);transition:transform .22s ease;box-shadow:0 0 40px rgba(9,35,65,.18);width:252px;flex-basis:252px}
  .sidebar.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(10,28,50,.38);z-index:35;opacity:0;pointer-events:none;transition:.2s}
  .scrim.show{opacity:1;pointer-events:auto}
  .menu-btn{display:grid}
  .topbar{padding:0 12px;height:50px}
  .topbar-meta .topbar-date,.topbar-meta .hide-sm{display:none}
  .content{padding:12px 12px 24px}
  .page-foot{padding:0 12px 16px}
  .page-head{gap:9px;margin-bottom:10px}
  .page-ico{width:38px;height:38px;font-size:18px;border-radius:10px}
  .page-title{font-size:18px}
  .quote-grid{grid-template-columns:1fr}
  .quote-card{min-height:150px}
  .g3,.g2,.g4,.lit-grid,.dir-grid,.video-grid,.topic-grid,.vocab-cloud,.vocab{grid-template-columns:1fr}
  .fit-grid{grid-template-columns:1fr}
  .ledger-form{grid-template-columns:1fr 1fr}
  .ledger-form .field:nth-child(5){grid-column:1/-1}
  .phrase-grid{column-count:1}
  .review-grid{grid-template-columns:1fr}
  .star-grid{grid-template-columns:1fr}
  .upcoming{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cal-day{min-height:58px;padding:4px}
  .cal-shift{font-size:8.2px;padding:0 3px}
  .opts{grid-template-columns:1fr}
  .topbar-crumb .crumb-root{display:none}
  .topbar-crumb .crumb-sep{display:none}
  .money-cards{grid-template-columns:1fr 1fr 1fr;gap:5px}
  .money .v{font-size:16px}
}
@media(max-width:520px){
  .stat-strip{gap:6px}
  .stat{padding:7px 8px;gap:7px}
  .stat-ico{width:26px;height:26px;font-size:13px}
  .stat-value{font-size:13.5px}
  .stat-label{font-size:9px}
  .page-actions{width:100%}
  .page-actions .btn{flex:1}
  .cal{gap:3px}
  .cal-day{min-height:52px;border-radius:7px}
  .cal-shift{font-size:7.4px}
  .cal-num{font-size:9px}
  .upcoming{grid-template-columns:repeat(2,minmax(0,1fr))}
  .money-cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
  .money{padding:7px 7px}
  .money .l{font-size:8.8px;white-space:nowrap}
  .money .v{font-size:13.4px}
  .ledger-form{grid-template-columns:1fr 1fr}
  .ledger-form .field:nth-child(5){grid-column:1/-1}
  .tabs{flex-wrap:wrap;overflow:visible}
  .tab{flex:1 1 auto;padding:5px 7px;font-size:11px}
  .quiz-head{flex-direction:column;align-items:flex-start}
  .page-title{font-size:17px}
}
@media print{
  .sidebar,.topbar,.scrim,.toast,.page-actions,.btn,.qbtn{display:none!important}
  .main{width:100%}
  .content{padding:0}
  body{background:#fff}
}

<script>
window.DB = window.DB || {};
DB.quotes = [
  {id:'q01',cat:'创面修复',text:'我包扎伤口，上帝治愈它。',author:'安布鲁瓦兹·帕雷',note:'清创、抗感染、减压与敷料，都是为机体再生创造条件，而不是替代再生。'},
  {id:'q02',cat:'创面修复',text:'伤口是光进入你内心的地方。',author:'鲁米',note:'慢性创面患者常被反复换药和失败消磨，照护要同时处理组织与心理。'},
  {id:'q03',cat:'创面修复',text:'医学的艺术，是让病人在自然治愈的过程中保持愉快。',author:'伏尔泰',note:'创面愈合有自身节律，过度干预和放任不管都可能错过窗口。'},
  {id:'q04',cat:'创面修复',text:'有时去治愈，常常去帮助，总是去安慰。',author:'爱德华·特鲁多',note:'糖尿病足反复溃疡时，减负、护理与长期随访本身就是治疗。'},
  {id:'q05',cat:'创面修复',text:'创面修复不是把伤口盖住，而是给细胞一个愿意继续工作的微环境。',author:'科研札记',note:'敷料、清创、氧合与免疫状态，最终都要落到细胞行为上。'},
  {id:'q06',cat:'干细胞',text:'干细胞不是万能药，微环境决定它往哪里走。',author:'科研札记',note:'移植后的存活、归巢与旁分泌，往往比“打到创面”本身更关键。'},
  {id:'q07',cat:'干细胞',text:'自我更新与分化之间，干细胞维持着精细的平衡。',author:'科研札记',note:'体外扩增会改变干性、衰老与免疫调节能力，代次不是越高越好。'},
  {id:'q08',cat:'干细胞',text:'离开了演化，生物学中的一切都难以理解。',author:'杜布赞斯基',note:'再生能力的种间差异，是理解创面修复策略的重要背景。'},
  {id:'q09',cat:'干细胞',text:'科学是求解可解问题的艺术。',author:'彼得·梅达沃',note:'把“干细胞能不能治好糖尿病足”拆成可检验的机制与终点。'},
  {id:'q10',cat:'干细胞',text:'如果你确信自己在正确的路上，就不要让别人把你关掉。',author:'芭芭拉·麦克林托克',note:'长期课题需要耐心，但也需要用数据不断校准方向。'},
  {id:'q11',cat:'科研方法',text:'机遇偏爱有准备的头脑。',author:'路易·巴斯德',note:'异常结果不是噪音，先看它是否指向一个被忽略的变量。'},
  {id:'q12',cat:'科研方法',text:'第一原则是：你不能欺骗自己，而你自己是最容易被欺骗的人。',author:'理查德·费曼',note:'盲法、对照、重复与原始数据，都是防止自我欺骗的工具。'},
  {id:'q13',cat:'科研方法',text:'发现，是看见所有人都看见的，却想到没有人想到的。',author:'阿尔伯特·圣捷尔吉',note:'同一张切片，换一个染色或换一个时间点，可能就换了一个问题。'},
  {id:'q14',cat:'科研方法',text:'科学的进步依赖新技术、新发现和新想法，大致按这个顺序。',author:'悉尼·布伦纳',note:'单细胞、空间转录组与类器官，正在重写创面研究的提问方式。'},
  {id:'q15',cat:'科研方法',text:'读论文不是从第一页读到最后一页，而是先问它解决了什么问题。',author:'科研札记',note:'先看研究问题、模型与终点，再决定值不值得读方法。'},
  {id:'q16',cat:'临床转化',text:'医学是一门不确定性的科学，也是一门概率的艺术。',author:'威廉·奥斯勒',note:'糖尿病足的多因素性，决定了任何单一疗法都很难包打天下。'},
  {id:'q17',cat:'临床转化',text:'非凡的主张需要非凡的证据。',author:'卡尔·萨根',note:'越是“神奇愈合”的个案，越要回到对照、盲法与可重复性。'},
  {id:'q18',cat:'临床转化',text:'剂量决定毒性。',author:'帕拉塞尔苏斯',note:'细胞治疗同样有剂量、活率、给药途径与时机的问题。'},
  {id:'q19',cat:'临床转化',text:'从实验台到病床，最远的距离往往不是技术，而是可重复性与监管。',author:'科研札记',note:'GMP、批次一致性、终点定义与随访，决定了方案能否真正落地。'},
  {id:'q20',cat:'临床转化',text:'转化不是把小鼠结果直接搬给人，而是把机制变成可验证的方案。',author:'科研札记',note:'动物模型解决机制问题，临床试验回答获益与风险问题。'},
  {id:'q21',cat:'励志成长',text:'生活中没有什么可怕的东西，只有需要理解的东西。',author:'玛丽·居里',note:'把“做不出来”拆成技术、样本、对照与时间四个可处理的问题。'},
  {id:'q22',cat:'励志成长',text:'成功不是终点，失败也不是终结，唯有继续前行的勇气才最重要。',author:'温斯顿·丘吉尔',note:'博士课题的进展常常是非线性的，稳定推进比一次爆发更重要。'},
  {id:'q23',cat:'励志成长',text:'其实地上本没有路，走的人多了，也便成了路。',author:'鲁迅',note:'新方向不是等出来的，是在一次次小实验中踩出来的。'},

    text:"Doctors often ask patients about diet and exercise, but far fewer ask about sleep. Yet sleep is not a luxury. During deep sleep, blood pressure falls, stress hormones settle and the heart gets a rare chance to rest. Studies suggest that people who regularly sleep less than six hours may have a higher risk of high blood pressure and heart disease. The good news is that sleep can be improved. A fixed bedtime, less caffeine after noon and a cool, dark bedroom are simple places to start.",

  {id:'lit01',title:'Cutaneous Wound Healing',zh:'皮肤创面愈合的细胞与分子基础',journal:'N Engl J Med',year:1999,design:'经典综述（止血、炎症、增殖、重塑四阶段）',finding:'系统梳理创面愈合各阶段的细胞类型、生长因子与基质重塑，指出慢性创面的核心是阶段停滞。',meaning:'建立创面修复的通用语言，是理解糖尿病创面“卡在哪一步”的入门框架。',q:'Singer Clark cutaneous wound healing New England Journal 1999'},
  {id:'lit02',title:'Wound Repair and Regeneration',zh:'创面修复与再生',journal:'Nature',year:2008,design:'机制综述',finding:'将成体创面修复与胚胎/低等脊椎动物再生对比，强调炎症、干细胞与微环境对再生能力的限制。',meaning:'提示“修复”不等于“再生”，糖尿病创面研究需要区分瘢痕性修复与功能性再生。',q:'Gurtner wound repair and regeneration Nature 2008'},
  {id:'lit03',title:'Wound Repair and Regeneration: Mechanisms, Signaling, and Translation',zh:'创面修复与再生：机制、信号与转化',journal:'Sci Transl Med',year:2014,design:'转化医学综述',finding:'总结炎症消退、血管生成、成纤维细胞异质性与干细胞动员的信号网络，并讨论转化失败的原因。',meaning:'为从通路到临床终点设计提供路线图，强调机制必须落到可干预节点。',q:'Eming Martin Tomic-Canic wound repair regeneration mechanisms signaling translation'},
  {id:'lit04',title:'Wound Healing and Its Impairment in the Diabetic Foot',zh:'糖尿病足创面愈合障碍',journal:'Lancet',year:2005,design:'临床综述',finding:'归纳糖尿病足溃疡的神经病变、缺血、感染与代谢因素，解释为何单一换药难以愈合。',meaning:'糖尿病创面是“多因素综合征”，研究设计必须说明控制/匹配了哪些混杂因素。',q:'Falanga wound healing impairment diabetic foot Lancet'},
  {id:'lit05',title:'Cellular and Molecular Basis of Wound Healing in Diabetes',zh:'糖尿病创面愈合的细胞与分子基础',journal:'J Clin Invest',year:2007,design:'机制综述',finding:'聚焦高糖、晚期糖基化终产物、氧化应激与巨噬细胞功能异常对愈合的抑制作用。',meaning:'为选择体外高糖模型、AGEs 刺激与巨噬细胞极化读出提供依据。',q:'Brem Tomic-Canic cellular molecular basis wound healing diabetes'},
  {id:'lit06',title:'Human Skin Wounds: A Major and Snowballing Threat to Public Health and the Economy',zh:'皮肤创面的公共卫生与经济负担',journal:'Wound Repair Regen',year:2009,design:'流行病学与卫生经济学分析',finding:'估算慢性创面患病率与治疗成本，指出人口老龄化与糖尿病将放大疾病负担。',meaning:'为课题的临床意义与卫生经济学背景提供可引用框架。',q:'Sen human skin wounds major snowballing threat public health economy'},
  {id:'lit07',title:'Diabetic Foot Ulcers and Their Recurrence',zh:'糖尿病足溃疡及其复发',journal:'N Engl J Med',year:2017,design:'临床综述',finding:'强调糖尿病足溃疡复发率高，需把减压、足部护理、感染控制与代谢管理整合为长期策略。',meaning:'提示疗效评价不能只看“创面闭合”，还要看复发与保肢。',q:'Armstrong Boulton Bus diabetic foot ulcers recurrence'},
  {id:'lit08',title:'Chronic Wound Healing: A Review of Current Management and Treatments',zh:'慢性创面愈合：现有管理与治疗',journal:'Adv Ther',year:2017,design:'临床综述',finding:'总结清创、敷料、负压、生物制剂与细胞治疗等策略，指出证据质量参差。',meaning:'帮助区分“有结局证据的干预”和“机制上合理但证据不足的干预”。',q:'Han Ceilley chronic wound healing review current management treatments'},
  {id:'lit09',title:'Stem Cell Therapy for Diabetic Foot Ulcers: A Review of Preclinical and Clinical Research',zh:'干细胞治疗糖尿病足：临床前与临床研究综述',journal:'Stem Cell Res Ther',year:2018,design:'转化研究综述',finding:'汇总骨髓、脂肪与脐带来源间充质干细胞的给药途径、剂量与早期临床结果，指出异质性与随访不足。',meaning:'是设计细胞治疗课题时梳理“剂量—途径—终点”差异的关键参考。',q:'stem cell therapy diabetic foot ulcers review preclinical clinical research'},
  {id:'lit10',title:'Mesenchymal Stem Cells for the Treatment of Diabetic Foot Ulcers: A Systematic Review and Meta-Analysis',zh:'间充质干细胞治疗糖尿病足的系统评价与荟萃分析',journal:'Stem Cell Res Ther',year:2019,design:'系统评价与荟萃分析',finding:'合并分析提示间充质干细胞可能提高创面闭合率，但研究样本量小、方案异质、偏倚风险较高。',meaning:'解读“有效”时必须同时看对照、盲法、随访与不良事件报告。',q:'mesenchymal stem cells diabetic foot ulcers systematic review meta-analysis'},
  {id:'lit11',title:'Adipose-Derived Stem Cells for Wound Healing',zh:'脂肪来源干细胞与创面修复',journal:'Stem Cells Int',year:2019,design:'机制与转化综述',finding:'脂肪来源干细胞通过旁分泌、免疫调节与促血管生成参与创面修复，来源丰富且获取相对微创。',meaning:'适合作为糖尿病创面细胞治疗的候选来源，但需关注供体差异与扩增衰老。',q:'adipose-derived stem cells wound healing review'},
  {id:'lit12',title:'Mesenchymal Stem Cell-Derived Exosomes for Wound Healing',zh:'间充质干细胞外泌体与创面修复',journal:'Stem Cell Res Ther',year:2020,design:'机制与转化综述',finding:'外泌体携带 miRNA、蛋白与脂质，可调节炎症、血管生成与细胞增殖，且规避活细胞治疗的部分风险。',meaning:'“无细胞治疗”是当前热点，但产量、纯度、标准化与体内分布仍是瓶颈。',q:'mesenchymal stem cell derived exosomes wound healing'},
  {id:'lit13',title:'Macrophage Polarization in Wound Healing',zh:'巨噬细胞极化与创面愈合',journal:'Front Immunol',year:2019,design:'机制综述',finding:'M1/M2 表型不是二元开关，巨噬细胞在不同时相呈现连续状态，影响炎症消退与组织重塑。',meaning:'糖尿病创面常停滞于促炎状态，巨噬细胞重编程是合理但需精确的干预点。',q:'macrophage polarization wound healing review'},
  {id:'lit14',title:'Biofilms and Chronic Wounds',zh:'生物膜与慢性创面',journal:'J Wound Care',year:2018,design:'机制与临床综述',finding:'生物膜通过屏障、耐药与持续炎症维持创面不愈合，常规拭子培养可能低估其存在。',meaning:'难愈创面需考虑生物膜负荷，清创与局部抗菌策略应进入实验/临床设计。',q:'biofilms chronic wounds review'},
  {id:'lit15',title:'Negative Pressure Wound Therapy for Treating Foot Wounds in People with Diabetes Mellitus',zh:'负压创面治疗糖尿病足创面',journal:'Cochrane Database Syst Rev',year:2015,design:'Cochrane 系统评价',finding:'负压治疗可能提高部分糖尿病足创面闭合率，但证据质量低，硬件、压力与疗程差异大。',meaning:'临床常用不等于证据充分；课题中若使用 NPWT，需要明确参数与对照。',q:'negative pressure wound therapy diabetic foot Cochrane'},
  {id:'lit16',title:'Hyperbaric Oxygen Therapy for Chronic Wounds',zh:'高压氧治疗慢性创面',journal:'Cochrane Database Syst Rev',year:2015,design:'Cochrane 系统评价',finding:'高压氧可能改善部分缺血性糖尿病足创面愈合，但获益不一致，需筛选患者并规范疗程。',meaning:'机制上改善氧合，但并非所有糖尿病创面都缺氧；表型分层是关键。',q:'hyperbaric oxygen therapy chronic wounds Cochrane'},
  {id:'lit17',title:'Skin Substitutes for Treating Chronic Wounds',zh:'皮肤替代物治疗慢性创面',journal:'Cochrane Database Syst Rev',year:2020,design:'Cochrane 系统评价',finding:'多种皮肤替代物可能提高愈合率，但研究设计、产品与终点差异限制了跨产品比较。',meaning:'生物材料/组织工程产品评价需要统一创面基线、清创标准与随访时点。',q:'skin substitutes chronic wounds Cochrane'},

    var v = voices.filter(function (x) {
      return String(x.lang || '').toLowerCase().replace('_', '-').indexOf(pre) === 0;
    })[0];

  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400);
  }
  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('已复制'); }
      catch (e) { toast('复制失败，请手动选择'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制'); }, fallback);
    } else fallback();
  }

  function calcStreak() {
    var v = get('visited', {}), d = new Date(), n = 0;
    while (n < 366) {
      var k = ymd(d);
      if (v[k] && v[k].length) { n++; d.setDate(d.getDate() - 1); }
      else break;
    }
    return n;
  }
  function markVisited(m) {
    var v = get('visited', {}), k = todayStr();
    var arr = v[k] || [];

  function quizHTML(m) {

    return '<section class="quiz" data-quiz="' + m + '">' +
      '<div class="quiz-head"><h3>🧠 今日小测 · ' + qs.length + ' 题</h3>' +
      '<span class="tiny muted">最佳成绩：' + (best == null ? '尚未作答' : best + ' 分') + '</span></div>' +
      qs.map(function (q, qi) {
        return '<div class="q" data-a="' + q.a + '"><div class="q-title">' + (qi + 1) + '. ' + esc(q.q) + '</div>' +
          '<div class="opts">' + q.options.map(function (o, oi) {
            return '<label class="opt"><input type="radio" name="quiz-' + m + '-' + qi + '" value="' + oi + '">' +
              '<span>' + esc(o) + '</span></label>';
          }).join('') + '</div><div class="exp">解析：' + esc(q.e) + '</div></div>';
      }).join('') +
      '<div class="btn-row" style="margin-top:7px">' +
      '<button type="button" class="btn btn-primary" data-act="quiz-submit" data-module="' + m + '">提交答案</button>' +
      '<button type="button" class="btn btn-soft" data-act="quiz-reset">重做</button></div>' +
      '<div class="quiz-result hidden" style="margin-top:8px"></div></section>';
  }

  function gradeQuiz(root) {
    var m = root.getAttribute('data-quiz');
    var qs = $$('.q', root), score = 0, blank = 0;
    qs.forEach(function (q) {
      q.classList.add('graded');
      q.classList.remove('correct', 'wrong');
      var sel = $('input:checked', q);
      if (!sel) { blank++; q.classList.add('wrong'); return; }
      if (Number(sel.value) === Number(q.getAttribute('data-a'))) { score++; q.classList.add('correct'); }
      else q.classList.add('wrong');
    });
    var pct = Math.round(score / qs.length * 100);
    var best = get('quizBest', {});
    if (best[m] == null || pct > best[m]) { best[m] = pct; set('quizBest', best); }
    var r = $('.quiz-result', root);
    r.classList.remove('hidden');
    r.innerHTML = '<b>' + pct + '</b><div>得分 ' + pct + ' 分 · ' + score + '/' + qs.length + ' 题正确 · 最佳 ' + best[m] +
      ' 分' + (blank ? '<br><span class="tiny">还有 ' + blank + ' 题未作答</span>' : '') + '</div>';
    var head = $('.quiz-head .muted', root);
    if (head) head.textContent = '最佳成绩：' + best[m] + ' 分';
    if (blank) toast('还有 ' + blank + ' 题未作答');
  }

  function termEntries(dirKey) {

  /* ---------------- 5. 实验排期 ---------------- */
  function shiftFor(d) {
    var anchor = parseYmd(DB.schedule.anchor);
    var idx = ((dayDiff(d, anchor) % 6) + 6) % 6;
    return DB.schedule.cycle[idx];
  }
  function shiftClass(s) {
    return s.key === 'duty24' ? 'shift-24' : (s.key === 'night' ? 'shift-night' : (s.key === 'off' ? 'shift-rest' : 'shift-day'));
  }
  function renderSchedule() {
    var y = S.month.getFullYear(), m = S.month.getMonth();
    var first = new Date(y, m, 1);
    var offset = (first.getDay() + 6) % 7;
    var days = new Date(y, m + 1, 0).getDate();
    var cells = Math.ceil((offset + days) / 7) * 7;
    var html = pageHead('📅', '实验排期', '六天一轮，以 ' + DB.schedule.anchor + ' 的实验日为锚点；实验、分析、写作、文献、组会与休息循环推进。',
      '<button type="button" class="btn btn-soft" data-act="cal-today">回到今天</button>') +
      '<div class="stat-strip">' + stat('🧪', '今日安排', shiftFor(NOW).label) +
      stat('🔬', '本月实验日', monthCount(y, m, 'duty24') + ' <small>天</small>') +
      stat('📖', '本月文献日', monthCount(y, m, 'night') + ' <small>天</small>') +
      stat('☕', '下次休息', nextOff() + '</div>') +
      '<section class="card"><div class="card-head"><h3>' + y + ' 年 ' + (m + 1) + ' 月</h3><div class="hint">' + DB.schedule.note + '</div></div>' +
      '<div class="card-pad"><div class="cal-toolbar"><button type="button" class="btn btn-xs" data-act="cal-prev">‹ 上一月</button>' +
      '<div class="cal-month">' + y + '.' + pad(m + 1) + '</div><button type="button" class="btn btn-xs" data-act="cal-next">下一月 ›</button></div>' +
      '<div class="cal">' + ['一', '二', '三', '四', '五', '六', '日'].map(function (w) { return '<div class="cal-head">' + w + '</div>'; }).join('') +
      (function () {
        var out = '';
        for (var i = 0; i < cells; i++) {
          var d = new Date(y, m, 1 - offset + i);
          var inMonth = d.getMonth() === m;
          var s = shiftFor(d);
          var wd = d.getDay();
          out += '<div class="cal-day' + (inMonth ? '' : ' out') + (ymd(d) === TODAY ? ' today' : '') + ((wd === 0 || wd === 6) ? ' weekend' : '') + '" title="' + ymd(d) + ' · ' + s.label + '">' +
            '<div class="cal-num"><span>' + d.getDate() + '</span>' + (ymd(d) === TODAY ? '<span class="tiny">今天</span>' : '') + '</div>' +
            '<span class="cal-shift ' + shiftClass(s) + '">' + s.short + '</span></div>';
        }
        return out;
      })() + '</div>' +
      '<div class="legend"><span><i class="shift-24" style="background:#FDE7E7"></i>实验日</span><span><i class="shift-night" style="background:#E9E8FB"></i>文献日</span><span><i class="shift-day" style="background:#E6F6EE"></i>分析 / 写作 / 组会</span><span><i class="shift-rest" style="background:#F1F5FA"></i>休息</span></div>' +
      '<div class="upcoming">' + upcomingHTML(6) + '</div></div></section>' + quizHTML('schedule');
    return html;
  }
  function monthCount(y, m, type) {
    var n = 0, days = new Date(y, m + 1, 0).getDate();
    for (var i = 1; i <= days; i++) if (shiftFor(new Date(y, m, i)).key === type) n++;
    return n;
  }
  function nextOff() {
    var d = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
    for (var i = 1; i <= 20; i++) {
      d.setDate(d.getDate() + 1);
      if (shiftFor(d).key === 'off') return (i === 1 ? '明天' : '周' + '日一二三四五六'[d.getDay()]) + ' · ' + (d.getMonth() + 1) + '/' + d.getDate();
    }
    return '—';
  }
  function upcomingHTML(n) {
    var out = '', d = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
    for (var i = 0; i < n; i++) {
      if (i > 0) d.setDate(d.getDate() + 1);
      var s = shiftFor(d);
      out += '<div class="up-day"><span>' + WEEK[d.getDay()] + '</span><b>' + (d.getMonth() + 1) + '/' + d.getDate() + '</b>' +
        '<span class="cal-shift ' + shiftClass(s) + '" style="margin-top:0">' + s.short + '</span></div>';
    }
    return out;
  }

          '<div class="vmeta"><b>内容框架</b><ol class="mini-list">' + v.frame.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ol></div>' +
          '<div class="vmeta" style="margin-top:4px"><b>技巧</b> ' + esc(v.tip) + '</div>' +
          '<div class="rowline wrap" style="margin-top:5px">' + v.topics.map(function (t) { return '<span class="tag tag-blue">' + esc(t) + '</span>'; }).join('') + '</div>' +
          '<div class="btn-row" style="margin-top:6px"><a class="btn btn-xs btn-ghost" target="_blank" rel="noopener" href="https://search.bilibili.com/all?keyword=' + encodeURIComponent(v.bili) + '">B站搜索 ↗</a>' +
          '<a class="btn btn-xs btn-ghost" target="_blank" rel="noopener" href="https://www.douyin.com/search/' + encodeURIComponent(v.douyin) + '">抖音搜索 ↗</a>' +
          speakBtn(v.name + '。示例：' + v.example + '。技巧：' + v.tip, 'zh-CN') + '</div></article>';
      }).join('') + '</div>' +
      '<div class="callout" style="margin-top:9px">🎥 医疗科普内容需注意平台资质与表述边界：不承诺疗效、不替代面诊、不使用绝对化用语。</div>' + quizHTML('video');
  }

  /* ---------------- 9. 选题灵感 ---------------- */
  function renderTopics() {
    var favs = get('favTopics', []);
    var all = DB.topics;
    var list = S.topicFavOnly ? all.filter(function (t) { return favs.indexOf(t.id) >= 0; }) : (S.topicAll ? all : pickN(all, 4, DAY * 47 + 19));
    return pageHead('💡', '选题灵感', '10 个科研 / 科普选题，每日轮换 4 个；收藏后进入「我的选题库」。',
      '<button type="button" class="btn btn-soft" data-act="topic-fav-only">' + (S.topicFavOnly ? '返回每日选题' : '我的选题库 ' + favs.length) + '</button>' +
      '<button type="button" class="btn btn-soft" data-act="topic-all">' + (S.topicAll ? '只看今日 4 个' : '全部 10 个') + '</button>') +
      (list.length ? '<div class="topic-grid">' + list.map(function (t) {
        var fav = favs.indexOf(t.id) >= 0;
        return '<article class="topic-card"><h4>' + esc(t.title) + '</h4>' +
          '<div class="topic-line"><b>切入角度</b> ' + esc(t.angle) + '</div>' +
          '<div class="topic-line"><b>关键词</b> ' + t.keywords.map(function (k) { return '<span class="tag tag-gray">' + esc(k) + '</span>'; }).join(' ') + '</div>' +
          '<div class="topic-line"><b>适合形式</b> ' + esc(t.format) + '</div>' +
          '<div class="btn-row" style="margin-top:auto;padding-top:6px">' +
          '<button type="button" class="btn btn-xs ' + (fav ? 'fav-active' : '') + '" data-act="topic-fav" data-id="' + esc(t.id) + '">' + (fav ? '★ 已收藏' : '☆ 收藏') + '</button>' +
          '<button type="button" class="btn btn-xs btn-ghost" data-act="topic-copy" data-id="' + esc(t.id) + '">复制选题</button>' +
          speakBtn(t.title + '。' + t.angle + '。适合形式：' + t.format, 'zh-CN') + '</div></article>';
      }).join('') + '</div>' : '<div class="empty">还没有收藏选题。点卡片上的「☆ 收藏」即可加入我的选题库。</div>') +
      quizHTML('topic');
  }

  /* ---------------- 10. 科研复盘 ---------------- */
  function reviewList() { return get('reviews', []); }
  function reviewField(label, id, val, ph) {
    return '<div class="field"><label>' + label + '</label><textarea class="input" id="' + id + '" placeholder="' + attr(ph || '') + '">' + esc(val || '') + '</textarea></div>';
  }
  function renderReview() {
    var all = reviewList().slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
    var cur = all.filter(function (x) { return x.date === TODAY; })[0] || {};
    var hist = all.length ? all.map(function (x) {
      return '<details class="review-item"><summary style="cursor:pointer"><span class="d">' + esc(x.date) + '</span>' +
        '<div class="s">' + esc(x.caseSummary || '（未填研究摘要）') + '</div></summary>' +
        '<div style="margin-top:5px">' + [['S 情境', x.s], ['T 任务', x.t], ['A 行动', x.a], ['R 结果', x.r], ['学习要点', x.learn], ['下一步', x.next]].map(function (kv) {
          return kv[1] ? '<div class="topic-line"><b>' + kv[0] + '：</b>' + nl2br(kv[1]) + '</div>' : '';
        }).join('') +
        '<div class="btn-row" style="margin-top:4px">' + speakBtn((x.caseSummary || '') + '。' + (x.learn || ''), 'zh-CN') +
        '<button type="button" class="btn btn-xs btn-ghost" data-act="review-del" data-date="' + esc(x.date) + '">删除</button></div></div></details>';
    }).join('') : '<div class="empty">还没有科研复盘。今天离开实验室前，用 5 分钟写一条。</div>';
    return pageHead('🧠', '科研复盘', '每日一条：研究摘要 + STAR 反思 + 学习要点 + 下一步。按日期保存在本机，可随时回看。',
      '<span class="tag tag-blue">已记录 ' + all.length + ' 天</span>') +
      '<div class="review-grid"><section class="card"><div class="card-head"><h3>今日复盘</h3><span class="hint">' + TODAY + '</span></div><div class="card-pad">' +
      '<form id="reviewForm" class="review-form">' +
      '<div class="field"><label>复盘日期</label><input class="input" type="date" id="reviewDate" value="' + TODAY + '"></div>' +
      reviewField('研究摘要', 'rvCase', cur.caseSummary, '一句话说清：今天要回答的问题、关键操作与结果') +
      '<div class="star-grid">' +
      reviewField('S · 情境', 'rvS', cur.s, '今天的实验 / 分析场景与背景') +
      reviewField('T · 任务', 'rvT', cur.t, '今天要解决的核心问题') +
      reviewField('A · 行动', 'rvA', cur.a, '你做了什么、依据是什么') +
      reviewField('R · 结果', 'rvR', cur.r, '结果如何、有没有偏差') +
      '</div>' + reviewField('学习要点', 'rvLearn', cur.learn, '可迁移到下一个实验 / 下一轮分析的 1–3 点') +
      reviewField('下一步', 'rvNext', cur.next, '具体到下一个实验日能执行的动作') +
      '<div class="btn-row" style="margin-top:6px"><button class="btn btn-primary" type="submit">保存今日复盘</button>' +
      '<span class="tiny muted">同一天再次保存会覆盖当天记录</span></div></form></div></section>' +
      '<section class="card"><div class="card-head"><h3>复盘历史</h3><span class="hint">' + all.length + ' 天</span></div><div class="card-pad"><div class="review-history">' + hist + '</div></div></section></div>' +
      quizHTML('review');
  }
  function saveReview() {
    var date = $('#reviewDate').value || TODAY;
    var obj = {
      date: date,
      caseSummary: $('#rvCase').value.trim(),
      s: $('#rvS').value.trim(), t: $('#rvT').value.trim(),
      a: $('#rvA').value.trim(), r: $('#rvR').value.trim(),
      learn: $('#rvLearn').value.trim(), next: $('#rvNext').value.trim(),
      ts: Date.now()
    };
    if (!obj.caseSummary && !obj.s && !obj.a && !obj.learn) { toast('至少填写研究摘要或一条反思'); return; }
    var arr = reviewList();
    var i = arr.findIndex(function (x) { return x.date === date; });
    if (i >= 0) arr[i] = obj; else arr.push(obj);
    set('reviews', arr);
    toast(date + ' 的复盘已保存');
    render();
  }

  /* ---------------- 渲染入口 ---------------- */
  function render() {
    markVisited(S.module);
    var map = {
      quotes: renderQuotes, english: renderEnglish, literature: renderLiterature,
      research: renderResearch, schedule: renderSchedule, fitness: renderFitness,
      ledger: renderLedger, videos: renderVideos, topics: renderTopics, review: renderReview
    };
    var fn = map[S.module] || renderQuotes;
    $('#view').innerHTML = fn();
    updateChrome();
  }

  function go(m) {
    if (!TITLES[m]) return;
    S.module = m;
    closeNav();
    try { history.replaceState(null, '', '#' + m); } catch (e) { location.hash = m; }
    render();
    window.scrollTo(0, 0);
  }
  function openNav() {
    var sb = $('#sidebar'), sc = $('#scrim');
    if (sb) sb.classList.add('open');
    if (sc) sc.classList.add('show');
  }
  function closeNav() {
    var sb = $('#sidebar'), sc = $('#scrim');
    if (sb) sb.classList.remove('open');
    if (sc) sc.classList.remove('show');
  }

  /* ---------------- 交互 ---------------- */
  document.addEventListener('click', function (e) {
    var sp = e.target.closest('[data-speak]');
    if (sp) { speak(sp.getAttribute('data-speak'), sp.getAttribute('data-lang') || 'zh-CN'); return; }
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var key = el.getAttribute('data-key');
    var id = el.getAttribute('data-id');
    if (act === 'copy-quote') {
      var q = DB.quotes.filter(function (x) { return x.id === id; })[0];
      if (q) copyText('“' + q.text + '” — ' + q.author + '\n' + q.note);
    } else if (act === 'en-tab') { S.enTab = key; render(); }
    else if (act === 'en-mode') { S.enMode = key; render(); }
    else if (act === 'en-daily') { S.enDaily = key === 'daily'; render(); }
    else if (act === 'phrase-cat') { S.phraseCat = key; render(); }
    else if (act === 'phrase-mark') { markPhrases([id]); }
    else if (act === 'phrase-group') { markPhrases(currentPhrases().map(function (p) { return p.id; })); }
    else if (act === 'phrase-reset') { set('phraseSeen', {}); toast('短语已学记录已重置'); render(); }
    else if (act === 'lit-tab') { S.litTab = key; render(); }
    else if (act === 'lit-learn') {
      var ll = get('litLearned', []); if (ll.indexOf(id) < 0) ll.push(id); set('litLearned', ll);
      toast('已标记，已自动补上下一篇'); render();
    } else if (act === 'guide-learn') {
      var gl = get('guideLearned', []); if (gl.indexOf(id) < 0) gl.push(id); set('guideLearned', gl);
      toast('已标记，已自动补上下一部'); render();
    } else if (act === 'lit-reset') { set('litLearned', []); toast('文献进度已重置'); render(); }
    else if (act === 'guide-reset') { set('guideLearned', []); toast('指南进度已重置'); render(); }
    else if (act === 'res-tab') { S.resTab = key; render(); }
    else if (act === 'research-dir') { S.dir = key; render(); }
    else if (act === 'term-learn') {
      var seen = get('termSeen', {}); seen[key + ':' + el.getAttribute('data-en')] = TODAY; set('termSeen', seen); render();
    } else if (act === 'term-group') {
      var data = termEntries(key), ts = get('termSeen', {});
      data.list.forEach(function (t) { ts[key + ':' + t.en] = TODAY; });
      set('termSeen', ts); toast('本组 10 个词汇已标记，已换一组'); render();
    } else if (act === 'cal-prev') { S.month = new Date(S.month.getFullYear(), S.month.getMonth() - 1, 1); render(); }
    else if (act === 'cal-next') { S.month = new Date(S.month.getFullYear(), S.month.getMonth() + 1, 1); render(); }
    else if (act === 'cal-today') { S.month = new Date(); render(); }
    else if (act === 'ledger-del') {
      set('ledger', ledgerAll().filter(function (x) { return x.id !== id; }));
      toast('已删除'); render();
    } else if (act === 'video-all') { S.videoAll = !S.videoAll; render(); }
    else if (act === 'topic-fav') {
      var favs = get('favTopics', []); var i = favs.indexOf(id);
      if (i >= 0) { favs.splice(i, 1); toast('已取消收藏'); } else { favs.push(id); toast('已加入我的选题库'); }
      set('favTopics', favs); render();
    } else if (act === 'topic-all') { S.topicAll = !S.topicAll; S.topicFavOnly = false; render(); }
    else if (act === 'topic-fav-only') {
      S.topicFavOnly = !S.topicFavOnly;
      if (S.topicFavOnly) S.topicAll = true;
      render();
    } else if (act === 'topic-copy') {
      var t = DB.topics.filter(function (x) { return x.id === id; })[0];
      if (t) copyText(t.title + '\n切入角度：' + t.angle + '\n关键词：' + t.keywords.join('、') + '\n形式：' + t.format);
    } else if (act === 'review-del') {
      var date = el.getAttribute('data-date');
      set('reviews', reviewList().filter(function (x) { return x.date !== date; }));
      toast('已删除 ' + date + ' 的复盘'); render();
    } else if (act === 'quiz-submit') {
      var root = el.closest('.quiz'); if (root) gradeQuiz(root);
    } else if (act === 'quiz-reset') { render(); }
  });

  function markPhrases(ids) {
    var seen = get('phraseSeen', {});
    ids.forEach(function (id) { if (id) seen[id] = TODAY; });
    set('phraseSeen', seen);
    toast('已标记 ' + ids.length + ' 条，30 天内不再出现');
    render();
  }

  document.addEventListener('submit', function (e) {
    if (e.target.id === 'ledgerForm') { e.preventDefault(); addLedger(); }
    else if (e.target.id === 'reviewForm') { e.preventDefault(); saveReview(); }
  });

  function init() {
    loadVoices();
    var h = String(location.hash || '').replace('#', '');
    if (TITLES[h]) S.module = h;
    $('#menuBtn').addEventListener('click', openNav);
    $('#scrim').addEventListener('click', closeNav);
    $('#stopSpeak').addEventListener('click', function () {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      toast('已停止朗读');
    });
    $$('.nav-item').forEach(function (b) {
      b.addEventListener('click', function () { go(b.getAttribute('data-module')); });
    });
    window.addEventListener('hashchange', function () {
      var m = String(location.hash || '').replace('#', '');
      if (TITLES[m] && m !== S.module) { S.module = m; render(); }
    });
    render();
  }

  var started = false;
  function boot() {
    if (started) return;
    started = true;
    init();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  }
  boot();
})();

</script>
</body>
</html>
