{"pmid":"42902920","topic":"糖尿病难愈创面","title":"Programming Extracellular Vesicle-Biomaterial Interfaces for Diabetic Wounds: Barrier-Matched Design and Translational Criteria.","titleZh":"面向糖尿病创面的细胞外囊泡-生物材料界面编程：屏障匹配设计与转化标准","journal":"Advanced healthcare materials","year":"2026","date":"2026-Oct-20","edat":"2026-10-22","authors":"Wu B, Ruan J, Zhang K, Wang X, You S","doi":"10.1002/adhm.71859","abstract":"Diabetic wounds are sustained by a coupled network of unresolved inflammation, vascular insufficiency, oxidative injury, infection and biofilms, and matrix dysfunction. Although extracellular vesicles (EVs) can convey regenerative signals and engineered cargo, therapeutic performance is ultimately determined by how a wound-contact material preserves, presents, and releases them. This review reframes EV-based treatment as the programming of an EV-biomaterial interface. It relates wound barriers to cargo function; compares donor-cell engineering, post-isolation loading, surface modification, EV mimetics, and hybrid systems; and examines how composition, crosslinking, architecture, adhesion, mechanics, degradation, and stimulus responsiveness govern local exposure. Preclinical and emerging clinical evidence is evaluated alongside product-defining measurements, including EV identity and purity, cargo content and encapsulation efficiency, removal of free cargo, recovery, release, potency, safety, sterility, and batch consistency. The analysis shows that added functional complexity is not inherently advantageous unless each component is mechanistically necessary and quantitatively controlled. A barrier-matched, fully characterized interface therefore offers a rigorous basis for developing reproducible and clinically testable EV-enabled wound therapeutics.","abstractZh":"糖尿病创面由未消退的炎症、血管功能不全、氧化损伤、感染与生物膜以及基质功能障碍构成的耦联网络所维持。尽管细胞外囊泡（EVs）能够传递再生信号和工程化载荷，但其治疗效果最终取决于创面接触材料如何保存、呈递和释放它们。本综述将基于 EVs 的治疗重新界定为对 EV-生物材料界面的编程。它将创面屏障与载荷功能相联系；比较了供体细胞工程化、分离后负载、表面修饰、EV 模拟物和杂合系统；并考察了组成、交联、结构、黏附、力学、降解和刺激响应性如何决定局部暴露。临床前及新兴临床证据与产品定义性检测指标一并评估，包括 EV 身份与纯度、载荷含量与包封效率、游离载荷去除、回收率、释放、效力、安全性、无菌性和批次一致性。分析表明，增加功能复杂性本身并不必然带来优势，除非每个组分在机制上必要且可被定量控制。因此，一个屏障匹配、充分表征的界面为开发可重复且可临床检验的 EV 创面治疗药物提供了严谨的基础。","tier":"1区","if":10.0},
{"pmid":"42870224","topic":"糖尿病难愈创面","title":"Immune‑Friendly Skin Interface Remodeling: Chiral Hydrogels for Diabetic Non-Healing Wound Therapy.","titleZh":"免疫友好型皮肤界面重塑：手性水凝胶用于糖尿病难愈合创面治疗","journal":"Advanced healthcare materials","year":"2026","date":"2026-Oct-13","edat":"2026-10-13","authors":"Yin H, Li Y, Qin B, Lei Y, Chen Y","doi":"10.1002/adhm.71842","abstract":"Diabetic non‑healing wounds pose a clinical challenge due to persistent inflammation, dysregulated immunity, and poor integration of dressings with the skin. Conventional hydrogel dressings have proven effective in providing physical barriers, moisture retention, and local drug delivery. Further optimization is still feasible for precise immune regulation and dynamic skin interfacial matching. In non-healing wound therapy, enantiomerically defined chiral hydrogels have emerged as a promising platform for targeted immune remodeling. By selectively steering macrophage polarization from pro-inflammatory M1 to pro-healing M2, they facilitate a smooth inflammatory-to-proliferative transition and accelerate wound closure. With rational network design, chiral hydrogels achieve favorable interfacial compatibility with the moist, dynamic wound environment, supporting cell adhesion, reducing friction induced microtrauma, sustaining bioactive signal delivery, and avoiding overt foreign body reactions. By integrating chiral topography, biomimetic mechanical properties, and moderate tissue adhesion, these hydrogels help establish an \"immune-friendly\" dermal interface. This review discusses structure-activity relationships linking chiral chemistry to immune cell behavior and outlines design principles for clinically translatable wound dressings. Collectively, chiral hydrogels that synergistically remodel immune microenvironment and ensure skin compatibility could redefine diabetic wound therapy, enabling a new paradigm of precision, immune‑instructive the wound management that transcends conventional dressing functions.","abstractZh":"糖尿病难愈合创面因持续性炎症、免疫失调以及敷料与皮肤整合不良而成为临床难题。传统水凝胶敷料在提供物理屏障、保湿和局部给药方面已被证明有效。在精准免疫调控和动态皮肤界面匹配方面，仍有进一步优化的空间。在难愈合创面治疗中，对映体明确的手性水凝胶已成为靶向免疫重塑的有前景平台。通过选择性引导巨噬细胞由促炎 M1 型向促愈合 M2 型极化，其促进炎症期向增殖期的平稳过渡并加速创面闭合。通过合理的网络设计，手性水凝胶与潮湿、动态的创面环境实现良好的界面相容性，支持细胞黏附、减少摩擦所致微损伤、持续传递生物活性信号，并避免明显的异物反应。通过整合手性形貌、仿生力学性能与适度的组织黏附，这些水凝胶有助于建立「免疫友好」的真皮界面。本综述讨论了将手性化学与免疫细胞行为相联系的结构-活性关系，并概述了可用于临床转化的创面敷料设计原则。总体而言，能够协同重塑免疫微环境并确保皮肤相容性的手性水凝胶可能重新定义糖尿病创面治疗，开创超越传统敷料功能的精准、免疫指导型创面管理新范式。","tier":"1区","if":10.0},
{"pmid":"42745668","topic":"糖尿病难愈创面","title":"PLL-g-HPA Hydrogel Microneedles Loaded With Rhoifolin Target Macrophages to Alleviate Fibroblast Senescence for Diabetic Wound Healing.","titleZh":"负载野漆树苷的 PLL-g-HPA 水凝胶微针靶向巨噬细胞以缓解成纤维细胞衰老促进糖尿病创面愈合","journal":"Advanced healthcare materials","year":"2026","date":"2026-Oct","edat":"2026-09-16","authors":"Liao J, Gan L, Lu L, Ouyang L, Xiong Y","doi":"10.1016/s0169-409x(01)00240-x","abstract":"In this study, we demonstrate that during diabetic wound healing, interleukin-11 (IL-11) promotes the M1 polarization of macrophages, which subsequently triggers fibroblast senescence through the enhanced release of pro-inflammatory cytokines IL-1β and IL-6. Notably, Rhoifolin (Rho) effectively inhibits IL-11-induced M1 polarization, alleviates the secretion of IL-1β and IL-6, and concurrently promotes the release of choline, thereby mitigating fibroblast senescence. Based on these mechanistic findings, we constructed a targeted delivery system by loading Rho into mesoporous silica nanoparticles and coating them with macrophage membranes (M-Rho). The M-Rho were then incorporated into a poly(L-lysine)-grafted hyperbranched poly(amidoamine) (PLL-g-HPA) hydrogel to fabricate microneedles (Gel@M-Rho MN). This integrated system enables macrophage targeting, controlled drug release, favorable mechanical properties, and excellent biocompatibility. Moreover, the system exhibits potent reactive oxygen species (ROS)-scavenging activity and effectively inhibits the growth of Escherichia coli and Staphylococcus aureus. In vivo animal studies confirmed that Gel@M-Rho MN significantly promotes M2 macrophage polarization, suppresses fibroblast senescence, and accelerates wound closure, angiogenesis, and collagen deposition. Collectively, this strategy, which modulates macrophage-fibroblast crosstalk, offers a multi-mechanistic synergistic therapeutic approach for diabetic wounds, holding substantial potential for clinical translation.","abstractZh":"本研究证实，在糖尿病创面愈合过程中，白细胞介素-11(IL-11)促进巨噬细胞 M1 型极化，后者通过增强释放促炎细胞因子 IL-1β 和 IL-6 进而触发成纤维细胞衰老。值得注意的是，野漆树苷(Rho)有效抑制 IL-11 诱导的 M1 极化，减轻 IL-1β 和 IL-6 的分泌，同时促进胆碱释放，从而减轻成纤维细胞衰老。基于上述机制发现，我们将 Rho 负载于介孔二氧化硅纳米粒并包覆巨噬细胞膜，构建了靶向递送系统(M-Rho)。随后将 M-Rho 载入聚(L-赖氨酸)接枝超支化聚(酰胺-胺)(PLL-g-HPA)水凝胶中制备微针(Gel@M-Rho MN)。该集成系统实现了巨噬细胞靶向、药物控释、良好的力学性能和优异的生物相容性。此外，该系统具有强效的活性氧(ROS)清除活性，并能有效抑制大肠杆菌和金黄色葡萄球菌生长。体内动物研究证实，Gel@M-Rho MN 显著促进 M2 型巨噬细胞极化、抑制成纤维细胞衰老，并加速创面闭合、血管生成和胶原沉积。总体而言，该通过调控巨噬细胞-成纤维细胞串扰的策略为糖尿病创面提供了多机制协同的治疗途径，具有可观的临床转化潜力。","tier":"1区","if":10.0},
{"pmid":"42713721","topic":"糖尿病难愈创面","title":"An Apoptotic Body-Mimetic Nanoagonist for Synergistic Diabetic Wound Immunotherapy.","titleZh":"仿凋亡小体纳米激动剂用于协同性糖尿病创面免疫治疗","journal":"Advanced healthcare materials","year":"2026","date":"2026-Oct","edat":"2026-09-09","authors":"Wang Z, Yang W, Yang Y, Deng Z, Yang Q","doi":"10.1002/adhm.71665","abstract":"Diabetic skin injury (DSI), which are challenging to heal, contribute to global economic losses exceeding US$ 250 billion annually. The impaired healing process is primarily driven by severe local inflammation, excessive oxidative stress, and restricted angiogenesis, with dysfunctional macrophage polarization being a central pathological factor. Inspired from mechanisms of apoptotic cell clearance and maintenance of tissue homeostasis in the body, herein we developed a sprayable apoptotic body-mimic nanotherapeutic with macrophage-targeting anti-inflammatory and antioxidant properties, which consisted of the 'eat me' signal, phosphatidylserine-exposing nanoliposome containing epigallocatechin gallate-magnesium ion nanocomplexes (EGCG-Mg@PSLs). Both in vitro and in vivo experiments demonstrated that macrophage-targeted EGCG-Mg@PSLs effectively alleviate inflammation, promote angiogenesis and collagen fiber formation, and accelerate wound closure. Network pharmacology analysis supported the therapeutic relevance of EGCG in DSI healing. Transcriptomic sequencing also revealed that EGCG-Mg@PSLs likely modulate macrophage behavior via the MAPK signaling pathway and metabolic reprogramming. The results indicated that apoptotic body-mimic nanotherapeutics with PS-exposing shell and metal-phenolic complex core represent a promising bio-inspired therapeutic strategy for macrophage immunotherapy for chronic diabetic wounds.","abstractZh":"糖尿病皮肤损伤(DSI)难以愈合，每年造成的全球经济负担超过 2500 亿美元。愈合过程受损主要由严重的局部炎症、过度氧化应激和血管生成受限所驱动，其中巨噬细胞极化功能障碍是核心病理因素。受体内凋亡细胞清除与组织稳态维持机制的启发，我们开发了一种可喷雾的仿凋亡小体纳米治疗剂，具有靶向巨噬细胞的抗炎和抗氧化特性，其由「吞噬我」信号——即暴露磷脂酰丝氨酸的纳米脂质体——包裹表没食子儿茶素没食子酸酯-镁离子纳米复合物构成(EGCG-Mg@PSLs)。体外和体内实验均表明，靶向巨噬细胞的 EGCG-Mg@PSLs 有效减轻炎症、促进血管生成和胶原纤维形成，并加速创面闭合。网络药理学分析支持 EGCG 在 DSI 愈合中的治疗相关性。转录组测序还显示，EGCG-Mg@PSLs 可能通过 MAPK 信号通路和代谢重编程调控巨噬细胞行为。结果表明，具有 PS 暴露外壳和金属-酚配合物内核的仿凋亡小体纳米治疗剂，是用于慢性糖尿病创面巨噬细胞免疫治疗的一种有前景的仿生治疗策略。","tier":"1区","if":10.0},
{"pmid":"42568052","topic":"糖尿病难愈创面","title":"Antioxidant MOF Nanozyme-Engineered Periodontal Ligament Stem Cells Promote Diabetic Wound Healing.","titleZh":"抗氧化 MOF 纳米酶工程化牙周膜干细胞促进糖尿病创面愈合","journal":"Advanced healthcare materials","year":"2026","date":"2026-Oct","edat":"2026-08-07","authors":"Liu X, Dong Q, Sun Y, Wu J, Zhao X","doi":"10.1002/adhm.71523","abstract":"Diabetic chronic wounds, as a prevalent and serious complication of diabetes, pose serious threats to patient health and survival, underscoring the urgent need for effective therapeutic strategies. Stem cell therapy has emerged as a promising approach, but its efficacy is often compromised by the hostile wound microenvironment, characterized by excessive reactive oxygen species and persistent inflammation. To address this challenge, we developed a nanozyme-based engineering strategy to enhance the therapeutic potential of periodontal ligament stem cells (PDLSCs) based on a bimetallic CuNi-MOF nanozyme exhibiting dual superoxide dismutase- and catalase-like activities. In vitro experiments demonstrated that, the CuNi-MOF nanozyme effectively alleviated oxidative stress and reduced cellular senescence in PDLSCs. Mechanistic investigation revealed the involvement of the JNK/ERK signaling axis in this protective effect. In a diabetic wound model, nanozyme-engineered PDLSCs (E-PDLSCs), exhibited superior healing compared with untreated PDLSCs. Specifically, E-PDLSCs significantly accelerated re-epithelialization, enhanced collagen deposition, and promoted angiogenesis, while also modulating inflammatory cytokine levels and macrophage polarization. Overall, this study presents a cell engineering strategy that integrates antioxidant nanozymes with stem cells for chronic wound treatment, extending the potential applications of nanozyme in regenerative medicine.","abstractZh":"糖尿病慢性创面作为糖尿病常见且严重的并发症，严重威胁患者健康与生存，凸显了有效治疗策略的迫切需求。干细胞疗法已成为一种有前景的方法，但其疗效常受恶劣创面微环境影响，该微环境以活性氧过多和持续炎症为特征。为应对这一挑战，我们基于具有超氧化物歧化酶和过氧化氢酶双重活性的双金属 CuNi-MOF 纳米酶，开发了一种纳米酶工程化策略，以增强牙周膜干细胞(PDLSCs)的治疗潜能。体外实验表明，CuNi-MOF 纳米酶有效减轻 PDLSCs 的氧化应激并减少细胞衰老。机制研究揭示 JNK/ERK 信号轴参与这一保护作用。在糖尿病创面模型中，纳米酶工程化 PDLSCs(E-PDLSCs)较未处理 PDLSCs 表现出更优的愈合效果。具体而言，E-PDLSCs 显著加速再上皮化、增强胶原沉积并促进血管生成，同时调节炎症细胞因子水平和巨噬细胞极化。总体而言，本研究提出了一种将抗氧化纳米酶与干细胞整合用于慢性创面治疗的细胞工程策略，拓展了纳米酶在再生医学中的潜在应用。","tier":"1区","if":10.0},
{"pmid":"42814517","topic":"糖尿病难愈创面","title":"Magnesium Phosphate Composite Hydrogel Dressing Promotes Diabetic Wound Repair Through Anti-Inflammatory, Antioxidant, Angiogenic, and Metabolic Regulatory Mechanisms.","titleZh":"磷酸镁复合水凝胶敷料通过抗炎、抗氧化、促血管生成及代谢调控机制促进糖尿病创面修复","journal":"Advanced healthcare materials","year":"2026","date":"2026-Sep-30","edat":"2026-09-30","authors":"Wang X, Zuo Y, Liu S, Zhang K, Ren Y","doi":"10.1002/adhm.71782","abstract":"Chronic non-healing diabetic wounds pose a significant clinical challenge, attributed to a pathogenic microenvironment characterized by persistent inflammation, excessive accumulation of reactive oxygen species, impaired angiogenesis, and mitochondrial dysfunction. Herein, we reported a novel multifunctional hydrogel dressing aimed at promoting diabetic wound healing through the synergistic action of anti-inflammatory, antioxidant, angiogenic, and metabolic regulatory mechanisms. First, nicotinamide mononucleotide (NMN)-templated magnesium phosphate nanoparticles (NMP NPs) were synthesized through a biomimetic mineralization strategy. Subsequently, the NMP NPs were incorporated into a double-network hydrogel that formed by dynamic Schiff base crosslinking and photocuring of methacrylated gelatin and oxidized dextran, resulting in a multifunctional composite hydrogel (NMP/GO) with tissue adhesion properties and multiple biological activities. The NMP/GO hydrogel dressing slowly releases Mg2+ ions and NMN within the diabetic microenvironment, where Mg2+ modulates inflammatory responses and promotes angiogenesis, while NMN restores redox balance and ameliorates mitochondrial dysfunction. Owing to this synergistic effect, the NMP/GO hydrogel dressing significantly promotes diabetic wound healing by reducing inflammation, mitigating oxidative stress, restoring mitochondrial function, and enhancing angiogenic potential. Consequently, the NMP/GO hydrogel dressing presents a promising therapeutic strategy for advanced diabetic wound management with high translational potential.","abstractZh":"慢性难愈合糖尿病创面是重大临床挑战，其归因于以持续炎症、活性氧过度蓄积、血管生成受损和线粒体功能障碍为特征的致病性微环境。在此，我们报道了一种新型多功能水凝胶敷料，旨在通过抗炎、抗氧化、促血管生成和代谢调控机制的协同作用促进糖尿病创面愈合。首先，通过仿生矿化策略合成了烟酰胺单核苷酸(NMN)模板化的磷酸镁纳米粒(NMP NPs)。随后，将 NMP NPs 掺入由甲基丙烯酰化明胶和氧化葡聚糖经动态席夫碱交联与光固化形成的双网络水凝胶中，得到具有组织黏附性能和多种生物活性的多功能复合水凝胶(NMP/GO)。NMP/GO 水凝胶敷料在糖尿病微环境中缓慢释放 Mg2+ 离子和 NMN，其中 Mg2+ 调节炎症反应并促进血管生成，而 NMN 恢复氧化还原平衡并改善线粒体功能障碍。凭借这一协同效应，NMP/GO 水凝胶敷料通过减轻炎症、缓解氧化应激、恢复线粒体功能和增强血管生成潜能，显著促进糖尿病创面愈合。因此，NMP/GO 水凝胶敷料为晚期糖尿病创面管理提供了一种有前景且具高转化潜力的治疗策略。","tier":"1区","if":10.0},
{"pmid":"42811356","topic":"糖尿病难愈创面","title":"A Dynamic Polysaccharide Hydrogel With Reactive Oxygen Species-Scavenging, Antibacterial Activity, and Angiogenesis for Pressure Injury and Diabetic Wound Healing.","titleZh":"具有活性氧清除、抗菌和促血管生成作用的动态多糖水凝胶用于压力性损伤与糖尿病创面愈合","journal":"Advanced healthcare materials","year":"2026","date":"2026-Sep-29","edat":"2026-09-30","authors":"Ma Y, Zhao H, Zhang Y, An P, Xia L","doi":"10.1002/adhm.71787","abstract":"Chronic wound healing is often delayed due to the inability of conventional dressings to provide a suitable extracellular matrix (ECM) microenvironment that supports the survival and function of endogenous cells. This deficiency leads to persistent inflammation, impaired angiogenesis, and excessive reactive oxygen species (ROS) production, forming a vicious cycle to exacerbate tissue damage. Herein, we propose a dual-crosslinked injectable dynamic polysaccharide hydrogel. Leveraging anti-inflammatory oxidized xyloglucan, and carboxymethyl chitosan to construct a first dynamic network based on Schiff-base chemistry, this biomimetic extracellular matrix mimics dynamic changes to promote cell proliferation and resolve inflammation. Furthermore, strontium ions with pro-angiogenic activity and protocatechualdehyde with antioxidant activity serve as crosslinking points for the second dynamic network. This design ensures spatiotemporal alignment between material mechanics and therapeutic action, effectively disrupting the vicious cycle of persistent inflammation, oxidative stress, and impaired angiogenesis in chronic wounds. Additionally, this hydrogel possesses commendable self-healing, tissue-adhesive and antibacterial properties. RNA sequencing analysis revealed that the hydrogel interrupts the inflammatory cascade, modulates immune processes, and accelerates collagen deposition and angiogenesis, promoting chronic wound healing. Collectively, these findings establish a foundation for designing straightforward and multifunctional hydrogel dressings capable of accelerating chronic wound repair by establishing a regenerative microenvironment.","abstractZh":"慢性创面的愈合往往被延迟，其原因在于传统敷料无法提供适宜的细胞外基质(ECM)微环境，以支持内源性细胞的存活与功能发挥。这一缺陷会导致持续性炎症、血管生成受损以及活性氧(ROS)的过度产生，从而形成恶性循环，进一步加剧组织损伤。在此，我们提出一种双交联的可注射动态多糖水凝胶。该水凝胶以具有抗炎作用的氧化木葡聚糖和羧甲基壳聚糖为原料，基于席夫碱化学构建第一个动态网络，这一仿生细胞外基质能够模拟动态变化，从而促进细胞增殖并使炎症得以消退。此外，具有促血管生成活性的锶离子和具有抗氧化活性的原儿茶醛作为第二个动态网络的交联点。该设计确保了材料力学性能与治疗作用之间的时空匹配，从而有效打破慢性创面中持续性炎症、氧化应激与血管生成受损所形成的恶性循环。此外，该水凝胶还具有值得称道的自愈合性能、组织黏附性能和抗菌性能。RNA 测序分析显示，该水凝胶能够阻断炎症级联反应、调节免疫过程，并加速胶原沉积和血管生成，从而促进慢性创面愈合。总体而言，这些发现为设计简便而多功能的水凝胶敷料奠定了基础，此类敷料能够通过建立再生微环境来加速慢性创面修复。","tier":"1区","if":10.0},
{"pmid":"42604447","topic":"糖尿病难愈创面","title":"Multifunctional Janus Membrane Promotes Neurovascular Network Regeneration for Diabetic Wound Healing.","titleZh":"多功能Janus膜促进神经血管网络再生以加速糖尿病创面愈合","journal":"Advanced healthcare materials","year":"2026","date":"2026-Sep","edat":"2026-08-16","authors":"Li Z, Chen R, Wang Y, Shi G, Hao Z","doi":"10.1016/j.msec.2021.112245","abstract":"The complex microenvironment of diabetic wounds poses a formidable challenge to tissue repair, particularly due to the absence of a functional neurovascular network. In this study, we developed a multifunctional Janus-structured scaffold (PLGA-PCL+CS+Cu-TA NS+P2, PCTP) by integrating chitosan (CS) electrospun fibers with PLGA-PCL coaxial electrospun fibers loaded with tannic acid (TA)-copper nanosheets (NSs). The NSs were loaded with PTHrP-2 to enhance bioactivity. The unique \"core-shell\" design protects the drug and ensures efficient release. The Janus architecture rationally manages wound exudate while maintaining a moist microenvironment conducive to healing. Moreover, PCTP exhibits excellent mechanical properties and sustained release kinetics. Its potent antioxidant and antibacterial activities effectively scavenge reactive oxygen species, protect mitochondrial integrity, and delay cellular senescence. Crucially, PCTP accelerates the regeneration of dermal fibers and epidermis structures while promoting concurrent neurogenesis and angiogenesis, thereby restoring both structural integrity and functional competence. In diabetic rat models, PCTP significantly enhanced vascularization, collagen deposition, and inflammation modulation. Collectively, this multifunctional scaffold represents a promising therapeutic strategy for achieving integrated structural and functional skin regeneration in the challenging diabetic milieu.","abstractZh":"糖尿病创面复杂的微环境给组织修复带来巨大挑战，尤其是由于功能性神经血管网络的缺失。本研究通过将壳聚糖（CS）静电纺纤维与负载单宁酸（TA）-铜纳米片（NSs）的PLGA-PCL同轴静电纺纤维相结合，构建了一种多功能Janus结构支架（PLGA-PCL+CS+Cu-TA NS+P2，PCTP）。纳米片中还负载了PTHrP-2以增强其生物活性。独特的“核-壳”设计可保护所载药物免于失活，并确保其高效释放。Janus结构能够合理管理创面渗出液，同时维持有利于愈合的湿润微环境。此外，PCTP具有优异的力学性能和缓释动力学特征。其强效的抗氧化和抗菌活性可有效清除活性氧、保护线粒体完整性并延缓细胞衰老。关键的是，PCTP在加速真皮纤维和表皮结构再生的同时，促进神经发生与血管生成同步进行，从而同时恢复结构完整性和功能能力。在糖尿病大鼠模型中，PCTP显著增强了血管化、胶原沉积和炎症调控。总之，这种多功能支架是在具有挑战性的糖尿病环境中实现结构与功能一体化皮肤再生的一种有前景的治疗策略。","tier":"1区","if":10.0},
{"pmid":"42844650","topic":"外泌体","title":"Hierarchically Structured Microparticles Encapsulated With Multiple Plant-Derived Bioactives for Psoriasis Therapy.","titleZh":"包载多种植物来源生物活性成分的多级结构微颗粒用于银屑病治疗","journal":"Advanced healthcare materials","year":"2026","date":"2026-Oct-07","edat":"2026-10-08","authors":"Chen D, Lu M, Zhao Y","doi":"10.1002/adhm.71803","abstract":"Traditional Chinese medicine bioactives have considerable therapeutic value in psoriasis management, while their clinical applications are still constrained by the insufficient therapeutic efficacy of single components, uncontrolled release, and low local bioavailability. In this study, we report a hierarchically structured microparticle system loaded with multiple plant-derived bioactives for psoriasis therapy. The microparticles of sodium alginate (SA) hydrogel with polydopamine (PDA)-modification were fabricated through microfluidics, co-loaded with paeoniflorin (PF) and ginger-derived exosome-like nanoparticles (GELNs). Benefiting from the porous structure of hydrogel and adhesive property of PDA, the microparticles enable stable co-encapsulation of multiple plant-derived bioactives and achieve sustained release at lesion sites, enhancing local bioavailability. The encapsulated PF and GELNs exert complementary anti-inflammatory, antioxidant, and anti-proliferative effects, collectively regulating key pathological processes associated with psoriasis. These results prove that the microparticle-based multiple plant-derived bioactives delivery system provides a safe, cost-effective, and translatable approach for long-term topical treatment of psoriasis, highlighting their therapeutic potential in inflammatory skin diseases.","abstractZh":"中药生物活性成分在银屑病治疗中具有相当的治疗价值，但其临床应用仍受限于单一成分疗效不足、释放不可控以及局部生物利用度低。在本研究中，我们报道了一种负载多种植物来源生物活性成分的多级结构微颗粒系统用于银屑病治疗。通过微流控制备了聚多巴胺（PDA）修饰的海藻酸钠（SA）水凝胶微颗粒，共负载芍药苷（PF）和姜来源类外泌体纳米颗粒（GELNs）。得益于水凝胶的多孔结构和 PDA 的黏附特性，该微颗粒可稳定共包载多种植物来源生物活性成分，并在病灶部位实现持续释放，提高局部生物利用度。包载的 PF 与 GELNs 发挥互补的抗炎、抗氧化和抗增殖作用，共同调控银屑病相关的关键病理过程。这些结果证明，基于微颗粒的多种植物来源生物活性成分递送系统为银屑病的长期局部治疗提供了一种安全、经济且可转化的方法，凸显了其在炎症性皮肤病中的治疗潜力。","tier":"1区","if":10.0}
];

/* ===== 共享组件：日期索引 / 测验 / 测验历史 ===== */
(function () {
  'use strict';
  var U = WB.util;

  /* 相对 2024-01-01 的天数索引；offset 用于错开各模块轮换节奏 */
  function dayIdx(offset) {
    var a = new Date(2024, 0, 1), d = new Date();
    d.setHours(0, 0, 0, 0);
    return Math.floor((d - a) / 86400000) + (offset || 0);
  }
  function seedOf(offset) { return (U.daySeed(U.todayStr()) + (offset || 0) * 7919) >>> 0; }

  /* ---------------- 测验组件 ---------------- */
  function quiz(qs, opt) {
    opt = opt || {};
    var wrap = document.createElement('div');
    var picked = [], locked = false, i;
    for (i = 0; i < qs.length; i++) picked.push(-1);

    var body = qs.map(function (q, idx) {
      return '<div class="quiz" data-qi="' + idx + '">' +
        '<div class="qh"><div class="qn2">' + (idx + 1) + '</div><div class="qtext">' + U.esc(q.q) + '</div></div>' +
        '<div class="opts">' + q.o.map(function (o, j) {
          return '<button type="button" class="opt" data-q="' + idx + '" data-o="' + j + '">' +
            '<span class="k">' + String.fromCharCode(65 + j) + '</span><span>' + U.esc(o) + '</span></button>';
        }).join('') + '</div>' +
        '<div class="explain" data-ex="' + idx + '"></div>' +
        '</div>';
    }).join('');

    wrap.innerHTML = body +
      '<div class="row mt8">' +
      '<button type="button" class="btn pri" data-act="submit">✅ 提交答案</button>' +
      (opt.onAgain ? '<button type="button" class="btn" data-act="again">🔄 ' + U.esc(opt.againLabel || '换一批题目') + '</button>' : '') +
      '<span class="sp"></span><span class="muted small">共 ' + qs.length + ' 题 · 满分 100</span></div>' +
      '<div class="score" data-score style="display:none"></div>';

    var scoreBox = wrap.querySelector('[data-score]');

    wrap.addEventListener('click', function (e) {
      var opt2 = e.target.closest('.opt');
      if (opt2 && !locked) {
        var qi = +opt2.getAttribute('data-q');
        picked[qi] = +opt2.getAttribute('data-o');
        wrap.querySelectorAll('.opt[data-q="' + qi + '"]').forEach(function (b) { b.classList.remove('sel'); });
        opt2.classList.add('sel');
        return;
      }
      var act = e.target.closest('[data-act]');
      if (!act) return;
      var a = act.getAttribute('data-act');
      if (a === 'again' && opt.onAgain) { opt.onAgain(); return; }
      if (a === 'next' && opt.onAgain) { opt.onAgain(); return; }
      if (a !== 'submit' || locked) return;

      var miss = picked.filter(function (p) { return p < 0; }).length;
      if (miss) { U.toast('还有 ' + miss + ' 道题未作答'); return; }

      locked = true;
      var right = 0;
      qs.forEach(function (q, idx) {
        var correct = q.a;
        if (picked[idx] === correct) right++;
        wrap.querySelectorAll('.opt[data-q="' + idx + '"]').forEach(function (b) {
          var o = +b.getAttribute('data-o');
          b.disabled = true;
          if (o === correct) b.classList.add('right');
          else if (o === picked[idx]) b.classList.add('wrong');
        });
        var ex = wrap.querySelector('[data-ex="' + idx + '"]');
        if (ex) {
          ex.innerHTML = '<b>正确答案：' + String.fromCharCode(65 + correct) + '．' + U.esc(q.o[correct]) + '</b><br>' + U.esc(q.e || '');
          ex.classList.add('show');
        }
      });
      var score = Math.round(right / qs.length * 100);
      scoreBox.style.display = 'flex';
      scoreBox.innerHTML = '<div class="big">' + score + '<small>/100</small></div>' +
        '<div><div><b>' + (score >= 90 ? '优秀！' : score >= 70 ? '不错，继续保持' : score >= 60 ? '及格，再巩固一下' : '需要复习') + '</b></div>' +
        '<div class="small muted">答对 ' + right + ' / ' + qs.length + ' 题</div></div>' +
        '<span class="sp"></span>' +
        (opt.onAgain ? '<button type="button" class="btn pri sm" data-act="next">➡️ 下一批新题</button>' : '');
      act.disabled = true;
      if (opt.onDone) opt.onDone(score, right, qs.length, picked);
    });

    return wrap;
  }

  /* ---------------- 模块测验（带每日轮换 + 历史） ---------------- */
  function quizCard(host, modId, pool, opt) {
    opt = opt || {};
    var key = 'qh_' + modId;
    var offset = 0, showHist = false;

    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-h"><h3>📝 今日测验</h3><span class="sp"></span>' +
      '<button type="button" class="btn sm" data-act="again">🔄 换一批题目</button>' +
      '<button type="button" class="btn sm" data-act="hist">📜 历史题目</button></div>' +
      '<div data-qbody></div>';
    host.appendChild(card);
    var body = card.querySelector('[data-qbody]');

    function renderQuiz() {
      showHist = false;
      body.innerHTML = '';
      var rnd = U.rndFor(seedOf(opt.offset || 0) + offset * 131);
      var qs = U.pickN(pool, opt.count || 5, rnd);
      body.appendChild(quiz(qs, {
        onAgain: function () { offset++; renderQuiz(); U.toast('已换一批新题'); },
        onDone: function (score, right, total, picked) {
          var h = U.storeGet(key, []);
          h.push({
            d: U.todayStr(), ts: Date.now(), score: score, right: right, total: total,
            items: qs.map(function (q, i) { return { q: q.q, o: q.o, a: q.a, e: q.e, p: picked[i] }; })
          });
          if (h.length > 60) h = h.slice(-60);
          U.storeSet(key, h);
          U.toast('成绩已记录，可点「历史题目」查看');
        }
      }));
    }

    function renderHist() {
      showHist = true;
      var h = U.storeGet(key, []);
      body.innerHTML = '';
      var back = document.createElement('div');
      back.className = 'row mb8';
      back.innerHTML = '<button type="button" class="btn sm" data-act="back">← 返回今日测验</button>' +
        '<span class="sp"></span><span class="muted small">共 ' + h.length + ' 次记录</span>';
      body.appendChild(back);
      if (!h.length) {
        body.insertAdjacentHTML('beforeend', U.emptyBox('📭', '还没有测验记录，先做一次今日测验吧'));
      } else {
        var box = document.createElement('div');
        box.className = 'list';
        h.slice().reverse().forEach(function (r) {
          var it = document.createElement('div');
          it.className = 'item';
          it.innerHTML = '<div class="it-h"><div class="sp"><h4>' + U.relDay(r.d) + ' · ' + U.esc(r.d) +
            '</h4><div class="meta"><span class="tag ' + (r.score >= 80 ? 'g' : r.score >= 60 ? 'o' : 'r') + '">得分 ' + r.score +
            '</span><span>答对 ' + r.right + '/' + r.total + '</span></div></div>' +
            '<button type="button" class="btn sm" data-open>展开题目</button></div>' +
            '<div class="small" data-detail style="display:none;margin-top:8px">' +
            r.items.map(function (q, i) {
              return '<div style="margin-bottom:6px"><b>' + (i + 1) + '. ' + U.esc(q.q) + '</b><br>' +
                '<span class="muted">你的答案：</span>' + (q.p >= 0 ? String.fromCharCode(65 + q.p) + '．' + U.esc(q.o[q.p]) : '未作答') + '<br>' +
                '<span style="color:var(--ok)">正确答案：' + String.fromCharCode(65 + q.a) + '．' + U.esc(q.o[q.a]) + '</span><br>' +
                '<span class="muted">' + U.esc(q.e || '') + '</span></div>';
            }).join('') + '</div>';
          box.appendChild(it);
        });
        body.appendChild(box);
      }
    }

    card.addEventListener('click', function (e) {
      var t = e.target.closest('[data-act]');
      if (t) {
        var a = t.getAttribute('data-act');
        if (a === 'again') { offset++; renderQuiz(); U.toast('已换一批新题'); return; }
        if (a === 'hist') { renderHist(); return; }
        if (a === 'back') { renderQuiz(); return; }
      }
      var open = e.target.closest('[data-open]');
      if (open) {
        var d = open.closest('.item').querySelector('[data-detail]');
        var on = d.style.display !== 'none';
        d.style.display = on ? 'none' : 'block';
        open.textContent = on ? '展开题目' : '收起';
      }
    });

    renderQuiz();
    return card;
  }

  WB.quiz = quiz;
  WB.quizCard = quizCard;
  WB.dayIdx = dayIdx;
  WB.seedOf = seedOf;
  U.dayIdx = dayIdx;
  U.seedOf = seedOf;
})();

        if (!o.titleZh && p.titleZh) o.titleZh = p.titleZh;
        if (!o.abstract && p.abstract) o.abstract = p.abstract;
      } else { map[k] = p; arr.push(p); }
    });
    arr.forEach(function (p) { p._d = p.edat || p.date || p.year || ''; });

  function topPapers(papers, n) {

    arr.sort(function (a, b) {

      if (da !== db) return String(db).localeCompare(String(da));

  function generate(papers, n) {
    n = n || 20;
    var top = topPapers(papers, 100);
    if (!top.length) return { list: [], total: 0, sig: '' };

    var sig = top.map(function (p) { return p.pmid; }).join(',');
    var seed = (U.daySeed(sig) ^ 0x9e3779b9) >>> 0;
    var rnd = U.rndFor(seed);

    var scored = [];
    MECH.forEach(function (m) {
      var hits = top.filter(function (p) {
        return m.re.test((p.title || '') + ' ' + (p.titleZh || '') + ' ' + (p.abstract || ''));
      });
      if (hits.length) {
        scored.push({ m: m, hits: hits, r: rnd(), w: hits.length + (m.kind === 'mech' ? 2 : m.kind === 'proc' ? 1 : 0) });
      }
    });
    scored.sort(function (a, b) { return b.w - a.w || a.r - b.r; });

        if (used[key]) continue;

        var tp = dominantTopic(s.hits);
        var cfg = MODEL[tp] || FALLBACK_MODEL;
        var partner = null;
        if (s.m.kind === 'mat' || s.m.kind === 'meth') {
          for (var q = 0; q < scored.length; q++) {
            if (scored[q].m.kind === 'mech' || scored[q].m.kind === 'proc') { partner = scored[q].m; break; }
          }
        }
        var mech2 = (s.m.kind === 'mat' || s.m.kind === 'meth')
          ? (partner ? partner.zh : '创面修复信号') : s.m.zh;
        var cell = pickCell(s.m, cfg);
        var carrier = CARRIER[(k + round + Math.floor(rnd() * CARRIER.length)) % CARRIER.length];
        var o = {
          mech: s.m.zh, mech2: mech2, env: cfg.env, model: cfg.model, bad: cfg.bad,
          cell: cell, proc: s.m.proc || '增殖与迁移', carrier: carrier,
          dys: s.m.dys || (s.m.zh + '失衡'), tgt: s.m.tgt || (cell + (s.m.proc || '增殖与迁移')),
          rnd: rnd

        var title = titleFor(s.m, o, rnd);

        var src = s.hits.slice().sort(function (a, b) {
          return String(b.edat || b.date || '').localeCompare(String(a.edat || a.date || ''));
        }).slice(0, 3).map(shortPaper);

        var formTag = s.m.kind === 'meth' ? '多组学/模型构建'
          : (s.m.kind === 'mat' ? '材料 + 机制交叉' : '基础机制');
        var ang = s.m.ang + '。' + angle2(s.m, cfg, o, src);

        list.push({
          t: title,
          a: ang,
          k: [s.m.zh, cfg.model, s.m.cell, formTag].filter(function (v, ix, ar) { return v && ar.indexOf(v) === ix; }),
          f: formTag + '：' + cfg.form,
          src: src,
          tp: tp,
          kind: s.m.kind,
          ts: Date.now()
        });
      }
      round++;
    }
    return { list: list, total: top.length, sig: sig };
  }

  WB.topicGen = { generate: generate, collect: collect, topPapers: topPapers, MECH: MECH };

/* ===== 云端同步：GitHub Gist 后端 =====

/* ===== 模块 3：科研进展 ===== */
(function () {
  'use strict';
  var U = WB.util, D = window.WB_DATA || {};
  var PAPERS = (D.papers || []).slice();
  var MED = D.medWords || [], MCATS = D.medCats || [];
  var K_FAV = 'fav_papers', K_LEARNED = 'med_learned', K_HIST = 'med_hist';

  /* 只保留近三年（含当年） */
  var THIS_YEAR = new Date().getFullYear();
  var RECENT = PAPERS.filter(function (p) { return +p.year >= THIS_YEAR - 2; });
  if (RECENT.length < 20) RECENT = PAPERS;

  /* 静态库 + 实时抓取库合并（实时条目优先，按日期倒序） */
  /* 静态库日期是 "2026-Jun" 这种格式，统一成可比较的 YYYY-MM-DD */
  var MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  function normDate(d) {
    d = String(d || '');
    if (/^\d{4}-\d{2}-\d{2}/.test(d)) return d.slice(0, 10);
    var m = d.match(/^(\d{4})-([A-Za-z]{3})/);
    if (m) {
      var mm = MON[m[2].toLowerCase()] || 1;
      return m[1] + '-' + (mm < 10 ? '0' + mm : mm) + '-01';
    }
    m = d.match(/^(\d{4})/);
    return m ? m[1] + '-01-01' : '';
  }

  function allPapers() {
    var live = (WB.live && WB.live.list) ? WB.live.list() : [];
    var map = {}, arr = [];
    RECENT.forEach(function (p) { map[String(p.pmid)] = p; arr.push(p); });
    live.forEach(function (p) {
      var k = String(p.pmid);
      if (map[k]) {
        /* 已有静态条目：用实时抓到的摘要/日期补全，保留人工译文 */
        var o = map[k];
        if (!o.abstractZh && p.abstractZh) o.abstractZh = p.abstractZh;
        if (!o.titleZh && p.titleZh) o.titleZh = p.titleZh;
        if (!o.abstract && p.abstract) o.abstract = p.abstract;
        o._live = true;
      } else {
        p._live = true;
        map[k] = p; arr.push(p);
      }
    });
    /* 统一排序键：优先用 PubMed 收录日期（edat），其次实时抓取的发表日，最后年份 */
    arr.forEach(function (p) {
      p._d = normDate(p.edat) || normDate(p.date) || normDate(p.year);
    });
    arr.sort(function (a, b) {
      if (a._d !== b._d) return b._d.localeCompare(a._d);
      return (b.ts || 0) - (a.ts || 0);
    });
    return arr;
  }

  function topicList(arr) {
    var m = {};
    (arr || RECENT).forEach(function (p) { m[p.topic] = (m[p.topic] || 0) + 1; });
    return Object.keys(m).sort(function (a, b) { return m[b] - m[a]; });
  }

  function favList() { return U.storeGet(K_FAV, []); }
  function isFav(id) { return favList().indexOf(id) >= 0; }
  function toggleFav(id) {
    var f = favList(), i = f.indexOf(id);
    if (i >= 0) f.splice(i, 1); else f.push(id);
    U.storeSet(K_FAV, f);
    return i < 0;
  }

  function tierCls(t) {
    if (!t) return 'n';
    if (t.indexOf('1') === 0) return 'r';
    if (t.indexOf('2') === 0) return 'o';
    if (t.indexOf('3') === 0) return 'g';
    return 'n';
  }

  function paperCard(p, openMap) {
    var pmid = String(p.pmid);
    var url = 'https://pubmed.ncbi.nlm.nih.gov/' + pmid + '/';
    var zhAbs = (p.abstractZh || '').trim();
    /* 近 7 天内新收录的文献打 NEW 标 */
    var d7 = new Date(Date.now() - 7 * 864e5);
    var cut = d7.getFullYear() + '-' + ('0' + (d7.getMonth() + 1)).slice(-2) + '-' + ('0' + d7.getDate()).slice(-2);
    var isNew = !!(p._live && (p._d || '') >= cut);

        if (a === 'clearfav') {
          U.storeSet(K_FAV, []); renderFav(); refreshFavN(); U.toast('已清空收藏'); return;
        }
        if (a === 'whist') {
          var hist = U.storeGet(K_HIST, {});
          var ks = Object.keys(hist).sort().reverse();

        if (a === 'wback') { renderWords(); return; }

        var paper = act.closest('.paper');
        if (paper) {
          var pmid = paper.getAttribute('data-pmid');

            U.toast(added ? '已收藏' : '已取消收藏');

        }
        var mk = act;
        if (a === 'mark') {
          var card = mk.closest('.wcard');
          var en = card.getAttribute('data-en');
          var learned = U.storeGet(K_LEARNED, {});
          if (learned[en]) { delete learned[en]; card.classList.remove('learned'); mk.textContent = '标记已学'; }
          else { learned[en] = Date.now(); card.classList.add('learned'); mk.textContent = '✓ 已掌握'; }

      if (WB.live) {
        var _t = null;
        WB.live.onUpdate(function () {

          refreshFavN();
          if (st.tab !== 'feed' && st.tab !== 'fav') return;
          clearTimeout(_t);

      if (WB.live) {
        WB.live.pump();
        if (WB.live.needsSync()) {
          setTimeout(function () { WB.live.sync(false); }, 400);
        }
      }
    }
  });
})();

(function () {
  'use strict';

  var K_EV = 'calendar_events';
  var TYPES = {
    lab: { n: '实验安排', cls: 'ev-lab', ico: '🧪' },

  function allEv() {
    var v = U.storeGet(K_EV, {});
    if (!v || typeof v !== 'object' || Array.isArray(v)) return {};
    var out = {};
    Object.keys(v).forEach(function (d) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
      var arr = v[d];
      if (!Array.isArray(arr)) return;
      var clean = arr.filter(function (e) { return e && typeof e === 'object' && e.title; });
      if (clean.length) out[d] = clean;
    });
    return out;
  }
  function evOf(dateStr) { var a = allEv(); return (a[dateStr] || []).slice(); }
  function saveEv(dateStr, arr) {
    var a = allEv();
    if (arr && arr.length) a[dateStr] = arr; else delete a[dateStr];
    U.storeSet(K_EV, a);
  }

  WB.register({
    id: 'calendar', icon: '📅', title: '时间安排表', group: '每日',

      host.innerHTML =
        '<div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)">' +
        '<div class="card mb0"><div class="cal-head">' +
        '<button type="button" class="btn sm" data-act="prev">‹ 上月</button>' +
        '<div class="ym" data-ym></div>' +
        '<button type="button" class="btn sm" data-act="next">下月 ›</button>' +
        '<button type="button" class="btn sm" data-act="today">回到今天</button>' +
        '<span class="sp"></span><button type="button" class="btn sm danger" data-act="clear">🗑 一键清空</button></div>' +
        '<div class="cal-grid" data-dow></div>' +
        '<div class="cal-grid mt8" data-grid></div>' +
        '<div class="row mt8 small muted"><span class="tag ev-lab">🧪 实验</span><span class="tag ev-trip">✈️ 出行</span>' +
        '<span class="tag ev-remind">⏰ 提醒</span><span class="sp"></span><span data-monthn></span></div></div>' +
        '<div class="card mb0"><div class="card-h"><h3>📝 <span data-seltitle></span></h3></div>' +
        '<div data-daybox></div></div>' +
        '</div>';

      var grid = host.querySelector('[data-grid]');

        .map(function (d) { return '<div class="cal-dow">' + d + '</div>'; }).join('');

      function renderCal() {
        ym.textContent = st.y + ' 年 ' + (st.m + 1) + ' 月';
        var first = new Date(st.y, st.m, 1);
        var startDow = (first.getDay() + 6) % 7;
        var daysInMonth = new Date(st.y, st.m + 1, 0).getDate();
        var prevDays = new Date(st.y, st.m, 0).getDate();
        var cells = [], i;
        for (i = startDow - 1; i >= 0; i--) {
          cells.push({ d: prevDays - i, dim: true, y: st.m === 0 ? st.y - 1 : st.y, m: st.m === 0 ? 11 : st.m - 1 });
        }
        for (i = 1; i <= daysInMonth; i++) cells.push({ d: i, dim: false, y: st.y, m: st.m });
        while (cells.length % 7) {
          var n = cells.length % 7;
          cells.push({ d: n, dim: true, y: st.m === 11 ? st.y + 1 : st.y, m: st.m === 11 ? 0 : st.m + 1 });
        }

        var monthCount = 0;
        grid.innerHTML = cells.map(function (c) {
          var ds = c.y + '-' + U.pad2(c.m + 1) + '-' + U.pad2(c.d);
          var evs = evOf(ds);
          if (!c.dim) monthCount += evs.length;
          var cls = 'cal-cell' + (c.dim ? ' dim' : '') + (ds === U.todayStr() ? ' today' : '') + (ds === st.sel ? ' sel' : '');
          var show = evs.slice(0, 2).map(function (e) {
            var t = TYPES[e.type] || TYPES.remind;
            var tx = t.n + '·' + (e.title || e.text || '');
            return '<div class="ev ' + t.cls + '" title="' + U.esc(tx) + '">' + U.esc(tx) + '</div>';
          }).join('');
          if (evs.length > 2) show += '<div class="more">+' + (evs.length - 2) + '</div>';
          return '<div class="' + cls + '" data-date="' + ds + '"><div class="d">' + c.d + '</div>' + show + '</div>';
        }).join('');
        host.querySelector('[data-monthn]').textContent = '本月共 ' + monthCount + ' 项安排';
      }

      function renderDay() {
        var ds = st.sel, d = U.parseDate(ds), evs = evOf(ds);
        host.querySelector('[data-seltitle]').textContent =
          (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + U.weekCN(d) + '（' + U.relDay(ds) + '）';
        if (st.editing) return renderEditor();
        dayBox.innerHTML =
          '<div class="chips mb8">' + Object.keys(TYPES).map(function (k) {
            return '<button type="button" class="chip" data-add="' + k + '">+ ' + TYPES[k].ico + ' ' + TYPES[k].n + '</button>';
          }).join('') + '</div>' +
          (evs.length ? '<div class="evlist">' + evs.map(function (e, idx) {
            var t = TYPES[e.type] || TYPES.remind;
            return '<div class="evrow"><span>' + t.ico + '</span><div class="sp"><h5>' + U.esc(e.title || t.n) +
              ' <span class="tag n tiny">' + U.esc(e.time || '全天') + '</span></h5>' +
              '<div class="tiny muted">' + U.esc(t.n) + '</div>' +
              (e.text ? '<p>' + U.esc(e.text) + '</p>' : '') + '</div>' +
              '<button type="button" class="btn xs" data-edit="' + idx + '">编辑</button>' +
              '<button type="button" class="btn xs danger" data-del="' + idx + '">删</button></div>';
          }).join('') + '</div>' : '<div class="empty"><span class="e-ico">🗓️</span>这一天还没有安排，点上方按钮添加</div>');
      }

      function renderEditor() {
        var ed = st.editing, t = TYPES[ed.type] || TYPES.remind;
        var evs = evOf(st.sel);
        var cur = ed.idx == null ? null : evs[ed.idx];
        dayBox.innerHTML =
          '<div class="row mb8"><b>' + (cur ? '编辑' : '新增') + t.ico + t.n + '</b><span class="sp"></span>' +
          '<span class="muted small">' + U.esc(st.sel) + '</span></div>' +
          '<div class="field mb8"><label>标题</label>' +
          '<input type="text" data-e-title placeholder="' + (ed.type === 'lab' ? '如 动物造模 / 细胞传代' : ed.type === 'trip' ? '如 门诊 / 组会 / 出差' : '如 提交开题材料') + '" value="' + U.esc(cur ? cur.title || '' : '') + '"></div>' +
          '<div class="field mb8"><label>时间（留空表示全天）</label>' +
          '<input type="text" data-e-time placeholder="如 09:00-11:00" value="' + U.esc(cur ? cur.time || '' : '') + '"></div>' +
          '<div class="field mb8"><label>内容</label>' +
          '<textarea data-e-text placeholder="' +
          (ed.type === 'lab' ? '具体步骤、试剂、注意事项…' :
            ed.type === 'trip' ? '地点、同行、需要带的材料…' : '需要提醒自己的细节…') + '">' +
          U.esc(cur ? cur.text || '' : '') + '</textarea></div>' +
          '<div class="row"><button type="button" class="btn pri" data-save="1">保存</button>' +
          '<button type="button" class="btn" data-cancel="1">取消</button>' +
          (cur ? '<button type="button" class="btn danger" data-del="' + ed.idx + '">删除</button>' : '') + '</div>';
        var ti = dayBox.querySelector('[data-e-title]');
        if (ti) ti.focus();
      }

      host.addEventListener('click', function (e) {
        var cell = e.target.closest('[data-date]');
        if (cell) {
          st.sel = cell.getAttribute('data-date');
          st.editing = null;
          var p = st.sel.split('-');
          st.y = +p[0]; st.m = +p[1] - 1;
          renderCal(); renderDay(); return;
        }
        var act = e.target.closest('[data-act]');
        if (act) {
          var a = act.getAttribute('data-act');
          if (a === 'prev') { st.m--; if (st.m < 0) { st.m = 11; st.y--; } st.editing = null; renderCal(); renderDay(); return; }
          if (a === 'next') { st.m++; if (st.m > 11) { st.m = 0; st.y++; } st.editing = null; renderCal(); renderDay(); return; }
          if (a === 'today') {
            var d = new Date(); st.y = d.getFullYear(); st.m = d.getMonth(); st.sel = U.todayStr(); st.editing = null;
            renderCal(); renderDay(); return;
          }
          if (a === 'clear') {
            if (!window.confirm('确定清空全部日程安排吗？此操作不可恢复。')) return;
            U.storeSet(K_EV, {}); st.editing = null; renderCal(); renderDay(); U.toast('已清空全部日程'); return;
          }
        }
        var add = e.target.closest('[data-add]');
        if (add) { st.editing = { type: add.getAttribute('data-add'), idx: null }; renderEditor(); return; }
        var ed = e.target.closest('[data-edit]');
        if (ed) {
          var i = +ed.getAttribute('data-edit');
          st.editing = { type: (evOf(st.sel)[i] || {}).type || 'remind', idx: i };
          renderEditor(); return;
        }
        var dl = e.target.closest('[data-del]');
        if (dl) {
          var k = +dl.getAttribute('data-del');
          var arr = evOf(st.sel);
          arr.splice(k, 1);
          saveEv(st.sel, arr); st.editing = null; renderCal(); renderDay(); U.toast('已删除'); return;
        }
        var sv = e.target.closest('[data-save]');
        if (sv) {
          var title = dayBox.querySelector('[data-e-title]').value.trim();
          var time = dayBox.querySelector('[data-e-time]').value.trim();
          var text = dayBox.querySelector('[data-e-text]').value.trim();
          if (!title) { U.toast('请填写标题'); return; }
          var list = evOf(st.sel);
          var idx = st.editing.idx;
          var rec = { id: 'e' + Date.now() + Math.floor(Math.random() * 1000), type: st.editing.type, title: title, time: time, text: text, ts: Date.now() };
          if (idx == null) list.push(rec); else { rec.id = (list[idx] && list[idx].id) || rec.id; list[idx] = rec; }
          saveEv(st.sel, list); st.editing = null; renderCal(); renderDay(); U.toast('已保存'); return;
        }
        if (e.target.closest('[data-cancel]')) { st.editing = null; renderDay(); return; }
      });

      renderCal(); renderDay();
    }
  });
})();

/* ===== 模块 5：账本 ===== */
(function () {
  'use strict';
  var U = WB.util;
  var K_LED = 'ledger';
  var CATS = [
    { k: 'food', n: '餐饮', ico: '🍚' },
    { k: 'traffic', n: '交通', ico: '🚇' },
    { k: 'shopping', n: '购物', ico: '🛒' },
    { k: 'fun', n: '娱乐', ico: '🎬' },
    { k: 'medical', n: '医疗', ico: '🏥' },
    { k: 'other', n: '其他', ico: '📦' }
  ];
  var PLATS = [{ k: 'alipay', n: '支付宝', ico: '🔵' }, { k: 'wechat', n: '微信', ico: '🟢' }];

  function all() {
    var v = U.storeGet(K_LED, []);
    if (!Array.isArray(v)) return [];
    /* 容错：过滤掉云端同步可能带入的残缺记录，避免整页渲染崩掉 */
    return v.filter(function (r) {
      return r && typeof r === 'object' && typeof r.d === 'string' && r.d.length >= 7 && isFinite(Number(r.amt));
    }).map(function (r) {
      return { id: r.id || ('l' + Math.random().toString(36).slice(2, 8)), d: r.d, p: r.p || 'alipay', c: r.c || 'other', amt: Number(r.amt), note: r.note || '', ts: r.ts || 0 };
    });
  }
  function catOf(k) { for (var i = 0; i < CATS.length; i++) if (CATS[i].k === k) return CATS[i]; return CATS[5]; }
  function platOf(k) { for (var i = 0; i < PLATS.length; i++) if (PLATS[i].k === k) return PLATS[i]; return PLATS[0]; }

  WB.register({
    id: 'ledger', icon: '💰', title: '账本', group: '每日',
    mount: function (host) {
      var st = { day: U.todayStr(), tab: 'today' };

      host.innerHTML =
        '<div class="card">' +
        '<div class="card-h"><h3>✍️ 记一笔</h3><span class="sp"></span><span class="muted small">日期</span>' +
        '<input type="date" data-date style="width:150px"></div>' +
        '<div class="row mb8"><div class="seg" data-plat>' +
        PLATS.map(function (p) {
          return '<button type="button" class="' + (p.k === 'alipay' ? 'on' : '') + '" data-p="' + p.k + '">' + p.ico + ' ' + p.n + '</button>';
        }).join('') + '</div>' +
        '<div class="seg" data-cat>' + CATS.map(function (c, i) {
          return '<button type="button" class="' + (i === 0 ? 'on' : '') + '" data-c="' + c.k + '">' + c.ico + ' ' + c.n + '</button>';
        }).join('') + '</div></div>' +
        '<div class="row"><input type="number" data-amt placeholder="金额" step="0.01" min="0" style="width:110px">' +
        '<input type="text" data-note placeholder="备注（可选），如 细胞培养皿 / 地铁 / 午饭" style="flex:1;min-width:150px">' +
        '<button type="button" class="btn pri" data-act="add">+ 记一笔</button></div></div>' +
        '<div data-body></div>';

      var body = host.querySelector('[data-body]');
      var dateInp = host.querySelector('[data-date]');
      var platBox = host.querySelector('[data-plat]');
      var catBox = host.querySelector('[data-cat]');
      var amtInp = host.querySelector('[data-amt]');
      var noteInp = host.querySelector('[data-note]');
      dateInp.value = st.day;

      function pickSeg(box, attr) {
        box.addEventListener('click', function (e) {
          var b = e.target.closest('[' + attr + ']');
          if (!b) return;
          box.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on');
        });
      }
      pickSeg(platBox, 'data-p');
      pickSeg(catBox, 'data-c');
      function curVal(box, attr) {
        var b = box.querySelector('button.on');
        return b ? b.getAttribute(attr) : null;
      }

      /* ---- 渲染 ---- */
      function render() {
        var list = all();
        var dayList = list.filter(function (r) { return r.d === st.day; });
        var sumDay = dayList.reduce(function (s, r) { return s + r.amt; }, 0);
        var ali = dayList.filter(function (r) { return r.p === 'alipay'; }).reduce(function (s, r) { return s + r.amt; }, 0);
        var wx = dayList.filter(function (r) { return r.p === 'wechat'; }).reduce(function (s, r) { return s + r.amt; }, 0);

        var byCat = {};
        dayList.forEach(function (r) { byCat[r.c] = (byCat[r.c] || 0) + r.amt; });
        var catArr = Object.keys(byCat).map(function (k) { return { c: catOf(k), v: byCat[k] }; })
          .sort(function (a, b) { return b.v - a.v; });
        var maxV = catArr.length ? catArr[0].v : 1;

        /* 近 7 天 */
        var days = [], i;
        for (i = 6; i >= 0; i--) {
          var d = U.parseDate(st.day); d.setDate(d.getDate() - i);
          var ds = U.fmtDate(d);
          days.push({ d: ds, v: list.filter(function (r) { return r.d === ds; }).reduce(function (s, r) { return s + r.amt; }, 0) });
        }
        var max7 = Math.max.apply(null, days.map(function (x) { return x.v; }).concat([1]));

        var monthKey = st.day.slice(0, 7);
        var monthSum = list.filter(function (r) { return r.d.slice(0, 7) === monthKey; })
          .reduce(function (s, r) { return s + r.amt; }, 0);

        body.innerHTML =
          '<div class="grid g4 half mb0">' +
          '<div class="card tight mb0"><div class="stat"><div class="lb">今日合计</div><div class="vl">¥' + U.money(sumDay) + '</div></div></div>' +
          '<div class="card tight mb0"><div class="stat"><div class="lb">🔵 支付宝</div><div class="vl">¥' + U.money(ali) + '</div></div></div>' +
          '<div class="card tight mb0"><div class="stat g"><div class="lb">🟢 微信</div><div class="vl">¥' + U.money(wx) + '</div></div></div>' +
          '<div class="card tight mb0"><div class="stat o"><div class="lb">本月累计</div><div class="vl">¥' + U.money(monthSum) + '</div></div></div>' +
          '</div>' +
          '<div class="grid g2 mt8">' +
          '<div class="card mb0"><div class="card-h"><h3>📊 今日分类占比</h3></div>' +
          (catArr.length ? catArr.map(function (c) {
            var pct = Math.round(c.v / sumDay * 100);
            return '<div class="bar-row"><span class="nm">' + c.c.ico + ' ' + c.c.n + '</span>' +
              '<span class="track"><i style="width:' + Math.round(c.v / maxV * 100) + '%"></i></span>' +
              '<span class="vv">¥' + U.money(c.v) + '</span><span class="tiny muted" style="width:34px;text-align:right">' + pct + '%</span></div>';
          }).join('') : '<div class="empty"><span class="e-ico">📊</span>今天还没有记录</div>') +
          '</div>' +
          '<div class="card mb0"><div class="card-h"><h3>📈 近 7 天支出</h3></div>' +
          '<div class="row" style="align-items:flex-end;gap:6px;height:96px;padding-top:6px">' +
          days.map(function (x) {
            var h = Math.max(4, Math.round(x.v / max7 * 78));
            return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0">' +
              '<div class="tiny muted" style="font-variant-numeric:tabular-nums">' + (x.v ? Math.round(x.v) : '') + '</div>' +
              '<div title="¥' + U.money(x.v) + '" style="width:100%;height:' + h + 'px;background:linear-gradient(180deg,#64B5F6,#1565C0);border-radius:5px 5px 2px 2px"></div>' +
              '<div class="tiny muted">' + x.d.slice(5).replace('-', '/') + '</div></div>';
          }).join('') + '</div></div></div>' +
          '<div class="card mt8 mb0"><div class="card-h"><h3>📒 ' + U.relDay(st.day) + ' 明细（' + dayList.length + ' 笔）</h3>' +
          '<span class="sp"></span><button type="button" class="btn sm" data-act="hist">📜 全部历史</button></div>' +
          (dayList.length ? '<div class="tb-wrap"><table class="tb"><thead><tr><th>时间</th><th>平台</th><th>分类</th><th>备注</th><th class="num">金额</th><th></th></tr></thead><tbody>' +
            dayList.slice().reverse().map(function (r) {
              var c = catOf(r.c), p = platOf(r.p);
              return '<tr><td class="tiny muted">' + U.esc(r.d) + '</td>' +
                '<td><span class="tag n">' + p.ico + ' ' + p.n + '</span></td>' +
                '<td><span class="tag">' + c.ico + ' ' + c.n + '</span></td>' +
                '<td>' + U.esc(r.note || '—') + '</td>' +
                '<td class="num">¥' + U.money(r.amt) + '</td>' +
                '<td><button type="button" class="btn xs danger" data-del="' + r.id + '">删</button></td></tr>';
            }).join('') + '</tbody></table></div>'
            : '<div class="empty"><span class="e-ico">🧾</span>还没有记录，用上方表单记第一笔</div>') +
          '</div>';
      }

      /* ---- 历史 ---- */
      function renderHist() {
        var list = all().slice().reverse();
        var byDay = {};
        list.forEach(function (r) { (byDay[r.d] = byDay[r.d] || []).push(r); });
        var ks = Object.keys(byDay).sort().reverse();
        var total = list.reduce(function (s, r) { return s + r.amt; }, 0);
        body.innerHTML =
          '<div class="row mb8"><button type="button" class="btn sm" data-act="back">← 返回</button>' +
          '<b>全部历史记录</b><span class="sp"></span>' +
          '<span class="tag dark">共 ' + list.length + ' 笔</span><span class="tag">合计 ¥' + U.money(total) + '</span></div>' +
          (ks.length ? '<div class="list">' + ks.map(function (k) {
            var arr = byDay[k], s = arr.reduce(function (a, r) { return a + r.amt; }, 0);
            var ali = arr.filter(function (r) { return r.p === 'alipay'; }).reduce(function (a, r) { return a + r.amt; }, 0);
            return '<div class="item"><div class="it-h"><div class="sp"><h4>' + U.relDay(k) + ' · ' + k +
              '</h4><div class="meta"><span class="tag">' + arr.length + ' 笔</span>' +
              '<span>支付宝 ¥' + U.money(ali) + '</span><span>微信 ¥' + U.money(s - ali) + '</span></div></div>' +
              '<b style="color:var(--brand-2)">¥' + U.money(s) + '</b></div>' +
              '<div class="small muted" style="margin-top:5px">' + arr.map(function (r) {
                return catOf(r.c).ico + ' ' + U.esc(r.note || catOf(r.c).n) + ' ¥' + U.money(r.amt);
              }).join('　') + '</div></div>';
          }).join('') + '</div>' : U.emptyBox('📭', '暂无账本记录'));
      }

      /* ---- 事件 ---- */
      host.addEventListener('change', function (e) {
        if (e.target === dateInp) { st.day = dateInp.value || U.todayStr(); render(); }
      });

      host.addEventListener('click', function (e) {
        var act = e.target.closest('[data-act]');
        if (act) {
          var a = act.getAttribute('data-act');
          if (a === 'add') {
            var amt = parseFloat(amtInp.value);
            if (!(amt > 0)) { U.toast('请输入正确金额'); amtInp.focus(); return; }
            var list = all();
            list.push({
              id: 'r' + Date.now() + Math.floor(Math.random() * 1000),
              d: st.day, p: curVal(platBox, 'data-p') || 'alipay',
              c: curVal(catBox, 'data-c') || 'food',
              amt: Math.round(amt * 100) / 100,
              note: noteInp.value.trim(), ts: Date.now()
            });
            U.storeSet(K_LED, list);
            amtInp.value = ''; noteInp.value = '';
            render(); U.toast('已记录 ¥' + U.money(amt));
            return;
          }
          if (a === 'hist') { renderHist(); return; }
          if (a === 'back') { render(); return; }
        }
        var dl = e.target.closest('[data-del]');
        if (dl) {
          var id = dl.getAttribute('data-del');
          var arr = all().filter(function (r) { return r.id !== id; });
          U.storeSet(K_LED, arr); render(); U.toast('已删除'); return;
        }
      });

      render();
    }
  });
})();

/* ===== 模块 9：选题灵感（基于顶刊速递前 100 篇文献自动挖掘） ===== */
(function () {
  'use strict';
  var U = WB.util;
  var K_MINE = 'my_ideas';        /* 我的选题库 */
  var K_CACHE = 'idea_cache';     /* {sig, day, list} 缓存当天生成结果 */

  function mine() { return U.storeGet(K_MINE, []); }
  function setMine(m) { U.storeSet(K_MINE, m); }
  function mineIdx(t) {
    var m = mine(), idx = -1;
    m.forEach(function (x, i) { if (x.t === t) idx = i; });
    return idx;
  }
  function isMine(t) { return mineIdx(t) >= 0; }

  /* 取选题：优先用缓存（文献池签名 + 当天未变），否则重新生成 */
  function getIdeas() {
    var papers = WB.topicGen.collect();
    var res = WB.topicGen.generate(papers, 20);
    var cache = U.storeGet(K_CACHE, null);
    if (cache && cache.sig === res.sig && cache.day === U.todayStr() && cache.list && cache.list.length) {
      res.list = cache.list;
      res.cached = true;
    } else if (res.list.length) {
      U.storeSet(K_CACHE, { sig: res.sig, day: U.todayStr(), list: res.list, total: res.total });
    }
    return res;
  }

  function pmUrl(pmid) { return 'https://pubmed.ncbi.nlm.nih.gov/' + pmid + '/'; }

  function srcHtml(it) {
    var src = it.src || [];
    if (!src.length) return '<div class="kv"><b>来源文献：</b><span class="muted">暂无关联文献</span></div>';
    return '<div class="kv"><b>来源文献（点击查看原文）：</b></div><div class="isrc">' +
      src.map(function (p, i) {
        var label = p.titleZh || p.title || ('PMID ' + p.pmid);
        return '<a class="ilink" href="' + pmUrl(p.pmid) + '" target="_blank" rel="noopener" title="' + U.esc(p.title || '') + '">' +
          '<b>' + (i + 1) + '.</b> ' + U.esc(label) +
          '<span class="ij">' + U.esc(p.journal || '') + (p.if ? ' · IF ' + p.if : '') + (p.date ? ' · ' + U.esc(p.date) : '') + '</span>' +
          '</a>';
      }).join('') + '</div>';
  }

  WB.register({
    id: 'ideas', icon: '💡', title: '选题灵感', group: '科研',
    mount: function (host) {
      var st = { tab: 'today', data: null };

      host.innerHTML =
        '<div class="card"><div class="tabs">' +
        '<button type="button" class="tab on" data-tab="today">✨ 今日灵感 <span class="tiny" data-n1></span></button>' +
        '<button type="button" class="tab" data-tab="mine">⭐ 我的选题库 <span class="tiny" data-n2></span></button>' +
        '</div><div data-body></div></div>';

      var body = host.querySelector('[data-body]');
      var n1 = host.querySelector('[data-n1]');
      var n2 = host.querySelector('[data-n2]');

      function refreshN() {
        var d = st.data || getIdeas();
        st.data = d;
        n1.textContent = d.list.length ? '(' + d.list.length + ')' : '';
        var m = mine().length;
        n2.textContent = m ? '(' + m + ')' : '';
      }

      function ideaCard(it, showFav) {
        var got = isMine(it.t);
        return '<div class="idea"><div class="row"><h4 style="flex:1">' + U.esc(it.t) + '</h4>' +
          (showFav !== false ? '<button type="button" class="btn xs' + (got ? ' on' : '') + '" data-fav="' + U.esc(it.t) + '">' +
            (got ? '★ 已收藏' : '☆ 收藏') + '</button>' : '') +
          '</div>' +
          '<div class="kv"><b>切入角度：</b>' + U.esc(it.a) + '</div>' +
          '<div class="kv"><b>关键词：</b>' + (it.k || []).map(function (k) { return '<span class="tag n tiny">' + U.esc(k) + '</span>'; }).join(' ') + '</div>' +
          '<div class="kv"><b>适合形式：</b>' + U.esc(it.f) + '</div>' +
          srcHtml(it) +
          '<div class="row mt8"><button type="button" class="btn xs"' + U.spkAttr(it.t + '。' + it.a, 'zh-CN') + '>🔊 朗读</button>' +
          '<button type="button" class="btn xs" data-copy="' + U.esc(it.t + '\n切入点：' + it.a + '\n关键词：' + (it.k || []).join('、') + '\n适合形式：' + it.f) + '">📋 复制</button></div>' +
          '</div>';
      }

      function renderToday() {
        var d = st.data || getIdeas();
        st.data = d;
        if (!d.list.length) {
          body.innerHTML = U.emptyBox('💡', '文献池为空，请先到「科研进展 → 预刊速递」同步一次文献');
          return;
        }
        body.innerHTML =
          '<div class="row mb8"><span class="tag dark">' + d.list.length + ' 个选题</span>' +
          '<span class="muted small">从顶刊速递前 ' + d.total + ' 篇文献中挖掘 · 文献更新即自动重算</span>' +
          '<span class="sp"></span>' +
          '<button type="button" class="btn sm" data-act="regen">🔄 重新挖掘</button></div>' +
          '<div class="grid g2 half">' + d.list.map(function (i) { return ideaCard(i); }).join('') + '</div>' +
          '<div class="hint b mt8">💡 选题由「科研进展 → 顶刊速递」前 100 篇文献自动挖掘：文献池每天刷新，选题随之更新。收藏后进入「我的选题库」。</div>';
      }

      function renderMine() {
        var m = mine();
        body.innerHTML = '<div class="row mb8"><span class="tag dark">' + m.length + ' 个</span>' +
          '<span class="muted small">我收藏的选题</span><span class="sp"></span>' +
          (m.length ? '<button type="button" class="btn sm" data-copy="' + U.esc(m.map(function (x, i) {
            return (i + 1) + '. ' + x.t + '\n   切入角度：' + x.a;
          }).join('\n')) + '">📋 全部复制</button>' : '') + '</div>' +
          (m.length ? '<div class="list">' + m.map(function (i) { return ideaCard(i); }).join('') + '</div>'
            : U.emptyBox('⭐', '还没有收藏选题，去「今日灵感」点 ☆ 收藏'));
      }

      function render() {
        refreshN();
        if (st.tab === 'today') renderToday(); else renderMine();
      }

      host.addEventListener('click', function (e) {
        var t = e.target.closest('[data-tab]');
        if (t) {
          st.tab = t.getAttribute('data-tab');
          host.querySelectorAll('[data-tab]').forEach(function (b) { b.classList.toggle('on', b === t); });
          render(); return;
        }
        var f = e.target.closest('[data-fav]');
        if (f) {
          var title = f.getAttribute('data-fav');
          var m = mine(), idx = mineIdx(title);
          if (idx >= 0) {
            m.splice(idx, 1); setMine(m);
            f.textContent = '☆ 收藏'; f.classList.remove('on'); U.toast('已取消收藏');
          } else {
            var pool = (st.data ? st.data.list : []).concat((U.storeGet(K_CACHE, {}) || {}).list || []);
            var src = pool.filter(function (x) { return x.t === title; })[0] || { t: title };
            m.push({ t: src.t, a: src.a || '', k: src.k || [], f: src.f || '', src: src.src || [], ts: Date.now() });
            setMine(m);
            f.textContent = '★ 已收藏'; f.classList.add('on'); U.toast('已加入我的选题库');
          }
          refreshN();
          if (st.tab === 'mine') renderMine();
          return;
        }
        if (e.target.closest('[data-act="regen"]')) {
          U.storeDel(K_CACHE);
          st.data = getIdeas();
          renderToday(); refreshN();
          U.toast('已重新挖掘选题');
          return;
        }
      });

      render();

      /* 顶刊速递文献池更新（实时抓取/翻译完成）后自动重算选题 */
      if (WB.live && WB.live.onUpdate) {
        var _t = null;
        WB.live.onUpdate(function () {
          if (!document.body.contains(host)) return;
          clearTimeout(_t);
          _t = setTimeout(function () {
            if (!document.body.contains(host)) return;
            var d = getIdeas();
            if (st.data && d.sig === st.data.sig) return;
            st.data = d;
            if (st.tab === 'today') { renderToday(); refreshN(); }
          }, 1200);
        });
      }
    }
  });
})();

/* ===== 模块 10：每日复盘 ===== */
(function () {
  'use strict';
  var U = WB.util;
  var K_REV = 'review';
  var K_EV = 'calendar_events';

  var PROMPTS = [
    '今天最有价值的一个实验/阅读收获是什么？',
    '哪个环节卡住了？卡在哪里、下一步怎么绕开？',
    '明天的第一件事应该是什么？',
    '今天的文献里，有哪一句可以直接写进讨论部分？',
    '如果只能保留今天做的一件事，你选哪件？'
  ];

  function all() {
    var v = U.storeGet(K_REV, {});
    if (!v || typeof v !== 'object' || Array.isArray(v)) return {};
    var out = {};
    Object.keys(v).forEach(function (d) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
      var r = v[d];
      if (r && typeof r === 'object') out[d] = r;
    });
    return out;
  }

  /* 自动统计今天的学习足迹 */
  function stats() {
    var t = U.todayStr(), out = [];
    var vocab = U.storeGet('en_vocab_hist', []);
    var v = vocab.filter(function (x) { return x.d === t; })[0];
    out.push({ k: '📖 今日单词', v: v ? v.n + ' 个' : '0 个' });

    var readH = U.storeGet('en_read_hist', []).filter(function (x) { return x.d === t; });
    out.push({ k: '📄 阅读测验', v: readH.length ? readH[readH.length - 1].score + ' 分' : '未做' });

    var lisH = U.storeGet('en_listen_hist', []).filter(function (x) { return x.d === t; });
    out.push({ k: '🎧 听力测验', v: lisH.length ? lisH[lisH.length - 1].score + ' 分' : '未做' });

    var qh = 0;
    Object.keys(localStorage).forEach(function (k) {
      if (k.indexOf('wb1_qh_') !== 0) return;
      try {
        var arr = JSON.parse(localStorage.getItem(k)) || [];
        qh += arr.filter(function (x) { return x.d === t; }).length;
      } catch (e) { }
    });
    out.push({ k: '📝 测验次数', v: qh + ' 次' });

    var ev = U.storeGet(K_EV, {})[t] || [];
    out.push({ k: '📅 今日安排', v: ev.length + ' 项' });

    var led = U.storeGet('ledger', []).filter(function (x) { return x.d === t; });
    var sum = led.reduce(function (s, r) { return s + r.amt; }, 0);
    out.push({ k: '💰 今日支出', v: '¥' + U.money(sum) });

    return out;
  }

  WB.register({
    id: 'review', icon: '📝', title: '每日复盘', group: '每日',
    mount: function (host) {
      var t = U.todayStr();
      var st = { day: t, tab: 'write' };

      host.innerHTML =
        '<div class="card"><div class="tabs">' +
        '<button type="button" class="tab on" data-tab="write">✍️ 写复盘</button>' +
        '<button type="button" class="tab" data-tab="hist">📚 历史复盘</button>' +
        '<button type="button" class="tab" data-tab="stat">📊 学习足迹</button>' +
        '</div><div data-body></div></div>';

      var body = host.querySelector('[data-body]');

      function renderWrite() {
        var rec = all()[st.day] || {};
        body.innerHTML =
          '<div class="row mb8"><span class="tag dark">' + U.relDay(st.day) + '</span>' +
          '<span class="muted small">' + st.day + '</span><span class="sp"></span>' +
          '<input type="date" data-day value="' + st.day + '" style="width:150px">' +
          '<button type="button" class="btn sm" data-act="prompt">🎲 换个提问</button></div>' +
          '<div class="grid g2 half">' +
          '<div class="field mb8"><label>✅ 今日完成</label>' +
          '<textarea data-f="done" placeholder="如：完成糖尿病小鼠创面造模 6 只；读完 2 篇外泌体文献">' + U.esc(rec.done || '') + '</textarea></div>' +
          '<div class="field mb8"><label>🚧 问题与卡点</label>' +
          '<textarea data-f="block" placeholder="如：WB 条带背景高，考虑延长封闭时间">' + U.esc(rec.block || '') + '</textarea></div>' +
          '<div class="field mb8"><label>💡 今日收获</label>' +
          '<textarea data-f="gain" placeholder="如：理解了巨噬细胞极化在糖尿病创面中的作用">' + U.esc(rec.gain || '') + '</textarea></div>' +
          '<div class="field mb8"><label>🎯 明日计划</label>' +
          '<textarea data-f="next" placeholder="如：细胞传代 + 补做免疫荧光">' + U.esc(rec.next || '') + '</textarea></div>' +
          '</div>' +
          '<div class="row"><button type="button" class="btn pri" data-act="save">💾 保存复盘</button>' +
          '<button type="button" class="btn"' + U.spkAttr((rec.done || '') + '。' + (rec.gain || '') + '。' + (rec.next || ''), 'zh-CN') + '>🔊 朗读复盘</button>' +
          '<span class="sp"></span><span class="muted small">保存后自动记入历史</span></div>';
      }

      function renderHist() {
        var a = all();
        var ks = Object.keys(a).sort().reverse();
        body.innerHTML = '<div class="row mb8"><span class="tag dark">' + ks.length + ' 天</span>' +
          '<span class="muted small">每天一份复盘记录</span></div>' +
          (ks.length ? '<div class="list">' + ks.map(function (k) {
            var r = a[k];
            return '<div class="item"><div class="it-h"><div class="sp"><h4>' + U.relDay(k) + ' · ' + k + '</h4>' +
              '<div class="small" style="margin-top:5px;line-height:1.7">' +
              (r.done ? '<div><b>✅ 完成：</b>' + U.esc(r.done) + '</div>' : '') +
              (r.block ? '<div><b>🚧 卡点：</b>' + U.esc(r.block) + '</div>' : '') +
              (r.gain ? '<div><b>💡 收获：</b>' + U.esc(r.gain) + '</div>' : '') +
              (r.next ? '<div><b>🎯 明日：</b>' + U.esc(r.next) + '</div>' : '') +
              '</div></div>' +
              '<div class="row nw"><button type="button" class="btn xs"' + U.spkAttr((r.done || '') + '。' + (r.gain || ''), 'zh-CN') + '>🔊</button>' +
              '<button type="button" class="btn xs danger" data-del="' + k + '">删</button></div></div></div>';
          }).join('') + '</div>' : U.emptyBox('📭', '还没有复盘记录，去写第一篇吧'));
      }

      function renderStat() {
        var s = stats();
        var a = all(), ks = Object.keys(a);
        var streak = 0, d = new Date();
        for (var i = 0; i < 400; i++) {
          var ds = U.fmtDate(d);
          if (a[ds]) streak++;
          else if (i > 0) break;
          d.setDate(d.getDate() - 1);
        }
        body.innerHTML =
          '<div class="grid g4 half mb0">' + s.map(function (x) {
            return '<div class="stat"><div class="lb">' + U.esc(x.k) + '</div><div class="vl" style="font-size:15px">' + U.esc(x.v) + '</div></div>';
          }).join('') + '</div>' +
          '<div class="grid g2 mt8">' +
          '<div class="card tight mb0"><div class="card-h"><h3>🔥 连续复盘</h3></div>' +
          '<div class="stat"><div class="lb">当前连续天数</div><div class="vl">' + streak + ' <small>天</small></div></div>' +
          '<div class="progress mt8"><i style="width:' + Math.min(100, streak * 10) + '%"></i></div>' +
          '<div class="small muted mt8">累计复盘 ' + ks.length + ' 天 · 目标：连续 30 天</div></div>' +
          '<div class="card tight mb0"><div class="card-h"><h3>📌 复盘小贴士</h3></div>' +
          PROMPTS.map(function (p) {
            return '<div class="small" style="margin-bottom:5px">· ' + U.esc(p) + '</div>';
          }).join('') + '</div></div>';
      }

      host.addEventListener('change', function (e) {
        if (e.target.hasAttribute('data-day')) { st.day = e.target.value || U.todayStr(); renderWrite(); }
      });

      host.addEventListener('click', function (e) {
        var t2 = e.target.closest('[data-tab]');
        if (t2) {
          st.tab = t2.getAttribute('data-tab');
          host.querySelectorAll('[data-tab]').forEach(function (b) { b.classList.toggle('on', b === t2); });
          render(); return;
        }
        var act = e.target.closest('[data-act]');
        if (act) {
          var a2 = act.getAttribute('data-act');
          if (a2 === 'save') {
            var rec = all();
            var obj = {};
            ['done', 'block', 'gain', 'next'].forEach(function (k) {
              var f = body.querySelector('[data-f="' + k + '"]');
              obj[k] = f ? f.value.trim() : '';
            });
            if (!obj.done && !obj.block && !obj.gain && !obj.next) { U.toast('至少写一项吧'); return; }
            obj.ts = Date.now();
            rec[st.day] = obj;
            U.storeSet(K_REV, rec);
            U.toast('复盘已保存 ✓');
            return;
          }
          if (a2 === 'prompt') {
            var p = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
            var f2 = body.querySelector('[data-f="gain"]');
            if (f2) { f2.placeholder = p; f2.focus(); }
            U.toast('想一想：' + p);
            return;
          }
        }
        var dl = e.target.closest('[data-del]');
        if (dl) {
          var k2 = dl.getAttribute('data-del');
          if (!window.confirm('确定删除 ' + k2 + ' 的复盘吗？')) return;
          var r2 = all(); delete r2[k2]; U.storeSet(K_REV, r2); renderHist(); U.toast('已删除');
        }
      });

      function render() {
        if (st.tab === 'write') renderWrite();
        else if (st.tab === 'hist') renderHist();
        else renderStat();
      }
      render();
    }
  });
})();

(function () {

  function fmtTime(iso) {
    if (!iso) return '从未同步';
    var d = new Date(iso);

  function countLocal() {

          '<div class="hint g mt8">生成令牌时：<b>Note</b> 随便填（如 workbench），<b>Expiration</b> 可选 No expiration，' +
          '<b>Scopes</b> 只需勾选 <b>gist</b> 这一项。生成后复制以 <code>ghp_</code> 开头的那串，粘贴到上面即可。</div>' +
          (st.err ? '<div class="hint" style="border-color:#F3C1C1">⚠ ' + U.esc(st.err) + '</div>' : '');
      }

      function renderLogged() {
        var u = WB.cloud.user() || {};
        var c = countLocal();
        var mode = WB.cloud.getMode();
        return '' +
          '<div class="row" style="gap:12px;align-items:center;margin-top:4px">' +
          (u.avatar ? '<img src="' + U.esc(u.avatar) + '" alt="" style="width:38px;height:38px;border-radius:50%">' : '') +
          '<div style="flex:1"><b>' + U.esc(u.name || u.login || '') + '</b>' +
          '<div class="muted small">@' + U.esc(u.login || '') + ' · 数据存于私有 Gist</div></div>' +
          '<button type="button" class="btn sm danger" data-act="logout">退出登录</button>' +
          '</div>' +
          '<div class="grid g3 mt8">' +
          U.statCard('本机数据项', String(c.keys), '条记录') +
          U.statCard('上次同步', fmtTime(WB.cloud.lastSync()).replace(' ', '<br>'), '') +
          U.statCard('同步方式', mode === 'auto' ? '自动' : '手动', mode === 'auto' ? '改动后 4 秒上传' : '点了才同步') +
          '</div>' +
          '<div class="row mt8">' +
          '<button type="button" class="btn pri" data-act="sync"' + (WB.cloud.isBusy() ? ' disabled' : '') + '>' +
          (WB.cloud.isBusy() ? '⏳ 同步中…' : '🔄 立即同步') + '</button>' +
          '<button type="button" class="btn" data-act="mode">' + (mode === 'auto' ? '⚙ 切换为手动同步' : '⚙ 切换为自动同步') + '</button>' +
          '<button type="button" class="btn" data-act="pull">⬇ 只下载（用云端覆盖本机）</button>' +
          '</div>' +
          (st.msg ? '<div class="hint g mt8">✅ ' + U.esc(st.msg) + '</div>' : '') +
          (st.err ? '<div class="hint mt8" style="border-color:#F3C1C1">⚠ ' + U.esc(st.err) + '</div>' : '') +
          '<div class="hint b mt8">同步规则：多个设备的数据按<b>并集</b>合并（账本按笔、日程按条、收藏按篇），不会互相覆盖；' +
          '同一项两边都改过时，保留较新的那次。合并完成后本机与云端一致。</div>';
      }

      function renderHelp() {
        return '<div class="card" style="margin-top:12px">' +
          '<div class="card-h"><h3>📖 使用说明</h3></div>' +
          '<div class="hint b"><b>1. 电脑上先登录</b>：生成令牌 → 粘贴 → 点「登录并同步」，本机现有数据会上传到云端。</div>' +
          '<div class="hint b" style="margin-top:8px"><b>2. 手机上打开同一个网址</b>：' +
          '<code>https://weita97.github.io/plastic-surgery-lab/workbench/</code> → 进「云端同步」→ 粘贴<b>同一个令牌</b> → 点登录，数据会自动拉下来。</div>' +
          '<div class="hint b" style="margin-top:8px"><b>3. 之后不用管</b>：自动模式下，任何改动（记账、写复盘、收藏文献、标记已学）4 秒后自动上传。</div>' +
          '<div class="hint g" style="margin-top:8px">🔒 <b>安全</b>：令牌只存在你自己浏览器的 localStorage，不会发给任何第三方；' +
          '上传的数据用令牌派生密钥做 AES-GCM 加密，即使 Gist 被看到也是密文。</div>' +
          '<div class="hint g" style="margin-top:8px">⚠ <b>注意</b>：换设备或清浏览器数据后需要重新粘贴令牌；' +
          '令牌等同于账号密码，不要发给别人。</div>' +
          '</div>';
      }

      function setMsg(m, e) { st.msg = m || ''; st.err = e || ''; render(); }

      function doSync(silent) {
        if (!WB.cloud.isLogged()) return;
        WB.cloud.sync().then(function (r) {
          setMsg('同步完成：本机 ' + r.keys + ' 项数据已与云端合并');
          if (!silent) U.toast('☁️ 同步完成');
          setTimeout(function () { if (document.body.contains(host)) render(); }, 1200);
        }).catch(function (err) {
          setMsg('', err.message || String(err));
          if (!silent) U.toast('同步失败：' + (err.message || '').slice(0, 40));
        });
      }

      host.addEventListener('click', function (e) {
        var a = e.target.closest('[data-act]');
        if (!a) return;
        var act = a.getAttribute('data-act');

        if (act === 'login') {
          var input = host.querySelector('[data-token]');
          var tk = input ? input.value.trim() : '';
          if (!tk) { setMsg('', '请先粘贴令牌'); return; }
          a.disabled = true; a.textContent = '⏳ 验证中…';
          WB.cloud.login(tk).then(function (u) {
            st.tab = 'sync';
            return WB.cloud.sync().then(function (r) {
              setMsg('登录成功，欢迎 ' + u.login + '！已同步 ' + r.keys + ' 项数据');
              U.toast('☁️ 登录成功，已同步');
            });
          }).catch(function (err) {
            setMsg('', err.message || String(err));
          });
          return;
        }

        if (act === 'logout') {
          if (!window.confirm('退出后本机数据保留，但不再自动同步。确定退出？')) return;
          WB.cloud.logout();
          setMsg('已退出登录');
          U.toast('已退出云端同步');
          return;
        }

        if (act === 'sync') { doSync(false); return; }

        if (act === 'mode') {
          var m = WB.cloud.getMode() === 'auto' ? 'manual' : 'auto';
          WB.cloud.setMode(m);
          setMsg(m === 'auto' ? '已切换为自动同步' : '已切换为手动同步');
          return;
        }

        if (act === 'pull') {
          if (!window.confirm('将用云端数据覆盖本机同名数据（本机独有的记录会保留）。确定继续？')) return;
          a.disabled = true;
          WB.cloud.sync().then(function () {
            setMsg('已从云端拉取并合并完成');
            U.toast('已从云端拉取');
            setTimeout(function () { if (document.body.contains(host)) render(); }, 800);
          }).catch(function (err) { setMsg('', err.message); });
          return;
        }
      });

      host.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && e.target.matches('[data-token]')) {
          var b = host.querySelector('[data-act="login"]');
          if (b) b.click();
        }
      });

      render();

      /* 同步状态变化时刷新界面 */
      WB.cloud.onUpdate(function (p) {
        if (!document.body.contains(host)) return;
        if (p.state === 'running') {
          var btn = host.querySelector('[data-act="sync"]');
          if (btn) { btn.disabled = true; btn.textContent = '⏳ 同步中…'; }
        } else if (p.state === 'ok') {
          st.msg = p.msg || '同步完成'; st.err = '';
          render();
        } else if (p.state === 'err') {
          st.err = p.msg || ''; st.msg = '';
          render();
        }
      });
    }
  });
})();

</script>
</body>
</html>
