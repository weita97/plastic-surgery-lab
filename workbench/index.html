{"pmid":"38280861","topic":"外泌体","title":"In-situ-sprayed therapeutic hydrogel for oxygen-actuated Janus regulation of postsurgical tumor recurrence/metastasis and wound healing.","titleZh":"原位喷涂治疗性水凝胶以氧气驱动 Janus 调控术后肿瘤复发/转移与创面愈合","journal":"Nature communications","year":"2024","date":"2024-Jan-27","edat":"2024-01-27","authors":"Chen S, Luo Y, He Y, Li M, Liu Y","doi":"10.1002/adma.202209799","abstract":"Surgery is the mainstay of treatment modality for malignant melanoma. However, the deteriorative hypoxic microenvironment after surgery is recognized as a stemming cause for tumor recurrence/metastasis and delayed wound healing. Here we design and construct a sprayable therapeutic hydrogel (HIL@Z/P/H) encapsulating tumor-targeted nanodrug and photosynthetic cyanobacteria (PCC 7942) to prevent tumor recurrence/metastasis while promote wound healing. In a postsurgical B16F10 melanoma model in female mice, the nanodrug can disrupt cellular redox homeostasis via the photodynamic therapy-induced cascade reactions within tumor cells. Besides, the photosynthetically generated O2 by PCC 7942 can not only potentiate the oxidative stress-triggered cell death to prevent local recurrence of residual tumor cells, but also block the signaling pathway of hypoxia-inducible factor 1α to inhibit their distant metastasis. Furthermore, the long-lasting O2 supply and PCC 7942-secreted extracellular vesicles can jointly promote angiogenesis and accelerate the wound healing process. Taken together, the developed HIL@Z/P/H capable of preventing tumor recurrence/metastasis while promoting wound healing shows great application potential for postsurgical cancer therapy.","abstractZh":"手术是恶性黑色素瘤的主要治疗方式。然而，术后恶化的缺氧微环境被认为是肿瘤复发/转移和创面愈合延迟的根本原因。在此，我们设计并构建了一种可喷涂的治疗性水凝胶（HIL@Z/P/H），其包封肿瘤靶向纳米药物和光合蓝细菌（PCC 7942），以在促进创面愈合的同时预防肿瘤复发/转移。在雌性小鼠术后 B16F10 黑色素瘤模型中，该纳米药物可通过光动力治疗在肿瘤细胞内诱导的级联反应破坏细胞氧化还原稳态。此外，PCC 7942 光合产生的 O2 不仅能增强氧化应激触发的细胞死亡以预防残留肿瘤细胞的局部复发，还能阻断缺氧诱导因子 1α 的信号通路以抑制其远处转移。此外，持久的 O2 供应和 PCC 7942 分泌的细胞外囊泡可共同促进血管新生并加速创面愈合过程。综上，所开发的 HIL@Z/P/H 能够在促进创面愈合的同时预防肿瘤复发/转移，在术后肿瘤治疗中显示出巨大的应用潜力。","tier":"1区","if":14.7},
{"pmid":"39333560","topic":"糖尿病难愈创面","title":"Computer-aided drug design to generate a unique antibiotic family.","titleZh":"计算机辅助药物设计生成独特抗生素家族","journal":"Nature communications","year":"2024","date":"2024-Sep-27","edat":"2024-09-27","authors":"Barden CJ, Wu F, Fernandez-Murray JP, Lu E, Sun S","doi":"10.1097/01.prs.0000475763.94203.52","abstract":"The World Health Organization has identified antibiotic resistance as one of the three greatest threats to human health. The need for antibiotics is a pressing matter that requires immediate attention. Here, computer-aided drug design is used to develop a structurally unique antibiotic family targeting holo-acyl carrier protein synthase (AcpS). AcpS is a highly conserved enzyme essential for bacterial survival that catalyzes the first step in lipid synthesis. To the best of our knowledge, there are no current antibiotics targeting AcpS making this drug development program of high interest. We synthesize a library of > 700 novel compounds targeting AcpS, from which 33 inhibit bacterial growth in vitro at ≤ 2 μg/mL. We demonstrate that compounds from this class have stand-alone activity against a broad spectrum of Gram-positive organisms and synergize with colistin to enable coverage of Gram-negative species. We demonstrate efficacy against clinically relevant multi-drug resistant strains in vitro and in animal models of infection in vivo including a difficult-to-treat ischemic infection exemplified by diabetic foot ulcer infections in humans. This antibiotic family could form the basis for several multi-drug-resistant antimicrobial programs.","abstractZh":"世界卫生组织已将抗生素耐药列为人类健康的三大威胁之一。对新型抗生素的需求是一个亟待解决的紧迫问题。在此，利用计算机辅助药物设计开发了靶向全酰基载体蛋白合成酶（AcpS）的结构独特抗生素家族。AcpS是一种高度保守的酶，对细菌生存至关重要，催化脂质合成的第一步。据我们所知，目前尚无靶向AcpS的抗生素，这使该药物开发项目备受关注。我们合成了>700种靶向AcpS的新型化合物库，其中33种在体外以≤2 μg/mL的浓度抑制细菌生长。我们证明该类化合物对广谱革兰阳性菌具有独立活性，并与黏菌素协同以覆盖革兰阴性菌。我们在体外及动物体内感染模型中证明了对临床相关多重耐药菌株的疗效，包括以人类糖尿病足溃疡感染为例的难治性缺血性感染。该抗生素家族可为多个抗多重耐药菌项目奠定基础。","tier":"1区","if":14.7},
{"pmid":"38296937","topic":"糖尿病难愈创面","title":"Hydrogel dressings with intrinsic antibiofilm and antioxidative dual functionalities accelerate infected diabetic wound healing.","titleZh":"具有内在抗生物膜和抗氧化双重功能的水凝胶敷料加速感染性糖尿病创面愈合","journal":"Nature communications","year":"2024","date":"2024-Feb-01","edat":"2024-01-31","authors":"Pranantyo D, Yeo CK, Wu Y, Fan C, Xu X","doi":"10.1002/9780470942390.mo130135","abstract":"Chronic wounds are often infected with biofilm bacteria and characterized by high oxidative stress. Current dressings that promote chronic wound healing either require additional processes such as photothermal irradiation or leave behind gross amounts of undesirable residues. We report a dual-functionality hydrogel dressing with intrinsic antibiofilm and antioxidative properties that are synergistic and low-leaching. The hydrogel is a crosslinked network with tethered antibacterial cationic polyimidazolium and antioxidative N-acetylcysteine. In a murine diabetic wound model, the hydrogel accelerates the closure of wounds infected with methicillin-resistant Staphylococcus aureus or carbapenem-resistant Pseudomonas aeruginosa biofilm. Furthermore, a three-dimensional ex vivo human skin equivalent model shows that N-acetylcysteine promotes the keratinocyte differentiation and accelerates the re-epithelialization process. Our hydrogel dressing can be made into different formats for the healing of both flat and deep infected chronic wounds without contamination of the wound or needing other modalities such as photothermal irradiation.","abstractZh":"慢性创面常被生物膜细菌感染，并以高氧化应激为特征。目前促进慢性创面愈合的敷料要么需要光热照射等额外处理，要么残留大量不良残余物。我们报道一种具有内在抗生物膜和抗氧化特性的双功能水凝胶敷料，其特性协同且低浸出。该水凝胶是交联网络，接枝有抗菌阳离子聚咪唑鎓和抗氧化N-乙酰半胱氨酸。在小鼠糖尿病创面模型中，该水凝胶加速了耐甲氧西林金黄色葡萄球菌或耐碳青霉烯铜绿假单胞菌生物膜感染创面的闭合。此外，三维离体人皮肤等效模型显示N-乙酰半胱氨酸促进角质形成细胞分化并加速再上皮化过程。我们的水凝胶敷料可制成不同形态，用于平坦和深部感染性慢性创面的愈合，且不会污染创面或需要光热照射等其他手段。","tier":"1区","if":14.7},
{"pmid":"42153537","topic":"整形医学","title":"MOTS-c, a mitochondrial-derived peptide, ameliorates lysosomal membrane permeability and improves survival of soft tissue transplantation.","titleZh":"线粒体衍生肽MOTS-c改善溶酶体膜通透性并提高软组织移植存活率","journal":"Autophagy","year":"2026","date":"2026-Oct","edat":"2026-05-19","authors":"Shi J, Wu Y, Liu X, Xia W, Wu J","doi":"10.1038/s41586-024-07487-w","abstract":"Distal ischemic necrosis remains a major challenge in reconstructive surgery. Mitochondria and lysosomes interact via signaling and membrane contacts to maintain cellular homeostasis. Mitochondrial-derived peptide MOTS-c, encoded by the MT-RNR1/12S rRNA open reading frame, enhances mitochondrial function by reducing reactive oxygen species (ROS) and stabilizing the membrane potential, potentially preserving lysosomal integrity and reducing lysosomal membrane permeabilization (LMP). This study investigated the protective effects and underlying mechanisms of MOTS-c in ischemic flaps. RNA sequencing explored MOTS-c mechanisms in ischemic flaps. Tissue clearing, laser speckle contrast imaging and Doppler analyses revealed improved blood flow perfusion following MOTS-c treatment. Histological staining (HE, Masson, F-CHP) demonstrated enhanced angiogenesis and collagen remodeling. Western blotting, ELISA, and immunofluorescence were used to assess pyroptosis, macroautophagy/autophagy, LMP, and MAPK1/ERK2-MAPK3/ERK1-NFKB/NF-κB pathway-related proteins. MOTS-c reduced endothelial pyroptosis, enhanced autophagy, and attenuated LMP in ischemic flaps. Mechanistically, in vivo overexpression of PLA2G4A/cPLA2 (phospholipase A2, group IVA (calcium, calcium dependent)) via AAV confirmed that MOTS-c enhances autophagy and reduces pyroptosis and LMP by suppressing PLA2G4A phosphorylation. Furthermore, MOTS-c inhibited PLA2G4A via the MAPK1-MAPK3-NFKB signaling cascade, thereby reducing LMP and enhancing flap survival. These findings suggest that MOTS-c restores cellular homeostasis by targeting the PLA2G4A-LMP axis, representing a promising therapeutic strategy for improving outcomes in ischemic flap surgery.Abbreviations: AA = arachidonic acid, AAV = adeno-associated virus, ACTA2/α-SMA = actin alpha 2, smooth muscle, aorta, ALs = autolysosomes, BECN1 = beclin 1, CASP1 = caspase 1, CQ = chloroquine, CTSB = cathepsin B, CTSD = cathepsin D, CTSL = cathepsin L, Co-IP = co-immunoprecipitation, DEGs = differentially expressed genes, ELISA = enzyme-linked immunosorbent assay, F-CHP = 5-FAM-conjugated collagen hybridizing peptide staining, GSDMD = gasdermin D, GO = gene Ontology, GPT/ALT = glutamic pyruvic transaminase, soluble, GOT1/AST = glutamic-oxaloacetic transaminase 1, soluble, HE = hematoxylin-eosin, HUVECs = human umbilical vein endothelial cells, IP/MS = immunoprecipitation coupled with mass spectrometry, IL1B/IL-1β = interleukin 1 beta, IL18 = interleukin 18, IP = intraperitoneal injection, IV = intravenous injection, LDBF = laser Doppler blood flow, LMP = lysosomal membrane permeability, MAP1LC3/LC3 = microtubule-associated protein 1 light chain 3, MAPK = mitogen-activated protein kinase, NAGLU = alpha-N-acetylglucosaminidase (Sanfilippo disease IIIB), NFKB/NF-κB = nuclear factor kappa B, NLRP1 = NLR family pyrin domain containing 1, NLRP3 = NLR family pyrin domain containing 3, PECAM1/CD31 = platelet/endothelial cell adhesion molecule 1, PLA2G4A/cPLA2 = phospholipase A2, group IVA (cytosolic, calcium-dependent), PYCARD/ASC = PYD and CARD domain containing, PIK3C3/VPS34 = phosphatidylinositol 3-kinase catalytic subunit type 3, PMA = phorbol 12-myristate 13-acetate, ROS = reactive oxygen speciesSQSTM1/p62 = sequestosome 1, SPR = surface plasmon resonance, scRNA-seq = single-cell RNA sequencing, UMAP = uniform manifold approximation and projection, WB = western blotting.","abstractZh":"远端缺血坏死仍是重建外科的重大挑战。线粒体与溶酶体通过信号传导和膜接触相互作用以维持细胞稳态。由 MT-RNR1/12S rRNA 开放阅读框编码的线粒体衍生肽 MOTS-c 通过减少活性氧（ROS）和稳定膜电位来增强线粒体功能，可能保护溶酶体完整性并减少溶酶体膜通透化（LMP）。本研究探讨了 MOTS-c 在缺血皮瓣中的保护作用及其潜在机制。RNA 测序探索了 MOTS-c 在缺血皮瓣中的作用机制。组织透明化、激光散斑对比成像和多普勒分析显示，MOTS-c 处理后血流灌注改善。组织学染色（HE、Masson、F-CHP）显示血管生成和胶原重塑增强。采用 Western blotting、ELISA 和免疫荧光评估焦亡、巨自噬/自噬、LMP 以及 MAPK1/ERK2-MAPK3/ERK1-NFKB/NF-κB 通路相关蛋白。MOTS-c 减少了缺血皮瓣中的内皮细胞焦亡，增强了自噬，并减轻了 LMP。在机制上，通过 AAV 在体内过表达 PLA2G4A/cPLA2（磷脂酶 A2 IVA 组（钙依赖性））证实，MOTS-c 通过抑制 PLA2G4A 磷酸化来增强自噬并减少焦亡和 LMP。此外，MOTS-c 通过 MAPK1-MAPK3-NFKB 信号级联抑制 PLA2G4A，从而减少 LMP 并提高皮瓣存活率。这些发现提示，MOTS-c 通过靶向 PLA2G4A-LMP 轴恢复细胞稳态，是改善缺血皮瓣手术结局的有前景的治疗策略。缩写：AA = 花生四烯酸（arachidonic acid），AAV = 腺相关病毒（adeno-associated virus），ACTA2/α-SMA = 平滑肌肌动蛋白 α2（actin alpha 2, smooth muscle, aorta），ALs = 自噬溶酶体（autolysosomes），BECN1 = beclin 1，CASP1 = caspase 1，CQ = 氯喹（chloroquine），CTSB = 组织蛋白酶 B（cathepsin B），CTSD = 组织蛋白酶 D（cathepsin D），CTSL = 组织蛋白酶 L（cathepsin L），Co-IP = 免疫共沉淀（co-immunoprecipitation），DEGs = 差异表达基因（differentially expressed genes），ELISA = 酶联免疫吸附试验（enzyme-linked immunosorbent assay），F-CHP = 5-FAM 偶联胶原杂交肽染色（5-FAM-conjugated collagen hybridizing peptide staining），GSDMD = gasdermin D，GO = 基因本体（gene Ontology），GPT/ALT = 谷丙转氨酶（glutamic pyruvic transaminase, soluble），GOT1/AST = 谷草转氨酶 1（glutamic-oxaloacetic transaminase 1, soluble），HE = 苏木精-伊红（hematoxylin-eosin），HUVECs = 人脐静脉内皮细胞（human umbilical vein endothelial cells），IP/MS = 免疫沉淀结合质谱（immunoprecipitation coupled with mass spectrometry），IL1B/IL-1β = 白细胞介素 1β（interleukin 1 beta），IL18 = 白细胞介素 18（interleukin 18），IP = 腹腔注射（intraperitoneal injection），IV = 静脉注射（intravenous injection），LDBF = 激光多普勒血流（laser Doppler blood flow），LMP = 溶酶体膜通透性（lysosomal membrane permeability），MAP1LC3/LC3 = 微管相关蛋白 1 轻链 3（microtubule-associated protein 1 light chain 3），MAPK = 丝裂原活化蛋白激酶（mitogen-activated protein kinase），NAGLU = α-N-乙酰葡糖胺糖苷酶（alpha-N-acetylglucosaminidase, Sanfilippo disease IIIB），NFKB/NF-κB = 核因子 κB（nuclear factor kappa B），NLRP1 = NLR 家族含 pyrin 结构域蛋白 1（NLR family pyrin domain containing 1），NLRP3 = NLR 家族含 pyrin 结构域蛋白 3（NLR family pyrin domain containing 3），PECAM1/CD31 = 血小板/内皮细胞黏附分子 1（platelet/endothelial cell adhesion molecule 1），PLA2G4A/cPLA2 = 磷脂酶 A2 IVA 组（胞质型，钙依赖性）（phospholipase A2, group IVA (cytosolic, calcium-dependent)），PYCARD/ASC = 含 PYD 和 CARD 结构域蛋白（PYD and CARD domain containing），PIK3C3/VPS34 = 磷脂酰肌醇 3-激酶催化亚基 3 型（phosphatidylinositol 3-kinase catalytic subunit type 3），PMA = 佛波醇 12-肉豆蔻酸酯 13-乙酸酯（phorbol 12-myristate 13-acetate），ROS = 活性氧（reactive oxygen species），SQSTM1/p62 = sequestosome 1，SPR = 表面等离子共振（surface plasmon resonance），scRNA-seq = 单细胞 RNA 测序（single-cell RNA sequencing），UMAP = 统一流形近似与投影（uniform manifold approximation and projection），WB = 蛋白印迹（western blotting）。","tier":"1区","if":14.6},
{"pmid":"40624741","topic":"线粒体自噬","title":"Activation of endogenous PRKN by structural derepression is linked to increased turnover of the E3 ubiquitin ligase.","titleZh":"通过结构去抑制激活内源性PRKN与E3泛素连接酶周转增加相关","journal":"Autophagy","year":"2025","date":"2025-Dec","edat":"2025-07-08","authors":"Fiesel FC, Bustillos BA, Watzlawik JO, Chen CXQ, Berryer MH","doi":"10.1073/pnas.0702717104","abstract":"Loss-of-function mutations in the PINK1 and PRKN genes are the most common cause of early-onset Parkinson disease (PD). The encoded enzymatic pair selectively identifies, labels, and targets damaged mitochondria for degradation via the macroautophagy/autophagy-lysosome system (mitophagy). This pathway is cytoprotective and efforts to activate mitophagy are pursued as therapeutic avenues to combat PD and other neurodegenerative disorders. When mitochondria are damaged, the ubiquitin kinase PINK1 accumulates and recruits PRKN from the cytosol to activate the E3 ubiquitin ligase from its auto-inhibited conformation. We have previously designed several mutations that effectively derepress the structure of PRKN and activate its enzymatic functions in vitro. However, it remained unclear how these PRKN-activating mutations would perform endogenously in cultured neurons or in vivo in the brain. Here, we gene-edited neural progenitor cells and induced pluripotent stem cells to express PRKN-activating mutations in dopaminergic cultures. All tested PRKN-activating mutations indeed enhanced the enzymatic activity of PRKN in the absence of exogenous stress, but their hyperactivity was linked to their own PINK1-dependent degradation. Strikingly, in vivo in a mouse model expressing an equivalent activating mutation, we find the same relationship between PRKN enzymatic activity and protein stability. We conclude that PRKN degradation is the consequence of its structural derepression and enzymatic activation, thus resulting only in a temporary gain of activity. Our findings imply that pharmacological activation of endogenous PRKN will lead to increased turnover and suggest that additional considerations might be necessary to achieve sustained E3 ubiquitin ligase activity for disease treatment.Abbreviations: BSA: bovine serum album, CCCP: carbonyl cyanide 3-chlorophenylhydrazone; ECL: electrochemiluminescence; EGF: epidermal growth factor; ELISA: enzyme-linked immunosorbent assay; FGF: fibroblast growth factor; iPSC: induced pluripotent stem cell; KI: knock-in; KO: knockout; MAP2: microtubule associated protein 2; MFN2: mitofusin 2; MSD: Meso Scale Discovery; mt-Keima: mitochondrial targeted Keima; NPC: neural progenitor cell; PD: Parkinson disease; PDH: pyruvate dehydrogenase; p-S65-PRKN: Serine 65 phosphorylated PRKN; p-S65-Ub: Serine 65 phosphorylated ubiquitin; REP: repressor element of PRKN; TH: tyrosine hydroxylase; TX: Triton X-100, Ub: ubiquitin; UBL: ubiquitin-like; WT: wild-type.","abstractZh":"PINK1和PRKN基因的功能缺失突变是早发型帕金森病（PD）最常见的病因。该对编码酶选择性地识别、标记受损线粒体，并通过巨自噬/自噬—溶酶体系统（线粒体自噬）将其靶向降解。该通路具有细胞保护作用，激活线粒体自噬的努力被视为对抗PD和其他神经退行性疾病的治疗途径。当线粒体受损时，泛素激酶PINK1蓄积并从胞质中招募PRKN，使E3泛素连接酶从其自抑制构象激活。我们此前设计了若干突变，可在体外有效解除PRKN的结构抑制并激活其酶功能。然而，这些PRKN激活突变在培养神经元中的内源性表现或在体脑内的表现仍不清楚。在此，我们对神经祖细胞和诱导多能干细胞进行基因编辑，使其在多巴胺能培养物中表达PRKN激活突变。所有受试的PRKN激活突变确实在无外源应激的情况下增强了PRKN的酶活性，但其过度活跃与自身PINK1依赖的降解相关。引人注目的是，在表达等效激活突变的小鼠模型体内，我们发现PRKN酶活性与蛋白稳定性之间具有相同的关系。我们得出结论：PRKN的降解是其结构去抑制和酶激活的结果，因此仅带来暂时性的活性增强。我们的发现提示，对内源性PRKN的药理学激活将导致其周转加快，并提示若要实现用于疾病治疗的持续E3泛素连接酶活性，可能需要额外的考量。缩写：BSA：牛血清白蛋白；CCCP：羰基氰3-氯苯腙；ECL：电化学发光；EGF：表皮生长因子；ELISA：酶联免疫吸附试验；FGF：成纤维细胞生长因子；iPSC：诱导多能干细胞；KI：敲入；KO：敲除；MAP2：微管相关蛋白2；MFN2：线粒体融合蛋白2；MSD：Meso Scale Discovery检测平台；mt-Keima：线粒体靶向Keima；NPC：神经祖细胞；PD：帕金森病；PDH：丙酮酸脱氢酶；p-S65-PRKN：丝氨酸65磷酸化PRKN；p-S65-Ub：丝氨酸65磷酸化泛素；REP：PRKN抑制元件；TH：酪氨酸羟化酶；TX：Triton X-100；Ub：泛素；UBL：泛素样；WT：野生型。","tier":"1区","if":14.6},
{"pmid":"41688727","topic":"细胞衰老","title":"The TP53 gene contains a diversity box that makes it more than a tumor suppressor.","titleZh":"TP53基因含有一个“多样性盒”，使其作用超越抑癌基因","journal":"Cell death and differentiation","year":"2026","date":"2026-Sep","edat":"2026-02-13","authors":"Levine AJ, Hainaut P","doi":"10.1126/sciadv.adp2229","abstract":"The p53 protein is a transcription factor that is most commonly known and studied as a tumor suppressor preventing cancers. At least 50% of cancers have TP53 mutations that inactivate p53 functions and many other cancers utilize physiological means to inactivate p53 tumor suppressor functions, pointing to the fundamental role of p53 as a barrier to the expansion of transformed cells. An intriguing characteristic of the TP53 gene is the presence of multiple regulatory structures that control the diversity of p53 expression within a short region of 1200 bp between exon 2 and exon 5. This \"diversity box\" encompasses a dense array of regulatory signals that control the selective activation and cell-fate specificity of p53 suppressor functions. These signals include multiple post-translational modification sites and motifs regulating the expression of N-terminally truncated p53 isoforms Δ40p53α and Δ133p53α, all of which contribute to modulate p53 functions and phenotypes. These functions may play a role in early development, DNA repair, wound healing versus cell death, as well as enhanced metabolic and mitochondrial functions, reversal of cellular senescence, cell-type- specific functions, communication with the immune system, and even accelerated aging. Remarkably, the TP53 diversity box harbors several frequent polymorphisms known to modulate p53 functions, which are in linkage disequilibrium and specify unique haplotypes that differ from one population to another. This suggests that genetic variations in the diversity box may contribute to differences in epidemiological and pathological traits of the same cancer types among individuals from different ancestries.","abstractZh":"p53蛋白是一种转录因子，最为人熟知并得到最广泛研究的是其作为阻止癌症发生的抑癌因子。至少50%的癌症存在使p53功能失活的TP53突变，而许多其他癌症则通过生理学手段使p53的抑癌功能失活，这提示p53作为阻止转化细胞扩增的屏障具有基础性作用。TP53基因一个引人注目的特征在于，在外显子2与外显子5之间仅1200 bp的短区域内存在多种调控结构，控制着p53表达的多样性。这一“多样性盒”包含密集的调控信号阵列，控制p53抑癌功能的选择性激活和细胞命运特异性。这些信号包括多个翻译后修饰位点，以及调控N端截短型p53异构体Δ40p53α和Δ133p53α表达的基序，它们均参与调节p53的功能和表型。这些功能可能在早期发育、DNA修复、创面愈合与细胞死亡的抉择，以及代谢和线粒体功能增强、细胞衰老逆转、细胞类型特异性功能、与免疫系统的交流，甚至加速衰老中发挥作用。值得注意的是，TP53多样性盒携带若干已知可调节p53功能的常见多态性，这些多态性处于连锁不平衡状态，并构成在不同人群之间存在差异的特异性单倍型。这提示多样性盒中的遗传变异可能造成不同血统个体之间相同癌种的流行病学与病理学特征差异。","tier":"1区","if":13.7},
{"pmid":"41826727","topic":"糖尿病难愈创面","title":"Cortistatin antagonizes Piezo1-STING axis and facilitates mitochondrial homeostasis of keratinocytes by attenuating AGEs accumulation in diabetic ulcers.","titleZh":"Cortistatin拮抗Piezo1-STING轴并通过减轻糖尿病溃疡中AGEs积累促进角质形成细胞线粒体稳态","journal":"Cell death and differentiation","year":"2026","date":"2026-Oct","edat":"2026-03-14","authors":"Ma G, Yuan Q, Li Y, Liu B, Bi J","doi":"10.1038/nature14156","abstract":"Diabetic complications frequently arise in mechanically stressed regions, yet the molecular links between biomechanical forces and metabolic dysfunction remain unclear. Here, we demonstrate that mechanical stress induces glucose accumulation and downstream metabolic stress in keratinocytes. Mechanistically, Piezo1 activation led to intracellular glucose overload and advanced glycation end-products (AGEs) accumulation, which induced mitochondrial DNA (mtDNA) leakage into the cytosol and subsequently activated the cyclic GMP-AMP synthase (cGAS)-stimulator of interferon genes (STING) signaling cascade (cGAS-STING pathway). Keratinocyte-specific Piezo1 deletion markedly reduced AGEs accumulation and preserved mitochondrial integrity, and STING ablation exhibited similar downstream protective effects. Notably, we identify Cortistatin (CST), an endogenous neuropeptide, as a previously unrecognized inhibitory ligand of Piezo1. CST binding attenuates calcium influx and glucose accumulation under mechanical stress, conferring notable protection in vitro and in diabetic ulcers (DUs) models. These findings uncover a CST-Piezo1-STING regulatory axis that integrates mechanical and metabolic cues to drive keratinocyte dysfunction in diabetes.","abstractZh":"糖尿病并发症常发生于机械应力区域，但生物力学力与代谢功能障碍之间的分子联系仍不清楚。在此，我们证明机械应力诱导角质形成细胞中葡萄糖积累及下游代谢应激。在机制上，Piezo1激活导致细胞内葡萄糖超载和晚期糖基化终末产物（AGEs）积累，进而诱导线粒体DNA（mtDNA）泄漏至细胞质，随后激活环鸟苷酸-腺苷酸合成酶（cGAS）-干扰素基因刺激因子（STING）信号级联（cGAS-STING通路）。角质形成细胞特异性敲除Piezo1可显著减少AGEs积累并维持线粒体完整性，STING缺失也表现出相似的下游保护作用。值得注意的是，我们鉴定Cortistatin（CST）——一种内源性神经肽——是Piezo1的先前未被认识的抑制性配体。CST结合可减弱机械应力下的钙内流和葡萄糖积累，在体外和糖尿病溃疡（DU）模型中提供显著保护。这些发现揭示了一条CST-Piezo1-STING调控轴，其整合机械与代谢线索以驱动糖尿病中的角质形成细胞功能障碍。","tier":"1区","if":13.7},
{"pmid":"42811049","topic":"创面修复","title":"Efferocytosis triggered proteomic reprogramming of macrophages reveals CD97 as a novel apoptotic receptor.","titleZh":"胞葬作用触发的巨噬细胞蛋白质组重编程揭示CD97是一种新型凋亡细胞受体","journal":"Cell death and differentiation","year":"2026","date":"2026-Sep-29","edat":"2026-09-29","authors":"Raymond BBA, Novenstern J, Dannoura A, Meng M, Frey AM","doi":"10.1007/978-1-4939-6371-3_1","abstract":"During the daily process of healthy cellular turnover in the human body, billions of cells undergo apoptosis. These cells are removed by phagocytic cells, namely macrophages through a process known as efferocytosis, which triggers a cascade of reprogramming events in the cell, with a shift towards a pro-resolving or 'wound healing' phenotype. To date, no study has attempted to investigate these phenotypic changes from a proteomic perspective. Here, we present a novel and robust workflow for the investigation of proteome and secretome changes in bone marrow-derived macrophages (BMDMs) and alveolar macrophages following efferocytosis using stable isotope labelling by amino acids in cell culture (SILAC) combined with data-independent acquisition (DIA) mass spectrometry. Using this workflow, we dissected the mixed proteomes of BMDMs and apoptotic cells to map the reprogramming events occurring in macrophages in the later stages of efferocytosis. Specifically, we identified the adhesion G protein-coupled receptor Adgre5/CD97 as a novel efferocytosis-associated protein and showed that this evolutionary conserved protein plays a role in the uptake of apoptotic cells (ACs) by macrophages from mouse, human and fly. Additionally, we show that CD97 may act as a co-receptor for ACs with other efferocytic receptors such as MerTK. Our results provide an unprecedented view of the efferocytic landscape of macrophages and will aid in further understanding this important immunological process in the larger context of immune homeostasis and inflammatory disorders.","abstractZh":"在人体日常的健康细胞更新过程中，数十亿细胞发生凋亡。这些细胞由吞噬细胞即巨噬细胞通过称为胞葬作用（efferocytosis）的过程清除，该过程触发细胞内一系列重编程事件，使其向促消退或「伤口愈合」表型转变。迄今为止，尚无研究尝试从蛋白质组学角度研究这些表型变化。在此，我们提出了一种新颖且稳健的工作流程，采用细胞培养中氨基酸稳定同位素标记（SILAC）结合数据非依赖性采集（DIA）质谱，研究胞葬作用后骨髓来源巨噬细胞（BMDMs）和肺泡巨噬细胞的蛋白质组与分泌组变化。利用该工作流程，我们解析了BMDMs与凋亡细胞的混合蛋白质组，以绘制胞葬作用后期巨噬细胞中发生的重编程事件图谱。具体而言，我们鉴定出黏附类G蛋白偶联受体Adgre5/CD97是一种新型胞葬作用相关蛋白，并证明这一进化上保守的蛋白在来自小鼠、人和果蝇的巨噬细胞摄取凋亡细胞（ACs）中发挥作用。此外，我们表明CD97可能与MerTK等其他胞葬受体一起作为ACs的共受体。我们的结果提供了对巨噬细胞胞葬作用图景的前所未有的视角，并将有助于在免疫稳态和炎症性疾病的更大背景下进一步理解这一重要的免疫学过程。","tier":"1区","if":13.7},
{"pmid":"42679540","topic":"创面修复","title":"A temporally coordinated MXene@PDA hydrogel sequentially orchestrates hemostasis, inflammation resolution, and angiogenesis for wound repair.","titleZh":"时序协同的MXene@PDA水凝胶序贯调控止血、炎症消退与血管生成促进创面修复","journal":"Biomaterials","year":"2027","date":"2027-Feb","edat":"2026-09-01","authors":"Liu C, Tan L, Zhai Y, Zheng Y, Wang Y","doi":"10.1016/j.biomaterials.2026.124589","abstract":"Uncontrolled hemorrhage and oxidative stress-driven inflammation following acute trauma remain major clinical challenges. Here, we report an ultrafast self-gelling biomimetic hydrogel (PSMP) that integrates an MXene@polydopamine (MXene@PDA) heterojunction nanozyme into a dynamic polyvinyl alcohol/silk fibroin matrix. PSMP provides rapid wet-tissue adhesion and mechanical sealing, thereby enabling efficient hemostasis in complex bleeding environments. The dynamic polymer network, together with catechol-mediated interfacial interactions and the hemostasis-promoting effect of MXene@PDA, allows PSMP to rapidly fill bleeding cavities, firmly adhere to wet tissues, and accelerate clot formation. During the transition to tissue repair, reactive oxygen species (ROS)-responsive matrix degradation triggers the release of MXene@PDA nanozymes. These nanozymes scavenge mitochondrial ROS, preserve mitochondrial homeostasis, and are associated with reduced activation of cGAS-STING-NF-κB-related inflammatory signaling. In parallel, PSMP promotes pro-angiogenic responses consistent with activation-associated changes in the Angiopoietin-Tie2 signaling pathway. Evaluations in rodent, rabbit, and porcine models of lethal hemorrhage and full-thickness wounds support an association between PSMP treatment and the temporal coordination of early hemostasis, subsequent inflammation attenuation, and angiogenic responses. This temporally coordinated system offers a promising strategy for advanced wound management.","abstractZh":"急性创伤后难以控制的出血和氧化应激驱动的炎症仍是重大临床挑战。在此，我们报道一种超快自凝胶仿生水凝胶（PSMP），它将MXene@聚多巴胺（MXene@PDA）异质结纳米酶整合入动态聚乙烯醇/丝素蛋白基质中。PSMP可提供快速的湿组织黏附和机械封闭，从而在复杂出血环境中实现高效止血。动态聚合物网络，连同儿茶酚介导的界面相互作用和MXene@PDA的促止血效应，使PSMP能够快速填充出血腔隙、牢固黏附于湿组织并加速血凝块形成。在向组织修复过渡的过程中，活性氧（ROS）响应性基质降解触发MXene@PDA纳米酶的释放。这些纳米酶可清除线粒体ROS、维持线粒体稳态，并与cGAS-STING-NF-κB相关炎症信号活化减弱相关。与此同时，PSMP促进促血管生成反应，与血管生成素-Tie2信号通路中活化相关的变化相一致。在啮齿类、兔和猪的致死性出血与全层创面模型中的评价支持PSMP治疗与早期止血、随后炎症减轻及血管生成反应之间的时序协同相关。这一时序协同系统为高级创面管理提供了一种有前景的策略。","tier":"1区","if":12.8},
{"pmid":"42600512","topic":"创面修复","title":"ROS-responsive hydrogel nanoarmor enables stepwise photodynamic viral inactivation and sustained anti-inflammation for monkeypox therapy.","titleZh":"ROS响应水凝胶纳米装甲实现分步光动力病毒灭活与持续抗炎用于猴痘治疗","journal":"Biomaterials","year":"2027","date":"2027-Feb","edat":"2026-08-14","authors":"Shi N, Cao X, Zhu X, Li X, Qiu X","doi":"10.1016/j.biomaterials.2026.124540","abstract":"Currently, monkeypox virus (MPXV) treatment methods face a dilemma of potential drug resistance. They cannot simultaneously address two core pathological mechanisms driving infection: continuous viral replication and uncontrolled inflammatory storm. To overcome these challenges, we innovatively developed a dual-function therapeutic strategy with precise virus clearance and anti-inflammatory effects, constructing a dual hydrogel system synergistically combining phototherapy and immunomodulatory effects. Specifically, aggregation-induced emission (AIE) nanoparticles (NPs) are embedded in a reactive oxygen species (ROS)-degradable polyvinyl alcohol (PVA)-N1-(4-borobenzoyl)-N3-(4-borobenzoyl)-the N1, the N1, N3, N3-tetramethylpropane-1,3-diamine (tsPBA) hydrogel, while the anti-inflammatory agent is loaded in a zwitterionic hydrogel (SBMA) matrix. Under near-infrared band laser irradiation, AIE NPs efficiently generate large amounts of ROS, which, together with inflammation-produced endogenous ROS, trigger the rapid degradation of the ROS-responsive hydrogel and release of AIE NPs. The generated ROS effectively destroys the MPXV shell and strongly inactivates the virus. After virus clearance, the SBMA hydrogel continuously releases anti-inflammatory drugs (Dexamethasone, DXMS) to inhibit excessive pro-inflammatory cytokines and reduce inflammation-induced tissue damage. In mouse, rabbit, and non-human primate models with MPXV-induced skin damage, this hydrogel nanoparticle protective layer significantly inhibits viral replication and accelerates wound healing, representing a transformative, convertible platform for treating MPXV and other highly inflammatory viral infections.","abstractZh":"目前，猴痘病毒（monkeypox virus，MPXV）的治疗方法面临潜在耐药性的困境。这些方法无法同时应对驱动感染的两个核心病理机制：病毒的持续复制和失控的炎症风暴。为克服这些挑战，我们创新性地开发了一种兼具精准病毒清除与抗炎作用的双功能治疗策略，构建了协同结合光疗与免疫调节作用的双水凝胶系统。具体而言，将聚集诱导发光（aggregation-induced emission，AIE）纳米颗粒（NPs）嵌入可被活性氧（ROS）降解的聚乙烯醇（PVA）-N1,N3-双(4-硼苯甲酰基)-N1,N1,N3,N3-四甲基丙烷-1,3-二胺（tsPBA）水凝胶中，而抗炎药物则负载于两性离子水凝胶（SBMA）基质中。在近红外波段激光照射下，AIE NPs高效产生大量ROS，这些ROS与炎症产生的内源性ROS共同触发ROS响应水凝胶的快速降解和AIE NPs的释放。所产生的ROS有效破坏MPXV包膜并使病毒强烈失活。病毒清除后，SBMA水凝胶持续释放抗炎药物（地塞米松，DXMS）以抑制过度表达的促炎细胞因子并减轻炎症所致的组织损伤。在MPXV所致皮肤损伤的小鼠、兔和非人灵长类模型中，该水凝胶纳米颗粒保护层显著抑制病毒复制并加速创面愈合，为治疗MPXV及其他高炎症性病毒感染提供了一个具有变革意义的可转换平台。","tier":"1区","if":12.8},
{"pmid":"42508152","topic":"创面修复","title":"Visible-light-responsive cationized photodynamic nanoparticles integrated with a silk fibroin-based nanofibrous matrix for enhanced ROS utilization in infected wound healing.","titleZh":"可见光响应阳离子化光动力纳米颗粒结合丝素蛋白纳米纤维基质增强感染创面愈合中的ROS利用","journal":"Biomaterials","year":"2027","date":"2027-Jan","edat":"2026-07-27","authors":"Lin H, Peng Q, Lin Y, Yang X, Zhang F","doi":"10.1016/j.biomaterials.2026.124485","abstract":"Drug-resistant bacteria infecting wounds and impeding their healing have become a pressing clinical challenge. Antimicrobial photodynamic therapy (aPDT) does not pose a risk of bacterial resistance, but its application is limited due to the short lifespan, restricted diffusion distance, and non-selective biological toxicity of reactive oxygen species (ROS). Herein, we developed a visible-light-responsive organic nanoplatform (iTPyPXs/SCM) that improves ROS utilization for antimicrobial therapy while limiting excessive intracellular ROS. The platform consists of cationized photodynamic organic nanoparticles (iTPyPXs) integrated with a silk fibroin-based nanofibrous membrane (SCM) via electrospray deposition. Cationization enhanced the local donor-acceptor (D-A) structure and electrostatic adhesion of iTPyPXs, improving visible-light-induced ROS generation at the bacteria-material interface. Meanwhile, SCM immobilized iTPyPXs and released silk fibroin to reduce excessive intracellular ROS, thereby supporting an M2-associated reparative immunomodulatory tendency. In a rat model, iTPyPXs/SCM-aPDT eradicated infection and accelerated wound closure, while promoting inflammation resolution, angiogenesis, and collagen deposition. Transcriptomic analysis further confirmed that the treatment promoted regenerative healing. Collectively, this work provides a safer and more effective biomaterial strategy for photodynamic therapy in infected wound healing.","abstractZh":"耐药菌感染创面并阻碍其愈合已成为紧迫的临床挑战。抗菌光动力治疗（antimicrobial photodynamic therapy，aPDT）不产生细菌耐药风险，但由于活性氧（ROS）寿命短、扩散距离受限以及非选择性生物毒性，其应用受到限制。在此，我们开发了一种可见光响应有机纳米平台（iTPyPXs/SCM），可提高ROS在抗菌治疗中的利用率，同时限制细胞内ROS过度蓄积。该平台由阳离子化光动力有机纳米颗粒（iTPyPXs）与丝素蛋白基纳米纤维膜（SCM）通过电喷雾沉积整合而成。阳离子化增强了iTPyPXs局部的供体-受体（D-A）结构和静电黏附，改善了细菌-材料界面处可见光诱导的ROS生成。同时，SCM固定iTPyPXs并释放丝素蛋白以减少细胞内过度蓄积的ROS，从而支持M2相关的修复性免疫调节倾向。在大鼠模型中，iTPyPXs/SCM-aPDT可根除感染并加速创面闭合，同时促进炎症消退、血管生成和胶原沉积。转录组分析进一步证实该治疗促进了再生性愈合。总体而言，本工作为感染创面愈合中的光动力治疗提供了一种更安全、更有效的生物材料策略。","tier":"1区","if":12.8},
{"pmid":"42503284","topic":"创面修复","title":"Asymmetric-interfacial nanofibrous membranes with diode-like exudate transport for nanozyme-catalyzed antibacterial wound healing.","titleZh":"具有二极管式渗出液传输的不对称界面纳米纤维膜用于纳米酶催化抗菌创面愈合","journal":"Biomaterials","year":"2027","date":"2027-Jan","edat":"2026-07-26","authors":"Ou X, Qi Y, Sun S, Huang M, Gao S","doi":"10.1016/j.biomaterials.2026.124483","abstract":"Antibiotic-resistant wound infections require dressings that rapidly remove protein-rich exudate, resist fouling and bacterial adhesion, and provide drug-sparing antimicrobial activity. Here we develop asymmetric-interfacial Janus nanofibrous membranes that integrate diode-like exudate transport with infection-microenvironment-responsive nanozyme catalysis for antibacterial wound healing. The membrane couples a multiscale-rough superhydrophobic outer layer with a hydrophilic inner layer, establishing a through-thickness wettability gradient and capillary-pressure asymmetry that preferentially pumps liquids from the hydrophilic side to the superhydrophobic side while suppressing reverse wetting. An asymmetric Janus nanofibrous membrane (Janus-ZnCu-BIF NFM), composed of a hydrophilic nanofiber layer selectively loaded with copper-doped zinc boron imidazolate framework (ZnCu-BIF) nanocubes and an integrated hydrophobic polylactic acid layer, exhibits catalytic antibacterial activity by promoting reactive oxygen species generation and disrupting bacterial membrane integrity. The resulting membrane nearly eliminated viable multidrug-resistant bacteria in vitro. In a murine full-thickness wound model infected with methicillin-resistant Staphylococcus aureus, the dressing significantly reduced bacterial burden and accelerated healing, reaching 99.8% wound closure by day 12. Histological analyses indicated attenuated inflammation, enhanced angiogenesis, and improved dermal regeneration, while transcriptomic profiling revealed enrichment of pathways associated with extracellular-matrix remodeling and vascular development. Overall, this work establishes a scalable, biomimetic dressing that couples rectified exudate management with robust catalytic antibacterial efficacy, providing a practical route toward next-generation wound care materials for drug-resistant infections.","abstractZh":"耐抗生素的创面感染需要能够快速清除富含蛋白的渗出液、抗污抗细菌黏附并提供节省用药的抗菌活性的敷料。在此，我们开发了不对称界面Janus纳米纤维膜，将二极管式渗出液传输与感染微环境响应性纳米酶催化相结合，用于抗菌创面愈合。该膜将多尺度粗糙的超疏水外层与亲水内层耦合，形成贯穿厚度的润湿性梯度和毛细压力不对称性，优先将液体从亲水侧泵向超疏水侧，同时抑制反向润湿。一种不对称Janus纳米纤维膜（Janus-ZnCu-BIF NFM）由选择性负载铜掺杂锌硼咪唑酯骨架（ZnCu-BIF）纳米立方体的亲水纳米纤维层与一体化疏水聚乳酸层构成，通过促进活性氧生成和破坏细菌膜完整性而表现出催化抗菌活性。所得膜在体外几乎完全清除存活的多重耐药菌。在耐甲氧西林金黄色葡萄球菌感染的小鼠全层创面模型中，该敷料显著降低细菌负荷并加速愈合，第12天创面闭合率达99.8%。组织学分析显示炎症减轻、血管生成增强和真皮再生改善，而转录组谱分析显示与细胞外基质重塑和血管发育相关的通路富集。总体而言，本工作建立了一种可规模化制备的仿生敷料，将整流式渗出液管理与强效催化抗菌效能相结合，为耐药感染的新一代创面护理材料提供了一条实用路径。","tier":"1区","if":12.8},
{"pmid":"42480224","topic":"创面修复","title":"A recombinant collagen-based nanocomposite hydrogel for programmable full-cycle intelligent management of infected wounds.","titleZh":"重组胶原基纳米复合水凝胶用于感染创面的可编程全周期智能管理","journal":"Biomaterials","year":"2027","date":"2027-Jan","edat":"2026-07-21","authors":"Li Y, Wang J, Ding Y, Yang X, Zhang S","doi":"10.1016/j.biomaterials.2026.124470","abstract":"Infected wound healing is a highly dynamic, multistage process, yet most wound dressings remain functionally static and incapable of adapting to its evolving microenvironment. Here, we develop a nanocomposite hydrogel that enables programmable, full-cycle intelligent management of infected wounds. Methacrylic anhydride-grafted recombinant collagen CF-1552 functions as a macromolecular crosslinker, overcoming the cytotoxicity and uncontrollable crosslinking associated with conventional small-molecule crosslinkers. The crosslinker copolymerizes with acrylamide monomers to form a protein-polymer hydrogel network with multiple bioactivities and tunable mechanical properties, which encapsulates electro-responsive nanoparticles self-assembled from curcumin on polydopamine-templated polypyrrole nanowires. The hydrogel employs a closed-loop therapeutic paradigm governed by a \"dual sensing-precision feedback-sequential release\" mechanism. Specifically, (i) Rapid hemostasis and wound closure are achieved in acute trauma phase. (ii) During the transition toward a chronic, infection-prone state, bacterial proliferation induces local alkalization, triggering endogenous-responsive curcumin release, with pH-mediated visual monitoring providing feedback for early therapeutic adjustment. (iii) In inflammatory phase, conductive nanowires endow the hydrogel with a temperature coefficient of resistance (TCR = -1.49%°C-1), enabling real-time inflammatory monitoring and feedback-regulated exogenous drug release. (iv) During proliferation and remodeling phase, the collagen network synergizes with the electro-responsive controlled-release system to promote cell migration and angiogenesis. This nanotechnology platform is capable of achieving integrated management of the entire process of wound healing due to infection.","abstractZh":"感染创面愈合是一个高度动态的多阶段过程，但多数创面敷料在功能上仍是静态的，无法适应其不断变化的微环境。在此，我们开发了一种纳米复合水凝胶，可对感染创面实现可编程的全周期智能管理。甲基丙烯酸酐接枝的重组胶原CF-1552作为大分子交联剂，克服了传统小分子交联剂相关的细胞毒性和交联不可控问题。该交联剂与丙烯酰胺单体共聚，形成具有多种生物活性和可调力学性能的蛋白-聚合物水凝胶网络，并包封由姜黄素在聚多巴胺模板化聚吡咯纳米线上自组装形成的电响应纳米颗粒。该水凝胶采用由「双重传感-精准反馈-序贯释放」机制主导的闭环治疗范式。具体而言：（i）在急性创伤阶段实现快速止血与创面封闭；（ii）在向慢性、易感染状态过渡的过程中，细菌增殖引起局部碱化，触发内源性响应性姜黄素释放，pH介导的可视化监测为早期治疗调整提供反馈；（iii）在炎症阶段，导电纳米线赋予水凝胶电阻温度系数（TCR = -1.49%°C-1），实现实时炎症监测和反馈调控的外源性药物释放；（iv）在增殖与重塑阶段，胶原网络与电响应控释系统协同促进细胞迁移和血管生成。该纳米技术平台能够实现感染所致创面愈合全过程的一体化管理。","tier":"1区","if":12.8},
{"pmid":"42475906","topic":"糖尿病难愈创面","title":"Self-powered photothermal-thermoelectric bioelectronic dressings combined with antioxidant immune regulation accelerate diabetic infected wounds healing.","titleZh":"自供电光热-热电生物电子敷料联合抗氧化免疫调节加速糖尿病感染创面愈合","journal":"Biomaterials","year":"2027","date":"2027-Jan","edat":"2026-07-20","authors":"Yuan X, Shi J, Zhang Y, Ding M, Zhang Y","doi":"10.1016/j.biomaterials.2026.124471","abstract":"Chronic diabetic wounds are plagued by problems such as severe infection, oxidative stress, persistent inflammation. Here, we present an innovative dual-mode thermoelectric bio-dressing that synergistically addresses the multifactorial challenges of diabetic wound healing. The integrated, self-sustained platform combines photothermal sterilization, thermoelectric-driven electrical stimulation, and antioxidant-mediated immunoregulation, consisting of a 3D-printed graphene-doped polycaprolactone (PCL) photothermal generator (PTG), a Bi2Te3-based thermoelectric generator (TEG), and an astaxanthin (AST)-loaded polyvinyl alcohol (PVA) hydrogel. Under near-infrared (NIR) irradiation, the PTG raises local temperature to eliminate bacteria and creates a thermal gradient that activates the TEG, generating ∼190 mV electrical output-this electrical field enhances bacterial membrane disruption and antimicrobial efficacy. After NIR cessation, the natural skin-environment temperature difference sustains ∼106 mV stable voltage, providing prolonged low-level electrical stimulation to promote fibroblast proliferation, endothelial migration, and angiogenesis. Meanwhile, the thermoresponsive hydrogel releases AST (a potent antioxidant) to scavenge ROS and polarize macrophages toward the pro-regenerative M2 phenotype, alleviating chronic inflammation. In vivo experiments and single-cell RNA sequencing confirm the dressing effectively eradicates Staphylococcus aureus infection, accelerates re-epithelialization, stimulates vascularization, and modulates immune responses for tissue repair. Unlike previous single-modality or externally powered devices, this work innovatively integrates thermoelectric energy harvesting, photothermal therapy, and phytochemical-based immunoregulation into a scalable, autonomous, and environment-adaptive solution.","abstractZh":"慢性糖尿病创面受严重感染、氧化应激和持续炎症等问题困扰。在此，我们提出一种创新的双模式热电生物敷料，可协同应对糖尿病创面愈合的多因素挑战。该一体化自持平台将光热杀菌、热电驱动电刺激和抗氧化介导的免疫调节相结合，由3D打印的石墨烯掺杂聚己内酯（PCL）光热发生器（PTG）、基于Bi2Te3的热电发生器（TEG）和负载虾青素（AST）的聚乙烯醇（PVA）水凝胶组成。在近红外（NIR）照射下，PTG升高局部温度以杀灭细菌，并产生热梯度激活TEG，输出约190 mV的电信号——该电场增强细菌膜破坏和抗菌效能。NIR停止后，皮肤与环境的自然温差可维持约106 mV的稳定电压，提供持久的低强度电刺激，促进成纤维细胞增殖、内皮细胞迁移和血管生成。同时，温敏水凝胶释放AST（一种强效抗氧化剂）以清除ROS并使巨噬细胞向促再生的M2表型极化，从而缓解慢性炎症。体内实验和单细胞RNA测序证实，该敷料可有效清除金黄色葡萄球菌感染、加速再上皮化、刺激血管化并调节免疫应答以促进组织修复。与以往单一模式或外部供能的装置不同，本工作创新性地将热电能量采集、光热治疗和基于植物化学物的免疫调节整合为一个可规模化、自主且环境自适应的解决方案。","tier":"1区","if":12.8},
{"pmid":"42424693","topic":"糖尿病难愈创面","title":"Metal ion-based therapeutic strategies for diabetic wound healing: Mechanisms, biomaterial platforms, and translational challenges.","titleZh":"基于金属离子的糖尿病创面治疗策略：机制、生物材料平台与转化挑战","journal":"Biomaterials","year":"2027","date":"2027-Jan","edat":"2026-07-09","authors":"Xiong Y, He C, Su D, Zheng S, Deng W","doi":"10.1016/j.biomaterials.2026.124428","abstract":"The management of chronic diabetic wounds remains a persistent clinical challenge, characterized by prolonged healing times and high recurrence rates. These wounds typically stall in the inflammatory phase due to multiple overlapping pathological factors, including multidrug-resistant infections, poor microvascular networks, sustained oxidative stress, and impaired immune responses. Traditional single-target treatments struggle to overcome these concurrent barriers; thus, there is a pressing need for multifunctional therapeutic approaches. Metal ions (evolutionarily conserved enzymatic cofactors and redox mediators) provide this mechanistic versatility by coordinating antimicrobial defense, angiogenesis, inflammation resolution, and tissue remodeling through distinct yet complementary pathways. We systematically examine the specific mechanisms of nine functional metal ions (Ag+, Cu2+, Zn2+, Au3+, Ce3+/Ce4+, Mg2+, Ca2+, Mn2+, and Co2+), and discuss recent advances in bimetallic synergistic platforms (e.g., Fe-Cu, Cu-Ce). To connect biological potential with practical application, we compare diverse delivery architectures (such as stimuli-responsive hydrogels, metal-organic frameworks, electrospun nanofibers, and microneedle patches) focusing on their release kinetics and structural advantages. Finally, we address the primary bottlenecks limiting clinical translation, notably protein corona formation, and outline future directions for designing the next generation of safe, smart, and highly effective metal-based wound dressings.","abstractZh":"慢性糖尿病创面的管理仍是长期存在的临床挑战，其特征为愈合时间延长和复发率高。由于多重相互重叠的病理因素，包括多重耐药菌感染、微血管网络不良、持续性氧化应激和免疫应答受损，这类创面通常停滞于炎症阶段。传统的单靶点治疗难以克服这些并存的障碍，因此迫切需要多功能治疗策略。金属离子（进化上保守的酶辅因子和氧化还原介质）通过各自不同却又互补的通路协调抗菌防御、血管生成、炎症消退和组织重塑，从而提供这种机制上的多样性。我们系统梳理了九种功能性金属离子（Ag+、Cu2+、Zn2+、Au3+、Ce3+/Ce4+、Mg2+、Ca2+、Mn2+和Co2+）的具体机制，并讨论了双金属协同平台（如Fe-Cu、Cu-Ce）的最新进展。为将生物学潜能与实际应用相衔接，我们比较了多种递送架构（如刺激响应水凝胶、金属有机框架、静电纺纳米纤维和微针贴片），重点关注其释放动力学和结构优势。最后，我们讨论了限制临床转化的主要瓶颈，尤其是蛋白冠形成，并展望了设计下一代安全、智能且高效金属基创面敷料的未来方向。","tier":"1区","if":12.8},
{"pmid":"42574960","topic":"外泌体","title":"An immunomodulatory hydrogel encapsulating dental follicle stem cell-derived small extracellular vesicles promotes neutrophil clearance and periodontal bone regeneration.","titleZh":"包载牙囊干细胞来源小细胞外囊泡的免疫调节水凝胶促进中性粒细胞清除与牙周骨再生","journal":"Biomaterials","year":"2027","date":"2027-Feb","edat":"2026-08-10","authors":"Li M, Wen Y, Ding Y, Tian W, Guo S","doi":"10.1016/j.biomaterials.2026.124522","abstract":"Periodontitis, characterized by progressive alveolar bone resorption and periodontal defect formation, remains a major clinical challenge driven by bacterial infection and a dysregulated inflammatory immune microenvironment. Neutrophils, as the predominant innate immune cells, accumulate at infected sites to eliminate microbes but concurrently suppress osteoblast function, thereby impairing bone formation and accelerating alveolar bone loss. Lipopolysaccharide-preconditioned dental follicle stem cell-derived small extracellular vesicles (L-DFSC-sEV) exhibit potent immunomodulatory activity, facilitating the clearance of proinflammatory neutrophils and attenuating neutrophil hyperactivation, and reshaping the periodontal immunoregulatory microenvironment. However, the therapeutic efficacy of sEV is often hindered by the hostile infectious and inflammatory environment, as well as the lack of an appropriate delivery system tailored to periodontal conditions. To overcome these limitations, we developed a multifunctional, dynamically cross-linked hydrogel comprising gelatin, oxidized chondroitin sulfate, and epigallocatechin gallate at physiological pH, which encapsulates L-DFSC-sEV (L-DFSC-sEV@GCSE). This hydrogel exhibits excellent tissue adhesion, self-healing capability, antibacterial activity, and immunoregulatory properties, thereby creating a favorable microenvironment for sustained sEV release. In a rat periodontal defect model, L-DFSC-sEV@GCSE markedly enhanced sEV retention and delivery, effectively controlled infection and inflammation, modulated the osteoimmune microenvironment, and significantly promoted periodontal tissue regeneration.","abstractZh":"牙周炎以进行性牙槽骨吸收和牙周缺损形成为特征，由细菌感染和失调的炎症免疫微环境驱动，仍是重大的临床挑战。中性粒细胞作为主要的固有免疫细胞，在感染部位聚集以清除微生物，但同时抑制成骨细胞功能，从而损害骨形成并加速牙槽骨丢失。脂多糖预处理的牙囊干细胞来源小细胞外囊泡（L-DFSC-sEV）具有强效免疫调节活性，可促进促炎性中性粒细胞的清除、减轻中性粒细胞过度活化，并重塑牙周免疫调节微环境。然而，sEV 的疗效常常受到恶劣的感染与炎症环境以及缺乏针对牙周状况的合适递送系统的限制。为克服这些局限，我们开发了一种由明胶、氧化硫酸软骨素和表没食子儿茶素没食子酸酯在生理 pH 下构成的多功能动态交联水凝胶，用于包载 L-DFSC-sEV（L-DFSC-sEV@GCSE）。该水凝胶具有优异的组织黏附性、自愈合能力、抗菌活性和免疫调节特性，从而为 sEV 的持续释放创造了有利的微环境。在大鼠牙周缺损模型中，L-DFSC-sEV@GCSE 显著提高了 sEV 的滞留与递送，有效控制了感染和炎症，调节了骨免疫微环境，并显著促进了牙周组织再生。","tier":"1区","if":12.8},
{"pmid":"42492357","topic":"外泌体","title":"Extracellular vesicles with unique proteomic signatures from self-organized cardiac spheroids under hydrodynamic stimulation.","titleZh":"流体力学刺激下自组织心脏球体来源细胞外囊泡具有独特的蛋白质组特征","journal":"Biomaterials","year":"2027","date":"2027-Jan","edat":"2026-07-23","authors":"Perez JE, Joanne P, Dec L, Loew D, Agbulut O","doi":"10.1016/j.biomaterials.2026.124463","abstract":"Cardiac extracellular vesicles (EVs) hold promise as cell-free therapeutics for heart repair. However, robust methods to produce scalable, functional and cardiac-specific EVs at high yield remain a limiting factor in their exploitation. Here, we report an engineered platform that combines 3D cardiac microtissues with hydrodynamic stimulation to address these hurdles. We exploited differential cell mechanics, quantified via surface tension measurements, to establish a unique 3D spheroid architecture showing cardiomyocytes preferentially localizing at the spheroid periphery. A controlled-flow bioreactor then enabled high-yield EV production, at a 10-fold increase compared to non-stimulated spheroids, all while maintaining cell viability comparable to standard 2D production conditions while preserving vesicle structural integrity. Proteomic profiling revealed that EVs generated under these conditions carry a cardiac-specific signature, enriched in sarcomeric, mitochondrial, ribosomal and heat shock proteins, all while retaining core EV markers. Functionally, these EVs enhanced wound closure and reduced fibroblast activation more effectively than EVs derived from standard 2D fibroblast cultures, at 1.3 and 1.5-fold, respectively. Our findings establish a scalable, physiologically relevant strategy for generating cardiac EVs and demonstrate that combining 3D microenvironment engineering with hydrodynamic cues can yield therapeutically potent vesicles suitable for regenerative medicine.","abstractZh":"心脏细胞外囊泡（EVs）作为用于心脏修复的无细胞治疗手段具有前景。然而，如何以稳健的方法高产制备可规模化、具功能且心脏特异性的 EVs，仍是限制其应用的瓶颈。在此，我们报道了一种将 3D 心脏微组织与流体力学刺激相结合以解决这些难题的工程化平台。我们利用通过表面张力测量量化的细胞力学差异，建立了独特的三维球体结构，使心肌细胞优先定位于球体周边。随后，控流生物反应器实现了高产量 EV 生产，相比未受刺激的球体提高 10 倍，同时保持与标准二维生产条件相当的细胞活力，并维持囊泡结构完整性。蛋白质组分析显示，在这些条件下产生的 EVs 带有心脏特异性特征，富含肌节、线粒体、核糖体和热休克蛋白，同时保留核心 EV 标志物。在功能上，与标准二维成纤维细胞培养来源的 EVs 相比，这些 EVs 更有效地促进创面闭合并抑制成纤维细胞活化，分别提高 1.3 倍和 1.5 倍。我们的研究建立了一种可规模化、符合生理的制备心脏 EVs 的策略，并证明将三维微环境工程与流体力学信号相结合可产生适合再生医学的治疗性囊泡。","tier":"1区","if":12.8},
{"pmid":"42407199","topic":"糖尿病难愈创面","title":"A protein-initiated polymerization cascade enables a self-eliminating powder tissue adhesive for diabetic ulcer repair.","titleZh":"蛋白引发的级联聚合实现可自消除粉末组织黏合剂用于糖尿病溃疡修复","journal":"Biomaterials","year":"2026","date":"2026-Dec","edat":"2026-07-06","authors":"Yang R, Nie X, Zhang Q, Shao J, Cui C","doi":"10.1016/j.biomaterials.2026.124423","abstract":"Inspired by natural protein-based adhesives and protein-guided biosynthesis and assembly processes, this work proposes a strategy for constructing a bioactive dynamic adhesive through a protein-initiated polymerization cascade. In this system, ovalbumin (OVA) acts as a macromolecular director, and sodium lipoate (LANa) serves as a polymerizable bioactive monomer. The surfactant property of LANa disrupts the tertiary structure of OVA, exposing hydrophobic domains and thiol groups. LANa subsequently binds to these exposed hydrophobic microdomains to form OVA-LANa complexes, while the exposed thiols further initiate the ring-opening polymerization of LANa via thiol-disulfide exchange. This cascade proceeds rapidly and spontaneously without external energy input, complex synthetic procedures, or additional catalysts. The resulting metastable precursor solution can be lyophilized and ground into a storable powder (OPLA-P). Upon contact with body fluids, OPLA-P rapidly rehydrates and reinitiates polymerization, forming an in situ solidified adhesive hydrogel for efficient sealing. Furthermore, the sustained release of bioactive LANa helps regulate the regenerative microenvironment and accelerates wound healing. After fulfilling its functions, the hydrogel gradually dissolves spontaneously, helping alleviate the adhesion-trauma-free dilemma. When evaluated in diabetic ulcer models, including full-thickness skin defects and oral ulcers, OPLA-P exhibits superior therapeutic effects to those of the selected commercial materials.","abstractZh":"受天然蛋白类黏合剂以及蛋白引导的生物合成与组装过程启发，本工作提出了一种通过蛋白引发的级联聚合构建生物活性动态黏合剂的策略。在该体系中，卵清蛋白（OVA）作为大分子导向剂，硫辛酸钠（LANa）作为可聚合的生物活性单体。LANa 的表面活性剂性质破坏 OVA 的三级结构，暴露出疏水结构域与巯基。随后 LANa 结合这些暴露的疏水微区形成 OVA-LANa 复合物，而暴露的巯基进一步通过巯基-二硫键交换引发 LANa 的开环聚合。该级联过程快速自发进行，无需外部能量输入、复杂合成步骤或额外催化剂。所得亚稳态前驱液可冻干并研磨成可储存的粉末（OPLA-P）。接触体液后，OPLA-P 迅速复水并重新引发聚合，形成原位固化的黏附性水凝胶以实现高效封闭。此外，生物活性 LANa 的持续释放有助于调控再生微环境并加速创面愈合。在完成其功能后，该水凝胶逐渐自发溶解，有助于缓解黏附与无创伤剥离之间的两难困境。在包括全层皮肤缺损与口腔溃疡在内的糖尿病溃疡模型中评估时，OPLA-P 表现出优于所选商用材料的治疗效果。","tier":"1区","if":12.8},
{"pmid":"42330584","topic":"创面修复","title":"Ready-to-use, in situ formed collagen/RGD/hyaluronic acid hydrogel: accelerating full-thickness wound healing.","titleZh":"即用型原位成型胶原/RGD/透明质酸水凝胶加速全层创面愈合","journal":"Biomaterials","year":"2026","date":"2026-Dec","edat":"2026-06-22","authors":"Zheng T, Li S, Li Y, Song J, Huang P","doi":"10.1016/j.biomaterials.2026.124389","abstract":"A robust strategy was developed to customize the hydrogel's composition, concentration, and crosslink density, thereby providing a method for the screening and optimization of skin repair hydrogels. Specifically, methyltetrazine-modified collagen (Col-T), norbornene-modified RGD peptide, and norbornene-modified hyaluronic acid with varying degrees of modification (HA-Nlow, HA-Nmed, and HA-Nhigh), were synthesized. Upon mixing Col-T, RGD-N, and one of the HA-N derivatives, a bioorthogonal reaction was immediately initiated, thereby forming an in situ crosslinked, shape-adaptable hydrogel. An extracellular matrix-mimetic hydrogel composed of collagen, RGD peptide, and hyaluronic acid was optimized using human epidermal stem cells (hEpdSCs), human dermal fibroblasts (HDFs), and human umbilical vein endothelial cells (HUVECs). The optimized hydrogel effectively promoted the hEpdSCs proliferation, the proliferation and migration of HDFs, and the migration and tubular formation of HUVECs. In comparison, GelMA exhibited significant cytotoxicity against hEpdSCs due to the use of photoinitiator LAP. The hydrogel exhibited anti-hemolytic, pro-coagulant, and tissue-adhesive properties, and significantly accelerated the healing of 15 mm × 15 mm full-thickness wound after a single application without any additives. This hydrogel was associated with enhanced hair follicle-like structure formation and reduced inflammation-related responses in the wound area. Furthermore, its ready-to-use and biodegradable nature made it highly suitable for clinical applications.","abstractZh":"本研究开发了一种稳健的策略来定制水凝胶的组成、浓度与交联密度，从而为皮肤修复水凝胶的筛选与优化提供了方法。具体而言，合成了甲基四嗪修饰的胶原（Col-T）、降冰片烯修饰的 RGD 肽，以及具有不同修饰度的降冰片烯修饰透明质酸（HA-Nlow、HA-Nmed 和 HA-Nhigh）。将 Col-T、RGD-N 与其中一种 HA-N 衍生物混合后，生物正交反应立即启动，从而形成原位交联、形状可适应的水凝胶。利用人表皮干细胞（hEpdSCs）、人真皮成纤维细胞（HDFs）和人脐静脉内皮细胞（HUVECs），对由胶原、RGD 肽和透明质酸组成的仿细胞外基质水凝胶进行了优化。优化后的水凝胶有效促进了 hEpdSCs 增殖、HDFs 的增殖与迁移，以及 HUVECs 的迁移与成管。相比之下，GelMA 因使用光引发剂 LAP 而对 hEpdSCs 表现出明显细胞毒性。该水凝胶具有抗溶血、促凝血和组织黏附性能，单次应用且不添加任何添加剂即可显著加速 15 mm × 15 mm 全层创面的愈合。该水凝胶与创面区域毛囊样结构形成增强及炎症相关反应减弱相关。此外，其即用型与可生物降解的特性使其非常适合临床应用。","tier":"1区","if":12.8},
{"pmid":"42287983","topic":"创面修复","title":"A membrane-to-nucleus targeting photosensitizer featuring aggregation-induced emission for dual-color imaging-guided antifungal therapy and biofilm disruption.","titleZh":"具有聚集诱导发光特性的膜-核靶向光敏剂用于双色成像引导的抗真菌治疗与生物膜破坏","journal":"Biomaterials","year":"2026","date":"2026-Dec","edat":"2026-06-13","authors":"Chen P, Zhao J, Yang JC, Su X, Zhang P","doi":"10.1016/j.biomaterials.2026.124367","abstract":"The management of superficial fungal infections is a major global public health burden, driving the need for precise and resistance-free therapies. While photodynamic therapy (PDT) mediated by photosensitizers (PSs) offers a promising alternative, the lack of self-reporting capability in antifungal PSs hampers the accurate control of treatment and increases collateral risk from excessive reactive oxygen species (ROS). In this work, we designed and synthesized a series of aggregation-induced emission (AIE) PSs consisting of triphenylamine and 1H-indene-1,3(2H)-dione units, and found a versatile PS (named as ITTPM) that not only generates ROS efficiently but also simultaneously discriminates between live and dead fungi via a distinct fluorescence signal switch. In live fungi, ITTPM targets the cell membranes emitting red fluorescence. Upon fungal cell death, it relocates to the nuclei, staining them green. Mechanistic investigations via molecule imaging, lipid membrane mimicking experiment, DNA-responsive experiments and molecular docking revealed that ITTPM interacts with fungal membrane phospholipids via its aryl-substituted indanedione fragment and one pyridinium group in live fungi, versus binding to DNA bases via two cationic pyridinium fragments in dead cells. Furthermore, ITTPM shows potent photodynamic antifungal efficacy against planktonic fungi, effectively inhibits biofilm formation, and eradicates mature biofilms. In vivo studies on fungi-infected mouse wounds demonstrated that ITTPM achieved complete fungal eradication, facilitated wound healing and exhibited excellent biocompatibility. This study provides a promising candidate PS for precise clinical treatment of superficial fungal infections and novel insights into developing multifunctional antifungal PSs.","abstractZh":"浅表真菌感染的管理是全球主要的公共卫生负担，推动了对精准且不产生耐药性的治疗的需求。虽然由光敏剂（PSs）介导的光动力治疗（PDT）提供了颇具前景的替代方案，但抗真菌 PSs 缺乏自报告能力，妨碍了治疗的精准控制，并增加了活性氧（ROS）过量带来的附带损伤风险。在本工作中，我们设计并合成了一系列由三苯胺和 1H-茚-1,3(2H)-二酮单元组成的聚集诱导发光（AIE）PSs，并发现了一种多功能 PS（命名为 ITTPM），它不仅能高效产生 ROS，还能通过独特的荧光信号切换同时区分活真菌与死真菌。在活真菌中，ITTPM 靶向细胞膜并发出红色荧光。真菌细胞死亡后，它转移至细胞核并将其染成绿色。通过分子成像、脂质膜模拟实验、DNA 响应实验与分子对接进行的机制研究揭示：在活真菌中，ITTPM 通过其芳基取代的茚二酮片段和一个吡啶鎓基团与真菌膜磷脂相互作用；而在死亡细胞中，则通过两个阳离子吡啶鎓片段与 DNA 碱基结合。此外，ITTPM 对浮游真菌表现出强效的光动力抗真菌作用，可有效抑制生物膜形成并清除成熟生物膜。在真菌感染小鼠创面的体内研究中，ITTPM 实现了真菌的完全清除，促进创面愈合，并表现出优异的生物相容性。本研究为浅表真菌感染的精准临床治疗提供了一种颇具前景的候选 PS，并为开发多功能抗真菌 PSs 提供了新见解。","tier":"1区","if":12.8},
{"pmid":"42214209","topic":"糖尿病难愈创面","title":"O2-releasing microneedle platform eradicates drug-resistant bacterial biofilm via metabolic interference and innate immune reactivation.","titleZh":"释氧微针平台通过代谢干扰与先天免疫再激活清除耐药细菌生物膜","journal":"Biomaterials","year":"2026","date":"2026-Dec","edat":"2026-05-29","authors":"Liu S, Zhang Z, Ge Z, Teng R, Chen R","doi":"10.1016/j.biomaterials.2026.124284","abstract":"Biofilm-associated infections pose formidable clinical challenges due to their complicated microenvironment characterized by dense extracellular polymeric substances (EPS), hypoxia, and excessive H2O2. While microneedles can mechanically penetrate biofilms, their efficacy is limited by poor diffusion of antibacterial agents through EPS and secondary infection resulting from escaping planktonic bacteria. Herein, we proposed an oxygen-powered microneedle (FeCN@MN) that synergistically eradicates biofilms through a dual mechanism: ferroptosis-like death-mediated bacterial killing and neutrophil reactivation. The microneedle utilizes sodium percarbonate (SPO) particles that react with interstitial fluid to generate O2 bubbles, which propel the loaded FeS2-decorated carbon nanospheres (FeCN) to disperse throughout biofilms. Moreover, the FeCN@MN can reactivate neutrophils to scavenge planktonic bacteria escaping from biofilm disintegration through enhanced chemotaxis and respiratory burst, further inhibiting potential recurrence of infection. In vitro experiment reveals that iron overload disrupts amino acid metabolism and peroxide accumulation, promoting bacterial ferroptosis-like death. Furthermore, neutrophil functional tests show enhanced chemotaxis and killing ability to MRSA bacteria. In MRSA biofilm-infected diabetic wound model, FeCN@MN significantly dismantles biofilms, and effectively eliminates infections. In conclusion, this two-stage therapeutic approach combining bacterial metabolic interference with immune response reactivation provides a promising strategy in eradicating drug-resistant bacterial biofilm-associated infections.","abstractZh":"生物膜相关感染因其以致密胞外聚合物（EPS）、缺氧和过量 H2O2 为特征的复杂微环境而带来严峻的临床挑战。尽管微针可机械性穿透生物膜，但其疗效受限于抗菌剂在 EPS 中扩散不良，以及逃逸的浮游细菌导致的继发感染。在此，我们提出一种氧驱动微针（FeCN@MN），通过双重机制协同清除生物膜：类铁死亡介导的细菌杀灭与中性粒细胞再激活。该微针利用过碳酸钠（SPO）颗粒与组织液反应生成 O2 气泡，推动负载的 FeS2 修饰碳纳米球（FeCN）在生物膜中弥散分布。此外，FeCN@MN 可通过增强趋化与呼吸爆发再激活中性粒细胞，清除生物膜崩解后逃逸的浮游细菌，进一步抑制感染的潜在复发。体外实验显示，铁过载破坏氨基酸代谢并导致过氧化物蓄积，促进细菌类铁死亡。此外，中性粒细胞功能实验显示其趋化能力和对 MRSA 的杀伤能力增强。在 MRSA 生物膜感染的糖尿病创面模型中，FeCN@MN 显著瓦解生物膜并有效清除感染。总之，这种将细菌代谢干扰与免疫反应再激活相结合的两阶段治疗策略，为清除耐药细菌生物膜相关感染提供了颇具前景的策略。","tier":"1区","if":12.8},
{"pmid":"42202626","topic":"创面修复","title":"Biomechanical and directional electric field coupling material promotes wound healing through Piezo1-mediated cell migration.","titleZh":"生物力学与定向电场耦合材料通过 Piezo1 介导的细胞迁移促进创面愈合","journal":"Biomaterials","year":"2026","date":"2026-Dec","edat":"2026-05-27","authors":"Fan Y, Lin M, Li J, Yu Y, Huang Y","doi":"10.1016/j.biomaterials.2026.124331","abstract":"Re-epithelialization and extracellular matrix (ECM) regeneration determine the quality of wound repair. Although the physical microenvironment regulates these processes through physio-biochemical coupling, effective approaches are lacking. This study aims to reconstruct biomechanical and electric field microenvironments in wounds and is the first to develop a biomimetic coupling material that modulates wound mechanics and directional electric fields. The coupling material markedly accelerated re-epithelialization and promoted the ordered regeneration and structural remodeling of the ECM. Both axolotl skin-inspired biomechanical materials and application of electric fields at physiological intensities downregulated the expression of the mechanosensitive ion channel Piezo1 in keratinocytes, relieving its inhibitory effect on cell migration. This represents a new mechanism by which a biomimetic material with biomechanical and directional electric field coupling synergistically promotes keratinocyte migration. This study provides a novel strategy with translational potential for wound healing while offering theoretical insights and a versatile platform for research on wound regeneration.","abstractZh":"再上皮化与细胞外基质（ECM）再生决定创面修复的质量。尽管物理微环境通过生理-生化耦合调控这些过程，但仍缺乏有效的方法。本研究旨在重建创面中的生物力学与电场微环境，并首次开发出一种可调控创面力学与定向电场的仿生耦合材料。该耦合材料显著加速再上皮化，并促进 ECM 的有序再生与结构重塑。仿美西螈皮肤的力学材料以及生理强度电场的施加，均下调角质形成细胞中机械敏感离子通道 Piezo1 的表达，从而解除其对细胞迁移的抑制作用。这揭示了一种新机制：具有生物力学与定向电场耦合作用的仿生材料可协同促进角质形成细胞迁移。本研究为创面愈合提供了一种具有转化潜力的新策略，同时为创面再生研究提供了理论依据与通用平台。","tier":"1区","if":12.8},
{"pmid":"42184556","topic":"创面修复","title":"Sprayable polysaccharide-based biomimetic double dressing with synergistic regulation for wound healing.","titleZh":"可喷涂多糖基仿生双层敷料通过协同调控促进创面愈合","journal":"Biomaterials","year":"2026","date":"2026-Dec","edat":"2026-05-25","authors":"Xue Y, Lin Y, Lu Y, Zhang H, Chen B","doi":"10.1016/j.biomaterials.2026.124328","abstract":"Current sprayable hydrogel dressings often fail to achieve the functional integration required for complex wounds, owing to inherent design flaws and a lack of synergistic action, which delays healing and promotes scarring. Inspired by the stratified structure and dynamic repair functions of human skin, we developed a sprayable, biomimetic double-layer polysaccharide dressing (BDD) that integrates the immunomodulatory compound mangiferin (MGF). This integrated system, termed MGF@BDD, rapidly self-assembles via sequential spraying, offering adhesion and wound adaptability. The distinctive strength of MGF@BDD is its spatiotemporally coordinated bioactivity, enabled by synergistic regulation between its layers in response to the dynamic wound microenvironment. The dense top layer, reinforced by Ca2+-Ba2+ dual-ion coordination, provides immediate hemostasis and enzyme-resistant mechanical protection. In contrast, the porous bottom layer acts as an intelligent reservoir for MGF, maintaining a regenerative niche. During the inflammatory phase, the acidic environment triggers the hydrolysis of dynamic bonds within the bottom-layer, accelerating MGF release for anti-inflammatory and anti-oxidative effects, while Ca2+-Ba2+ ions released from the top layer synergistically suppress inflammation at its source. As healing progresses into the proliferative phase, the network stabilizes under neutral conditions, switching to the sustained co-release of MGF and Ca2+ to effectively promote angiogenesis and tissue remodeling. Both in vitro and in vivo experiments have confirmed that MGF @BDD can effectively promote wound healing, as evidenced by significantly accelerated wound closure and reduced collagen disorder. Constructed via a simple two-syringe process, this work presents an adaptive system capable of dynamically regulating the healing cascade, offering a novel strategy for the functional regeneration of complex wounds.","abstractZh":"现有可喷涂水凝胶敷料常因设计缺陷和缺乏协同作用而无法实现复杂创面所需的功能整合，从而延缓愈合并促进瘢痕形成。受人体皮肤分层结构与动态修复功能的启发，我们开发了一种可喷涂的仿生双层多糖敷料（BDD），并整合了免疫调节化合物芒果苷（MGF）。该集成系统称为 MGF@BDD，可通过顺序喷涂快速自组装，具备黏附性和创面适应性。MGF@BDD 的独特优势在于其时空协调的生物活性，这源于两层之间响应动态创面微环境的协同调控。由 Ca2+-Ba2+ 双离子配位增强的致密顶层可提供即时止血和抗酶解的机械保护。相比之下，多孔底层作为 MGF 的智能储库，维持再生微环境。在炎症期，酸性环境触发底层内动态键的水解，加速 MGF 释放以发挥抗炎与抗氧化作用，同时顶层释放的 Ca2+-Ba2+ 离子在源头协同抑制炎症。随着愈合进入增殖期，网络在中性条件下趋于稳定，转为 MGF 与 Ca2+ 的持续共同释放，从而有效促进血管生成与组织重塑。体外与体内实验均证实，MGF@BDD 可有效促进创面愈合，表现为创面闭合显著加速和胶原紊乱减少。本工作通过简单的双注射器工艺构建，提出了一种能够动态调控愈合级联的适应性系统，为复杂创面的功能性再生提供了新策略。","tier":"1区","if":12.8},
{"pmid":"42085856","topic":"整形医学","title":"A biomimetic nanotherapeutic hydrogel orchestrates multi-mechanism therapy for ischemic skin flaps.","titleZh":"仿生纳米治疗水凝胶通过多机制协同治疗缺血性皮瓣","journal":"Biomaterials","year":"2026","date":"2026-Nov","edat":"2026-05-05","authors":"Cheng S, Dai Z, Xi S, Zhao J, Ding J","doi":"10.1016/j.biomaterials.2026.124257","abstract":"Despite considerable advances in nanotherapeutics, their clinical application is often limited by suboptimal monotherapy, rapid immune clearance and insufficient target-site accumulation. These limitations are particularly pronounced in the treatment of flap necrosis because of the complex ischemic microenvironment. To address this challenge, we fabricated a multifunctional therapeutic platform by loading melanin nanoparticles (MNPs) with the PI3Kα agonist UCL-TRO-1938, coating them with membranes derived from tert-butyl hydroperoxide (TBHP)-preconditioned human umbilical vein endothelial cells (HUVECs), and embedding them within a fibrin hydrogel. The resulting CM-1938@MNP hydrogels conferred cytoprotective effects in vitro by rescuing HUVECs from TBHP induced dysfunction and shifting macrophage polarization from the M1 to M2 phenotype. In a mouse model of ischemic skin flaps, local injection of the hydrogel markedly improved flap survival by stimulating angiogenesis, alleviating oxidative stress, and suppressing inflammation; these results were confirmed by RNA-seq analysis. This work presents a biomimetic strategy that transcends conventional single target therapies, offering a promising versatile platform for treating ischemia.","abstractZh":"尽管纳米治疗已取得显著进展，但其临床应用常受限于单一疗法效果欠佳、免疫清除迅速以及靶部位蓄积不足。由于缺血微环境复杂，这些局限在皮瓣坏死的治疗中尤为突出。为应对这一挑战，我们构建了一种多功能治疗平台：将黑色素纳米颗粒（MNPs）负载 PI3Kα 激动剂 UCL-TRO-1938，用经叔丁基过氧化氢（TBHP）预处理的人脐静脉内皮细胞（HUVECs）来源的膜进行包覆，并将其嵌入纤维蛋白水凝胶中。所得 CM-1938@MNP 水凝胶在体外发挥细胞保护作用，可挽救 TBHP 诱导功能损伤的 HUVECs，并促使巨噬细胞由 M1 表型向 M2 表型极化。在缺血性皮瓣小鼠模型中，局部注射该水凝胶通过促进血管生成、减轻氧化应激和抑制炎症而显著提高皮瓣存活率；这些结果经 RNA 测序分析证实。本研究提出了一种超越传统单靶点治疗的仿生策略，为缺血性疾病的治疗提供了有前景的多功能平台。","tier":"1区","if":12.8},
{"pmid":"42251781","topic":"糖尿病难愈创面","title":"A natural synergistic repair hydrogel with disulfide COF core breaks the vicious cycle of diabetic wounds in rabbits.","titleZh":"含二硫键COF核心的天然协同修复水凝胶打破兔糖尿病创面的恶性循环","journal":"Biomaterials","year":"2026","date":"2026-Dec","edat":"2026-06-07","authors":"Hu D, Zhuang J, Xue J, Wang K, Zhang G","doi":"10.1016/j.biomaterials.2026.124349","abstract":"Diabetic chronic wounds present a formidable clinical challenge driven by a self-perpetuating cycle of hyperglycaemia-induced oxidative stress, persistent inflammation, and recurrent infection. Conventional wound dressings often fail to address these complexities, primarily due to their lack of inherent multifunctionality and stimuli-responsive capabilities. To overcome these limitations, we develop a smart, redox-responsive hydrogel that integrates a disulfide-bridged covalent organic framework (S-COF) loaded with various natural bioactives, including curcumin, gallic acid, vanillin, and carboxymethyl chitosan. This multifunctional hydrogel facilitates sustained and on-demand therapeutic release in direct response to the wound microenvironment, while exerting synergistic antioxidant, antibacterial, and anti-inflammatory effects. In vitro assays using clinical diabetic blood samples demonstrated efficient reactive oxygen species scavenging, pathogen inhibition, and increased superoxide dismutase activity. In a diabetic rabbit wound model, this COF-based hydrogel significantly accelerated healing by reducing the inflammatory phase and promoting angiogenesis and collagen deposition, resulting in approximately 90% wound closure, a marked improvement over the 50% closure in untreated controls. Additionally, the hydrogel exhibited excellent biocompatibility, evidenced by a hemolysis rate of <1%. This natural-product-derived, redox-responsive platform simultaneously targets multiple pathological pathways, offering a robust and versatile strategy for advanced diabetic wound therapy.","abstractZh":"糖尿病慢性创面是一项艰巨的临床挑战，由高血糖诱导的氧化应激、持续炎症和反复感染所形成的自我维持循环所驱动。传统创面敷料往往难以应对这些复杂性，主要因其缺乏内在的多功能性和刺激响应能力。为克服这些局限，我们开发了一种智能氧化还原响应型水凝胶，其整合了二硫键桥连的共价有机框架（S-COF），并负载多种天然生物活性物质，包括姜黄素、没食子酸、香草醛和羧甲基壳聚糖。这种多功能水凝胶能够直接响应创面微环境，实现持续、按需的治疗性释放，同时发挥协同的抗氧化、抗菌和抗炎作用。使用临床糖尿病血液样本进行的体外实验显示，该水凝胶可高效清除活性氧、抑制病原体并提高超氧化物歧化酶活性。在糖尿病兔创面模型中，这种基于 COF 的水凝胶通过缩短炎症期、促进血管生成与胶原沉积而显著加速愈合，实现约 90% 的创面闭合，明显优于未治疗对照组 50% 的闭合率。此外，该水凝胶表现出优异的生物相容性，溶血率 <1%。这一源于天然产物的氧化还原响应型平台可同时靶向多条病理通路，为晚期糖尿病创面治疗提供了稳健而多能的策略。","tier":"1区","if":12.8},
{"pmid":"42184751","topic":"糖尿病难愈创面","title":"Multifunctional antibacterial intelligent hydrogel for infection detection and inflammation regulation to promote diabetic wound healing.","titleZh":"多功能抗菌智能水凝胶用于感染检测与炎症调控以促进糖尿病创面愈合","journal":"Biomaterials","year":"2026","date":"2026-Nov","edat":"2026-05-25","authors":"Yang B, Cheng Q, Zhao S, Tang Y, Pang E","doi":"10.1016/j.biomaterials.2026.124326","abstract":"Infection remains a major barrier to diabetic wound repair and can lead to severe complications. Therefore, timely infection detection, effective antibacterial therapy, and sustained inflammation regulation are critical for successful wound healing. Here, we developed an intelligent hydrogel dressing that enables fluorescence-based infection indication while simultaneously providing coordinated antibacterial and anti-inflammatory therapy. The injectable hydrogel was constructed via dynamic boronate ester crosslinking between polyvinyl alcohol and phenylboronic acid-modified chitosan, and functionalized with BODIPY-loaded mesoporous polydopamine nanoparticles (mPDA@BP) and the fluorogenic substrate 4-Methylumbelliferyl-β-D-glucuronide (MUG). Upon cleavage of MUG by bacteria-secreted β-glucuronidase, the released 4-methylumbelliferone emits a blue fluorescence signal, enabling rapid visualization of infection progression. Meanwhile, mPDA@BP generates reactive oxygen species under light exposure for photodynamic antibacterial therapy, while maintaining sustained anti-inflammatory immunomodulation in the dark condition. Benefiting from its dynamic network, the hydrogel exhibits excellent injectability and conformal adaptability to irregular wound geometries. In an infected diabetic mouse wound model, this hydrogel significantly reduced bacterial burden and inflammatory responses, accelerated wound closure, and enhanced epidermal regeneration, collagen deposition, and angiogenesis. Collectively, this work presents a cost-effective theranostic hydrogel platform for integrated infection monitoring and coordinated diabetic wound therapy.","abstractZh":"感染仍是糖尿病创面修复的主要障碍，并可导致严重并发症。因此，及时检测感染、有效的抗菌治疗和持续的炎症调控对创面成功愈合至关重要。在此，我们开发了一种智能水凝胶敷料，可实现基于荧光的感染指示，同时提供协同的抗菌与抗炎治疗。该可注射水凝胶通过聚乙烯醇与苯硼酸修饰壳聚糖之间的动态硼酸酯交联构建，并以负载 BODIPY 的介孔聚多巴胺纳米颗粒（mPDA@BP）和荧光底物 4-甲基伞形酮基-β-D-葡糖苷酸（MUG）进行功能化。当细菌分泌的 β-葡糖苷酸酶切割 MUG 后，释放的 4-甲基伞形酮发出蓝色荧光信号，从而可快速可视化感染进展。同时，mPDA@BP 在光照下产生活性氧用于光动力抗菌治疗，而在避光条件下维持持续的抗炎免疫调节。得益于其动态网络，该水凝胶具有优异的可注射性和对不规则创面几何形状的适形适配性。在感染的糖尿病小鼠创面模型中，该水凝胶显著降低细菌负荷与炎症反应，加速创面闭合，并增强表皮再生、胶原沉积与血管生成。总之，本工作提出了一种经济高效的治疗诊断一体化水凝胶平台，用于整合感染监测与协同糖尿病创面治疗。","tier":"1区","if":12.8},
{"pmid":"42143992","topic":"糖尿病难愈创面","title":"Honeycomb-inspired biomass bilayer membrane orchestrating antimicrobial defense and regeneration for diabetic wound healing.","titleZh":"仿蜂窝生物质双层膜协同调控抗菌防御与再生以促进糖尿病创面愈合","journal":"Biomaterials","year":"2026","date":"2026-Nov","edat":"2026-05-17","authors":"Li M, Li XL, Fu T, Xiong K, Zhou Z","doi":"10.1016/j.biomaterials.2026.124310","abstract":"Diabetic wounds are characterized by a persistent pathological imbalance between infection and regeneration, in which bacterial colonization and impaired tissue repair synergistically hinder the healing process. However, most existing wound dressings focus on a single therapeutic function, limiting their capacity to orchestrate both antimicrobial defense and tissue regeneration within the multifactorial wound microenvironment. Inspired by the spatially hierarchical architecture of natural honeycombs, we developed a biomimetic bidirectional membrane (PYS) fabricated via a breath figure patterning technique and biomass-derived polyester materials to achieve integrated structural and functional stratification. The dense and smooth outer layer serves as an effective physical antimicrobial barrier, while the inner layer features a downward-opening honeycomb structure that enables high-efficiency loading and sustained release of epidermal growth factor (EGF), providing a favorable three-dimensional microenvironment for cell migration and angiogenesis. In a diabetic mouse wound model, PYS-EGF significantly suppressed bacterial adhesion, promoted neovascularization, and accelerated wound closure. This study demonstrates that synergistic integration of structural biomimicry and functional stratification can achieve coordinated antimicrobial and regenerative effects in diabetic wounds, offering a promising strategy for the design of next-generation wound healing materials.","abstractZh":"糖尿病创面的特征在于感染与再生之间长期存在的病理性失衡，其中细菌定植与组织修复受损二者协同作用，共同阻碍了创面愈合进程。然而，现有的大多数创面敷料仅着眼于单一的治疗功能，因而限制了其在多因素共同作用的创面微环境中同时协调抗菌防御与组织再生的能力。受天然蜂窝空间层级结构的启发，我们采用呼吸图图案化技术（breath figure patterning）与生物质来源的聚酯材料，制备了一种仿生双向膜（PYS），以实现结构与功能的一体化分层。其中，致密而光滑的外层作为有效的物理抗菌屏障发挥作用；而内层则具有向下开口的蜂窝状结构，该结构可实现表皮生长因子（epidermal growth factor, EGF）的高效负载与持续缓释，从而为细胞迁移和血管生成提供有利的三维微环境。在糖尿病小鼠创面模型中，PYS-EGF 显著抑制了细菌黏附、促进了新生血管形成，并加速了创面闭合。本研究证明，将结构仿生与功能分层进行协同整合，能够在糖尿病创面中实现抗菌与再生相互协调的效应，为下一代创面愈合材料的设计提供了一种有前景的策略。","tier":"1区","if":12.8},
{"pmid":"42097023","topic":"糖尿病难愈创面","title":"Replenishing interfacial lubrication: A cartilage-inspired polyzwitterionic dressing for spatiotemporal healing of friction-prone diabetic wound.","titleZh":"补充界面润滑：仿软骨聚两性离子敷料用于易摩擦糖尿病创面的时空愈合","journal":"Biomaterials","year":"2026","date":"2026-Nov","edat":"2026-05-07","authors":"Yu P, Li Y, Liu Y, Ma Z, Jiang Y","doi":"10.1016/j.biomaterials.2026.124228","abstract":"Frequent frictions and overexpressed reactive oxygen-nitrogen species are two prominent barriers to friction-prone diabetic wound healing. Current commercial dressings fail to adaptively replenish the interfacial lubrication and restore immune homeostasis. By mimicking the lubrication and antioxidation properties of cartilage, we develop an engineered polyzwitterionic dressing by upcycling kitchen waste (eggshell membrane, ESM). With the sequential chemical modification of ergothioneine (EGT) and active-ester-contained zwitterionic copolymer, the resulting EP-ESM dressing replenishes interfacial lubrication (μ = 0.0204) by thickening the hydrated fluid film and thinning the tissue fluid. We quantify the mathematical correlation between time-controlled lubrication and responsive EGT release, confirming the improved efficiency of lubrication replenishment and the inherent lubricity of EP-ESM dressing. In addition, it demonstrates enhanced anti-oxidation performance by synergistic proton-transfer and electron-transfer mechanisms, thereby preserving mitochondrial energy metabolism. EP-ESM also exhibit an immunoregulatory property (2.77-fold increment in CD206 and 68.04% reduction in CD86), as analyzed using RNA-sequencing and qPCR. Consequently, in the full-thickness wound at the dorsal neck of diabetic rats, EP-ESM dressing shows a superior spatiotemporal healing performance compared with pristine ESM and commercial Tegaderm dressings, as evidenced by the increased wound closure rate, more collagen deposition and mature, and rapid angiogenesis. This study offers a promising regenerative strategy that integrates immunoregulation with dynamic lubrication replenishment for chronic wound repair and other tribological diseases.","abstractZh":"频繁摩擦与过度表达的活性氧氮物种是易摩擦糖尿病创面愈合的两大突出障碍。现有商业化敷料无法自适应地补充界面润滑并恢复免疫稳态。通过模拟软骨的润滑与抗氧化特性，我们以厨余废弃物（蛋壳膜，ESM）为原料进行升级再造，开发了一种工程化聚两性离子敷料。经麦角硫因（EGT）与含活性酯的两性离子共聚物依次化学修饰后，所得 EP-ESM 敷料通过增厚水化液膜、减薄组织液膜而补充界面润滑（μ = 0.0204）。我们量化了时间控制润滑与响应性 EGT 释放之间的数学相关性，证实了 EP-ESM 敷料润滑补充效率的提高及其固有润滑性。此外，该敷料通过质子转移与电子转移的协同机制表现出增强的抗氧化性能，从而保护线粒体能量代谢。RNA 测序与 qPCR 分析显示，EP-ESM 还具有免疫调节特性（CD206 增加 2.77 倍，CD86 减少 68.04%）。因此，在糖尿病大鼠颈背部全层创面中，与原始 ESM 和商用 Tegaderm 敷料相比，EP-ESM 敷料表现出更优越的时空愈合性能，表现为创面闭合率提高、胶原沉积更多且更成熟、血管生成迅速。本研究提供了一种将免疫调节与动态润滑补充相结合的有前景的再生策略，用于慢性创面修复及其他摩擦学相关疾病。","tier":"1区","if":12.8},
{"pmid":"41946317","topic":"糖尿病难愈创面","title":"A single-component photocurable chitosan hydrogel mitigates inflammation and promotes angiogenesis and neurogenesis for diabetic wound healing.","titleZh":"单组分光固化壳聚糖水凝胶减轻炎症并促进血管生成与神经发生以促进糖尿病创面愈合","journal":"Biomaterials","year":"2026","date":"2026-Oct","edat":"2026-04-07","authors":"Liu K, Zhang D, Liu C, Kang H, Dong X","doi":"10.1016/j.biomaterials.2026.124161","abstract":"Effective tissue regeneration remains challenging due to persistent inflammation, insufficient angiogenesis, and impaired neuroregeneration, particularly in complex wounds such as diabetic ulcers. Although multifunctional biomaterials have shown therapeutic potential, their structural complexity often limits clinical translation, highlighting the need for simpler yet highly effective systems. Herein, we develop a chitosan-based hydrogel derived from selenolipoic acid modified chitosan (SeAMC). In contrast to conventional octenoic acid modified chitosan (OAMC) and lipoic acid modified chitosan (LAMC), the SeAMC hydrogel exhibits markedly faster gelation under UV irradiation (within 3 s) and, notably, enables efficient photocrosslinking under 495 nm blue-green light as well as natural white light, thereby substantially broadening the applicable photochemical window. The SeAMC hydrogel effectively alleviates inflammation while promoting angiogenesis and neuroregeneration, thereby facilitating wound closure and tissue regeneration in diabetic wounds. Owing to its simple composition, good photocuring performance, and integrated biofunctionality, SeAMC represents a clinically translatable strategy for high-performance tissue repair.","abstractZh":"由于持续性炎症、血管生成不足和神经再生受损，有效的组织再生仍具挑战性，尤其是在糖尿病溃疡等复杂创面中。尽管多功能生物材料已显示出治疗潜力，但其结构复杂性常限制临床转化，凸显了对更简单却高效系统的需求。在此，我们开发了一种由硒辛酸改性壳聚糖(SeAMC)衍生的壳聚糖基水凝胶。与传统的辛烯酸改性壳聚糖(OAMC)和硫辛酸改性壳聚糖(LAMC)相比，SeAMC 水凝胶在紫外照射下凝胶化明显更快(3 s 内)，并且值得注意的是，其可在 495 nm 蓝绿光以及自然白光下实现高效光交联，从而大幅拓宽了适用的光化学窗口。SeAMC 水凝胶有效减轻炎症，同时促进血管生成和神经再生，从而促进糖尿病创面的闭合与组织再生。凭借其组成简单、光固化性能良好和一体化生物功能，SeAMC 代表了一种可用于临床转化的高性能组织修复策略。","tier":"1区","if":12.8},
{"pmid":"42184749","topic":"糖尿病难愈创面","title":"A photo-responsive, fisetin-functionalized DNA nanocage for programmed therapy to accelerate early-stage wound healing in aged skin.","titleZh":"光响应性漆黄素功能化 DNA 纳米笼用于程序化治疗以加速老化皮肤早期创面愈合","journal":"Biomaterials","year":"2026","date":"2026-Nov","edat":"2026-05-25","authors":"Yue Z, Jiang Z, Yang Y, Yin W, Lin Y","doi":"10.1016/j.biomaterials.2026.124330","abstract":"Age-related impaired wound healing presents distinct challenges compared to conventional wounds, primarily due to dysregulated phase kinetics of wound repair and chronic cellular senescence, which collectively disrupt the dynamic and orderly progression of tissue regeneration. Effective intervention requires a stage-specific and temporally programmed therapeutic strategy. To address this, we first performed transcriptome sequencing (RNA-seq) to elucidate the differential healing trajectory between young and aged wounds. Herein, we construct a photo-responsive, Fisetin-functionalized DNA nanocage (TAF) for spatiotemporally precise therapy of aged wounds. TAF is composed of a tetrahedral DNA nanocage loaded with a miR-29-targeting antisense oligonucleotide (ASO) covalently linked through a photocleavable linker and noncovalently encapsulating the senolytic agent Fisetin. The TAF platform enables a programmed therapeutic strategy: (a) the intrinsic antioxidant capacity of DNA scavenges excessive reactive oxygen species (ROS) during the early inflammatory phase; (b) photo-triggered ASO release in the proliferative phase promotes collagen synthesis; and (c) sustained Fisetin release eliminates senescent cells, fostering a pro-regenerative microenvironment. In vivo studies in aged mice reveal that TAF-mediated therapy significantly accelerates early wound closure and enhances high-quality tissue regeneration. In summary, TAF establishes an efficient nanomedicine platform that improves aged tissue repair through stage-specific, temporally programmed regulation.","abstractZh":"与常规创面相比，年龄相关的创面愈合受损呈现独特挑战，主要由于创面修复各期动力学失调和慢性细胞衰老，二者共同破坏组织再生的动态有序进程。有效干预需要阶段特异性和时间程序化的治疗策略。为此，我们首先进行转录组测序(RNA-seq)，以阐明年轻与老化创面之间愈合轨迹的差异。在此，我们构建了一种光响应性、漆黄素功能化的 DNA 纳米笼(TAF)，用于老化创面的时空精准治疗。TAF 由四面体 DNA 纳米笼构成，其负载通过光可裂解连接臂共价连接的靶向 miR-29 的反义寡核苷酸(ASO)，并以非共价方式包封衰老细胞清除剂漆黄素。TAF 平台实现了程序化治疗策略：(a) DNA 固有的抗氧化能力在早期炎症期清除过量活性氧(ROS)；(b) 增殖期光触发 ASO 释放促进胶原合成；(c) 漆黄素持续释放清除衰老细胞，营造促再生微环境。在老年小鼠体内的研究显示，TAF 介导的治疗显著加速早期创面闭合并增强高质量组织再生。总之，TAF 建立了一个高效的纳米医学平台，通过阶段特异性、时间程序化的调控改善老化组织修复。","tier":"1区","if":12.8},
