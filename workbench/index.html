{"pmid":"42107134","topic":"细胞衰老","title":"Microvascular remodeling strategy for skin rejuvenation through microenvironmental reprogramming and appendage restoration.","titleZh":"通过微环境重编程与附属器修复实现皮肤年轻化的微血管重塑策略","journal":"Biomaterials","year":"2026","date":"2026-Nov","edat":"2026-05-10","authors":"Zhou J, Jiang S, Wang L, Dong T, Yu L","doi":"10.1016/j.biomaterials.2026.124249","abstract":"Skin photoaging, induced by excessive ultraviolet exposure, leads to microvascular and appendage degeneration, extracellular matrix degradation, and cellular senescence. The limited efficacy of current treatments for photoaging is partly due to underlying microvascular dysfunction. This study introduces a microneedle patch incorporating decellularized adipose-derived matrix (DAM) to enhance microvascular remodeling and mitigate photoaging. In vitro studies demonstrate that DAM enhances the function of photoaged endothelial cells via the VEGFA/PI3K/Akt pathway while simultaneously alleviating senescence in both fibroblasts and keratinocytes through intercellular communication. In a UVB-induced photoaged mouse model, DAM promotes angiogenesis, reduces matrix metalloproteinase expression, and stimulates collagen synthesis, ultimately restoring local homeostasis and reversing aging signs. Notably, DAM treatment not only reverses these signs but also regulates the hair follicle cycle, underscoring its dual impact on appendage regeneration and microvascular repair. In conclusion, the integration of DAM into a microneedle patch provides a clinically translatable and minimally invasive platform for addressing photoaging. These findings not only advance the understanding of photoaging mechanisms but also propose a novel microvascular-focused strategy for skin regeneration. Future research will focus on optimizing patch design and establishing standardized DAM quality control protocols, with potential applications in other age-related disorders.","abstractZh":"由过度紫外线暴露诱导的皮肤光老化会导致微血管和附属器退变、细胞外基质降解以及细胞衰老。当前光老化治疗疗效有限，部分原因在于潜在的微血管功能障碍。本研究介绍了一种掺入脱细胞脂肪来源基质(DAM)的微针贴片，用于增强微血管重塑并减轻光老化。体外研究表明，DAM 通过 VEGFA/PI3K/Akt 通路增强光老化内皮细胞的功能，同时通过细胞间通讯减轻成纤维细胞和角质形成细胞的衰老。在 UVB 诱导的光老化小鼠模型中，DAM 促进血管生成、降低基质金属蛋白酶表达并刺激胶原合成，最终恢复局部稳态并逆转衰老征象。值得注意的是，DAM 治疗不仅逆转上述征象，还调控毛囊周期，凸显其对附属器再生和微血管修复的双重作用。总之，将 DAM 整合入微针贴片，为应对光老化提供了一个可临床转化且微创的平台。这些发现不仅推进了对光老化机制的理解，还提出了一种以微血管为核心的新型皮肤再生策略。未来研究将聚焦于优化贴片设计并建立标准化的 DAM 质量控制方案，并有望应用于其他年龄相关性疾病。","tier":"1区","if":12.8},
{"pmid":"40916241","topic":"细胞衰老","title":"Senescence-regulating agents remodel mesenchymal stem cell-schwann cell circuitry for diabetic bone regeneration.","titleZh":"衰老调控制剂重塑间充质干细胞—施万细胞环路以促进糖尿病骨再生","journal":"Biomaterials","year":"2026","date":"2026-Mar","edat":"2025-09-08","authors":"Lao A, Sun Y, Li W, Zhuang Y, Liu Z","doi":"10.1016/j.biomaterials.2025.123656","abstract":"Bone healing requires Schwann cells (SCs) paracrine factors for mesenchymal stem cell function. Diabetes mellitus (DM) patients are susceptible to developing SCs dysfunction and impairing bone healing. Rare research considered reconstructing mesenchymal stem cell-schwann cell circuitry in diabetic bone regeneration. Here we found that SCs in diabetic microenvironment appeared cellular senescence phenotype with excessive reactive oxygen species (ROS) and mitochondrial dysfunction. To target at senescent SCs, we co-entrapped small interfering RNA that targets P53 (Si-P53) and metformin (MET) in ZIF-8-based nanoparticles (MMZ@Si-P53). Mechanistically, MMZ@Si-P53 affected senescent SCs by promoting mitochondria recovery and serine biosynthesis. In addition, rejuvenation of SCs and recovery of mesenchymal stem cell-schwann cell circuitry inhibited bone marrow mesenchymal stem cells (BMSCs) senescence and improved BMSCs ossification. Subsequently MMZ@Si-P53 loaded into glucose-responsive hydrogel system (MMZ@Si-P53/HAMA-PBA-PVA) for triggering release of nanoparticles in hyperglycemia. MMZ@Si-P53/HAMA-PBA-PVA strongly promoted diabetic bone regeneration in diabetic rat model. Our findings demonstrated the effectiveness of MMZ@Si-P53/HAMA-PBA-PVA system in repairing diabetic bone defects.","abstractZh":"骨愈合需要施万细胞（SCs）的旁分泌因子来维持间充质干细胞功能。糖尿病（DM）患者易出现SCs功能障碍并损害骨愈合。鲜有研究考虑在糖尿病骨再生中重建间充质干细胞—施万细胞环路。本研究发现，糖尿病微环境中的SCs呈现细胞衰老表型，伴有过量活性氧（ROS）和线粒体功能障碍。为靶向衰老SCs，我们将靶向P53的小干扰RNA（Si-P53）与二甲双胍（MET）共同包封于ZIF-8基纳米颗粒中（MMZ@Si-P53）。机制上，MMZ@Si-P53通过促进线粒体恢复和丝氨酸生物合成作用于衰老SCs。此外，SCs的年轻化及间充质干细胞—施万细胞环路的恢复抑制了骨髓间充质干细胞（BMSCs）衰老并改善BMSCs成骨。随后将MMZ@Si-P53载入葡萄糖响应性水凝胶系统（MMZ@Si-P53/HAMA-PBA-PVA），以在高血糖时触发纳米颗粒释放。在糖尿病大鼠模型中，MMZ@Si-P53/HAMA-PBA-PVA强烈促进糖尿病骨再生。我们的研究结果证明了MMZ@Si-P53/HAMA-PBA-PVA系统修复糖尿病骨缺损的有效性。","tier":"1区","if":12.8},
{"pmid":"41881889","topic":"线粒体自噬","title":"Unidirectional moisture-transporting, thermoregulating, and antimicrobial aerogel dressing orchestrates a pro-regenerative microenvironment for pressure ulcer treatment.","titleZh":"单向导湿、调温、抗菌气凝胶敷料为压疮治疗构建促再生微环境","journal":"Biomaterials","year":"2026","date":"2026-Sep","edat":"2026-03-26","authors":"Bian X, Li H, Chen J, Luo Z, Huo T","doi":"10.1016/j.biomaterials.2026.124157","abstract":"Persistent pressure-shear coupled injury traps pressure ulcer wounds in a sustained ischemia-reperfusion cycle, leading to mitochondrial membrane potential collapse and mtDNA leakage in macrophages. This mitochondrial dysfunction amplifies intracellular ROS accumulation, disrupts inflammatory resolution, and blocks the transition from inflammation to proliferation, ultimately resulting in non-healing or delayed healing pressure ulcers. Here, we report a Janus hierarchical porous aerogel (OBP2GM) fabricated via directional ice-templating combined with electrospinning, designed to integrate multi-dimensional wound microenvironment regulation within a single construct. The electrospun top layer incorporates phase-change microspheres to provide mild, adaptive thermal buffering around physiological skin temperature (32-35 °C), while its highly porous fibrous architecture enables efficient bacterial interception. The underlying aerogel layer features vertically aligned microchannels that support rapid unidirectional fluid transport, ensuring effective exudate drainage and moisture balance. More importantly, the polysaccharide-polyphenol network within the aerogel actively regulates macrophage mitochondrial homeostasis by activating the PINK1/Parkin-mediated mitophagy pathway, facilitating the clearance of severely damaged mitochondria while preserving functional ones. This process restores mitochondrial membrane potential (ΔΨm↑, relative fluorescence intensity 69.22%), suppresses excessive ROS generation, promotes macrophage polarization toward the pro-regenerative M2 phenotype, and enhances HUVEC tubulogenesis by nearly threefold. In a murine pressure ulcer model, OBP2GM markedly accelerated wound re-epithelialization, demonstrating a materials-based strategy for mechanical-mitochondrial-immune synergistic repair of pressure ulcers.","abstractZh":"持续的压力—剪切耦合损伤使压疮创面陷入持续的缺血—再灌注循环，导致巨噬细胞线粒体膜电位崩溃和mtDNA泄漏。这种线粒体功能障碍放大细胞内ROS蓄积、破坏炎症消退，并阻断从炎症期向增殖期的转变，最终导致压疮不愈合或延迟愈合。在此，我们报道一种通过定向冰模板法结合静电纺丝制备的Janus分级多孔气凝胶（OBP2GM），旨在单一结构中整合多维创面微环境调控。静电纺丝顶层引入相变微球，在生理皮肤温度（32-35 °C）附近提供温和、自适应性的热缓冲，同时其高孔隙纤维结构可实现高效细菌拦截。下层气凝胶层具有垂直排列的微通道，支持快速单向液体传输，确保有效的渗出液引流和湿度平衡。更重要的是，气凝胶内的多糖—多酚网络通过激活PINK1/Parkin介导的线粒体自噬通路主动调控巨噬细胞线粒体稳态，促进严重受损线粒体的清除，同时保留功能正常的线粒体。该过程恢复线粒体膜电位（ΔΨm↑，相对荧光强度69.22%）、抑制过量ROS生成、促进巨噬细胞向促再生的M2表型极化，并使HUVEC成管能力增强近三倍。在小鼠压疮模型中，OBP2GM显著加速创面再上皮化，展示了基于材料的机械—线粒体—免疫协同修复压疮的策略。","tier":"1区","if":12.8},
{"pmid":"41512500","topic":"糖尿病难愈创面","title":"Mitochondria-targeted co-assembled nanosystem with multimodal mitochondrial DNA level control to alleviate inflammation and promote chronic wound healing.","titleZh":"具有多模式线粒体DNA水平控制的线粒体靶向共组装纳米系统减轻炎症并促进慢性创面愈合","journal":"Biomaterials","year":"2026","date":"2026-Jun","edat":"2026-01-09","authors":"Mao X, Wang C, Yu S, Zhang K, Wang Z","doi":"10.1016/j.biomaterials.2026.123981","abstract":"Mitochondrial dysfunction, particularly when associated with the mitochondrial DNA (mtDNA) activated cGAS-STING signaling pathway, represents a key pathogenic mechanism contributing to excessive inflammation. Therapeutic targeting of mitochondrial homeostasis coupled with precise modulation of mtDNA release emerges as a promising yet underexplored strategy to suppress pathological inflammation and promote chronic wound healing. Herein, epigallocatechin gallate-quercetin co-assembled nanoparticles (EQ NPs) were engineered to inhibit mtDNA-mediated inflammatory cascades through mitochondria-targeted multimodal mtDNA level control. Primarily, EQ NPs reduced the formation of oxidized mtDNA fragments (Ox-mtDNA). Then, EQ NPs inhibited the excessive opening of the mitochondrial permeability transition pore, preventing Ox-mtDNA cytoplasmic leakage. Subsequently, the escaped mtDNA fragments were neutralized by EQ NPs through polyphenol-mediated adsorption. Finally, mitophagy was upregulated to selectively eliminate damaged mitochondria. This well-designed strategy significantly inhibited the activation of the mtDNA-mediated cGAS-STING pathway, relieved the release of inflammatory factors, and promoted anti-inflammatory phenotype polarization of macrophages. In vivo, EQ NPs promoted chronic wound healing by bacteriostasis, anti-inflammation, immunomodulation, and accelerated angiogenesis. Overall, the study establishes a sequential mitochondrial quality control paradigm in which the inflammatory cascade is interrupted by multimodal and full-chain mtDNA scavenging, providing a promising candidate for the treatment of inflammatory diseases and chronic wound healing.","abstractZh":"线粒体功能障碍，尤其是与线粒体DNA（mtDNA）激活的cGAS-STING信号通路相关时，是导致过度炎症的关键致病机制。靶向线粒体稳态并精确调控mtDNA释放的治疗策略，已成为抑制病理性炎症和促进慢性创面愈合的一种有前景但尚待深入探索的方法。在此，我们构建了表没食子儿茶素没食子酸酯—槲皮素共组装纳米颗粒（EQ NPs），通过线粒体靶向的多模式mtDNA水平控制来抑制mtDNA介导的炎症级联反应。首先，EQ NPs减少氧化型mtDNA片段（Ox-mtDNA）的形成。其次，EQ NPs抑制线粒体通透性转换孔的过度开放，阻止Ox-mtDNA向胞质泄漏。随后，逃逸的mtDNA片段通过多酚介导的吸附作用被EQ NPs中和。最后，线粒体自噬被上调以选择性清除受损线粒体。这一精心设计的策略显著抑制mtDNA介导的cGAS-STING通路的激活、减少炎症因子释放，并促进巨噬细胞向抗炎表型极化。体内实验中，EQ NPs通过抑菌、抗炎、免疫调节和加速血管生成促进慢性创面愈合。总体而言，本研究建立了一种序贯性线粒体质量控制范式，通过多模式、全链条的mtDNA清除来中断炎症级联反应，为炎症性疾病治疗和慢性创面愈合提供了有前景的候选方案。","tier":"1区","if":12.8},
{"pmid":"42407200","topic":"细胞衰老","title":"Cationic nanotrap curbs UVB-induced cutaneous photodamage via exosomal cfNA capture.","titleZh":"阳离子纳米陷阱通过捕获外泌体 cfNA 抑制 UVB 诱导的皮肤光损伤","journal":"Biomaterials","year":"2026","date":"2026-Dec","edat":"2026-07-06","authors":"Zhu Y, Lin X, Li Y, Wu S, Xie X","doi":"10.1016/j.biomaterials.2026.124424","abstract":"Cell-free nucleic acids (cfNAs) carried by exosomes released from UVB-damaged skin cells act as damage-associated molecular patterns (DAMPs) that amplify sterile inflammation and contribute to sunburn, photoaging, and skin tumorigenesis. We isolated exosomes and cfNAs from UVB-irradiated human dermal fibroblasts (HDFs) and epidermal keratinocytes (NHEKs) and demonstrated that exosomes mediate the release and propagation of cfDNA, cfRNA, and cfmiRNA. These cfNAs activate endosomal Toll-like receptors (TLR3 and TLR9) and downstream NF-κB signaling in both reporter and recipient cell assays. To scavenge these inflammatory ligands, we engineered a 2D cationic nanosheet (WSP) by stabilizing exfoliated tungsten disulfide (WS2) with salvianolic acid B (SAB) and grafting cationic PAMAM generation-1 dendrimers. WSP inhibited TLR3 and 9 activation induced by nucleic-acid agonists, UVB-conditioned media from HDFs and NHEKs, and exosomes derived from UVB-damaged HDFs, indicating effective neutralization of both soluble and vesicle-associated cfNAs. Mechanistically, WSP acts upstream of receptor engagement by electrostatically sequestering anionic cfNAs rather than directly blocking TLRs. Compared with SP1 (SAB-P1 lacking the WS2 backbone), WSP more potently suppressed cfNA-associated inflammation and UVB-induced skin injury, with improved therapeutic efficacy in a murine UVB-induced skin inflammation model. Overall, WSP functions as an advanced \"nanotrap\" that enhances cfNA scavenging, attenuates inflammation, and helps reverse the progression of UVB-mediated skin damage.","abstractZh":"UVB 损伤的皮肤细胞所释放外泌体携带的游离核酸（cfNAs）作为损伤相关分子模式（DAMPs）放大无菌性炎症，并参与晒伤、光老化和皮肤肿瘤发生。我们从 UVB 照射的人真皮成纤维细胞（HDFs）和表皮角质形成细胞（NHEKs）中分离外泌体和 cfNAs，并证明外泌体介导 cfDNA、cfRNA 和 cfmiRNA 的释放与传播。在报告细胞和受体细胞实验中，这些 cfNAs 均激活内体 Toll 样受体（TLR3 和 TLR9）及下游 NF-κB 信号。为清除这些炎症配体，我们用丹酚酸 B（SAB）稳定剥离的二硫化钨（WS2）并接枝阳离子 PAMAM 第一代树枝状聚合物，构建了二维阳离子纳米片（WSP）。WSP 可抑制由核酸激动剂、HDFs 和 NHEKs 的 UVB 条件培养基以及 UVB 损伤 HDFs 来源外泌体所诱导的 TLR3 和 TLR9 激活，表明其能有效中和可溶性和囊泡相关的 cfNAs。机制上，WSP 通过静电螯合阴离子 cfNAs 作用于受体结合的上游，而非直接阻断 TLRs。与 SP1（缺乏 WS2 骨架的 SAB-P1）相比，WSP 更强效地抑制 cfNA 相关炎症和 UVB 诱导的皮肤损伤，并在小鼠 UVB 诱导皮肤炎症模型中表现出更优的疗效。总体而言，WSP 作为一种先进的“纳米陷阱”发挥作用，增强 cfNA 清除、减轻炎症，并有助于逆转 UVB 介导皮肤损伤的进展。","tier":"1区","if":12.8},
{"pmid":"42914654","topic":"外泌体","title":"A mechanically active microneedle platform integrated with engineered exosomes for enhanced tendon-bone regeneration.","titleZh":"结合工程化外泌体的力学活性微针平台促进腱-骨再生","journal":"Biomaterials","year":"2026","date":"2026-Oct-20","edat":"2026-10-23","authors":"Yang W, Li J, Zhang Y, Wang Z, Song Y","doi":"10.1016/j.biomaterials.2026.124715","abstract":"Functional regeneration of the tendon-bone interface remains a major challenge because early healing is constrained by an adverse inflammatory microenvironment and insufficient mechanical cues. Here, we developed a mechano-regenerative strategy that combines YAP-primed engineered exosomes with localized biomaterial-based delivery and active mechanical stimulation. Exosomes derived from a YAP agonist (PY-60) preconditioned TDSCs (P-Exo) showed enhanced uptake and promoted the osteogenic and chondrogenic differentiation of bone marrow mesenchymal stem cells, accompanied by activation of YAP-associated signaling and PI3K-Akt-related pathways. To improve local retention, P-Exo were incorporated into a ROS-responsive adhesive hydrogel, which accelerated fibrocartilage formation, bone ingrowth, and biomechanical restoration in a rabbit tendon-bone healing model. To address more complex repair conditions, we engineered a three-layer self-contracting microneedle platform for deep-tissue delivery of P-Exo with concurrent active mechanical stimulation. In an infected rat rotator cuff model, this system reduced bacterial burden and oxidative stress, promoted a reparative macrophage polarization and angiogenesis, and improved tendon-bone structural regeneration, biomechanical strength, and functional recovery. Together, these findings support a therapeutic framework in which engineered exosome signaling and active mechanoregulation act in concert to enhance tendon-bone repair.","abstractZh":"腱-骨界面的功能性再生仍是重大挑战，因为早期愈合受到不利炎症微环境和力学信号不足的限制。在此，我们开发了一种力学再生策略，将 YAP 预激活的工程化外泌体与基于生物材料的局部递送及主动力学刺激相结合。由 YAP 激动剂（PY-60）预处理的肌腱来源干细胞（TDSCs）所衍生的外泌体（P-Exo）表现出更强的摄取能力，并促进骨髓间充质干细胞的成骨和成软骨分化，同时伴随 YAP 相关信号及 PI3K-Akt 相关通路的激活。为提高局部滞留，将 P-Exo 负载于 ROS 响应性黏附水凝胶中，该体系在兔腱-骨愈合模型中加速了纤维软骨形成、骨长入和生物力学恢复。为应对更复杂的修复条件，我们设计了一种三层自收缩微针平台，用于深层组织递送 P-Exo 并同步施加主动力学刺激。在大鼠感染性肩袖模型中，该系统降低了细菌负荷和氧化应激，促进修复型巨噬细胞极化和血管生成，并改善腱-骨结构再生、生物力学强度和功能恢复。综上，这些发现支持一种治疗框架，即工程化外泌体信号与主动力学调控协同作用以增强腱-骨修复。","tier":"1区","if":12.8},
{"pmid":"42859106","topic":"创面修复","title":"What determines skin wound regeneration or scar healing?","titleZh":"皮肤创面再生还是瘢痕愈合由什么决定？","journal":"Trends in molecular medicine","year":"2026","date":"2026-Oct-10","edat":"2026-10-10","authors":"Su Z, Lu R, Zhang X","doi":"10.1016/j.molmed.2026.09.012","abstract":"Skin wound regeneration, scar healing, or scar evolution is a spatiotemporally continuous process with mechanisms that remain unclear. Dynamic interactions between repair cells, including fibroblasts, and the surrounding extracellular matrix scaffold are key determinants. Skin wound models that gradually deepen from the epidermis allow the simultaneous investigation of regeneration and scar-healing processes and their regulation.","abstractZh":"皮肤创面的再生、瘢痕愈合或瘢痕演变是一个在时间和空间上连续进行的过程，其机制目前仍不清楚。修复细胞（包括成纤维细胞）与周围细胞外基质支架之间的动态相互作用是关键的决定因素。从表皮开始并逐渐加深的皮肤创面模型，使得可以同时研究再生过程和瘢痕愈合过程及其调控机制。","tier":"1区","if":12.8},
{"pmid":"42632464","topic":"创面修复","title":"Chemokines in cardiovascular and cerebrovascular pathogenesis: Emerging therapeutic targets.","titleZh":"趋化因子在心血管与脑血管发病机制中的作用：新兴治疗靶点","journal":"Ageing research reviews","year":"2026","date":"2026-Nov","edat":"2026-08-22","authors":"Wang J, Ni Y, Chang H, Zhang M, Wu X","doi":"10.1016/j.arr.2026.103295","abstract":"The CC chemokine family is a group of low-molecular-weight secreted proteins that can induce various cells to migrate to specific tissues. CC chemokines are also coordinators of many cellular activities, including hematopoiesis, wound healing, tumor growth and metastasis, fibrosis, etc. Recently, CC chemokines play a pleiotropic role in regulating the occurrence and progression of cardiovascular and cerebrovascular diseases, mainly by exacerbating the diseases, and their effects vary at different stages of disease progression. Moreover, the expression of many CC chemokines is highly specific in cardiovascular and cerebrovascular diseases. These CC chemokines can serve as potential biomarkers for predicting future cardiovascular events. Intervention strategies targeting CC chemokines to alleviate diseases, such as blocking the interaction between CC chemokines and their receptors, interfering with the binding of chemokines with glycosaminoglycans, have shown great potential for application. In this review, we present the structure, physiological functions, and regulatory mechanisms of CC family, particularly elaborate on the association between CC chemokines and cardiovascular and cerebrovascular diseases, and reviewing the therapeutic applications of CC chemokines. This review demonstrates the great potential of CC chemokines in the treatment of cardiovascular and cerebrovascular diseases and proposes directions for future research.","abstractZh":"CC 趋化因子家族是一组低分子量分泌蛋白，可诱导多种细胞迁移至特定组织。CC 趋化因子也是多种细胞活动的协调者，包括造血、创面愈合、肿瘤生长与转移、纤维化等。近年来，CC 趋化因子在调控心血管与脑血管疾病的发生和进展中发挥多效性作用，主要通过加重疾病进程，且其作用在疾病进展的不同阶段有所差异。此外，许多 CC 趋化因子在心血管与脑血管疾病中的表达具有高度特异性。这些 CC 趋化因子可作为预测未来心血管事件的潜在生物标志物。以 CC 趋化因子为靶点缓解疾病的干预策略，如阻断 CC 趋化因子与其受体的相互作用、干扰趋化因子与糖胺聚糖的结合，已显示出巨大的应用潜力。在本综述中，我们介绍了 CC 家族的结构、生理功能与调控机制，尤其阐述了 CC 趋化因子与心血管及脑血管疾病的关联，并回顾了 CC 趋化因子的治疗应用。本综述展示了 CC 趋化因子在心血管与脑血管疾病治疗中的巨大潜力，并提出了未来研究方向。","tier":"1区","if":12.5},
{"pmid":"42697334","topic":"细胞衰老","title":"Posttranslational oxidation of SOD1 and skin aging: Evidence, gaps, and future directions.","titleZh":"SOD1 的翻译后氧化与皮肤老化：证据、空白与未来方向","journal":"Ageing research reviews","year":"2026","date":"2026-Nov","edat":"2026-09-04","authors":"Li C, Qi X, Kong J, Guan T","doi":"10.1016/j.arr.2026.103351","abstract":"As the body's primary barrier against environmental insults, the skin is continually exposed to oxidative stress, which may contribute to progressive proteotoxic stress. Excess reactive oxygen species (ROS) can overwhelm cellular protein-quality-control systems, promoting the accumulation of damaged and misfolded proteins, proteome instability, and eventual Protein homeostasis (proteostasis) collapse. Superoxide dismutase 1 (SOD1), a Cu/Zn-dependent cytosolic antioxidant enzyme and key component of cellular defense against superoxide radicals, is itself vulnerable to oxidative modification. ROS-mediated post-translational oxidation of SOD1 may promote its misfolding and the formation of toxic protein species, potentially establishing a self-amplifying cycle of superoxide accumulation, further protein damage, and impaired cellular homeostasis. In cutaneous cell types, including dermal fibroblasts and epidermal cells, these processes may be especially relevant to age-associated declines in proteostatic capacity and skin aging. This review distinguishes established skin-specific evidence from hypotheses extrapolated from other systems and synthesizes current evidence on the interplay among ROS-induced protein damage, proteostasis failure, SOD1 dysfunction, and cutaneous aging. We highlight the bidirectional relationship between proteostasis collapse and mitochondrial dysfunction, which may establish a self-reinforcing cycle of oxidative stress, cellular senescence, and chronic low-grade inflammation. These interconnected processes may converge to promote extracellular-matrix remodeling and tissue dysfunction, contributing to wrinkles, reduced elasticity, and impaired barrier function. By positioning SOD1 oxidation as a potential contributor to cutaneous proteostatic dysfunction, this review provides a framework for evaluating whether the SOD1 proteotoxic axis represents a candidate therapeutic target for skin aging.","abstractZh":"作为机体抵御环境损伤的主要屏障，皮肤持续暴露于氧化应激，这可能促成进行性蛋白质毒性应激。过量的活性氧(ROS)可压垮细胞蛋白质质量控制体系，促进受损和错误折叠蛋白的蓄积、蛋白质组不稳定，并最终导致蛋白质稳态(proteostasis)崩溃。超氧化物歧化酶 1(SOD1)是一种 Cu/Zn 依赖性胞质抗氧化酶，也是细胞防御超氧阴离子的关键组分，其本身易受氧化修饰。ROS 介导的 SOD1 翻译后氧化可能促进其错误折叠及毒性蛋白种类的形成，从而可能建立超氧阴离子蓄积、进一步蛋白损伤和细胞稳态受损的自我放大循环。在皮肤细胞类型中，包括真皮成纤维细胞和表皮细胞，这些过程可能与衰老相关的蛋白质稳态能力下降及皮肤老化尤为相关。本综述区分了已确立的皮肤特异性证据与由其他系统外推的假说，并综合了关于 ROS 诱导的蛋白损伤、蛋白质稳态失衡、SOD1 功能障碍与皮肤老化之间相互作用的现有证据。我们强调蛋白质稳态崩溃与线粒体功能障碍之间的双向关系，其可能建立氧化应激、细胞衰老和慢性低度炎症的自我强化循环。这些相互关联的过程可能汇聚于促进细胞外基质重塑和组织功能障碍，从而导致皱纹、弹性下降和屏障功能受损。通过将 SOD1 氧化定位为皮肤蛋白质稳态功能障碍的潜在促成因素，本综述为评估 SOD1 蛋白质毒性轴是否可作为皮肤老化的候选治疗靶点提供了框架。","tier":"1区","if":12.5},
{"pmid":"42914031","topic":"细胞衰老","title":"Mapping cellular senescence in heart failure: knowledge evolution, mechanistic modules, and senotherapeutic opportunities.","titleZh":"心力衰竭中细胞衰老的知识图谱：知识演进、机制模块与衰老治疗机遇","journal":"Ageing research reviews","year":"2026","date":"2026-Oct-22","edat":"2026-10-23","authors":"Meng L, Liao X, Wu Z, Hu Z","doi":"10.1016/j.arr.2026.103427","abstract":"BACKGROUND: Cellular senescence is increasingly recognized as a mechanistic link between cardiovascular ageing, inflammatory-fibrotic remodelling, and heart failure (HF) progression. However, the knowledge structure, thematic evolution, and translational frontiers of senescence research in HF remain incompletely mapped. OBJECTIVE: This study mapped the global research landscape of cellular senescence in HF from 2005 to 2025 by integrating dual-database bibliometric analysis with BERTopic-based semantic topic modelling. METHODS: English-language articles and reviews were retrieved from the Web of Science Core Collection and Scopus. After field verification, standardization, and deduplication, 479 publications were included. VOSviewer, CiteSpace, SCImago Graphica, Pajek, Python, and Microsoft Excel were used for bibliometric and visualization analyses. PubMedBERT-based embeddings and BERTopic were applied to identify latent semantic themes from titles, abstracts, and keywords. RESULTS: Publications increased rapidly after 2020, with 336 papers published between 2020 and 2025, accounting for 70.1% of the corpus. China and the United States were the leading contributors, with the United States showing higher collaboration strength and accumulated citation counts within the analysed dataset. Co-citation analysis identified foundational studies in senescence biology, senolytics, cardiovascular ageing, and HF remodelling. Keyword evolution showed a shift from oxidative stress, cardiac stem/progenitor cell senescence, and vascular cell senescence toward inflammation, metabolic remodelling, biomarkers, HF phenotypes, and senotherapeutics. BERTopic identified 17 substantive topics, with Cardiac and Cardiovascular Aging as the largest theme, followed by Cardiac Fibrosis and Fibroblast Activation, SASP-related Cardiovascular Senescence, Cardiac Regeneration, and Doxorubicin Cardiotoxicity. CONCLUSION: Bibliometric and semantic analyses indicate growing research interest in cell-type-specific senescence, inflammatory-fibrotic remodelling, HF phenotype heterogeneity, biomarkers, and senotherapeutics. These findings highlight opportunities for integrating mechanistic research with clinical investigation. Future studies should prioritize cell-specific senescence atlases, multidimensional biomarkers, comorbidity-aware HF stratification, and cautious evaluation of senotherapeutics in HF subgroups with evidence of senescence-associated pathology.","abstractZh":"背景：细胞衰老日益被认为是心血管老化、炎症-纤维化重塑与心力衰竭(HF)进展之间的机制纽带。然而，HF 中衰老研究的知识结构、主题演进和转化前沿仍未被完整描绘。目的：本研究通过整合双数据库文献计量分析与基于 BERTopic 的语义主题建模，描绘了 2005 至 2025 年 HF 中细胞衰老的全球研究图景。方法：从 Web of Science 核心合集和 Scopus 检索英文论文和综述。经字段核验、标准化和去重后，最终纳入 479 篇文献。使用 VOSviewer、CiteSpace、SCImago Graphica、Pajek、Python 和 Microsoft Excel 进行文献计量与可视化分析。应用基于 PubMedBERT 的嵌入和 BERTopic 从标题、摘要和关键词中识别潜在语义主题。结果：2020 年后发文量迅速增长，2020 至 2025 年间发表 336 篇，占全部文献的 70.1%。中国和美国是主要贡献者，在分析数据集中美国表现出更高的合作强度和累积被引次数。共被引分析识别出衰老生物学、衰老细胞清除剂、心血管老化和 HF 重塑等领域的基础性研究。关键词演进显示，研究重心从氧化应激、心脏干/祖细胞衰老和血管细胞衰老，转向炎症、代谢重塑、生物标志物、HF 表型和衰老治疗药物。BERTopic 识别出 17 个实质性主题，其中「心脏与心血管老化」为最大主题，其后依次为「心脏纤维化与成纤维细胞活化」「SASP 相关心血管衰老」「心脏再生」和「多柔比星心脏毒性」。结论：文献计量与语义分析表明，对细胞类型特异性衰老、炎症-纤维化重塑、HF 表型异质性、生物标志物和衰老治疗药物的研究兴趣日益增长。这些发现凸显了将机制研究与临床研究相结合的机会。未来研究应优先构建细胞特异性衰老图谱、多维生物标志物、考虑合并症的 HF 分层，并在具有衰老相关病理证据的 HF 亚组中审慎评估衰老治疗药物。","tier":"1区","if":12.5},
{"pmid":"41802679","topic":"糖尿病难愈创面","title":"Decoding skin aging: Emerging roles of miRNAs, lncRNAs, and circRNAs in mechanisms, therapies, and future horizons.","titleZh":"解码皮肤衰老：miRNAs、lncRNAs和circRNAs在机制、治疗及未来前景中的新兴作用","journal":"Ageing research reviews","year":"2026","date":"2026-Jun","edat":"2026-03-09","authors":"González-Melgoza LL, Méndez-García A, Ruiz IV, Rodríguez AG, Samanta D","doi":"10.1016/j.arr.2026.103094","abstract":"Skin aging is a multifactorial process influenced by intrinsic and extrinsic factors, including cellular senescence, photoaging, glycation, and impaired wound healing, all of which begin at birth. Recent epigenetic research has identified non-coding RNAs (ncRNAs), particularly microRNAs (miRNAs), long non-coding RNAs (lncRNAs), and circular RNAs (circRNAs), as key regulators of gene networks governing skin homeostasis, regeneration, and aging. However, the literature remains fragmented, lacking a cohesive framework that integrates ncRNA biogenesis, mechanistic function, and therapeutic relevance across aging pathways. This review consolidates current evidence on ncRNA-mediated regulation of skin aging, focusing on their roles in modulating oxidative stress, extracellular matrix remodeling, stem cell exhaustion, and inflammatory signaling. We highlight key ncRNAs such as miR-146a, miR-296-5p, lncRNA-H19, lncRNA-PVT1, and circRNA-406918, and their molecular targets including SIRT1, AQP3, NAMPT, TLR4 and CTSD, coordinating signaling via PI3K/mTOR, AMPK/NAD+ /SIRT, and ERK/p38 MAPK axes. We further address ncRNAs as diagnostic biomarkers and therapeutic candidates in precision dermatology and discuss the translational landscape, including delivery innovations and early-phase clinical studies. While preclinical models show strong promise, clinical applications remain limited, emphasizing the need for human-focused mechanistic and therapeutic research.","abstractZh":"皮肤衰老是一个受内在和外在因素影响的多因素过程，包括细胞衰老、光老化、糖化和创面愈合受损，这些过程自出生即已开始。近期的表观遗传学研究已确认非编码RNA（ncRNAs），特别是微小RNA（miRNAs）、长链非编码RNA（lncRNAs）和环状RNA（circRNAs），是调控皮肤稳态、再生和衰老相关基因网络的关键调节因子。然而，现有文献仍较为零散，缺乏一个整合ncRNA生物发生、机制功能及其在各类衰老通路中治疗相关性的连贯框架。本综述汇总了关于ncRNA介导皮肤衰老调控的现有证据，重点阐述其在调节氧化应激、细胞外基质重塑、干细胞耗竭和炎症信号传导中的作用。我们重点介绍了miR-146a、miR-296-5p、lncRNA-H19、lncRNA-PVT1和circRNA-406918等关键ncRNA及其分子靶点，包括SIRT1、AQP3、NAMPT、TLR4和CTSD，它们通过PI3K/mTOR、AMPK/NAD+/SIRT和ERK/p38 MAPK轴协调信号传导。我们进一步探讨ncRNAs作为精准皮肤科诊断生物标志物和治疗候选物的价值，并讨论其转化前景，包括递送技术创新和早期临床研究。尽管临床前模型显示出良好前景，临床应用仍然有限，这凸显了开展以人为中心的机制与治疗研究的必要性。","tier":"1区","if":12.5},
{"pmid":"41041048","topic":"线粒体自噬","title":"Cyclic mechanical stretching enhances mitophagy and oxidative stress resistance in adipose-derived stem cells via the Piezo1/ATP axis to accelerate wound healing.","titleZh":"循环机械牵张通过 Piezo1/ATP 轴增强脂肪来源干细胞的线粒体自噬与抗氧化应激能力并加速创面愈合","journal":"Theranostics","year":"2025","date":"2025","edat":"2025-10-03","authors":"Xiao Y, Shi Z, Yuan Y, Yao D, Feng R","doi":"10.7150/thno.118364","abstract":"Adipose-derived stem cells (ADSCs) hold significant potential in regenerative medicine, yet their therapeutic efficacy is often limited by low survival rates in the presence of oxidative stress. While mechanical cues regulate cytoskeletal dynamics, their roles in modulating cellular metabolism and mitochondrial adaptation remain unexplored. This study aimed to elucidate how physiological-range cyclic mechanical stretching (CMS) enhances ADSCs resistance to oxidative stress through the Piezo1/ATP signaling axis, thereby establishing an innovative strategy for developing antioxidant-functionalized stem cell therapies. Methods: To examine the impact of CMS on oxidative stress resistance, ADSCs were exposed to CMS (8% strain, 0.5 Hz, 24 h) using the Flexcell FX-6000 system. Oxidative stress models employed H₂O₂ (200 μM), with apoptosis, mitochondrial function, and metabolic flux analyzed in vitro. A murine full-thickness wound model was used to assess in vivo survival and regenerative outcomes. Results: CMS activated Piezo1 channels, resulting in enhanced ATP synthesis and remodeling of the tricarboxylic acid cycle. This improved the effectiveness of mitochondrial oxidative phosphorylation. Mechanically preconditioned ADSCs exhibited reduced apoptosis, ​enhanced oxidation resistance, stabilized mitochondrial membrane potential, and upregulated mitophagy. In vivo, these cells demonstrated superior healing capacity and accelerated wound closure. Conclusion: CMS orchestrated the Piezo1/ATP-driven metabolic-mitochondrial axis to enhance ADSCs oxidative stress resistance by coupling metabolic reprogramming with mitophagy activation. This mechanometabolic interaction identifies mechanical signaling as a direct regulator of cellular bioenergetics, offering a translatable strategy to engineer antioxidant-functionalized stem cells for regenerative therapies.","abstractZh":"脂肪来源干细胞（ADSCs）在再生医学中具有巨大潜力，但其在氧化应激环境下的低存活率常常限制了治疗效果。尽管力学信号可调控细胞骨架动力学，但其在调节细胞代谢与线粒体适应中的作用尚未被探索。本研究旨在阐明生理范围内的循环机械牵张（CMS）如何通过 Piezo1/ATP 信号轴增强 ADSCs 对氧化应激的抵抗能力，从而为开发抗氧化功能化干细胞疗法建立创新策略。方法：为考察 CMS 对氧化应激抵抗的影响，采用 Flexcell FX-6000 系统对 ADSCs 施加 CMS（应变 8%，0.5 Hz，24 h）。氧化应激模型使用 H₂O₂（200 μM），并在体外分析细胞凋亡、线粒体功能与代谢流。采用小鼠全层皮肤缺损创面模型评估体内存活与再生结局。结果：CMS 激活 Piezo1 通道，导致 ATP 合成增强及三羧酸循环重塑。这提高了线粒体氧化磷酸化的效率。经力学预处理的 ADSCs 表现为凋亡减少、抗氧化能力增强、线粒体膜电位稳定以及线粒体自噬上调。在体内，这些细胞表现出更优的愈合能力并加速创面闭合。结论：CMS 通过将代谢重编程与线粒体自噬激活相耦联，协调 Piezo1/ATP 驱动的代谢-线粒体轴，从而增强 ADSCs 的抗氧化应激能力。这种力学-代谢相互作用表明力学信号是细胞生物能量学的直接调控因素，为工程化改造抗氧化功能化干细胞用于再生治疗提供了一种可转化的策略。","tier":"1区","if":12.4},
{"pmid":"42906552","topic":"创面修复","title":"Inhibition of the CTP synthase 1 prevents GVHD and delays skin graft rejection revealing distinct alloreactive T cell responses.","titleZh":"抑制CTP合成酶1可预防GVHD并延缓皮肤移植排斥，揭示同种反应性T细胞应答的差异","journal":"Cell reports. Medicine","year":"2026","date":"2026-Oct-21","edat":"2026-10-22","authors":"Souza CL, Schaus R, Garcin C, Martin E, Nemazanyy I","doi":"10.1016/j.xcrm.2026.103121","abstract":"Acute graft-versus-host disease (aGVHD), following allogeneic hematopoietic stem cell transplantation, and organ rejection are serious immune-mediated complications driven by alloreactive T cells. CTPS1, a crucial enzyme for de novo CTP synthesis, is essential for the proliferation of activated T cells, representing an attractive therapeutic target for controlling T cell-mediated pathologies. In this study, using Ctps1-deficient T cells in fully MHC-mismatched and haploidentical hematopoietic stem cell transplantation models, a complete blockage in the induction of aGVHD is observed in association with significantly reduced alloreactive effector T cell expansion. In skin graft rejection models, expansion of alloreactive Ctps1-deficient T cells is reduced, and graft destruction is delayed but not prevented. Notably, the healing process allows T cells to mediate skin graft rejection independently of CTPS1. Finally, treatment with a specific CTPS1 inhibitor rescues mice from lethal aGVHD. Our results underscore the pivotal role of CTPS1 in driving alloreactive T cell responses, highlighting its potential for aGVHD treatment.","abstractZh":"异基因造血干细胞移植后发生的急性移植物抗宿主病（aGVHD）与器官排斥反应，是由同种反应性 T 细胞驱动的严重免疫介导并发症。CTPS1 是胞苷三磷酸（CTP）从头合成中的关键酶，对活化 T 细胞的增殖至关重要，是控制 T 细胞介导病理过程的有吸引力的治疗靶点。本研究在完全 MHC 错配与单倍体相合造血干细胞移植模型中，使用 Ctps1 缺陷 T 细胞，观察到 aGVHD 的诱导被完全阻断，同时同种反应性效应 T 细胞的扩增显著减少。在皮肤移植排斥模型中，同种反应性 Ctps1 缺陷 T 细胞的扩增减少，移植物破坏被延缓但未被阻止。值得注意的是，愈合过程使 T 细胞能够在独立于 CTPS1 的情况下介导皮肤移植排斥。最后，使用特异性 CTPS1 抑制剂治疗可使小鼠免于致死性 aGVHD。我们的结果强调了 CTPS1 在驱动同种反应性 T 细胞应答中的关键作用，凸显了其用于 aGVHD 治疗的潜力。","tier":"1区","if":11.7},
{"pmid":"42905820","topic":"创面修复","title":"Staphylococcus aureus wall teichoic acid structure dictates virulence potential and resistance to host defenses.","titleZh":"金黄色葡萄球菌壁磷壁酸结构决定其毒力潜能与对宿主防御的抵抗能力","journal":"Science advances","year":"2026","date":"2026-Oct-23","edat":"2026-10-22","authors":"Enroth TJ, Lee E, Eisenmesser EZ, Horswill AR","doi":"10.1126/sciadv.aef7070","abstract":"Staphylococcus aureus is a formidable pathogen and the leading cause of skin and soft tissue infections. We recently showed that the highly conserved sasF gene, encoding for an uncharacterized sortase-anchored surface protein, is up-regulated when S. aureus colonizes skin. Here, we demonstrate that SasF is an enzyme that has glycoside epimerase activity, which is required for S. aureus resistance to skin fatty acids. Mutants of sasF are highly impaired in skin colonization and acute infection models. The SasF enzyme is crucial for maintaining the structure of wall teichoic acids and proper S. aureus surface chemistry. To our knowledge, this is the first report of a bacterial surface epimerase in this pathogen, suggesting that SasF could be a therapeutic target.","abstractZh":"金黄色葡萄球菌是一种难以对付的病原体，也是皮肤和软组织感染的主要原因。我们最近发现，高度保守的sasF基因（编码一种尚未被表征的、经分选酶锚定的表面蛋白）在金黄色葡萄球菌定植皮肤时上调表达。在此，我们证明SasF是一种具有糖苷差向异构酶活性的酶，该活性是金黄色葡萄球菌抵抗皮肤脂肪酸所必需的。sasF突变体在皮肤定植和急性感染模型中均严重受损。SasF酶对于维持壁磷壁酸的结构和金黄色葡萄球菌表面化学性质的正常状态至关重要。据我们所知，这是该病原体中首次报道的细菌表面差向异构酶，提示SasF可能成为一个治疗靶点。","tier":"1区","if":11.7},
{"pmid":"42905816","topic":"创面修复","title":"Enterococcus faecalis biofilm rewires neutrophil metabolism to suppress antimicrobial activity.","titleZh":"粪肠球菌生物膜重编程中性粒细胞代谢以抑制其抗菌活性","journal":"Science advances","year":"2026","date":"2026-Oct-23","edat":"2026-10-22","authors":"Antypas H, Gonçalves da Silva RA, Wong GKX, Liang C, Muthualagu Natarajan L","doi":"10.1126/sciadv.aej4153","abstract":"Enterococcus faecalis is an opportunistic pathogen that persists in biofilm-associated infections despite robust neutrophil recruitment. How E. faecalis evades neutrophils remains poorly understood. Here, we investigated how E. faecalis biofilms alter effector functions in human neutrophils and a murine wound infection model. We found that E. faecalis biofilm suppresses neutrophil extracellular trap (NET) formation, bacterial engulfment, and neutrophil-mediated control of biofilm growth. This suppression is partly driven by production of lactic acid through the lactate dehydrogenases (LDHs) of E. faecalis, which acidifies the extracellular environment, lowers neutrophil intracellular pH, and disrupts glycolysis, the tricarboxylic acid cycle, and the oxidative pentose phosphate pathway. In a murine wound infection model, loss of LDH increased neutrophil recruitment and NETosis. We also found that high bacterial density, a defining feature of biofilms, suppresses NETosis through a lactic acid-independent mechanism. Collectively, these findings identify biofilm immune evasion strategies mediated by bacterial metabolism and the high-density structural organization of biofilm-associated bacteria.","abstractZh":"粪肠球菌是一种机会性病原体，尽管中性粒细胞被大量募集，其仍能在生物膜相关感染中持续存在。粪肠球菌如何逃逸中性粒细胞的作用目前仍知之甚少。在此，我们研究了粪肠球菌生物膜如何改变人中性粒细胞的效应功能以及在小鼠创面感染模型中的作用。我们发现，粪肠球菌生物膜抑制中性粒细胞胞外诱捕网（NET）形成、细菌吞噬以及中性粒细胞介导的生物膜生长控制。这种抑制作用部分由粪肠球菌的乳酸脱氢酶（LDHs）产生乳酸所驱动，乳酸使细胞外环境酸化、降低中性粒细胞胞内pH，并破坏糖酵解、三羧酸循环和氧化磷酸戊糖途径。在小鼠创面感染模型中，LDH缺失增加了中性粒细胞募集和NETosis。我们还发现，高细菌密度（生物膜的一个决定性特征）通过不依赖乳酸的机制抑制NETosis。总之，这些发现揭示了由细菌代谢以及生物膜相关细菌的高密度结构组织所介导的生物膜免疫逃逸策略。","tier":"1区","if":11.7},
{"pmid":"42886797","topic":"创面修复","title":"Cell-intrinsic steroidogenesis regulates mast cell function.","titleZh":"细胞内在类固醇合成调控肥大细胞功能","journal":"Science advances","year":"2026","date":"2026-Oct-16","edat":"2026-10-16","authors":"Pramanik J, Zhao Q, Chakraborty S, Yamashita-Kanemaru Y, Hussein H","doi":"10.1126/sciadv.aea0260","abstract":"Steroid hormones are well-known regulators of mast cell function, but whether mast cells themselves produce steroids de novo and influences their effector function has remained unknown. Here, we show that mast cells constitutively express the steroidogenic enzyme cytochrome P450 family 11 subfamily A member 1 (Cyp11a1) and produce pregnenolone. Cyp11a1 expression was detected across tissue-resident mast cells from multiple organs, was conserved in human mast cells, and was enhanced by interleukin-3 signaling and after activation. We identified Cyp11a1 as a Gata2-dependent, superenhancer-associated mast cell gene, placing steroidogenesis within the core mast cell transcriptional program. Loss of Cyp11a1 altered transcriptomic and proteomic programs in mast cells, with effects on pathways linked to cell growth, immune signaling, and effector function. Functionally, Cyp11a1-deficient mast cells showed increased degranulation in response to both immunoglobulin E (IgE)-dependent and IgE-independent stimulation. In vivo, loss of Cyp11a1 reduced mast cell abundance in several tissues but exacerbated passive cutaneous anaphylaxis. These findings identify cell-intrinsic steroidogenesis as a regulatory pathway that restrains mast cell activation and anaphylactic responses.","abstractZh":"类固醇激素是众所周知的肥大细胞功能调节因子，但肥大细胞本身是否从头合成类固醇并影响其效应功能仍属未知。在此，我们显示肥大细胞组成性表达类固醇合成酶细胞色素P450家族11亚家族A成员1（Cyp11a1）并产生孕烯醇酮。Cyp11a1表达在来自多个器官的组织驻留肥大细胞中均可检测到，在人肥大细胞中保守，并可被白细胞介素-3信号以及活化后增强。我们将Cyp11a1鉴定为Gata2依赖、与超级增强子相关的肥大细胞基因，从而将类固醇合成置于肥大细胞核心转录程序之中。Cyp11a1缺失改变了肥大细胞的转录组和蛋白质组程序，影响与细胞生长、免疫信号和效应功能相关的通路。在功能上，Cyp11a1缺陷的肥大细胞在响应免疫球蛋白E（IgE）依赖性和IgE非依赖性刺激时均表现出脱颗粒增加。在体内，Cyp11a1缺失减少了多个组织中的肥大细胞数量，但加重了被动皮肤过敏反应。这些发现确定细胞内在类固醇合成是一条限制肥大细胞活化和过敏反应的调控通路。","tier":"1区","if":11.7},
{"pmid":"42886785","topic":"创面修复","title":"Mechanoadaptive nanowire viscoplastic composites with strain-enhanced conductivity for reprocessable bioelectronic interfaces.","titleZh":"具有应变增强导电性的机械自适应纳米线粘塑性复合材料用于可再加工生物电子界面","journal":"Science advances","year":"2026","date":"2026-Oct-16","edat":"2026-10-16","authors":"Huo R, Huang S, Gong D, Zhou X, Zhu H","doi":"10.1126/sciadv.aef5042","abstract":"Bioelectronic interfaces must mechanically conform and adapt to biological tissues while maintaining stable electrical performance during motion and deformation. Existing soft conductors, however, often couple mechanical strain to electrical resistance, accumulate interfacial stress, and hinder reprocessing. Here, we report nanowire viscoplastic composites that combine silver nanowires with a dynamically crosslinked, short-chain polyborosiloxane matrix to produce emergent electromechanical behavior. The viscoplastic matrix permits deformation-induced nanowire reorganization, yielding high conductivity enhanced with strains. It also imparts fast stress relaxation, controllable yielding, and plastic conformability, enabling stress-free, mechanoadaptive contact with biological tissues. The material is self-healing, reconfigurable, and solvent-processable for recycling. It forms stable adhesion across porcine, rat, and human skin; accommodates hair regrowth; and exhibits excellent cytocompatibility and antibacterial function. As dry electrodes, these composites exhibit low impedance and resolve perilaryngeal muscle fatigue through high-resolution surface electromyography in humans. This work expands the materials design space for bioelectronic interfaces.","abstractZh":"生物电子界面必须在运动与形变过程中与生物组织在力学上相顺应并相互适应，同时保持稳定的电学性能。然而，现有的软导体常常将机械应变与电阻耦合在一起，累积界面应力，并阻碍材料的再加工。在此，我们报道一类纳米线粘塑性复合材料，它将银纳米线与一种动态交联的短链聚硼硅氧烷基体相结合，从而产生涌现性的机电行为。该粘塑性基体允许形变诱导的纳米线重组，从而获得随应变而增强的高电导率。它还可赋予材料快速的应力松弛、可控的屈服行为以及塑性贴合能力，从而实现与生物组织之间无应力的、机械自适应的接触。该材料具有自愈合性、可重构性以及可溶剂加工性，因而便于回收利用。它能够在猪、大鼠和人皮肤上形成稳定的粘附，适应毛发的再生长，并表现出优异的细胞相容性和抗菌功能。作为干电极使用时，这些复合材料表现出低阻抗，并通过高分辨率表面肌电图在人体中分辨出环咽肌的疲劳。这项工作拓展了生物电子界面的材料设计空间。","tier":"1区","if":11.7},
{"pmid":"42873866","topic":"创面修复","title":"Radical-induced autoxidation dominates squalene oxidative aging under environmental conditions.","titleZh":"自由基诱导的自氧化主导环境条件下角鲨烯的氧化老化","journal":"Science advances","year":"2026","date":"2026-Oct-16","edat":"2026-10-14","authors":"Wang X, Downey JP, Gobbi G, Fahy WD, Wu W","doi":"10.1126/sciadv.aei2144","abstract":"Ozone has been viewed as the principal oxidant of skin oils and other unsaturated surface films, but their fate under realistic indoor conditions remains poorly constrained. Here, we use squalene (SQ), a major component of skin lipids, to investigate the dominant oxidation pathways in occupied indoor environments and laboratory flow reactors. With exposure to indoor air, SQ decay and reactive oxygen species (ROS) formation accelerated over time, consistent with autoxidation. Laboratory experiments with ozone alone drove first-order SQ loss and humidity-dependent emissions of volatile organic compounds (VOCs). In contrast, exposure to both ozone and •OH produced nonexponential SQ decays, higher ROS yields, a much stronger in-film •OH source, and condensed-phase products enriched in highly oxidized organic hydroperoxides that closely match those observed indoors. Unexpectedly, gas-phase •OH strongly suppressed VOC emissions. These results demonstrate that gas-phase radical-induced autoxidation governs SQ aging, challenging the prevailing ozone-centric view of indoor skin oil oxidation.","abstractZh":"臭氧一直被视为皮肤油脂和其他不饱和表面膜的主要氧化剂，但其在真实室内环境中的归趋仍缺乏充分约束。在此，我们利用角鲨烯（SQ）——皮肤脂质的主要成分——研究在有人居住的室内环境和实验室流动反应器中占主导的氧化途径。暴露于室内空气时，SQ衰减和活性氧（ROS）形成随时间加速，与自氧化一致。仅使用臭氧的实验室实验驱动了一级SQ损失以及湿度依赖的挥发性有机化合物（VOC）排放。相比之下，同时暴露于臭氧和•OH产生了非指数型SQ衰减、更高的ROS产率、强得多的膜内•OH来源，以及富含高度氧化有机氢过氧化物的凝聚相产物，这些产物与室内观察到的产物高度吻合。出乎意料的是，气相•OH强烈抑制了VOC排放。这些结果表明，气相自由基诱导的自氧化主导SQ老化，挑战了目前以臭氧为中心的室内皮肤油脂氧化观点。","tier":"1区","if":11.7},
{"pmid":"42853945","topic":"创面修复","title":"Canonical Wnt induction by OTULIN prevents keratinocyte death and skin inflammation.","titleZh":"OTULIN诱导经典Wnt信号可防止角质形成细胞死亡和皮肤炎症","journal":"Science advances","year":"2026","date":"2026-Oct-09","edat":"2026-10-09","authors":"Lecomte K, Hertens P, Wylleman V, Toniolo A, Roelandt F","doi":"10.1126/sciadv.adz0181","abstract":"Loss-of-function mutations in the human OTULIN gene, encoding a deubiquitinase with exclusive specificity for linear ubiquitin chains, cause a severe multiorgan autoinflammatory condition involving the skin. Mice lacking OTULIN selectively in keratinocytes develop inflamed skin lesions that progress into squamous tumors, a phenotype driven by excessive tumor necrosis factor (TNF)-induced cell death. Previous studies suggest a role for OTULIN in mediating Wnt signaling during development, but the physiological relevance of this association is unknown. Here, we show that OTULIN promotes Wnt signaling in keratinocytes by regulating the linear ubiquitination status of β-catenin. Stabilization of β-catenin in OTULIN-deficient keratinocytes prevents progressive skin inflammation in prophylactic and therapeutic settings by blocking keratinocyte death. We demonstrate that OTULIN prevents proteasomal degradation of β-catenin in cultured keratinocytes. Reduced Wnt signaling in OTULIN-deficient keratinocytes leads to degradation of TCF3/4, an essential survival factor for keratinocytes. Collectively, our data identify OTULIN's linear deubiquitination activity as a key regulator of epithelial cell viability, not only by preventing cell death downstream of TNF, but also by promoting canonical Wnt signaling.","abstractZh":"人类OTULIN基因的功能缺失突变会导致一种累及皮肤的严重多器官自身炎症性疾病，该基因编码一种对线性泛素链具有专属特异性的去泛素化酶。在角质形成细胞中选择性缺失OTULIN的小鼠会出现炎症性皮肤病变，并进展为鳞状细胞肿瘤，这一表型由肿瘤坏死因子（TNF）诱导的过度细胞死亡所驱动。既往研究提示OTULIN在发育过程中介导Wnt信号，但这种关联的生理学意义尚不清楚。在此，我们证明OTULIN通过调节β-catenin的线性泛素化状态来促进角质形成细胞中的Wnt信号。在OTULIN缺陷的角质形成细胞中稳定β-catenin，可在预防性和治疗性设置下通过阻断角质形成细胞死亡来防止进行性皮肤炎症。我们证明OTULIN在培养的角质形成细胞中防止β-catenin的蛋白酶体降解。OTULIN缺陷角质形成细胞中Wnt信号减弱会导致TCF3/4降解，而TCF3/4是角质形成细胞必需的存活因子。总之，我们的数据表明OTULIN的线性去泛素化活性是上皮细胞存活的关键调节因子，其不仅通过阻止TNF下游的细胞死亡，还通过促进经典Wnt信号发挥作用。","tier":"1区","if":11.7},
{"pmid":"42853918","topic":"创面修复","title":"Dishevelled-mediated clustering stabilizes Frizzled6 and Vangl2 to establish planar cell polarity in the mammalian skin.","titleZh":"Dishevelled介导的聚集稳定Frizzled6和Vangl2以在哺乳动物皮肤中建立平面细胞极性","journal":"Science advances","year":"2026","date":"2026-Oct-09","edat":"2026-10-09","authors":"Sil P, Trejo B, Little KA, Devenport D","doi":"10.1101/2024.10.21.619498","abstract":"Planar cell polarity (PCP) in epithelia is characterized by the polarized distribution of two opposing, membrane-associated PCP complexes across cell junctions. Transmembrane components of the PCP complex bridge cell junctions and organize into punctate, intercellular assemblies that exhibit a high degree of stability. Here, we define the contributions of the cytoplasmic PCP protein, Dishevelled (Dvl), in the submicrometer scale organization and stability of PCP complexes. Using endogenously tagged fluorescent PCP reporters in the embryonic mouse epidermis, we quantify PCP protein mobility and clustering during polarization. We find that as transmembrane proteins immobilize into puncta, Dvl2/3 coaccumulates with its transmembrane partner Frizzled 6 in a polarized manner and stabilizes clusters of PCP complexes. We identify a previously unknown function for the oligomerizing Dishevelled/Axin (DIX) domain of Dvl3, typically associated with Wnt signaling, in Dvl3 asymmetric localization. These observations underscore a role for Dvl oligomerization in assembly and stabilization of asymmetric PCP puncta.","abstractZh":"上皮中的平面细胞极性（PCP）以两种相互对立的膜相关PCP复合物在细胞连接处的极性分布为特征。PCP复合物的跨膜组分桥接细胞连接，并组织成点状的细胞间组装体，表现出高度的稳定性。在此，我们明确了细胞质PCP蛋白Dishevelled（Dvl）在PCP复合物的亚微米尺度组织和稳定性中的作用。利用胚胎小鼠表皮中内源性标记的荧光PCP报告基因，我们定量了极化过程中PCP蛋白的移动性和聚集。我们发现，随着跨膜蛋白固定为点状结构，Dvl2/3以极性方式与其跨膜伙伴Frizzled 6共聚集，并稳定PCP复合物簇。我们发现了Dvl3的寡聚化Dishevelled/Axin（DIX）结构域（通常与Wnt信号相关）在Dvl3不对称定位中的先前未知功能。这些观察强调了Dvl寡聚化在不对称PCP点状结构的组装和稳定中的作用。","tier":"1区","if":11.7},
{"pmid":"42826195","topic":"创面修复","title":"A TERRA-NONO axis drives fibroblast reprogramming in cancer.","titleZh":"TERRA-NONO轴驱动癌症中的成纤维细胞重编程","journal":"Science advances","year":"2026","date":"2026-Oct-02","edat":"2026-10-02","authors":"Di Cicco E, Isma J, Sol S, Restivo G, Mazzeo L","doi":"10.1126/sciadv.aed3358","abstract":"The molecular mechanisms linking chromosome homeostasis to fibroblast reprogramming into cancer-associated fibroblasts (CAFs) remain poorly understood. Here, we identify a clinically relevant, telomere-associated nuclear pathway driving CAF activation across multiple human cancers. The long noncoding RNA TERRA is consistently elevated in CAFs from skin, lung, and breast tumors. We show that the androgen receptor (AR) represses TERRA transcription through subtelomeric binding, and its loss enables TERRA up-regulation and interaction with the RNA binding protein NONO. This interaction forms a CAF-specific nuclear complex that reprograms gene expression. Mechanistically, NONO is directly recruited to and binds the promoters of key CAF effector genes, where it regulates their transcription in a TERRA-dependent manner. Disrupting the TERRA-NONO axis, via TERRA silencing or pharmacologic NONO inhibition, reverses CAF activation and suppresses tumor-stroma interactions in vitro and in vivo, highlighting its therapeutic potential.","abstractZh":"将染色体稳态与成纤维细胞重编程为癌相关成纤维细胞（CAF）联系起来的分子机制仍知之甚少。在此，我们鉴定了一条在多种人类癌症中驱动CAF激活的、具有临床相关性的端粒相关核内通路。长链非编码RNA TERRA在来自皮肤、肺和乳腺肿瘤的CAF中持续升高。我们证明雄激素受体（AR）通过亚端粒结合抑制TERRA转录，其缺失使TERRA上调并与RNA结合蛋白NONO相互作用。这种相互作用形成CAF特异性的核复合物，从而重编程基因表达。在机制上，NONO被直接募集并结合关键CAF效应基因的启动子，在那里以TERRA依赖的方式调控其转录。通过TERRA沉默或药理学抑制NONO来破坏TERRA-NONO轴，可在体外和体内逆转CAF激活并抑制肿瘤-间质相互作用，凸显其治疗潜力。","tier":"1区","if":11.7},
{"pmid":"42789706","topic":"创面修复","title":"MCA1 mechanosensitive channels enable fast communication of wound signals between lateral roots.","titleZh":"MCA1机械敏感通道使侧根之间能够快速传递创伤信号","journal":"Science advances","year":"2026","date":"2026-Sep-25","edat":"2026-09-25","authors":"Baudon A, Brodersen CR, Huang S, Song H, Becker D","doi":"10.1101/2025.10.04.680446","abstract":"Although plant roots are hidden in soil, they are vulnerable to damage by insect herbivory, such as aerial tissues. However, wound signaling in roots is poorly understood. Here, we examined how damage signals spread locally and over long distances between Arabidopsis lateral roots. Using intracellular membrane potential recordings, calcium imaging, and optogenetics, we show that mechanical injury triggers an immediate local membrane depolarization and cytosolic calcium elevations whose magnitude and duration scale with wound severity. Depolarizations were also detected in neighboring lateral roots within milliseconds, demonstrating the presence of a rapid inter-root signaling pathway. Through mutant analyses, we highlight the roles of glutamate-like receptors and mid1-complementing activity 1 (MCA1) mechanosensitive channels in mediating this long-distance communication. Our results demonstrate that a wound-induced decrease in root cell turgor pressure rapidly spreads across the root network, where neighboring roots decode this signal via MCA1. This work underscores fundamental differences between root and shoot wound responses and uncovers a mechanosensory basis for fast communication between lateral roots.","abstractZh":"尽管植物根系隐藏于土壤之中，但它们与地上组织一样易受昆虫取食造成的损伤。然而，根系中的创伤信号传导了解甚少。在此，我们研究了损伤信号在拟南芥侧根之间局部及长距离传播的方式。利用细胞内膜电位记录、钙成像和光遗传学，我们证明机械损伤可立即触发局部膜去极化和胞质钙升高，其幅度和持续时间与创伤严重程度成比例。在相邻侧根中亦于毫秒级内检测到去极化，表明存在快速的根间信号通路。通过突变体分析，我们强调了谷氨酸样受体和mid1互补活性1（MCA1）机械敏感通道在介导这种长距离通讯中的作用。我们的结果表明，创伤诱导的根细胞膨压下降迅速扩散至整个根系网络，相邻根系通过MCA1解码该信号。本工作强调了根与地上部创伤反应之间的根本差异，并揭示了侧根间快速通讯的机械感觉基础。","tier":"1区","if":11.7},
{"pmid":"42647635","topic":"细胞衰老","title":"Development of mitochondrial mutator pigs exhibiting increased mitochondrial DNA mutations and premature aging via prime editing.","titleZh":"通过先导编辑构建线粒体DNA突变增加并过早衰老的线粒体突变猪","journal":"Science advances","year":"2026","date":"2026-Aug-28","edat":"2026-08-26","authors":"Chen F, Liang Y, Zheng W, Yao A, Wang N","doi":"10.1126/sciadv.adu0632","abstract":"The accumulation of mitochondrial DNA (mtDNA) mutations is a primary driver of mitochondrial dysfunction, which is intrinsically linked to aging and various pathologies. POLG, the catalytic subunit of DNA polymerase gamma, is essential for mtDNA replication; notably, a deficiency in its proofreading function precipitates the accumulation of mtDNA mutations. In this study, by combining prime editing with somatic cell nuclear transfer technology, we successfully generated a mitochondrial mutator pig model expressing proofreading-deficient POLG. These pigs exhibited elevated somatic mtDNA mutation loads and recapitulated key premature aging phenotypes, including weight loss, rough hair coat, anemia, structural alterations in the skin and testicular interstitium, increased apoptosis, and the up-regulation of senescence-associated markers, culminating in shortened life span. Given the physiological and metabolic similarities between pigs and humans, this mitochondrial mutator pig model represents an ideal preclinical tool for dissecting the mechanistic role of mtDNA mutations in aging and age-related pathologies and for accelerating the translation of therapeutic strategies.","abstractZh":"线粒体DNA（mtDNA）突变的积累是线粒体功能障碍的主要驱动因素，而线粒体功能障碍与衰老及多种病理状态存在内在联系。POLG是DNA聚合酶γ的催化亚基，对mtDNA复制至关重要；值得注意的是，其校对功能的缺陷会促使mtDNA突变积累。在本研究中，我们将先导编辑（prime editing）与体细胞核移植技术相结合，成功构建了表达校对缺陷型POLG的线粒体突变猪模型。这些猪表现出体细胞mtDNA突变负荷升高，并重现了关键的过早衰老表型，包括体重下降、被毛粗糙、贫血、皮肤和睾丸间质结构改变、细胞凋亡增加以及衰老相关标志物上调，最终导致寿命缩短。鉴于猪与人在生理和代谢上的相似性，该线粒体突变猪模型是理想的临床前工具，可用于解析mtDNA突变在衰老及年龄相关病理中的机制作用，并加速治疗策略的转化。","tier":"1区","if":11.7},
{"pmid":"41916295","topic":"糖尿病难愈创面","title":"Enalaprilat reverses neutrophil polarization imbalance via targeting taurine-STING axis for treatment of diabetic wounds.","titleZh":"依那普利拉通过靶向牛磺酸-STING 轴逆转中性粒细胞极化失衡以治疗糖尿病创面","journal":"Cell reports. Medicine","year":"2026","date":"2026-Apr-21","edat":"2026-03-31","authors":"Lu L, Xiong Y, Liao J, Zhou J, Wang G","doi":"10.1002/advs.202303894","abstract":"Persistent inflammation derived from neutrophil activation drives delayed healing of diabetic wounds. Herein, a dissolvable alginate methacryloyl-based microneedle patch functionalized with polypeptide CFLFLFK-NH2-coupled manganese/zinc ion metal-organic framework (MnZn-MOF) loading enalaprilat (Ena) (TMZE@A-MN) is developed. Ena promotes neutrophil repolarization from pro-inflammatory N1 to anti-inflammatory N2 state by inhibiting nuclear factor (NF)-κB axis and activating Smad3 pathway, attributed to Ena-induced level elevation of taurine and subsequently STING signaling cascade suppression, thus causing macrophage phenotype switching and endothelial cell ferroptosis repression. Due to identifiable property of CFLFLFK-NH2 on neutrophil membrane receptors, the delivery system endows Ena with targeting inhibitory roles in neutrophil activation. In addition, MnZn-MOFs possess free radical-eliminating performance and can effectively combat the growth of methicillin-resistant Staphylococcus aureus and Escherichia coli. In vivo evaluation on diabetic murine and porcine wounds also demonstrates that the TMZE@A-MN accelerates wound healing process. Consequently, the targeted microneedle delivery system holds great promise for diabetic wound treatment.","abstractZh":"源于中性粒细胞活化的持续炎症驱动糖尿病创面愈合延迟。在此，我们开发了一种可溶解的甲基丙烯酰化海藻酸盐微针贴片，其功能化修饰有多肽 CFLFLFK-NH2 偶联的锰/锌离子金属有机框架（MnZn-MOF）并负载依那普利拉（Ena）（TMZE@A-MN）。Ena 通过抑制核因子（NF）-κB 轴并激活 Smad3 通路，促进中性粒细胞从促炎 N1 状态向抗炎 N2 状态复极化，这归因于 Ena 诱导的牛磺酸水平升高以及随后的 STING 信号级联抑制，进而引起巨噬细胞表型转换和内皮细胞铁死亡抑制。由于 CFLFLFK-NH2 对中性粒细胞膜受体的可识别特性，该递送系统赋予 Ena 对中性粒细胞活化的靶向抑制作用。此外，MnZn-MOFs 具有自由基清除性能，可有效对抗耐甲氧西林金黄色葡萄球菌和大肠杆菌的生长。在糖尿病小鼠和猪创面上的体内评估也表明，TMZE@A-MN 加速创面愈合过程。因此，该靶向微针递送系统在糖尿病创面治疗中具有很大前景。","tier":"1区","if":11.7},
{"pmid":"41920988","topic":"糖尿病难愈创面","title":"Self-regulating hydrogel for diabetic wound healing: From animal models to a pilot clinical study.","titleZh":"自调控水凝胶用于糖尿病创面愈合：从动物模型到初步临床研究","journal":"Science advances","year":"2026","date":"2026-Apr-03","edat":"2026-04-01","authors":"Zhao L, Chen S, Chen S, Sun Y, Xi L","doi":"10.1101/2025.03.31.646270","abstract":"Chronic diabetic wounds affect millions and often fail to heal due to infection, inflammation, and poor angiogenesis, leading to high rates of amputation. Current treatments offer limited control over the wound microenvironment. Here, this work develops GPP@ZnBG hydrogels that can respond to elevated glucose and oxidative stress in diabetic wounds to release therapeutic ions in a self-pH-regulated and sequential manner. At an early stage, this hydrogel initiates a release of zinc ions under alkaline conditions, providing antibacterial activity while avoiding toxicity from excessive dosing. During the late stage, the hydrogel degrades, and it steadily releases zinc, calcium, and silicate ions that support angiogenesis, reduce inflammation, and promote tissue repair. In diabetic mice, GPP@ZnBG hydrogels improve neovascularization and enhance collagen deposition, leading to enhanced wound closure. Single-cell RNA sequencing results indicate that the hydrogel modulates fibroblast behavior, specifically fine-tuning NF-κB signaling to reduce detrimental inflammation and promote wound repair. A pilot clinical study demonstrates that topical GPP@ZnBG application showed a 94.57% relative reduction in a wound surface area within 4 weeks, with no adverse events reported. These findings establish a self-pH-driven ion delivery strategy that targets both infection and tissue regeneration, offering a promising therapeutic platform for chronic diabetic wound care.","abstractZh":"慢性糖尿病创面影响数百万人，常因感染、炎症和血管新生不良而难以愈合，导致高截肢率。现有治疗对创面微环境的控制有限。在此，本工作开发了 GPP@ZnBG 水凝胶，可响应糖尿病创面中升高的葡萄糖和氧化应激，以自 pH 调节和序贯方式释放治疗性离子。在早期阶段，该水凝胶在碱性条件下启动锌离子释放，提供抗菌活性，同时避免过量给药带来的毒性。在后期阶段，水凝胶降解，稳定释放锌、钙和硅酸根离子，支持血管新生、减轻炎症并促进组织修复。在糖尿病小鼠中，GPP@ZnBG 水凝胶改善新生血管形成并增强胶原沉积，从而促进创面闭合。单细胞 RNA 测序结果表明，该水凝胶调节成纤维细胞行为，特别是微调 NF-κB 信号以减少有害炎症并促进创面修复。一项初步临床研究显示，局部应用 GPP@ZnBG 在 4 周内使创面面积相对缩小 94.57%，且未报告不良事件。这些发现确立了一种自 pH 驱动的离子递送策略，同时针对感染和组织再生，为慢性糖尿病创面护理提供了一个有前景的治疗平台。","tier":"1区","if":11.7},
{"pmid":"41171927","topic":"糖尿病难愈创面","title":"Cascade-targeting pH/ROS microneedles promote scarless diabetic wound healing by macrophage metaboimmune reprogramming.","titleZh":"级联靶向pH/ROS微针通过重编程巨噬细胞代谢免疫促进糖尿病创面无瘢痕愈合","journal":"Science advances","year":"2025","date":"2025-Oct-31","edat":"2025-10-31","authors":"Yang G, Yang J, Diao Z, Long J, Shu Z","doi":"10.1126/sciadv.adw3834","abstract":"Precise macrophage modulation is essential for diabetic wound treatment, yet mitochondrial dysfunction often sustains proinflammatory states. We developed cascade-targeting nanoparticles [epigallocatechin-3-gallate and metformin nanoparticles modified with mannose (EM/Man NPs)] to regulate macrophage mitochondria, integrated into a detachable core-shell microneedle patch (EM/Man MNs) made of quaternary ammonium chitosan and reactive oxygen species (ROS)-degradable polymer. The patch offered high penetration and antibacterial activity, while its ROS-sensitive core released EM/Man NPs to scavenge ROS, restore adenosine 5'-triphosphate production, and reestablish redox balance. The NPs further activated the adenosine 5'-monophosphate-activated protein kinase/Sirtuin 1/peroxisome proliferator-activated receptor gamma coactivator 1α axis to promote mitochondrial biogenesis and oxidative phosphorylation, repolarizing macrophages to an anti-inflammatory phenotype. In diabetic mice, EM/Man MNs accelerated healing via bacterial clearance, immune reprogramming, angiogenesis, and collagen deposition while inhibiting scar formation through interleukin-17 and phosphatidylinositol 3-kinase-Akt suppression. This cascade-targeting strategy for modulating macrophage mitochondria to regulate immunity and redox homeostasis provides a previously unidentified approach for designing tissue engineering materials.","abstractZh":"精准调控巨噬细胞对糖尿病创面治疗至关重要，然而线粒体功能障碍常常维持促炎状态。我们开发了级联靶向纳米颗粒[甘露糖修饰的表没食子儿茶素没食子酸酯与二甲双胍纳米颗粒（EM/Man NPs）]以调控巨噬细胞线粒体，并将其整合入由季铵化壳聚糖和活性氧（ROS）可降解聚合物制成的可分离核壳微针贴片（EM/Man MNs）中。该贴片具有高穿透性和抗菌活性，其ROS敏感核心可释放EM/Man NPs以清除ROS、恢复腺苷5'-三磷酸生成并重建氧化还原平衡。该纳米颗粒进一步激活单磷酸腺苷活化蛋白激酶/沉默信息调节因子1/过氧化物酶体增殖物激活受体γ共激活因子1α轴，促进线粒体生物发生和氧化磷酸化，使巨噬细胞向抗炎表型复极化。在糖尿病小鼠中，EM/Man MNs通过清除细菌、免疫重编程、血管生成和胶原沉积加速愈合，同时通过抑制白细胞介素-17和磷脂酰肌醇3-激酶-Akt抑制瘢痕形成。这种通过调控巨噬细胞线粒体以调节免疫和氧化还原稳态的级联靶向策略，为设计组织工程材料提供了一种此前未被发现的途径。","tier":"1区","if":11.7},
{"pmid":"40238890","topic":"糖尿病难愈创面","title":"A wireless, self-powered smart insole for gait monitoring and recognition via nonlinear synergistic pressure sensing.","titleZh":"一种基于非线性协同压力传感的无线自供电智能鞋垫用于步态监测与识别","journal":"Science advances","year":"2025","date":"2025-Apr-18","edat":"2025-04-16","authors":"Wang Q, Guan H, Wang C, Lei P, Sheng H","doi":"10.1126/sciadv.adu1598","abstract":"Wearable insole-based pressure sensor systems have gained attention for continuous gait monitoring, showing potential for preventing, diagnosing, and treating conditions such as lumbar degenerative disease and diabetic foot ulcers. However, challenges such as nonlinear response, low stability, and energy limitations have hindered widespread adoption. Here, we report a fully integrated, self-powered, wireless smart insole designed for plantar pressure monitoring and real-time visualization and analysis of gait. The pressure sensor uses a nonlinear synergistic strategy, achieving remarkable linearity (R2 > 0.999 over 0 to 225 kilopascals) and high durability (>180,000 compression cycles). Powered by flexible solar cells, the insole features 22 pressure sensors, enabling spatially resolved pressure mapping and real-time visualization on a smartphone interface. Integration of a support vector machine model further enables accurate recognition of eight motion states, including static (e.g., sitting and standing) and dynamic (e.g., walking, running, and squatting) activities. The smart insole provides a practical solution for improving clinical assessments, personalized treatments, and biomechanics research.","abstractZh":"基于鞋垫的可穿戴压力传感器系统因连续步态监测而受到关注，在预防、诊断和治疗腰椎退行性疾病及糖尿病足溃疡等疾病方面显示出潜力。然而，非线性响应、稳定性低和能量受限等挑战阻碍了其广泛应用。在此，我们报道一种完全集成、自供电的无线智能鞋垫，用于足底压力监测以及步态的实时可视化和分析。该压力传感器采用非线性协同策略，实现了优异的线性度（0至225千帕范围内R2 > 0.999）和高耐久性（>180,000次压缩循环）。该鞋垫由柔性太阳能电池供电，配备22个压力传感器，可实现空间分辨的压力映射及智能手机界面的实时可视化。集成支持向量机模型进一步实现了对八种运动状态的准确识别，包括静态（如坐和站）和动态（如行走、跑步和深蹲）活动。该智能鞋垫为改进临床评估、个性化治疗和生物力学研究提供了实用解决方案。","tier":"1区","if":11.7},
{"pmid":"38608014","topic":"细胞衰老","title":"Energy metabolism as therapeutic target for aged wound repair by engineered extracellular vesicle.","titleZh":"能量代谢作为工程化细胞外囊泡促进衰老创面修复的治疗靶点","journal":"Science advances","year":"2024","date":"2024-Apr-12","edat":"2024-04-12","authors":"Zhuang Y, Jiang S, Deng X, Lao A, Hua X","doi":"10.1126/sciadv.adl0372","abstract":"Aging skin, vulnerable to age-related defects, is poor in wound repair. Metabolic regulation in accumulated senescent cells (SnCs) with aging is essential for tissue homeostasis, and adequate ATP is important in cell activation for aged tissue repair. Strategies for ATP metabolism intervention hold prospects for therapeutic advances. Here, we found energy metabolic changes in aging skin from patients and mice. Our data show that metformin engineered EV (Met-EV) can enhance aged mouse skin repair, as well as ameliorate cellular senescence and restore cell dysfunctions. Notably, ATP metabolism was remodeled as reduced glycolysis and enhanced OXPHOS after Met-EV treatment. We show Met-EV rescue senescence-induced mitochondria dysfunctions and mitophagy suppressions, indicating the role of Met-EV in remodeling mitochondrial functions via mitophagy for adequate ATP production in aged tissue repair. Our results reveal the mechanism for SnCs rejuvenation by EV and suggest the disturbed energy metabolism, essential in age-related defects, to be a potential therapeutic target for facilitating aged tissue repair.","abstractZh":"衰老皮肤易发生年龄相关缺陷，创面修复能力较差。随衰老而蓄积的衰老细胞（SnCs）中的代谢调节对组织稳态至关重要，而充足的ATP对衰老组织修复中的细胞活化十分重要。ATP代谢干预策略有望推动治疗进展。在此，我们发现了来自患者和小鼠的衰老皮肤中的能量代谢变化。我们的数据显示，二甲双胍工程化EV（Met-EV）可增强老年小鼠皮肤修复，并改善细胞衰老和恢复细胞功能障碍。值得注意的是，Met-EV处理后ATP代谢发生重塑，表现为糖酵解减少和OXPHOS增强。我们表明Met-EV可挽救衰老诱导的线粒体功能障碍和线粒体自噬抑制，提示Met-EV通过线粒体自噬重塑线粒体功能，从而在衰老组织修复中产生充足的ATP。我们的结果揭示了EV使SnCs年轻化的机制，并提示在年龄相关缺陷中至关重要的能量代谢紊乱可作为促进衰老组织修复的潜在治疗靶点。","tier":"1区","if":11.7},
{"pmid":"38781961","topic":"糖尿病难愈创面","title":"Bone transport induces the release of factors with multi-tissue regenerative potential for diabetic wound healing in rats and patients.","titleZh":"骨搬移诱导释放具有多组织再生潜能的因子促进大鼠和患者的糖尿病创面愈合","journal":"Cell reports. Medicine","year":"2024","date":"2024-Jun-18","edat":"2024-05-23","authors":"Xie J, Liu X, Wu B, Chen B, Song Q","doi":"10.1111/j.2002.384.doc.x","abstract":"Tibial cortex transverse distraction is a surgical method for treating severe diabetic foot ulcers (DFUs), but the underlying mechanism is unclear. We show that antioxidant proteins and small extracellular vesicles (sEVs) with multiple-tissue regenerative potential are released during bone transport (BT) in humans and rats. These vesicles accumulate in diabetic wounds and are enriched with microRNAs (miRNAs) (e.g., miR-494-3p) that have high regenerative activities that improve the circulation of ischemic lower limbs while also promoting neovascularization, fibroblast migration, and nerve fiber regeneration. Deletion of miR-494-3p in rats reduces the beneficial effects of BT on diabetic wounds, while hydrogels containing miR-494-3p and reduced glutathione (GSH) effectively repair them. Importantly, the ginsenoside Rg1 can upregulate miR-494-3p, and a randomized controlled trial verifies that the regimen of oral Rg1 and GSH accelerates wound healing in refractory DFU patients. These findings identify potential functional factors for tissue regeneration and suggest a potential therapy for DFUs.","abstractZh":"胫骨皮质横向牵张是治疗重度糖尿病足溃疡（DFUs）的一种手术方法，但其潜在机制尚不清楚。我们表明，在人和大鼠的骨搬移（BT）过程中会释放具有多组织再生潜能的抗氧化蛋白和小细胞外囊泡（sEVs）。这些囊泡蓄积于糖尿病创面，并富集具有高再生活性的microRNAs（miRNAs）（如miR-494-3p），可改善缺血下肢的循环，同时促进新生血管形成、成纤维细胞迁移和神经纤维再生。在大鼠中敲除miR-494-3p可减弱BT对糖尿病创面的有益作用，而含miR-494-3p和还原型谷胱甘肽（GSH）的水凝胶可有效修复这些创面。重要的是，人参皂苷Rg1可上调miR-494-3p，一项随机对照试验证实口服Rg1联合GSH的方案可加速难治性DFU患者的创面愈合。这些发现鉴定了组织再生的潜在功能因子，并为DFUs提示了一种潜在疗法。","tier":"1区","if":11.7},
{"pmid":"38924411","topic":"糖尿病难愈创面","title":"Alcaligenes faecalis corrects aberrant matrix metalloproteinase expression to promote reepithelialization of diabetic wounds.","titleZh":"粪产碱杆菌纠正异常的基质金属蛋白酶表达以促进糖尿病创面再上皮化","journal":"Science advances","year":"2024","date":"2024-Jun-28","edat":"2024-06-26","authors":"White EK, Uberoi A, Pan JT, Ort JT, Campbell AE","doi":"10.1126/sciadv.adj2020","abstract":"Chronic wounds are a common and costly complication of diabetes, where multifactorial defects contribute to dysregulated skin repair, inflammation, tissue damage, and infection. We previously showed that aspects of the diabetic foot ulcer microbiota were correlated with poor healing outcomes, but many microbial species recovered remain uninvestigated with respect to wound healing. Here, we focused on Alcaligenes faecalis, a Gram-negative bacterium that is frequently recovered from chronic wounds but rarely causes infection. Treatment of diabetic wounds with A. faecalis accelerated healing during early stages. We investigated the underlying mechanisms and found that A. faecalis treatment promotes reepithelialization of diabetic keratinocytes, a process that is necessary for healing but deficient in chronic wounds. Overexpression of matrix metalloproteinases in diabetes contributes to failed epithelialization, and we found that A. faecalis treatment balances this overexpression to allow proper healing. This work uncovers a mechanism of bacterial-driven wound repair and provides a foundation for the development of microbiota-based wound interventions.","abstractZh":"慢性创面是糖尿病常见且代价高昂的并发症，多种因素缺陷导致皮肤修复失调、炎症、组织损伤和感染。我们此前表明糖尿病足溃疡微生物群的某些方面与不良愈合结局相关，但分离出的许多微生物物种在创面愈合方面仍未被研究。在此，我们聚焦于粪产碱杆菌，这是一种常从慢性创面中分离但很少引起感染的革兰阴性菌。用粪产碱杆菌处理糖尿病创面可加速早期阶段的愈合。我们研究了潜在机制，发现粪产碱杆菌处理可促进糖尿病角质形成细胞的再上皮化，该过程为愈合所必需但在慢性创面中存在缺陷。糖尿病中基质金属蛋白酶过表达导致上皮化失败，我们发现粪产碱杆菌处理可平衡这种过表达，从而允许正常愈合。本研究揭示了一种细菌驱动的创面修复机制，并为开发基于微生物群的创面干预措施奠定了基础。","tier":"1区","if":11.7},
{"pmid":"41621532","topic":"糖尿病难愈创面","title":"Skin regeneration axis under metal-based nanozymes: from chronic wound healing to structural and functional restoration.","titleZh":"金属基纳米酶调控下的皮肤再生轴：从慢性创面愈合到结构与功能重建","journal":"Journal of advanced research","year":"2026","date":"2026-Oct","edat":"2026-02-01","authors":"Zhuang ZM, Guo K, Wu ZR, Wang Y, Zhong XC","doi":"10.1016/j.jare.2026.01.068","abstract":"BACKGROUND: Diabetic infected wounds, representing a prototypical model of chronic non-healing wounds, leading to severe impairment of skin regeneration. However, complete skin restoration requires more than just wound closure; it crucially involves the inhibition of pathological scarring (fibrosis) and the functional regeneration of skin appendages (e.g., hair follicles). Metal-based nanozymes (MNZs), due to their highly stable, tunable enzyme-mimicking catalytic activity and excellent integration potential, have emerged as promising candidates, with initial studies demonstrating their utility in these broader regenerative aspects. But existing reviews primarily focus on MNZs' role in basic wound healing, overlooking the structure and functional regeneration potential of skin under MNZs intervention. AIM OF REVIEW: This review addresses the knowledge gap by analyzing the recent literature to establish a comprehensive \"Skin Regeneration Axis\" for MNZs application. Specifically, the objective is to integrate and evaluate MNZs' potential across the three essential dimensions of full-process skin repair: chronic wound healing, structural pathological scar inhibition, and functional appendage regeneration. This integration fully reports MNZs' potential for holistic skin restoration. KEY SCIENTIFIC CONCEPTS OF REVIEW: This review summarizes the fundamentals of MNZs, including their catalytic mechanisms, classifications, and synthetic strategies. It articulates a multidimensional regenerative paradigm for MNZs, elucidating their roles across the entire spectrum of skin regeneration, which constitutes the core concepts of this review: (1) Chronic Wound Healing via controlling inflammation and oxidative stress, (2) Pathological Scar Inhibition through targeted molecular pathway regulation, and (3) Structural Appendage Regeneration (e.g., hair follicles). The review also highlights critical translational challenges and proposes integrated strategies for accelerating the clinical application of MNZs for holistic skin repair.","abstractZh":"背景：糖尿病感染性创面是慢性难愈合创面的典型模型，可导致皮肤再生严重受损。然而，完全的皮肤重建不仅需要创面闭合，还关键在于抑制病理性瘢痕(纤维化)以及实现皮肤附属器(如毛囊)的功能性再生。金属基纳米酶(MNZs)因其高度稳定、可调的类酶催化活性和优异的整合潜力而成为有前景的候选者，初步研究已证明其在上述更广泛的再生方面的效用。但现有综述主要关注 MNZs 在基础创面愈合中的作用，忽视了 MNZs 干预下皮肤结构与功能再生的潜力。综述目的：本综述通过分析近期文献来弥补这一知识空白，为 MNZs 的应用建立全面的「皮肤再生轴」。具体而言，目标是整合并评估 MNZs 在全程皮肤修复的三个基本维度上的潜力：慢性创面愈合、结构性病理性瘢痕抑制以及功能性附属器再生。这一整合全面呈现了 MNZs 在整体皮肤重建方面的潜力。综述的关键科学概念：本综述总结了 MNZs 的基础知识，包括其催化机制、分类和合成策略。其阐述了 MNZs 的多维再生范式，阐明其在皮肤再生全谱中的作用，这构成本综述的核心概念：(1) 通过控制炎症和氧化应激促进慢性创面愈合；(2) 通过靶向分子通路调控抑制病理性瘢痕；(3) 结构附属器再生(如毛囊)。本综述还强调了关键的转化挑战，并提出了加速 MNZs 临床应用于整体皮肤修复的整合策略。","tier":"1区","if":11.4},
{"pmid":"41534553","topic":"糖尿病难愈创面","title":"Bio-inspired supramolecular hydrogel inhibits ferroptosis to accelerate diabetic wound healing.","titleZh":"仿生超分子水凝胶抑制铁死亡加速糖尿病创面愈合","journal":"Journal of advanced research","year":"2026","date":"2026-Oct","edat":"2026-01-14","authors":"Zou H, Chen J, Huang Y, Li J, Yuan X","doi":"10.1016/j.bbcan.2023.188890","abstract":"INTRODUCTION: Ferroptosis significantly compromises diabetic wound healing and represents a promising therapeutic target for clinical intervention. Baicalein (Bai), a natural flavonoid, has been considered to own ferroptosis-regulating properties, while the underlying mechanisms remain understood. OBJECTIVES: The study aims to investigate potential mechanisms by which Bai inhibits ferroptosis in endothelial cells and validate the therapeutic efficacy of Bai-loaded hydrogel on diabetic wounds. METHODS: High-glucose-cultured human umbilical vein endothelial cells (HUVECs) were chosen to study Bai's molecular mechanisms inhibiting ferroptosis. Subsequently, a Bai@GA/Gel/Zn2+ supramolecular nanofibrous hydrogel was developed for active Bai delivery. Its wound-healing efficacy and underlying mechanisms were further evaluated in a diabetic rat model. RESULTS: In vitro experiments, HUVECs were observed to exhibit characteristic ferroptosis, which were induced by high-glucose (HG) microenvironment, leading to compromised cellular functions. Through the inhibition of ferroptosis in HUVECs, Bai effectively promoted cell growth, migration, and angiogenesis. Herein, we further reveal that Bai inhibits HG-induced ferroptosis by modulating the Keap1/NRF2/HIF-1α signaling axis. To optimize therapeutic delivery, Bai was encapsulated into supramolecular nanofibers self-assembled from glycyrrhizic acid (GA), followed by cross-linking with gelatin (Gel) and zinc ions (Zn2+) to form a hydrogel (Bai@GA/Gel/Zn2+), thereby enabling sustained release of Bai at the wound-healing interface. Bai@GA/Gel/Zn2+ nanofiber-incorporated hydrogel demonstrated favorable mechanical and biological properties, markedly reducing ferroptosis levels and accelerating diabetic wound healing. CONCLUSION: In summary, our findings reveal the ferroptosis-inhibiting mechanism of Bai and develop a Bai@GA/Gel/Zn2+ supramolecular nanofibrous hydrogel that synergistically enhances diabetic wound healing with proven therapeutic efficacy.","abstractZh":"引言：铁死亡显著损害糖尿病创面愈合，是临床干预的一个有前景的治疗靶点。黄芩素(Bai)是一种天然黄酮类化合物，被认为具有调控铁死亡的特性，但其潜在机制仍待阐明。目的：本研究旨在探讨 Bai 抑制内皮细胞铁死亡的潜在机制，并验证负载 Bai 的水凝胶对糖尿病创面的治疗效果。方法：选用高糖培养的人脐静脉内皮细胞(HUVECs)研究 Bai 抑制铁死亡的分子机制。随后，开发了 Bai@GA/Gel/Zn2+ 超分子纳米纤维水凝胶用于 Bai 的主动递送。并在糖尿病大鼠模型中进一步评价其创面愈合疗效及潜在机制。结果：体外实验中，观察到 HUVECs 在高糖(HG)微环境诱导下表现出特征性铁死亡，导致细胞功能受损。通过抑制 HUVECs 中的铁死亡，Bai 有效促进细胞生长、迁移和血管生成。在此，我们进一步揭示 Bai 通过调控 Keap1/NRF2/HIF-1α 信号轴抑制 HG 诱导的铁死亡。为优化治疗性递送，将 Bai 包封于由甘草酸(GA)自组装的超分子纳米纤维中，随后与明胶(Gel)和锌离子(Zn2+)交联形成水凝胶(Bai@GA/Gel/Zn2+)，从而在创面愈合界面实现 Bai 的持续释放。掺入 Bai@GA/Gel/Zn2+ 纳米纤维的水凝胶表现出良好的力学和生物学特性，显著降低铁死亡水平并加速糖尿病创面愈合。结论：总之，我们的发现揭示了 Bai 抑制铁死亡的机制，并开发了 Bai@GA/Gel/Zn2+ 超分子纳米纤维水凝胶，其可协同增强糖尿病创面愈合，并具有确证的疗效。","tier":"1区","if":11.4},
{"pmid":"41812707","topic":"细胞衰老","title":"Rejuvenation of THY1+ nucleus pulposus-derived stem cells promotes intervertebral disc regeneration through FGF10-FGFR1-CREB pathway and mitochondrial fission.","titleZh":"使THY1+髓核来源干细胞年轻化可通过FGF10-FGFR1-CREB通路和线粒体分裂促进椎间盘再生","journal":"Journal of advanced research","year":"2026","date":"2026-Mar-09","edat":"2026-03-11","authors":"Zhai H, Wang Z, Wang S, Liu Z, Zhao D","doi":"10.1016/j.jare.2026.03.008","abstract":"INTRODUCTION: Intervertebral disc degeneration (IVDD), a major cause of low back pain, is primarily characterized by compromised regeneration ability of nucleus pulposus-derived stem cells (NPSCs) owing to their senescence. The role of NPSCs as major regenerative cells in IVDD is garnering attention. However, the drivers and mechanisms of NPSCs reactivation and regeneration are poorly understood, limiting the development of targeted therapies. The fibroblast growth factor (FGF) family has shown increasing promise in tissue regeneration; however, the key factors involved in IVDD remain unclear. OBJECTIVES: To elucidate the regenerative driver of NPSCs and the underlying anti-senescence mechanism to provide a potential therapeutic strategy. METHODS: Single cell RNA sequencing (scRNA-seq) and bulk RNA sequencing were performed to identify the key NPSCs clusters and regenerative drivers in IVDD. Clinical IVDD samples were collected to determine the alterations in the NPSCs subset proportion and the expression of regeneration factors. Further, NPSCs senescence and in vivo models were utilized to investigate the specific mechanisms and therapeutic effects. RESULTS: Thy-1 membrane glycoprotein (THY1)+ NPSCs, which are depleted in IVDD, were the key cells involved in intervertebral disc degeneration based on scRNA-seq. THY1+ NPSCs exhibited stemness and regeneration potential. The RNA-seq analysis of senescent THY1+ NPSCs indicated fibroblast growth factor 10 (FGF10) as a pivotal rejuvenation factor. Multiplex fluorescence staining demonstrated diminished FGF10 expression in IVDD. FGF10 mitigated THY1+ NPSC senescence by interacting with fibroblast growth factor receptor 1 (FGFR1). The FGF10-FGFR1 axis inhibited CREB phosphorylation and further alleviated ARG2-DRP1-related mitochondrial fission, reversing THY1+ NPSC senescence. Inhibition of CREB and downregulation of ARG2 regulate cellular senescence via modulation of mitochondrial fission. The transplantation of FGF10-overexpression NPSCs prominently alleviated nucleus pulposus degeneration and demonstrated regeneration potential in vivo. CONCLUSION: Our findings elucidate the pivotal roles of THY1+ NPSCs and FGF10 in intervertebral disc regeneration and NPSCs activation, respectively, contributing to the development of regenerative therapeutic strategies for IVDD.","abstractZh":"引言：椎间盘退变（IVDD）是下腰痛的主要原因，其主要特征是髓核来源干细胞（NPSCs）因衰老而导致再生能力受损。NPSCs作为IVDD中主要再生细胞的作用正日益受到关注。然而，对NPSCs再激活与再生的驱动因素和机制了解甚少，限制了靶向治疗的开发。成纤维细胞生长因子（FGF）家族在组织再生中显示出越来越大的前景；然而，参与IVDD的关键因子仍不明确。目的：阐明NPSCs的再生驱动因素及其潜在的抗衰老机制，以提供潜在的治疗策略。方法：采用单细胞RNA测序（scRNA-seq）和整体RNA测序鉴定IVDD中的关键NPSCs亚群和再生驱动因素。收集临床IVDD样本以确定NPSCs亚群比例的变化及再生因子的表达。进一步利用NPSCs衰老模型和体内模型研究具体机制与治疗效果。结果：基于scRNA-seq，在IVDD中耗竭的Thy-1膜糖蛋白（THY1）+ NPSCs是参与椎间盘退变的关键细胞。THY1+ NPSCs表现出干性和再生潜能。对衰老THY1+ NPSCs的RNA-seq分析表明，成纤维细胞生长因子10（FGF10）是关键的年轻化因子。多重荧光染色显示IVDD中FGF10表达降低。FGF10通过与成纤维细胞生长因子受体1（FGFR1）相互作用来减轻THY1+ NPSC衰老。FGF10-FGFR1轴抑制CREB磷酸化，并进一步减轻ARG2-DRP1相关的线粒体分裂，从而逆转THY1+ NPSC衰老。抑制CREB和下调ARG2可通过调控线粒体分裂来调节细胞衰老。移植过表达FGF10的NPSCs显著减轻髓核退变，并在体内显示出再生潜能。结论：我们的发现阐明了THY1+ NPSCs和FGF10分别在椎间盘再生和NPSCs激活中的关键作用，有助于开发IVDD的再生治疗策略。","tier":"1区","if":11.4},
{"pmid":"42735564","topic":"创面修复","title":"GSH-derived carbon dot-mediated interfacial electron transfer modulates pH-Dependent redox catalysis of Ce-MOF nanozymes for wound healing.","titleZh":"GSH 衍生碳点介导的界面电子转移调控 Ce-MOF 纳米酶的 pH 依赖性氧化还原催化以促进创面愈合","journal":"Redox biology","year":"2026","date":"2026-Nov","edat":"2026-09-14","authors":"Chen Y, Zeng K, Ye Y, Sun X, Yan L","doi":"10.1039/C8NR02278J","abstract":"Infected wounds require therapeutic materials that can control bacterial infection without aggravating oxidative tissue damage. Here, glutathione-derived carbon dots (GSH-CDs) were introduced during the formation of a cerium metal-organic framework (Ce MOF) through an in situ integration strategy to construct a carbon-dot-integrated Ce MOF nanozyme (Ce MOF-CD). Electronic-structure analyses supported interfacial electron redistribution from GSH-CDs toward Ce MOF, accompanied by changes in the local electronic environment and Ce3+/Ce4+ distribution of the Ce active centers. Ce MOF-CD exhibited a distinct pH-dependent redox catalytic preference, with oxidase-like catalysis favored under acidic conditions and superoxide dismutase-like activity becoming more pronounced near neutrality. Accordingly, Ce MOF-CD markedly reduced the viability of MRSA and E. coli and disrupted established biofilms under acidic conditions. Under near-neutral cellular conditions, it reduced intracellular oxidative stress, attenuated inflammatory activation, and promoted repair-associated macrophage polarization. In an MRSA-infected wound model, Ce MOF-CD reduced bacterial burden and local inflammation, promoted tissue reconstruction, and accelerated wound closure with favorable biosafety. Overall, GSH-CDs-mediated interfacial electronic regulation modulates the pH-dependent redox catalytic behavior of Ce MOF, enabling antibacterial activity to be coordinated with oxidative-stress regulation during infected wound healing.","abstractZh":"感染创面需要能够控制细菌感染而不加重氧化性组织损伤的治疗材料。在此，通过原位整合策略，在铈金属有机框架（Ce MOF）形成过程中引入谷胱甘肽衍生碳点（GSH-CDs），构建了碳点整合的 Ce MOF 纳米酶（Ce MOF-CD）。电子结构分析支持电子从 GSH-CDs 向 Ce MOF 发生界面再分布，同时伴随 Ce 活性中心局部电子环境和 Ce3+/Ce4+ 分布的变化。Ce MOF-CD 表现出明显的 pH 依赖性氧化还原催化偏好：酸性条件下以氧化酶样催化为主，接近中性时超氧化物歧化酶样活性更为显著。因此，在酸性条件下，Ce MOF-CD 显著降低 MRSA 和大肠杆菌的活力并破坏已形成的生物膜。在近中性的细胞条件下，它降低细胞内氧化应激、减弱炎症激活并促进修复相关巨噬细胞极化。在 MRSA 感染创面模型中，Ce MOF-CD 减少细菌负荷与局部炎症、促进组织重建并加速创面闭合，且生物安全性良好。总体而言，GSH-CDs 介导的界面电子调控调节了 Ce MOF 的 pH 依赖性氧化还原催化行为，使抗菌活性与氧化应激调控在感染创面愈合过程中得以协同。","tier":"1区","if":10.7},
{"pmid":"42858534","topic":"整形医学","title":"NEURL1-mediated K63-ubiquitination of SLC40A1 drives ferroptosis resistance in pathological scars: Therapeutic targeting via autophagy-activating microneedles.","titleZh":"NEURL1介导SLC40A1的K63泛素化驱动病理性瘢痕的铁死亡抵抗：通过自噬激活微针实现治疗性靶向","journal":"Redox biology","year":"2026","date":"2026-Nov","edat":"2026-10-10","authors":"Lv M, Liu J, Dong Q, Guo Z, Wu Q","doi":"10.1186/s12951-023-02037-4","abstract":"Ferroptosis resistance contributes to pathological skin scarring, but the underlying regulatory mechanisms remain unclear. Here, we identified a novel selective autophagy pathway NEURL1-SQSTM1/p62-SLC40A1 that controls fibroblast ferroptosis and scar formation. SLC40A1 is upregulated in human scars, conferring ferroptosis resistance by promoting iron efflux. Mechanistically, NEURL1 mediates K63-linked ubiquitination of SLC40A1, enabling its recognition by SQSTM1 for lysosomal degradation. A microneedle system co-delivering curcumin (autophagy activator) and siSLC40A1 effectively activates this axis, induces ferroptosis, and alleviates scarring in vivo. Our findings reveal a new therapeutic target and strategy for pathological scars.","abstractZh":"铁死亡抵抗促进病理性皮肤瘢痕形成，但其潜在调控机制仍不清楚。在本研究中，我们鉴定出一条新的选择性自噬通路 NEURL1-SQSTM1/p62-SLC40A1，该通路调控成纤维细胞铁死亡与瘢痕形成。SLC40A1 在人瘢痕组织中表达上调，通过促进铁外排而赋予细胞铁死亡抵抗。在机制上，NEURL1 介导 SLC40A1 的 K63 连接泛素化，使其能够被 SQSTM1 识别并进行溶酶体降解。一种共递送姜黄素（自噬激活剂）与 siSLC40A1 的微针系统可有效激活该通路轴、诱导铁死亡，并在体内减轻瘢痕形成。我们的研究为病理性瘢痕揭示了新的治疗靶点与治疗策略。","tier":"1区","if":10.7},
