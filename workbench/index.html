{"pmid":"42686982","topic":"创面修复","title":"Multi-stromal organoid co-culture modelling reveals epithelial-fibroblast heterogeneity in pancreatic cancer and pancreatitis.","titleZh":"多间质类器官共培养模型揭示胰腺癌与胰腺炎中的上皮-成纤维细胞异质性","journal":"Nature cell biology","year":"2026","date":"2026-Oct","edat":"2026-09-03","authors":"Li W, Jihad M, Lloyd EG, Zaccaria M, Mucciolo G","doi":"10.1093/bioinformatics/btad547","abstract":"Interactions between epithelial cells and fibroblasts influence disease progression and treatment response in pancreatic ductal adenocarcinoma (PDAC). While the diversity of fibroblasts in PDAC is increasingly recognized, it remains unclear how these cells differ from fibroblasts found in pancreatic inflammation. Chronic pancreatitis is a stroma-rich inflammatory disease and a risk factor for PDAC, making it a useful setting to study how epithelial cells and fibroblasts change during disease. Here we compare fibroblast diversity and epithelial-stromal interactions in pancreatitis and PDAC using human samples, mouse models and mouse pancreatitis-derived epithelial organoids. We also developed pancreatitis and PDAC organoid co-cultures containing pancreatic stellate cells, fibroblasts and mesothelial cells. Combining in vitro and in vivo models better reflected human disease than mouse models alone. Overall, our findings reveal distinct epithelial and fibroblast features in pancreatitis and PDAC and provide models to identify disease-specific markers and therapeutic vulnerabilities.","abstractZh":"上皮细胞与成纤维细胞之间的相互作用影响胰腺导管腺癌（PDAC）的疾病进展和治疗反应。尽管PDAC中成纤维细胞的多样性日益受到认识，但这些细胞与胰腺炎症中所见成纤维细胞有何差异仍不清楚。慢性胰腺炎是一种富含间质的炎症性疾病，也是PDAC的危险因素，使其成为研究疾病过程中上皮细胞和成纤维细胞如何变化的良好场景。在此，我们利用人类样本、小鼠模型和小鼠胰腺炎来源的上皮类器官，比较了胰腺炎和PDAC中的成纤维细胞多样性及上皮-间质相互作用。我们还开发了包含胰腺星状细胞、成纤维细胞和间皮细胞的胰腺炎和PDAC类器官共培养体系。结合体外和体内模型比仅用小鼠模型更好地反映了人类疾病。总体而言，我们的发现揭示了胰腺炎和PDAC中不同的上皮与成纤维细胞特征，并提供了用于鉴定疾病特异性标志物和治疗脆弱性的模型。","tier":"1区","if":17.3},
{"pmid":"40404894","topic":"外泌体","title":"Neutrophils secrete exosome-associated DNA to resolve sterile acute inflammation.","titleZh":"中性粒细胞分泌外泌体相关DNA以消退无菌性急性炎症","journal":"Nature cell biology","year":"2025","date":"2025-Jun","edat":"2025-05-22","authors":"Arya SB, Collie SP, Xu Y, Fernandez M, Sexton JZ","doi":"10.1007/978-1-0716-0154-9_3","abstract":"Acute inflammation, characterized by a rapid influx of neutrophils, is a protective response that can lead to chronic inflammatory diseases when left unresolved. We previously showed that secretion of LTB4-containing exosomes via nuclear envelope-derived multivesicular bodies is required for effective neutrophil infiltration during inflammation. Here we report that the co-secretion of these exosomes with nuclear DNA facilitates the resolution of the neutrophil infiltrate in a mouse skin model of sterile inflammation. Activated neutrophils exhibit rapid and repetitive DNA secretion as they migrate directionally using a mechanism distinct from suicidal neutrophil extracellular trap release and cell death. Packaging of DNA in the lumen of nuclear envelope-multivesicular bodies is mediated by lamin B receptor and chromatin decondensation. These findings advance our understanding of neutrophil functions during inflammation and the physiological relevance of DNA secretion.","abstractZh":"以中性粒细胞快速浸润为特征的急性炎症是一种保护性反应，若未能消退则可导致慢性炎症性疾病。我们此前表明，通过核膜来源的多囊体分泌含LTB4的外泌体是炎症过程中有效的中性粒细胞浸润所必需的。在此，我们报道在小鼠无菌性炎症皮肤模型中，这些外泌体与核DNA的共同分泌促进了中性粒细胞浸润的消退。活化的中性粒细胞在定向迁移时表现出快速且重复的DNA分泌，其机制不同于自杀性的中性粒细胞胞外诱捕网释放和细胞死亡。DNA在核膜-多囊体腔内被包装由核纤层蛋白B受体和染色质解聚介导。这些发现推进了我们对炎症过程中中性粒细胞功能以及DNA分泌生理意义的理解。","tier":"1区","if":17.3},
{"pmid":"41708829","topic":"细胞衰老","title":"Induction of senescence during postpartum mammary gland involution supports tissue remodeling and promotes postpartum tumorigenesis.","titleZh":"产后乳腺复旧过程中诱导的衰老支持组织重塑并促进产后肿瘤发生","journal":"Nature aging","year":"2026","date":"2026-Mar","edat":"2026-02-18","authors":"Chiche A, Djoual L, Charifou E, Wang S, Temime L","doi":"10.1073/pnas.0506580102","abstract":"Cellular senescence is an evolutionarily conserved stress response that contributes to tissue repair and tumor suppression, yet its accumulation is also linked to aging and disease. Whether physiological senescence can be exploited by oncogenic events to promote tumorigenesis is unknown. Postpartum mammary gland involution is a major adult tissue remodeling event, resembling wound healing, and is closely associated with postpartum breast cancer. Here, we show that during mammary gland involution in mice, a p16Ink4a-dependent senescence response is induced in alveolar luminal cells. Eliminating senescent cells disrupts tissue remodeling and delays involution, demonstrating their physiological importance. However, in a postpartum breast cancer model where oncogenic activation coincides with involution, removing involution-associated senescent cells extended tumor latency. Mechanistically, senescent cells enhance tumor cell plasticity via the senescence-associated secretory phenotype, fostering metastasis. Our findings reveal that senescence, while required for postpartum tissue remodeling, can be hijacked to facilitate tumorigenesis, defining senescence as a unifying mechanism linking tissue repair to tumorigenesis.","abstractZh":"细胞衰老是一种在进化上高度保守的应激反应，有助于组织修复和肿瘤抑制，但衰老细胞的蓄积同样与机体衰老和疾病发生相关。生理性衰老能否被致癌事件所利用、从而促进肿瘤发生，目前尚不清楚。产后乳腺复旧是成年期一项重大的组织重塑事件，其过程类似于创面愈合，并与产后乳腺癌密切相关。在此，我们表明在小鼠乳腺复旧过程中，腺泡腔面细胞被诱导产生一种依赖p16Ink4a的衰老应答。清除这些衰老细胞会破坏组织重塑并延迟复旧进程，证明其具有重要的生理学意义。然而，在致癌激活与复旧过程同时发生的产后乳腺癌模型中，清除复旧相关的衰老细胞反而延长了肿瘤潜伏期。机制上，衰老细胞通过衰老相关分泌表型增强肿瘤细胞的可塑性，从而促进转移。我们的发现揭示，衰老虽然是产后组织重塑所必需，却被劫持以促进肿瘤发生，从而将衰老界定为连接组织修复与肿瘤发生的统一机制。","tier":"1区","if":17.0},
{"pmid":"41611832","topic":"细胞衰老","title":"Comparative analysis of senolytic drugs reveals mitochondrial determinants of efficacy and resistance.","titleZh":"衰老细胞清除药物的比较分析揭示疗效与耐药性的线粒体决定因素","journal":"Nature aging","year":"2026","date":"2026-Feb","edat":"2026-01-29","authors":"Wakita M, Ito K, Fujii K, Sakamoto D, Mikawa T","doi":"10.1038/s41556-023-01145-5","abstract":"Cellular senescence contributes to aging and disease, and senolytic drugs that selectively eliminate senescent cells hold therapeutic promise. Although over 20 candidates have been reported, their relative efficacies remain unclear. Here we systematically compared 21 senolytic agents using a senolytic specificity index, identifying the Bcl-2 inhibitor ABT263 and the BET inhibitor ARV825 as most effective senolytics across fibroblast and epithelial senescence models. However, even upon extended treatment with these most potent senolytics, a proportion of senescent cells remained viable. We found that senolytic resistance was driven by maintenance of mitochondrial integrity through V-ATPase-mediated clearance of damaged mitochondria. Imposing mitochondrial stress via metabolic workload enhanced the senolytic efficacies of ABT263 and ARV825 in vitro, and in mouse models, ketogenic diet adoption or SGLT2 inhibition similarly potentiated ABT263-induced and ARV825-induced senolysis, reducing metastasis and tumor growth. These findings suggest that mitochondrial quality control is a key determinant of resistance to ABT263-induced and ARV825-induced senolysis, providing a possible framework for rational combination senotherapies.","abstractZh":"细胞衰老参与衰老与疾病的发生，选择性清除衰老细胞的衰老细胞清除药物具有治疗前景。尽管已报道20余种候选药物，但其相对疗效仍不清楚。本研究采用衰老细胞清除特异性指数系统比较了21种衰老细胞清除剂，发现Bcl-2抑制剂ABT263和BET抑制剂ARV825在成纤维细胞和上皮细胞衰老模型中是最有效的衰老细胞清除剂。然而，即使延长使用这些最强效的衰老细胞清除剂处理，仍有一部分衰老细胞存活。我们发现，衰老细胞清除耐药性由V-ATP酶介导的受损线粒体清除所维持的线粒体完整性驱动。通过代谢负荷施加线粒体应激可在体外增强ABT263和ARV825的衰老细胞清除效力；在小鼠模型中，采用生酮饮食或抑制SGLT2同样增强了ABT263诱导和ARV825诱导的衰老细胞清除，并减少转移和肿瘤生长。这些发现提示，线粒体质量控制是ABT263诱导和ARV825诱导衰老细胞清除耐药性的关键决定因素，为合理的联合衰老治疗提供了可能的框架。","tier":"1区","if":17.0},
{"pmid":"42875585","topic":"创面修复","title":"Transcriptomic reprogramming screen identifies SRSF1 as a regulator of aging.","titleZh":"转录组重编程筛选鉴定SRSF1为衰老调控因子","journal":"Nature aging","year":"2026","date":"2026-Oct","edat":"2026-10-14","authors":"Plesa AM, Jung S, Wang HH, Omar F, Shadpour M","doi":"10.7554/eLife.75244","abstract":"Aging is characterized by progressive functional decline accompanied by distinct transcriptomic and epigenetic alterations. Although partial reprogramming via Yamanaka factors can reverse these signatures and improve cell function, toxicity and efficacy concerns limit their in vivo application, necessitating alternative geroprotective interventions. Here we develop an interpretable transcriptomic age predictor in human fibroblasts and perform a cDNA overexpression screen to identify factors that reprogram aged transcriptomes toward youthful states. This screen identifies the RNA-processing and splicing factor SRSF1 as a regulator of cellular aging that produces robust youthful transcriptional signatures without loss of cellular identity. In vitro, SRSF1 induction restores youthful phenotypes by reducing senescence, proteostatic stress and inflammatory signaling. In aged mice, inducible SRSF1 expression reduces frailty progression by 44% and is associated with a 14% extension of median lifespan (n = 9-10 per group). Our findings establish SRSF1 as a conserved regulator of aging and a promising geroprotective target.","abstractZh":"衰老的特征是进行性功能衰退，并伴随独特的转录组和表观遗传改变。尽管通过Yamanaka因子进行的部分重编程可逆转这些特征并改善细胞功能，但毒性和疗效方面的顾虑限制了其在体内的应用，因而需要替代性的抗衰老干预措施。在此，我们在人成纤维细胞中开发了一种可解释的转录组年龄预测器，并进行了cDNA过表达筛选，以鉴定可将衰老转录组重编程至年轻状态的因子。该筛选鉴定出RNA加工与剪接因子SRSF1为细胞衰老的调控因子，其可产生显著的年轻化转录特征而不丧失细胞身份。在体外，诱导SRSF1可通过减少衰老、蛋白质稳态应激和炎症信号恢复年轻表型。在老年小鼠中，可诱导的SRSF1表达使衰弱进展减少44%，并与中位寿命延长14%相关（每组n = 9-10）。我们的发现确立了SRSF1作为保守的衰老调控因子和有前景的抗衰老靶点。","tier":"1区","if":17.0},
{"pmid":"42917201","topic":"糖尿病难愈创面","title":"Nanofibrous Poly(amino acid ester) Dressing for Promoting Diabetic Wound Healing via Spatiotemporal Coordination of Immunomodulation and Tissue Regeneration.","titleZh":"纳米纤维聚(氨基酸酯)敷料通过免疫调节与组织再生的时空协同促进糖尿病创面愈合","journal":"ACS nano","year":"2026","date":"2026-Oct-13","edat":"2026-10-23","authors":"Ma L, Feng Y, Li K, Du Y, Zhou H","doi":"10.1021/acsnano.6c07848","abstract":"Effective healing of diabetic wounds requires spatiotemporal coordination of immunoregulation and tissue regeneration, which is often overlooked in conventional treatments. Here, we developed an extracellular matrix-mimicking dressing, termed ANM, that modulates arginine utilization within the diabetic wound microenvironment to re-establish the spatiotemporal coordination of healing. ANM was in situ fabricated by hand-held electrospinning using a rationally designed arginine- and norvaline-based poly(ester amide), yielding a conformable and breathable nanofibrous dressing. Its porous and hydrolyzable structure enabled moisture- and enzyme-responsive degradation, allowing sustained release of arginine- and norvaline-containing degradants. These bioactive degradants cooperatively modulated macrophage phenotypic transitions, initially promoting a timely proinflammatory response, followed by a spontaneous shift toward a pro-reparative state, thereby restoring the temporally sequenced inflammatory program in diabetic wounds. Meanwhile, ANM locally upregulated inducible nitric oxide synthase (iNOS) and arginase-1 in the peri-wound epidermis, spatially promoting the proliferation and differentiation of epidermal keratinocytes and accelerating re-epithelialization. In contrast to commercial dressings that failed to support healing and even led to progressive deterioration over 21 days, ANM significantly promoted collagen deposition and angiogenesis and accelerated wound closure in db/db mice by 14 days. This work offers a promising strategy for treating chronic nonhealing wounds through spatiotemporal metabolic modulation.","abstractZh":"糖尿病创面的有效愈合需要免疫调节与组织再生的时空协同，而这一点在传统治疗中常被忽视。在此，我们开发了一种模拟细胞外基质的敷料，命名为 ANM，其通过调控糖尿病创面微环境中的精氨酸利用，重建愈合过程的时空协同。ANM 采用手持式静电纺丝原位制备，原料为理性设计的精氨酸-正缬氨酸基聚(酯酰胺)，所得敷料贴合、透气，呈纳米纤维结构。其多孔且可水解的结构使其能够对湿度和酶作出响应性降解，从而持续释放含精氨酸和正缬氨酸的降解产物。这些生物活性降解产物协同调控巨噬细胞表型转换，先促进及时的促炎反应，随后自发转向促修复状态，从而恢复糖尿病创面中按时间序列进行的炎症程序。同时，ANM 在创周表皮局部上调诱导型一氧化氮合酶(iNOS)和精氨酸酶-1，在空间上促进表皮角质形成细胞的增殖与分化，加速再上皮化。与未能支持愈合、甚至在 21 天内导致创面进行性恶化的商品化敷料相比，ANM 显著促进胶原沉积与血管生成，并使 db/db 小鼠创面在 14 天内加速闭合。本工作为通过时空代谢调控治疗慢性难愈合创面提供了一种有前景的策略。","tier":"1区","if":15.8},
{"pmid":"42915654","topic":"糖尿病难愈创面","title":"Sunlight-Triggered Bacterial Membrane-Targeting Aggregation-Induced Emission \"Nanoantibiotic\" Hydrogel for Ultrafast Multidrug-Resistant Bacteria Eradication and Diabetic Wound Healing.","titleZh":"阳光触发、靶向细菌膜的聚集诱导发光「纳米抗生素」水凝胶用于超快速清除多重耐药菌及糖尿病创面愈合","journal":"ACS nano","year":"2026","date":"2026-Oct-06","edat":"2026-10-23","authors":"Xie D, Yan X, Cui C, Zhu J, Cheng D","doi":"10.1021/acsnano.6c10049","abstract":"Drug-resistant bacterial infections and persistent biofilm formation pose critical bottlenecks for diabetic wound management. To overcome these challenges, a sunlight (SL)-triggered aggregation-induced emission (AIE) photosensitizer, designated as MTP, was engineered and incorporated into an injectable thermosensitive hydrogel. Featuring a donor-acceptor architecture, MTP exhibits NIR fluorescence emission, while its visible light absorption enables sunlight-triggered dual-type photodynamic activity. Crucially, MTP achieves ultrafast bacterial cell membrane anchoring within 15 seconds, delivering exceptional bactericidal efficacy under natural solar power light. At a concentration of 30 nM, it eradicates Gram-positive pathogens and profoundly dismantles mature, multidrug-resistant biofilms. Transcriptomic and biochemical analyses revealed that the photodynamically generated reactive oxygen species (ROS) burst triggers a lethal damage cascade. This process induces severe membrane lipid peroxidation, transmembrane transport dysfunction, and complete collapse of intracellular proteostasis. During in vivo evaluations, the highly biocompatible composite hydrogel dramatically accelerated tissue regeneration in a methicillin-resistant Staphylococcus aureus (MRSA)-infected diabetic mouse model. Sunlight activation contracted the wound area to 35.5% by day 6 compared to 87.4% for the untreated control, achieving therapeutic efficacy on par with that of clinical vancomycin while favorably modulating the local inflammatory microenvironment. Ultimately, this nonantibiotic platform offers a highly effective and mechanism-clarified strategy for combating refractory wound infections with excellent biocompatibility.","abstractZh":"耐药菌感染和持续性生物膜形成是糖尿病创面管理的关键瓶颈。为克服这些挑战，我们设计了一种阳光(SL)触发的聚集诱导发光(AIE)光敏剂，命名为 MTP，并将其负载于可注射温敏水凝胶中。MTP 具有供体-受体结构，可发射近红外荧光，同时其可见光吸收能力使其具备阳光触发的双重类型光动力活性。关键在于，MTP 可在 15 秒内超快速锚定细菌细胞膜，在自然太阳光功率下即可发挥优异的杀菌效力。在 30 nM 浓度下，其可清除革兰阳性病原菌，并深度瓦解成熟的多重耐药生物膜。转录组学和生化分析显示，光动力产生的活性氧(ROS)爆发触发了致死性损伤级联反应。该过程诱导严重的膜脂质过氧化、跨膜转运功能障碍以及细胞内蛋白质稳态的彻底崩溃。在体内评价中，这种生物相容性良好的复合水凝胶在耐甲氧西林金黄色葡萄球菌(MRSA)感染的糖尿病小鼠模型中显著加速组织再生。阳光激活使第 6 天创面面积缩小至 35.5%，而未处理对照组为 87.4%，其疗效与临床万古霉素相当，同时可良性调节局部炎症微环境。最终，这一非抗生素平台为对抗难治性创面感染提供了一种高效、机制明确且生物相容性优良的策略。","tier":"1区","if":15.8},
{"pmid":"42814804","topic":"创面修复","title":"A single-dose topical therapy cures scabies in a human-relevant porcine model.","titleZh":"单剂局部治疗在人源相关猪模型中治愈疥疮","journal":"Science translational medicine","year":"2026","date":"2026-Sep-30","edat":"2026-09-30","authors":"Fernando DD, Taylor S, Samarawickrama GR, Nammunige NA, Hartel G","doi":"10.1126/scitranslmed.aeg5917","abstract":"Scabies affects ∼400 million people annually, yet current therapies lack ovicidal activity, require repeat dosing, and are increasingly compromised by treatment failure and resistance. The absence of a single-application therapy capable of eliminating both motile mites and eggs represents one important limitation to effective disease control. We developed a mechanism-informed topical therapy combining abametapir, a metalloprotease inhibitor with ovicidal activity, and flavesone, a β-triketone with rapid miticidal effects, designed to target multiple parasite life stages through distinct, non-neurotoxic mechanisms. Using a porcine model that closely recapitulates human scabies, we assessed efficacy, pruritus reduction, and pharmacologic exposure after topical administration. In severe scabies, a single 4-hour treatment eradicated all live mites and eggs and reduced pruritus, outperforming a standard two-dose oral ivermectin regimen. Skin pharmacokinetics demonstrated rapid attainment of concentrations with exposure profiles, supporting single-dose efficacy despite shorter systemic half-lives than ivermectin. Together, this promising therapeutic combination may offer a simplified and potentially resistance-resilient approach to scabies management.","abstractZh":"疥疮每年影响约4亿人，然而现有疗法缺乏杀卵活性、需要重复给药，并且日益受到治疗失败和耐药的削弱。缺乏能够同时清除活动期螨虫和虫卵的单次给药疗法，是有效控制该病的一项重要限制。我们开发了一种基于机制的局部疗法，将具有杀卵活性的金属蛋白酶抑制剂abametapir与具有快速杀螨作用的β-三酮类化合物flavesone联合，旨在通过不同的非神经毒性机制靶向寄生虫的多个生活史阶段。我们使用高度重现人类疥疮的猪模型，评估了局部给药后的疗效、瘙痒减轻情况及药物暴露。在重度疥疮中，单次4小时治疗即清除了所有活螨和虫卵并减轻了瘙痒，优于标准的双剂口服伊维菌素方案。皮肤药代动力学显示其可迅速达到相应浓度并具有相应的暴露特征，尽管其全身半衰期短于伊维菌素，仍支持单次给药的疗效。总之，这一有前景的治疗组合可能为疥疮管理提供一种简化且具有潜在抗耐药性的方法。","tier":"1区","if":15.8},
{"pmid":"42384772","topic":"创面修复","title":"Hypoxia-driven T cell-macrophage-stromal cross-talk sustains fibrosis in preclinical models of cutaneous chronic graft-versus-host disease.","titleZh":"缺氧驱动的 T 细胞-巨噬细胞-基质细胞交互作用维持皮肤慢性移植物抗宿主病临床前模型中的纤维化","journal":"Science translational medicine","year":"2026","date":"2026-Jul","edat":"2026-07-01","authors":"Song Q, Xu Y, Wang X, Wang W, Feng Y","doi":"10.1126/scitranslmed.adx7264","abstract":"Chronic graft-versus-host disease (cGVHD) is a major complication of allogeneic hematopoietic stem cell transplantation, with cutaneous fibrosis representing a debilitating and treatment-resistant manifestation. We identified a hypoxia-driven inflammatory and fibrotic program in cGVHD skin mediated by a hypoxia-inducible factor 1α-phosphatidylinositol 3-kinase-interleukin-13 (HIF-1α-PI3Kδ-IL-13) signaling axis. Spatial transcriptomics, single-cell RNA sequencing, and multiplex immunofluorescence revealed stabilization of HIF-1α in epidermal cells in hypoxic regions. HIF-1α stabilization was accompanied by IL-13 production from PI3Kδ-activated T cells and macrophage-epidermal cross-talk, which together promoted fibrosis and the formation of tertiary lymphoid structure (TLS)-like aggregates. In human epidermal cell lines and induced pluripotent stem cell-derived skin organoids, IL-13 directly induced HIF-1α expression in keratinocytes under normoxic conditions. HIF-1α expression was further amplified in hypoxic conditions, driving profibrotic signaling. Pharmacologic inhibition of HIF-1α, PI3Kδ, or IL-13 reduced tissue hypoxia, disrupted TLS-like aggregates, and ameliorated disease in murine cGVHD models. These findings identify a targetable circuit linking hypoxia, type 2 inflammation, and immune-stromal dysfunction in cGVHD and provide a translational framework for treating fibrotic cGVHD and related immune-mediated fibrosing diseases.","abstractZh":"慢性移植物抗宿主病（cGVHD）是异基因造血干细胞移植的主要并发症，其中皮肤纤维化是一种致残且难以治疗的临床表现。我们在 cGVHD 皮肤中鉴定出一个由缺氧诱导因子 1α-磷脂酰肌醇 3-激酶-白细胞介素-13（HIF-1α-PI3Kδ-IL-13）信号轴介导的缺氧驱动性炎症与纤维化程序。空间转录组学、单细胞 RNA 测序和多重免疫荧光显示，在缺氧区域表皮细胞中 HIF-1α 发生稳定化。HIF-1α 稳定化伴随 PI3Kδ 激活的 T 细胞产生 IL-13 以及巨噬细胞-表皮细胞交互作用，二者共同促进纤维化和三级淋巴结构（TLS）样聚集体的形成。在人表皮细胞系和诱导多能干细胞衍生的皮肤类器官中，IL-13 在常氧条件下直接诱导角质形成细胞表达 HIF-1α。在缺氧条件下 HIF-1α 表达进一步放大，驱动促纤维化信号。药物抑制 HIF-1α、PI3Kδ 或 IL-13 可减轻组织缺氧、破坏 TLS 样聚集体并改善小鼠 cGVHD 模型的疾病状态。这些发现鉴定出一个在 cGVHD 中连接缺氧、2 型炎症和免疫-基质功能障碍的可靶向环路，并为治疗纤维化性 cGVHD 及相关免疫介导的纤维化疾病提供了转化框架。","tier":"1区","if":15.8},
{"pmid":"41442502","topic":"糖尿病难愈创面","title":"HDAC5 deacetylates cytosolic ACTN4 during skin reepithelialization and represents a therapeutic target for chronic wound healing.","titleZh":"HDAC5 在皮肤再上皮化过程中使胞质 ACTN4 去乙酰化，是慢性创面愈合的治疗靶点","journal":"Science translational medicine","year":"2025","date":"2025-Dec-24","edat":"2025-12-24","authors":"Zhang Y, Wen D, Ho C, Liu Y, Wang X","doi":"10.1126/scitranslmed.ads0594","abstract":"Skin repair after injury is a complex multistage process. Reepithelialization is a vital component of skin wound healing and involves intricate molecular regulations that are still not fully understood. Here, using a combination of human tissue and animal models, we identified histone deacetylase 5 (HDAC5) as a key mediator of reepithelialization through a mechanism involving nucleocytoplasmic shuttling to regulate deacetylation of a nonhistone protein. We conducted functional validation through a conditional gene knockout mouse model. In addition, parallel studies using ex vivo human skin confirmed that HDAC5 cytoplasmic localization is necessary for efficient wound closure. Liquid chromatography-mass spectrometry of mouse wounds revealed that cytoplasmic HDAC5 interacts with alpha-actinin-4 (ACTN4). Site-directed mutagenesis, immunofluorescence, and luciferase assays demonstrated that HDAC5 deacetylates ACTN4 at the K417 site, allowing nuclear translocation of ACTN4 and subsequent modulation of transcriptional activity of Y-box-binding protein 1 (YBX1). Single-cell transcriptome analysis of mouse wounds revealed cystatin A as a key factor downstream of the HDAC5/ACTN4/YBX1 axis that enhanced reepithelialization and wound healing. We further identified an HDAC5-selective activator, G194-0712, and showed that it improved wound healing in three mouse models of chronic wounds: diabetic wounds, ischemic wounds, and radiation injury. Together, these results highlight a previously unappreciated mechanism involved in skin repair and suggest that HDAC5 activation may hold promise for the treatment of nonhealing skin wounds.","abstractZh":"损伤后的皮肤修复是一个复杂的多阶段过程。再上皮化是皮肤创面愈合的重要组成部分，涉及复杂且尚未完全阐明的分子调控。在此，我们结合人体组织和动物模型，鉴定出组蛋白去乙酰化酶 5（HDAC5）通过涉及核质穿梭以调节非组蛋白去乙酰化的机制，作为再上皮化的关键介质。我们通过条件性基因敲除小鼠模型进行了功能验证。此外，使用离体人皮肤的平行研究证实，HDAC5 的胞质定位对于有效创面闭合是必要的。小鼠创面的液相色谱-质谱分析显示，胞质 HDAC5 与 α-辅肌动蛋白-4（ACTN4）相互作用。定点突变、免疫荧光和荧光素酶实验表明，HDAC5 使 ACTN4 在 K417 位点去乙酰化，使 ACTN4 得以核转位，并随后调节 Y 盒结合蛋白 1（YBX1）的转录活性。小鼠创面的单细胞转录组分析显示，胱抑素 A 是 HDAC5/ACTN4/YBX1 轴下游增强再上皮化和创面愈合的关键因子。我们进一步鉴定出一种 HDAC5 选择性激活剂 G194-0712，并显示它在三种小鼠慢性创面模型（糖尿病创面、缺血性创面和放射损伤）中改善创面愈合。综上，这些结果突显了一种此前未被重视的皮肤修复机制，并提示激活 HDAC5 可能有望用于治疗难愈性皮肤创面。","tier":"1区","if":15.8},
{"pmid":"40267213","topic":"糖尿病难愈创面","title":"A microfluidic wearable device for wound exudate management and analysis in human chronic wounds.","titleZh":"用于人类慢性创面渗出液管理与分析的微流控可穿戴设备","journal":"Science translational medicine","year":"2025","date":"2025-Apr-23","edat":"2025-04-23","authors":"Wang C, Fan K, Shirzaei Sani E, Lasalde-Ramírez JA, Heng W","doi":"10.1038/s41551-023-01059-5","abstract":"Chronic wounds are a major global health challenge associated with substantial economic burden and a negative impact on patient quality of life. Real-time analysis of biomarkers like reactive oxygen and nitrogen species could guide treatment, but existing systems lack the capacity required for continuous monitoring. Wound exudate is secreted slowly and has a complex composition, making efficient fluid collection and real-time analysis challenging. To address these issues, we introduce iCares, a wearable device for wound exudate management and continuous in situ analysis of wound biomarkers. iCares contains a flexible nanoengineered sensor array that measures reactive species such as NO, H2O2, and O2, along with pH and temperature, providing multiparameter data to inform wound status. The device features pump-free triad microfluidic modules with a superhydrophobic-superhydrophilic Janus membrane, bioinspired wedge channels, and three-dimensional graded micropillars for efficient unidirectional exudate collection, transport, and refreshing. The sensors demonstrated a consistent response and analyte selectivity in vitro and in wound exudate. iCares was designed for rapid scalable manufacturing through advanced printing and laser patterning. Wireless connectivity supported long-term continuous monitoring in wounds. The iCares system real-time monitoring was tested in a murine model of diabetic skin wound during infection and antimicrobial treatment. Clinical wound evaluation was conducted in 20 patients with chronic wounds and in two patients before and after surgery. A machine learning analysis of the multiplexed data successfully classified wounds and healing times, indicating that wound exudate analysis by iCares could offer insight into chronic wound status to aid in treatment decisions.","abstractZh":"慢性创面是全球重大健康挑战，带来巨大经济负担并对患者生活质量产生负面影响。对活性氧和活性氮等生物标志物进行实时分析可指导治疗，但现有系统缺乏连续监测所需的能力。创面渗出液分泌缓慢且成分复杂，使高效液体收集和实时分析具有挑战性。为解决这些问题，我们推出iCares，一种用于创面渗出液管理和创面生物标志物连续原位分析的可穿戴设备。iCares包含柔性纳米工程传感器阵列，可测量NO、H2O2和O2等活性物质以及pH和温度，提供多参数数据以反映创面状态。该设备采用无泵三元微流控模块，配备超疏水-超亲水Janus膜、仿生楔形通道和三维梯度微柱，实现高效单向渗出液收集、输送和更新。传感器在体外和创面渗出液中均表现出稳定的响应和分析物选择性。iCares通过先进打印和激光图案化技术设计，可实现快速规模化制造。无线连接支持创面长期连续监测。iCares系统的实时监测在感染和抗菌治疗期间的糖尿病皮肤创面小鼠模型中进行了测试。在20例慢性创面患者以及2例手术前后患者中进行了临床创面评估。对多重数据的机器学习分析成功对创面和愈合时间进行了分类，表明iCares的创面渗出液分析可为慢性创面状态提供见解，辅助治疗决策。","tier":"1区","if":15.8},
{"pmid":"42371657","topic":"细胞衰老","title":"TXNIP Is Positioned as a Key Mediator of Hyperglycemia-Induced Vascular Senescence.","titleZh":"TXNIP被定位为高糖诱导血管衰老的关键介导因子","journal":"Diabetes","year":"2026","date":"2026-Sep-01","edat":"2026-06-29","authors":"Qian X, Chen X, Chai Y, Niu Y, Ning X","doi":"10.2337/db25-1093","abstract":"UNLABELLED: Thioredoxin-interacting protein (TXNIP) is regarded as a potential therapeutic target in type 2 diabetes. Hyperglycemia can upregulate the expression of TXNIP in various cell types, thereby inducing oxidative stress. However, the regulatory mechanisms by which this protein modulates vascular function in the aorta remain incompletely elucidated. This study aimed to investigate the response of TXNIP to high glucose in vascular smooth muscle cells (VSMCs) and elucidate the underlying molecular mechanisms. We demonstrated that the carbohydrate-responsive element-binding protein (ChREBP) acts as an upstream transcriptional activator of TXNIP and TXNIP induces cellular senescence by suppressing AKT phosphorylation. Concurrently, senescence leads to activation of p53 and increased expression of the ERBB receptor feedback inhibitor 1 (also known as Mig6), with the upregulated Mig6 in turn resulting in negative feedback inhibition of the activity of the epidermal growth factor receptor, thereby further promoting the development of atherosclerosis. Our findings identify the ChREBP/TXNIP/AKT axis as a novel pathway driving VSMC senescence in a hyperglycemic environment and establish its critical role in promoting atherosclerotic progression. This highlights its potential as a therapeutic target in diabetic macrovascular complications. ARTICLE HIGHLIGHTS: This study identifies the carbohydrate-responsive element-binding protein as the direct transcriptional activator of TXNIP in vascular smooth muscle cells under conditions of hyperglycemia. Aorta-specific TXNIP knockdown demonstrates therapeutic potential by alleviating arterial stiffness and attenuating atherosclerotic plaque in diabetic mice. Pharmacologic inhibition of TXNIP or activation of AKT ameliorates the senescent phenotype, highlighting a druggable pathway in diabetic vasculopathy.","abstractZh":"未标注：硫氧还蛋白相互作用蛋白（TXNIP）被视为2型糖尿病的一个潜在治疗靶点。高血糖可上调多种细胞类型中TXNIP的表达，从而诱导氧化应激。然而，该蛋白调控主动脉血管功能的调节机制尚未完全阐明。本研究旨在探讨血管平滑肌细胞（VSMCs）中TXNIP对高糖的应答，并阐明其潜在的分子机制。我们证明，碳水化合物反应元件结合蛋白（ChREBP）是TXNIP的上游转录激活因子，而TXNIP通过抑制AKT磷酸化来诱导细胞衰老。与此同时，衰老导致p53激活以及ERBB受体反馈抑制因子1（又称Mig6）表达增加，而上调的Mig6又对表皮生长因子受体的活性产生负反馈抑制，从而进一步促进动脉粥样硬化的发展。我们的发现确认ChREBP/TXNIP/AKT轴是驱动高血糖环境下VSMC衰老的一条新通路，并确立了其在促进动脉粥样硬化进展中的关键作用。这凸显了其作为糖尿病大血管并发症治疗靶点的潜力。文章亮点：本研究确认，在高血糖条件下，碳水化合物反应元件结合蛋白是血管平滑肌细胞中TXNIP的直接转录激活因子。主动脉特异性敲低TXNIP可通过减轻糖尿病小鼠的动脉僵硬度并减小动脉粥样硬化斑块而显示出治疗潜力。药物性抑制TXNIP或激活AKT可改善衰老表型，提示糖尿病血管病变中存在一条可成药的途径。","tier":"1区","if":14.8},
{"pmid":"41760650","topic":"糖尿病难愈创面","title":"Hybrid macrophage-mitochondria extracellular vesicles for mitochondrial ROS regulation in diabetic wounds.","titleZh":"巨噬细胞-线粒体杂合细胞外囊泡用于糖尿病创面的线粒体ROS调控","journal":"Nature communications","year":"2026","date":"2026-Feb-28","edat":"2026-02-27","authors":"Fan L, Zhang C, Xu Z, Li Z, Zhang B","doi":"10.1080/20013078.2020.1757209","abstract":"Precise regulation of mitochondrial reactive oxygen species (mtROS) in macrophages is essential for reducing inflammation and promoting diabetic wound healing. However, achieving targeted and responsive mtROS modulation in specific cell remains challenging. Herein, we report a macrophage-mitochondria hybrid membrane derived artificial extracellular vesicle platform (C@AH-EV). C@AH-EV integrates biomimetic dual-targeting membranes with an mtROS activatable prodrug. It leverages membrane protein-mediated targeting of macrophage mitochondria to offer highly selective intracellular delivery. The payload is a ROS sensitive antioxidant prodrug, which incorporates lipid tails that enhance its drug loading efficiency in vesicles. Upon mtROS-triggered cleavage of the boronate ester bond, potent antioxidants were locally released within the mitochondria to restore redox balance. In vitro and in vivo studies demonstrate that C@AH-EVs effectively reprogram macrophages from an inflammatory toward an anti-inflammatory phenotype, thereby attenuating inflammation and accelerating diabetic wound repair. This work offers a promising direction for treating chronic inflammatory conditions.","abstractZh":"精确调控巨噬细胞中的线粒体活性氧（mtROS）对于减轻炎症和促进糖尿病创面愈合至关重要。然而，在特定细胞中实现靶向且响应性的mtROS调控仍具挑战性。在此，我们报道了一种源自巨噬细胞-线粒体杂合膜的人工细胞外囊泡平台（C@AH-EV）。C@AH-EV将仿生双靶向膜与mtROS可激活的前药整合在一起。它利用膜蛋白介导的巨噬细胞线粒体靶向，实现高度选择性的胞内递送。其载荷是一种ROS敏感的抗氧化前药，该前药引入脂质尾部以增强其在囊泡中的载药效率。在mtROS触发硼酸酯键断裂后，强效抗氧化剂在线粒体内局部释放，以恢复氧化还原平衡。体外和体内研究表明，C@AH-EVs可有效将巨噬细胞从促炎表型重编程为抗炎表型，从而减轻炎症并加速糖尿病创面修复。本工作为治疗慢性炎症性疾病提供了一个有前景的方向。","tier":"1区","if":14.7},
{"pmid":"41559078","topic":"外泌体","title":"Bionic Janus hydrogel drives infected Achilles tendon regeneration via mechano-immune spatiotemporal steering.","titleZh":"仿生Janus水凝胶通过机械-免疫时空调控驱动感染性跟腱再生","journal":"Nature communications","year":"2026","date":"2026-Jan-20","edat":"2026-01-20","authors":"Li J, Wang Z, Yang W, Zhang Y, Wang Y","doi":"10.1038/s41467-026-68514-0","abstract":"The healing of infected tendons is hindered by mechanical dysfunction, tissue adhesion, bacterial colonization, and immune imbalance. Inspired by the biphasic \"adhesion-lubrication\" structure of tendon sheaths, we developed a Janus hydrogel, named HAPP@H-EXO, for spatiotemporal repair. The material exhibits antifatigue properties and redistributes mechanical stress through a dynamic network formed by norbornylated PVA and boronic acid-modified hyaluronic acid-PVA. Its high-adhesion side integrates tissue via borate and hydrogen bonds, whereas the lotus leaf-induced low-adhesion side prevents postsurgical adhesion. The incorporation of oligo-polyethyleneimine and phenylboronic acid groups traps and kills bacteria, overcoming resistance. The pH-responsive release of hypoxic tendon stem cell exosomes reprogrammes macrophages via inhibition of the NF-κB pathway, reducing inflammation and promoting regeneration. In an infected Achilles tendon model, HAPP@H-EXO eliminated MRSA, suppressed early inflammation, and enhanced regeneration. Within 8 weeks, it significantly improved biomechanical strength, prevented adhesion, and restored motor function, establishing a mechanoimmunotherapeutic strategy for infected tissue regeneration.","abstractZh":"感染性肌腱的愈合受到机械功能障碍、组织粘连、细菌定植和免疫失衡的阻碍。受腱鞘双相「黏附-润滑」结构的启发，我们开发了一种名为HAPP@H-EXO的Janus水凝胶，用于时空修复。该材料具有抗疲劳性能，并通过由降冰片烯基化PVA与硼酸修饰的透明质酸-PVA形成的动态网络重新分配机械应力。其高黏附侧通过硼酸酯键和氢键整合组织，而荷叶诱导的低黏附侧则防止术后粘连。引入寡聚乙烯亚胺和苯硼酸基团可捕获并杀灭细菌，克服耐药性。低氧肌腱干细胞外泌体的pH响应性释放通过抑制NF-κB通路重编程巨噬细胞，减轻炎症并促进再生。在感染性跟腱模型中，HAPP@H-EXO清除了MRSA、抑制了早期炎症并增强了再生。在8周内，它显著改善了生物力学强度、防止粘连并恢复运动功能，为感染组织再生建立了一种机械免疫治疗策略。","tier":"1区","if":14.7},
{"pmid":"42897161","topic":"糖尿病难愈创面","title":"Genome-directed discovery of an octalin-containing polyether ionophore improves diabetic skin wound healing.","titleZh":"基因组导向发现含八氢萘环的聚醚离子载体可改善糖尿病皮肤创面愈合","journal":"Nature communications","year":"2026","date":"2026-Sep-09","edat":"2026-10-19","authors":"Fang C, Liu Z, Bai L, Ma L, Xiong W","doi":"10.1158/0008-5472.CAN-20-1590","abstract":"Chronic hard-to-heal skin wounds in diabetes mellitus pose a significant clinical challenge, underscoring the urgent need for additional therapeutics. Herein, we report the identification of a polyether biosynthetic gene cluster (pdm BGC) from the marine-derived Streptomyces marincola SCSIO 03032 through genome mining. By overexpressing the positive regulator gene pdmRI, we increase the product of the pdm BGC 48-fold to enable the isolation, structural determination, and biosynthesis investigation of an octalin-containing polyether ionophore polydecalinmycin (PDM). Functionally, PDM demonstrates remarkable efficacy in promoting acute skin wound healing in BALB/c mice and significantly accelerating chronic wound closure in a diabetic mouse (db/db, male) model. Mechanistically, PDM induces an elevation of mitochondrial Na+ levels to trigger a transient burst of reactive oxygen species, a critical signal for initiating acute wound closure. Upon prolonged exposure, PDM activates a robust Nrf2-mediated antioxidant response, restoring mitochondrial homeostasis and conferring cytoprotection against high-glucose-induced oxidative stress. These insights highlight the therapeutic potential of PDM as a natural polyether candidate for developing ionophore-based strategies for diabetic wound healing.","abstractZh":"糖尿病中的慢性难愈性皮肤创面构成重大临床挑战，凸显了对更多治疗手段的迫切需求。在此，我们报告通过基因组挖掘从海洋来源的 Streptomyces marincola SCSIO 03032 中鉴定出一个聚醚生物合成基因簇（pdm BGC）。通过过表达正调控基因 pdmRI，我们将 pdm BGC 的产物提高了 48 倍，从而实现了对含八氢萘环的聚醚离子载体 polydecalinmycin（PDM）的分离、结构解析和生物合成研究。在功能上，PDM 在促进 BALB/c 小鼠急性皮肤创面愈合方面表现出显著疗效，并在糖尿病小鼠（db/db，雄性）模型中显著加速慢性创面闭合。机制上，PDM 诱导线粒体 Na+ 水平升高，触发活性氧的短暂爆发，这是启动急性创面闭合的关键信号。在长时间暴露后，PDM 激活强大的 Nrf2 介导的抗氧化反应，恢复线粒体稳态，并对高糖诱导的氧化应激提供细胞保护。这些见解凸显了 PDM 作为天然聚醚候选物在开发基于离子载体的糖尿病创面愈合策略方面的治疗潜力。","tier":"1区","if":14.7},
{"pmid":"42744768","topic":"糖尿病难愈创面","title":"Thermal-feedback modality switchable hydrogel with thermoelectric self-modulation for stage-adaptive repair of infected diabetic wound.","titleZh":"具备热电自调控的热反馈模式可切换水凝胶用于感染性糖尿病创面的分期适应修复","journal":"Nature communications","year":"2026","date":"2026-Aug-17","edat":"2026-09-15","authors":"Yang Y, Fang Q, Shu T, Liu W, Sun Y","doi":"10.1186/s13578-023-00954-3","abstract":"Hyperthermia is a promising strategy for chronic wound management, with efficacy critically dependent on precise temperature control. Current strategies largely rely on two discrete modes: high-temperature bactericidal ablation or mild hyperthermia to promote tissue regeneration. Enabling hyperthermia to autonomously match the thermal requirements of each wound-healing stage remains challenging. Herein, we developed a biomimetic thermal-feedback modality switchable (TFMS) hydrogel, obtained by copolymerizing N-isopropylacrylamide with sulfobetaine vinylimidazolium (SBVI) and loading glucose oxidase (GOx) together with EGCG-Fe3+-modified Bi2Te3. Tuning SBVI content precisely programs the volume phase transition temperature of hydrogel, enabling thermostatic photothermal antibacterial activity within a biologically safe window. GOx mediates the dissociation of the metal-polyphenol network during wound repair, thereby flexibly self-limiting the photothermal temperature and activating a thermoelectric effect at mild temperature to compensate for loss of intrinsic electric field in diabetic wounds. TFMS hydrogel enables stage-adaptive repair regulation of infected diabetic wounds through progressive regulation. Compared with commercial bioactive Flamigel, it significantly accelerates wound closure and improves wound repair quality in diabetic mice. The TFMS hydrogel expands the design of dynamic thermostatic hyperthermia in self-adaptive wound dressings, which can promote adaptability and user-friendly wound care, and has great application potential in chronic wound care.","abstractZh":"热疗是慢性创面管理中一种有前景的策略，其疗效关键取决于精确的温度控制。现有策略主要依赖两种离散模式：高温杀菌消融或温和热疗促进组织再生。使热疗能够自主匹配每个创面愈合阶段的热需求仍然具有挑战性。在此，我们开发了一种仿生热反馈模式可切换（TFMS）水凝胶，通过将 N-异丙基丙烯酰胺与磺基甜菜碱乙烯基咪唑鎓（SBVI）共聚，并负载葡萄糖氧化酶（GOx）以及 EGCG-Fe3+ 修饰的 Bi2Te3 而获得。调节 SBVI 含量可精确编程水凝胶的体积相变温度，从而在生物安全窗口内实现恒温光热抗菌活性。GOx 在创面修复过程中介导金属-多酚网络的解离，从而灵活地自限制光热温度，并在温和温度下激活热电效应，以补偿糖尿病创面中固有电场的缺失。TFMS 水凝胶通过渐进式调控，实现对感染性糖尿病创面的分期适应修复调控。与商业化生物活性敷料 Flamigel 相比，它在糖尿病小鼠中显著加速创面闭合并改善创面修复质量。TFMS 水凝胶拓展了自适应创面敷料中动态恒温热疗的设计，可提升适应性与便捷的创面护理，在慢性创面护理中具有巨大应用潜力。","tier":"1区","if":14.7},
{"pmid":"42409825","topic":"糖尿病难愈创面","title":"Engineering in vitro models to replicate the complexity of chronic wounds.","titleZh":"构建体外模型以复现慢性创面的复杂性","journal":"Nature communications","year":"2026","date":"2026-Jul-06","edat":"2026-07-06","authors":"Argandoña L, Ivanova K, Tzanov T","doi":"10.1016/j.jvn.2017.08.001","abstract":"Chronic wounds represent a major clinical challenge driven by sustained inflammation, proteolytic imbalance, microbial colonisation, and impaired tissue regeneration. This review critically examines 2D and 3D in vitro models used in chronic wound research, evaluating their capacity to recapitulate chronicity across venous leg ulcers, diabetic foot ulcers, and pressure ulcers. Current systems lack the biochemical complexity required to reproduce key features of the non-healing phenotype. Building on quantitative clinical wound exudate data, we propose a feature-driven, aetiology-stratified framework that provides modular design considerations for in vitro models and chronic wound simulating media.","abstractZh":"慢性创面是一项重大临床挑战，由持续炎症、蛋白水解失衡、微生物定植和组织再生受损所驱动。本综述批判性地审视了慢性创面研究中使用的 2D 和 3D 体外模型，评估其在静脉性小腿溃疡、糖尿病足溃疡和压力性溃疡中重现慢性化特征的能力。现有系统缺乏再现不愈合表型关键特征所需的生化复杂性。基于定量的临床创面渗出液数据，我们提出一个以特征为导向、按病因分层的框架，为体外模型和慢性创面模拟培养基提供模块化的设计考量。","tier":"1区","if":14.7},
{"pmid":"42120417","topic":"糖尿病难愈创面","title":"Sprayable nanozyme hydrogel epigenetically remodels inflammation for diabetic wound regeneration.","titleZh":"可喷涂纳米酶水凝胶通过表观遗传重塑炎症促进糖尿病创面再生","journal":"Nature communications","year":"2026","date":"2026-May-12","edat":"2026-05-12","authors":"Kurian AG, Park JH, Karunasagara S, Gupta A, Jain SK","doi":"10.1016/j.molcel.2010.05.004","abstract":"Chronic diabetic wounds present a critical clinical challenge due to persistent inflammation and compromised healing. Here, we report a sprayable nanozyme hydrogel that epigenetically remodels macrophages (Mφ) to suppress inflammation and coordinate regeneration. Ultrasmall copper-based nanozymes (CuNZ, ~4 nm) synthesized via an eco-friendly one-pot method demonstrated potent multi-radical scavenging activity. When integrated into gelatin methacryloyl (Gel), CuNZ@Gel exhibited sprayability, conformal skin coverage, and storage stability, offering potential for clinical translation. Notably, the nanozyme hydrogel induced distinct epigenetic modifications in Mφ by remodeling chromatin accessibility, thereby shifting gene expression from a pro-inflammatory to an anti-inflammatory profile. This epigenetic modulation sustained under oxidative stress, actively suppressing inflammation while facilitating regenerative responses. In rat diabetic wound models, CuNZ@Gel significantly accelerated healing through its coordinated antioxidant, anti-inflammatory, and pro-regenerative actions. Unlike conventional passive dressings, this sprayable nanozyme hydrogel proactively remodels the wound microenvironment via epigenetic control of inflammation, providing a promising therapeutic strategy for managing chronic diabetic wounds and inflammatory skin complications.","abstractZh":"慢性糖尿病创面因持续炎症和愈合受损而构成严峻的临床挑战。在此，我们报告一种可喷涂纳米酶水凝胶，可通过表观遗传方式重塑巨噬细胞（Mφ）以抑制炎症并协调再生。通过环境友好的一锅法合成的超小铜基纳米酶（CuNZ，约 4 nm）表现出强大的多自由基清除活性。当整合入甲基丙烯酰化明胶（Gel）后，CuNZ@Gel 表现出可喷涂性、与皮肤的保形覆盖以及储存稳定性，具有临床转化潜力。值得注意的是，该纳米酶水凝胶通过重塑染色质可及性，在 Mφ 中诱导明显的表观遗传修饰，从而将基因表达从促炎谱转向抗炎谱。这种表观遗传调控在氧化应激下得以维持，主动抑制炎症并促进再生反应。在大鼠糖尿病创面模型中，CuNZ@Gel 通过其协同的抗氧化、抗炎和促再生作用显著加速愈合。与传统被动敷料不同，这种可喷涂纳米酶水凝胶通过表观遗传控制炎症主动重塑创面微环境，为管理慢性糖尿病创面和炎症性皮肤并发症提供了一种有前景的治疗策略。","tier":"1区","if":14.7},
{"pmid":"41888164","topic":"糖尿病难愈创面","title":"Smad7-based biologic targeting epidermis and stroma promotes healing of diabetic wounds in mice and pigs.","titleZh":"靶向上皮与基质的 Smad7 生物制剂促进小鼠和猪糖尿病创面愈合","journal":"Nature communications","year":"2026","date":"2026-Mar-26","edat":"2026-03-27","authors":"Ke Y, Li BZ, Li F, Ravindran R, Wang D","doi":"10.1158/0008-5472.CAN-04-1331","abstract":"Diabetic wounds have limited effective therapies to restore tissue repair and resolve excessive inflammation. This study aimed to identify mechanisms of diabetic wound healing defects and test a therapeutic intervention using diabetic mouse and pig models. Here, we show that Smad7 transgene expression in mouse epidermis promotes wound healing in diabetic mice. To restrict the therapeutic effects of Smad7 on wounds, we develop a Smad7-based biologic (Tat-PYC-Smad7) that penetrates cells of the wound. Topical Tat-PYC-Smad7 treatment to diabetic pig and mouse wounds accelerates healing. Tat-PYC-Smad7-treated wounds exhibit reduced TGFβ/NFκB signaling, faster re-epithelialization, and better extracellular matrix remodeling compared to vehicle controls. Tat-PYC-Smad7 also attenuates neutrophil extracellular trap (NET) formation, potentially acting through reductions in MPO enzymatic activity and MPO nuclear entry, consequently reducing chromatin decondensation and the release of NET components. Our study reveals that keratinocytes and neutrophils are the two major cell types targeted by Tat-PYC-Smad7 to promote diabetic wound healing, providing insight into mechanisms of diabetic wound healing defects targetable by Smad7-based therapy.","abstractZh":"糖尿病创面在恢复组织修复和消除过度炎症方面的有效疗法有限。本研究旨在鉴定糖尿病创面愈合缺陷的机制，并在糖尿病小鼠和猪模型中检验一种治疗性干预。在此，我们显示小鼠表皮中的 Smad7 转基因表达可促进糖尿病小鼠的创面愈合。为将 Smad7 的治疗作用局限于创面，我们开发了一种基于 Smad7 的生物制剂（Tat-PYC-Smad7），其可穿透创面细胞。局部应用 Tat-PYC-Smad7 治疗糖尿病猪和小鼠创面可加速愈合。与载体对照相比，Tat-PYC-Smad7 处理的创面表现出 TGFβ/NFκB 信号减弱、再上皮化更快以及细胞外基质重塑更好。Tat-PYC-Smad7 还可减弱中性粒细胞胞外诱捕网（NET）的形成，可能通过降低 MPO 酶活性和 MPO 核内进入，进而减少染色质解聚和 NET 组分的释放。我们的研究揭示，角质形成细胞和中性粒细胞是 Tat-PYC-Smad7 促进糖尿病创面愈合所靶向的两大主要细胞类型，为基于 Smad7 的疗法可靶向的糖尿病创面愈合缺陷机制提供了见解。","tier":"1区","if":14.7},
{"pmid":"41857055","topic":"糖尿病难愈创面","title":"Low-intensity focused ultrasound-activated piezoelectric gel bandage for diabetic wound repair and neuropathic pain relief.","titleZh":"低强度聚焦超声激活的压电凝胶绷带用于糖尿病创面修复与神经病理性疼痛缓解","journal":"Nature communications","year":"2026","date":"2026-Mar-19","edat":"2026-03-20","authors":"Li X, Lin L, Zhu M, Li X, Yu J","doi":"10.1542/peds.2021-052714","abstract":"Nociceptive hypersensitivity and prolonged wound healing due to the interaction of peripheral neuropathy and local immune disorders are key issues that need to be addressed in diabetic foot ulcer (DFU) regenerative repair. Here, we present a low-intensity focused ultrasound (LIFU)-activated piezoelectric gel bandage for DFU wound repair and neuropathic pain relief. Acting as an artificial \"skin\", this self-powered, functionalized bandage not only temporarily shields tissue from external environment, but also serves as a drug reservoir that can in situ release nitric oxide upon LIFU to promote macrophage polarization, generate piezoelectric current to desensitize TRPV1 nociceptor for on demand neuropathic pain relief and produce reactive oxygen species to eliminate pathogens in male rodents. More importantly, this regimen can promote CGRP neuropeptides release from sensory neurons to invigorate M2-like macrophages-mediated protective cutaneous immunity. This LIFU-activated immune-nociceptor modulation strategy is potentially applicable to other non-healing tissue regeneration.","abstractZh":"由于周围神经病变与局部免疫紊乱的相互作用所致的痛觉过敏和创面愈合延迟，是糖尿病足溃疡（DFU）再生修复中亟待解决的关键问题。在此，我们提出一种低强度聚焦超声（LIFU）激活的压电凝胶绷带，用于 DFU 创面修复和神经病理性疼痛缓解。作为人工“皮肤”，这种自供电的功能化绷带不仅可暂时将组织与外部环境隔离，还可作为药物储库，在 LIFU 作用下原位释放一氧化氮以促进巨噬细胞极化、产生压电电流使 TRPV1 伤害感受器脱敏以按需缓解神经病理性疼痛，并产生活性氧以清除雄性啮齿动物体内的病原体。更重要的是，该方案可促进感觉神经元释放 CGRP 神经肽，从而激发 M2 样巨噬细胞介导的保护性皮肤免疫。这种 LIFU 激活的免疫-伤害感受器调控策略可能适用于其他不愈合组织的再生。","tier":"1区","if":14.7},
{"pmid":"41633993","topic":"糖尿病难愈创面","title":"Bio-orthogonal functionalization of bacterial cellulose combining metabolic glycoengineering and click chemistry.","titleZh":"结合代谢糖工程与点击化学的细菌纤维素生物正交功能化","journal":"Nature communications","year":"2026","date":"2026-Feb-03","edat":"2026-02-03","authors":"Chen S, Tang H, Fan X, Li B, Wang Y","doi":"10.1071/CH05176","abstract":"Bacterial cellulose possesses excellent biocompatibility and mechanical strength but lacks the bioactivity needed for many biomedical and healthcare applications. To address this limitation, we develop a metabolic glycoengineering-click chemistry strategy that enables in situ incorporation of azide groups into bacterial cellulose, followed by mild and selective conjugation of alkyne-bearing functional molecules. This approach avoids harsh chemical treatments, preserves the native properties of bacterial cellulose, and supports stable attachment of diverse bioactive agents, including antibacterial porphyrins, arginine-glycine-aspartic acid peptides, and recombinant proteins with fluorescent or enzymatic functions. As a proof-of-concept, a cascade catalytic system comprising glucose oxidase and superoxide dismutase is immobilized onto azide-modified bacterial cellulose, yielding a multifunctional wound dressing designed to address hyperglycemia and oxidative stress-key barriers to chronic wound healing. In male diabetic mice, this glucose oxidase/superoxide dismutase-integrated bacterial cellulose dressing (low endotoxin <0.1 EU/mL) accelerates wound closure to 92.1% by day 14, significantly outperforming the controls. Our strategy highlights a scalable and bio-orthogonal route for enhancing bacterial cellulose with user-defined bioactivities, thereby expanding its utility in advanced biomaterials development.","abstractZh":"细菌纤维素具有优异的生物相容性和机械强度，但缺乏许多生物医学和医疗保健应用所需的生物活性。为解决这一局限，我们开发了一种代谢糖工程-点击化学策略，可将叠氮基团原位引入细菌纤维素，随后温和、选择性地偶联带炔基的功能分子。该方法避免了苛刻的化学处理，保留了细菌纤维素的天然特性，并支持多种生物活性物质的稳定附着，包括抗菌卟啉、精氨酸-甘氨酸-天冬氨酸肽以及具有荧光或酶功能的重组蛋白。作为概念验证，将由葡萄糖氧化酶和超氧化物歧化酶组成的级联催化系统固定于叠氮修饰的细菌纤维素上，制得一种旨在应对高血糖和氧化应激（慢性创面愈合的关键障碍）的多功能创面敷料。在雄性糖尿病小鼠中，这种整合葡萄糖氧化酶/超氧化物歧化酶的细菌纤维素敷料（低内毒素 <0.1 EU/mL）在第 14 天将创面闭合率加速至 92.1%，显著优于对照组。我们的策略突显了一条可规模化、生物正交的途径，可用用户自定义的生物活性增强细菌纤维素，从而拓展其在先进生物材料开发中的用途。","tier":"1区","if":14.7},
{"pmid":"42768052","topic":"创面修复","title":"Fatty acid oxidation fuels mitochondrial respiration to drive epidermal stem cell fate and differentiation.","titleZh":"脂肪酸氧化驱动线粒体呼吸，决定表皮干细胞命运与分化","journal":"Nature communications","year":"2026","date":"2026-Aug-21","edat":"2026-09-21","authors":"Todorova K, Sol S, Boncimino F, Clocchiatti A, Takagaki K","doi":"10.1038/s41586-022-04984-8","abstract":"Skin barrier function relies on the epidermis, whose integrity is maintained by basal stem cells that continuously renew and differentiate into a multilayered architecture. Disrupted epidermal differentiation underlies numerous hyperproliferative and inflammatory skin disorders. While transcriptional and epigenetic mechanisms are known to regulate late differentiation, the molecular events driving early commitment remain elusive. Here, we reveal that early mitochondrial reprogramming, characterized by the activation of oxidative phosphorylation, is a determinant of differentiation initiation. We identify fatty acid oxidation as the primary metabolic pathway fueling oxidative phosphorylation during this process. Pharmacological and genetic inhibition of fatty acid oxidation, in vitro and in vivo, disrupts differentiation and compromises stratification, causing defective responses to physical insults. Mechanistically, fatty acid oxidation enables ATP production in committed epidermal cells to support the differentiation process, linking lipid metabolism and epidermal homeostasis. These results uncover an unrecognized role for metabolic reprogramming in epidermal stem cell fate and highlight fatty acid oxidation as a promising therapeutic target for restoring differentiation defects in disease.","abstractZh":"皮肤屏障功能依赖于表皮，其完整性由基底层干细胞维持，这些干细胞不断自我更新并分化形成多层结构。表皮分化受损是众多增殖过度性和炎症性皮肤疾病的基础。虽然已知转录和表观遗传机制调控晚期分化，但驱动早期定向的分子事件仍不清楚。在此我们揭示，以氧化磷酸化激活为特征的早期线粒体重编程是分化启动的决定因素。我们确定脂肪酸氧化是该过程中为氧化磷酸化供能的主要代谢途径。在体外和体内通过药物和遗传学手段抑制脂肪酸氧化，会破坏分化并损害分层，导致对物理损伤的应答缺陷。在机制上，脂肪酸氧化使已定向的表皮细胞能够产生 ATP 以支持分化过程，从而将脂质代谢与表皮稳态联系起来。这些结果揭示了代谢重编程在表皮干细胞命运中此前未被认识的作用，并提示脂肪酸氧化是修复疾病中分化缺陷的一个有前景的治疗靶点。","tier":"1区","if":14.7},
{"pmid":"42436119","topic":"创面修复","title":"Colorectal cancer co-opts an epidermal wound healing program during metastasis to generate disseminated tumor cells.","titleZh":"结直肠癌在转移过程中挪用表皮创面愈合程序以产生播散性肿瘤细胞","journal":"Nature communications","year":"2026","date":"2026-Jul-11","edat":"2026-07-11","authors":"Sakahara M, Okamoto T, Kumegawa K, Natsume Y, Kusama D","doi":"10.1016/j.cell.2021.04.048","abstract":"Metastasis is the principal cause of death from colorectal cancer (CRC), yet the cellular states that enable tumor dissemination remain poorly defined. Disseminated tumor cells (DTCs) are rare, transient, and clinically inaccessible, limiting mechanistic insight into their biology. Here we show that CRC cells transiently adopt a wound-healing program normally used by epidermal keratinocytes during tissue repair to enable metastatic dissemination. Using serial orthotopic transplantation of patient-derived organoids to model metastasis, we find that DTCs lose cancer stem cell features and instead express wound-inducible keratins, including KRT17, before metastatic outgrowth. This state is reversible, as cells reacquire primary tumor-like characteristics upon colonization of distant organs. Mechanistically, this transition is associated with reduced EZH2 activity and activation of YAP signaling. Clinically, KRT17⁺ cells localize to the invasive front of primary CRCs and are absent from adjacent normal tissue. These findings uncover unexpected lineage plasticity across distinct developmental origins and identify a transient, targetable state critical for metastatic progression.","abstractZh":"转移是结直肠癌（CRC）死亡的主要原因，然而使肿瘤得以播散的细胞状态仍缺乏清晰界定。播散性肿瘤细胞（DTCs）稀少、短暂且在临床上难以获取，限制了对某生物学的机制性认识。在此我们表明，CRC 细胞短暂地采用通常由表皮角质形成细胞在组织修复中使用的创面愈合程序，以实现转移性播散。利用患者来源类器官的连续原位移植构建转移模型，我们发现 DTCs 在转移性生长之前失去癌症干细胞特征，转而表达创面诱导性角蛋白（包括 KRT17）。该状态是可逆的，因为细胞在定植远处器官后重新获得类似原发肿瘤的特征。在机制上，这一转变与 EZH2 活性降低及 YAP 信号激活相关。在临床上，KRT17⁺ 细胞定位于原发 CRC 的浸润前沿，而在邻近正常组织中缺失。这些发现揭示了跨越不同发育起源的意外谱系可塑性，并鉴定出一个对转移进展至关重要的短暂且可靶向的状态。","tier":"1区","if":14.7},
{"pmid":"42399254","topic":"创面修复","title":"Ectomesenchyme contributes to epidermal stem cell formation through mesenchymal-to-epithelial transition.","titleZh":"外胚间充质通过间充质-上皮转化参与表皮干细胞形成","journal":"Nature communications","year":"2026","date":"2026-Jul-04","edat":"2026-07-03","authors":"Miura A, Kobayashi Y, Hirose Y, Azuma T, Shimbo T","doi":"10.1038/s41588-020-00721-x","abstract":"Cutaneous development is initiated by crosstalk between non-neural ectodermal epithelium and underlying mesenchymal cells. Recent studies have shown that some mesenchymal cells contribute to keratinocyte regeneration in injured skin. However, whether mesenchymal cells contribute to keratinocyte formation in physiologically normal skin remains unclear. Here we show, using lineage tracing, single-cell transcriptome and epigenome analyses of mouse skin, that the interfollicular epidermis consists largely of mesenchymal-lineage cells. Further lineage-tracing and live-imaging analysis of mouse embryos indicate that these mesenchymal-lineage epidermal progenitor cells arise from ectomesenchyme and contribute to the surface ectoderm through a mesenchymal-to-epithelial transition-like process between embryonic days 8.5 and 9.5. We also establish human induced pluripotent stem cell-derived ectomesenchyme and demonstrate that it generates p63-expressing keratinocytes. These data reveal a previously unappreciated contribution of ectomesenchyme to cutaneous development and provide insight into skin diseases involving epidermal mosaicism.","abstractZh":"皮肤发育由非神经外胚层上皮与其下方间充质细胞之间的交互作用所启动。近期研究显示，部分间充质细胞参与损伤皮肤中角质形成细胞的再生。然而，间充质细胞是否参与生理性正常皮肤中角质形成细胞的形成仍不清楚。在此我们通过对小鼠皮肤进行谱系示踪、单细胞转录组和表观基因组分析表明，毛囊间表皮在很大程度上由间充质谱系细胞构成。进一步的谱系示踪和小鼠胚胎活体成像分析表明，这些间充质谱系表皮祖细胞起源于外胚间充质，并在胚胎第 8.5 天至 9.5 天之间通过类间充质-上皮转化过程贡献于表面外胚层。我们还建立了人诱导多能干细胞来源的外胚间充质，并证明其可生成表达 p63 的角质形成细胞。这些数据揭示了外胚间充质对皮肤发育此前未被认识的作用，并为涉及表皮嵌合现象的皮肤疾病提供了新见解。","tier":"1区","if":14.7},
{"pmid":"42285958","topic":"创面修复","title":"A stretch-responsive fibroblast program promotes epidermal stem cell self-renewal during skin expansion.","titleZh":"牵张响应性成纤维细胞程序在皮肤扩张过程中促进表皮干细胞自我更新","journal":"Nature communications","year":"2026","date":"2026-Jun-12","edat":"2026-06-12","authors":"Aguilera Stewart C, Alar C, Gozza GA, Bargsted L, Kaklamanou I","doi":"10.1088/0957-4484/6/1/001","abstract":"Stretch-mediated tissue expansion is commonly used to grow extra skin for reconstructive surgeries. To ensure harmonious growth, the two main skin compartments, the epidermis and the dermis, must both expand in a coordinated manner. How fibroblasts respond to stretch-mediated tissue expansion in supporting keratinocyte proliferation remains unclear. Here we map the fibroblast transcriptional response to stretching in vivo and demonstrate that stretching forces fibroblasts to exit their quiescent state and restart proliferation. Concurrently, fibroblasts reduce collagen production and upregulate extracellular matrix remodelling factors, adopting a more embryonic-like program. Because embryonic fibroblasts are widely used as feeder layers to support the expansion of epidermal stem cells for clinical application, we leveraged this model to show that a low collagen state enhances epidermal stem cell self-renewal, thereby coordinating epidermal and dermal responses during skin expansion. These findings provide valuable insights to guide the design of in vivo stretch-mediated tissue expansion protocols and the production of in vitro skin grafts for clinical application.","abstractZh":"牵张介导的组织扩张常用于为重建外科手术培育额外皮肤。为确保协调生长，皮肤的两大主要区室——表皮和真皮——必须以协同方式共同扩张。成纤维细胞如何响应牵张介导的组织扩张以支持角质形成细胞增殖仍不清楚。在此我们绘制了体内成纤维细胞对牵张的转录应答图谱，并证明牵张迫使成纤维细胞退出静息状态并重新开始增殖。同时，成纤维细胞减少胶原产生并上调细胞外基质重塑因子，采用更接近胚胎样的程序。由于胚胎成纤维细胞被广泛用作饲养层以支持临床应用中的表皮干细胞扩增，我们利用该模型证明低胶原状态可增强表皮干细胞自我更新，从而在皮肤扩张过程中协调表皮与真皮的应答。这些发现为指导体内牵张介导组织扩张方案的设计以及临床应用所需的体外皮肤移植物制备提供了有价值的见解。","tier":"1区","if":14.7},
{"pmid":"42106338","topic":"创面修复","title":"Nanoparticle-enabled tuning of cell density for enhanced adhesion and tissue repair.","titleZh":"纳米颗粒调控细胞密度以增强黏附与组织修复","journal":"Nature communications","year":"2026","date":"2026-May-09","edat":"2026-05-09","authors":"Park HS, Im GB, Jeong SY, Lee J, Ferran A","doi":"10.1073/pnas.0506352103","abstract":"Low retention of transplanted stem cells at target sites remains a major barrier to the clinical translation of cell-based therapies. Conventional strategies, including genetic modification, chemical functionalization, and biomaterial encapsulation, often face limitations in translational feasibility, safety, or procedural complexity. Here, we present a nanoparticle-enabled biophysical approach to enhance cell retention. We incorporate cell-settling nanoparticles composed of clinically approved materials into mesenchymal stem cells, increasing cellular density to accelerate gravitational settling and improve adhesion and survival. Building on this, we develop copper-chaperone-activatable nanoparticles, which enhance tissue regeneration and anti-fibrotic signaling through activation of fibroblast growth factor 2 and a positive feedback loop. In a mouse skin wound model, we show that copper-chaperone-activatable nanoparticle-treated mesenchymal stem cells exhibit enhanced vascularization and reduced fibrosis. These findings demonstrate that modulation of cellular density and physical forces can improve stem cell engraftment, establishing a biophysical framework for safe and translationally relevant cell-based therapies.","abstractZh":"移植干细胞在靶部位的滞留率低，仍是细胞疗法临床转化的主要障碍。包括基因修饰、化学功能化和生物材料包封在内的传统策略，常在转化可行性、安全性或操作复杂性方面存在局限。在此，我们提出一种基于纳米颗粒的生物物理学方法来增强细胞滞留。我们将由临床已批准材料组成的细胞沉降纳米颗粒导入间充质干细胞，提高细胞密度以加速重力沉降并改善黏附与存活。在此基础上，我们开发了铜伴侣蛋白可激活的纳米颗粒，其通过激活成纤维细胞生长因子 2 及一个正反馈环路来增强组织再生和抗纤维化信号。在小鼠皮肤创面模型中，我们显示经铜伴侣蛋白可激活纳米颗粒处理的间充质干细胞表现出血管化增强和纤维化减轻。这些发现表明，调控细胞密度和物理力可改善干细胞植入，为安全且具有转化价值的细胞疗法建立了生物物理学框架。","tier":"1区","if":14.7},
{"pmid":"42045185","topic":"创面修复","title":"Histone methylation defines c-Jun/Sox2/Hif1α axis that controls stemness and tumor progression in squamous cell carcinoma.","titleZh":"组蛋白甲基化界定调控鳞状细胞癌干性与肿瘤进展的 c-Jun/Sox2/Hif1α 轴","journal":"Nature communications","year":"2026","date":"2026-Apr-27","edat":"2026-04-27","authors":"Mehta D, Paradkar A, Rekhi B, Nayak P, Mohanty B","doi":"10.1038/nature11344","abstract":"Squamous cell carcinomas (SCCs) originate from various sites that show poor survival due to the presence of cancer stem cells (CSCs), which impart therapy resistance. However, the crosstalk of molecular mechanisms regulating CSCs maintenance in skin and oral SCC is poorly understood. Here, we show that the whole-transcriptome profile of CSCs from skin SCC patients reveals upregulation in expression of genes associated with global hypermethylation, enhanced non-canonical Wnt signaling, and glycolysis, thereby activating the c-Jun/Sox2/Hif1α axis. Thus, it suggests crosstalk among epigenetics/signaling/metabolism in skin and oral SCC. Importantly, the combination of Decitabine (DAC), a methyltransferase inhibitor, and a RAC1 non-canonical Wnt inhibitor (RAC1i) in skin and oral SCC xenograft mouse models reduces global hypermethylation and non-canonical Wnt signaling, thereby attenuating the c-Jun/Sox2/Hif1α axis, stemness, and tumorigenic potential. Overall, our findings show that the combination of DAC and RAC1i may improve the clinical outcomes in patients with skin and oral SCC.","abstractZh":"鳞状细胞癌（SCCs）可起源于多个部位，由于癌症干细胞（CSCs）的存在而生存率较差，CSCs 赋予治疗耐药性。然而，调控皮肤和口腔 SCC 中 CSCs 维持的分子机制之间的交互作用仍知之甚少。在此我们表明，来自皮肤 SCC 患者的 CSCs 全转录组谱显示，与整体高甲基化、增强的非经典 Wnt 信号和糖酵解相关的基因表达上调，从而激活 c-Jun/Sox2/Hif1α 轴。因此，这提示皮肤和口腔 SCC 中存在表观遗传学/信号传导/代谢之间的交互作用。重要的是，在皮肤和口腔 SCC 异种移植小鼠模型中，甲基转移酶抑制剂地西他滨（DAC）与 RAC1 非经典 Wnt 抑制剂（RAC1i）联用可降低整体高甲基化和非经典 Wnt 信号，从而削弱 c-Jun/Sox2/Hif1α 轴、干性和致瘤潜能。总体而言，我们的发现表明 DAC 与 RAC1i 联用可能改善皮肤和口腔 SCC 患者的临床结局。","tier":"1区","if":14.7},
{"pmid":"41102196","topic":"糖尿病难愈创面","title":"Cu single-atom embedded g-C3N4 nanosheets rehabilitate multidrug-resistant bacteria infected diabetic wounds via photoswitchable cascade reaction.","titleZh":"铜单原子嵌入g-C3N4纳米片通过光开关级联反应修复多重耐药菌感染的糖尿病创面","journal":"Nature communications","year":"2025","date":"2025-Oct-16","edat":"2025-10-16","authors":"Sun X, Zhu P, Tang L, Wang P, Li N","doi":"10.1002/adfm.202305992","abstract":"To tackle elevated blood glucose, multidrug-resistant (MDR) bacterial infections, and persistent inflammation in diabetic wounds, we present a therapeutic strategy that employs a photoswitch-controlled catalytic cascade reaction, utilizing a photocatalytic material engineered through the synergistic regulation of nitrogen vacancies and single-atom embedding. Under visible light illumination, the N vacancy exist in g-C3N4 (CN) significantly enhances photocatalytic glucose oxidation to regulate the hyperglycemia condition at diabetic wound sites, and the atomically dispersed Cu promotes the generation of •OH and •O2- to efficiently eliminate MDR bacteria ( > 99.9%). Under dark conditions, excess ROS are scavenged by Cu/CN, reducing inflammation of wounds and promoting polarization of M2 macrophages. Serum biochemical and vital organs histopathological analyses after 14 days of treatment confirm the biosafety profile of Cu/CN. This photoswitchable cascade reaction effectively treats MDR bacterial-infected diabetic wounds in male mice, highlighting its potential for antibiotic-free therapy with promising clinical translation applications.","abstractZh":"为应对糖尿病创面中的高血糖、多重耐药（MDR）细菌感染和持续炎症，我们提出一种采用光开关控制的催化级联反应的治疗策略，所用光催化材料通过氮空位与单原子嵌入的协同调控进行设计。在可见光照射下，g-C3N4（CN）中存在的氮空位显著增强光催化葡萄糖氧化，从而调节糖尿病创面部位的高血糖状态，而原子级分散的Cu促进•OH和•O2-的生成，高效清除MDR细菌（>99.9%）。在黑暗条件下，过量ROS被Cu/CN清除，减轻创面炎症并促进M2型巨噬细胞极化。治疗14天后的血清生化及重要器官组织病理学分析证实了Cu/CN的生物安全性。这种光开关级联反应有效治疗了雄性小鼠的MDR细菌感染糖尿病创面，凸显其作为无抗生素疗法的潜力，具有广阔的临床转化应用前景。","tier":"1区","if":14.7},
{"pmid":"41057299","topic":"糖尿病难愈创面","title":"Soft bioelectronics embedded with self-confined tetrahedral DNA circuit for high-fidelity chronic wound monitoring.","titleZh":"嵌入自限域四面体DNA电路的柔性生物电子器件用于高保真慢性创面监测","journal":"Nature communications","year":"2025","date":"2025-Oct-07","edat":"2025-10-07","authors":"Zhao X, Huang J, Zhang J, Yang B, Hu Z","doi":"10.1038/s41467-025-63927-9","abstract":"Monitoring wound protein biomarkers, especially inflammation-related proteins, is essential to assess wound progression and guide treatment. However, high-fidelity wound biosensing is challenging because of current biosensors' limitations in detecting low-abundance proteins and their vulnerabilities to mechanical deformation, biofouling, and performance degradation. Here, we introduce a soft bioelectronics embedded with Self-Confined Tetrahedral DNA circuit (SCTD) for wound monitoring. In SCTD, proteins in wound exudate trigger DNA self-circulation amplification confined in the hydrophilic area, decreasing detection limits by an order of magnitude. The tetrahedral DNA structure ensures excellent mechanical stability (within 3% variation after 1000 bending cycles), prolonged stability (within 8% signal attenuation over 4 weeks), and reduced biofouling (over 50% BSA adhesion reduction). Coupled with wireless readout, this platform simultaneously monitors multiple wound healing-related proteins (TNF-α, IL-6, TGF-β1, and VEGF) and biophysical parameters. The wireless platform demonstrates accurate in-situ monitoring of both non-infected and infected wounds on diabetic male mice without hindering the healing process, offering quantitative and comprehensive evaluation to guide treatment.","abstractZh":"监测创面蛋白生物标志物，尤其是炎症相关蛋白，对于评估创面进展和指导治疗至关重要。然而，由于现有生物传感器在检测低丰度蛋白方面的局限，以及其对机械形变、生物污染和性能衰减的易感性，高保真创面生物传感仍具挑战性。在此，我们介绍一种嵌入自限域四面体DNA电路（SCTD）的柔性生物电子器件用于创面监测。在SCTD中，创面渗出液中的蛋白触发局限于亲水区域的DNA自循环扩增，使检测限降低一个数量级。四面体DNA结构确保了优异的机械稳定性（1000次弯折循环后变化在3%以内）、长期稳定性（4周内信号衰减在8%以内）以及降低的生物污染（BSA黏附减少超过50%）。结合无线读取，该平台可同时监测多种创面愈合相关蛋白（TNF-α、IL-6、TGF-β1和VEGF）及生物物理参数。该无线平台在糖尿病雄性小鼠上实现了对未感染和感染创面的准确原位监测，且不妨碍愈合过程，为指导治疗提供定量、全面的评估。","tier":"1区","if":14.7},
{"pmid":"40775187","topic":"糖尿病难愈创面","title":"Galectin-3-integrin α5β1 phase separation disrupted by advanced glycation end-products impairs diabetic wound healing in rodents.","titleZh":"晚期糖基化终末产物破坏半乳糖凝集素-3与整合素α5β1的相分离从而损害啮齿动物糖尿病创面愈合","journal":"Nature communications","year":"2025","date":"2025-Aug-07","edat":"2025-08-07","authors":"Zhang Z, Zhao Z, Huang X, Zhou L, Jiang X","doi":"10.1038/s41467-025-62320-w","abstract":"Diabetic foot ulcers are severe diabetic complications, and promoting impaired angiogenesis is essential for wound healing. Pro-angiogenic galectin-3 is elevated in diabetic serum and promotes systemic insulin resistance that may impair wound healing. However, the exact role of galectin-3 in the regulation of diabetic wound healing remains unclear. Here, we demonstrate that galectin-3 promotes skin wound healing and angiogenesis via binding to its receptor integrin α5β1, and enhances downstream focal adhesion kinase phosphorylation by forming a liquid-liquid phase separation with integrin α5β1. Under diabetic conditions, aberrant accumulated advanced glycation end-products bind to galectin-3, blocking its interaction with integrin α5β1 and impairing angiogenesis. Topical treatment of recombinant galectin-3 in hydrogels promotes diabetic wound healing in rodents without causing systemic insulin resistance and synergizes with insulin. This study clarifies the binding of galectin-3 to integrin α5β1, instead of advanced glycation end-products, forming phase separation to promote angiogenesis and diabetic wound healing, laying the foundation for local galectin-3 therapy to treat diabetic foot ulcers.","abstractZh":"糖尿病足溃疡是严重的糖尿病并发症，促进受损的血管生成对创面愈合至关重要。促血管生成的半乳糖凝集素-3在糖尿病血清中升高，并促进可能损害创面愈合的全身性胰岛素抵抗。然而，半乳糖凝集素-3在糖尿病创面愈合调控中的确切作用仍不清楚。在此，我们证明半乳糖凝集素-3通过与受体整合素α5β1结合促进皮肤创面愈合和血管生成，并通过与整合素α5β1形成液-液相分离增强下游黏着斑激酶磷酸化。在糖尿病条件下，异常蓄积的晚期糖基化终末产物与半乳糖凝集素-3结合，阻断其与整合素α5β1的相互作用并损害血管生成。将重组半乳糖凝集素-3以水凝胶形式局部治疗可促进啮齿动物糖尿病创面愈合，不引起全身性胰岛素抵抗，并与胰岛素产生协同作用。本研究阐明了半乳糖凝集素-3与整合素α5β1（而非晚期糖基化终末产物）结合形成相分离以促进血管生成和糖尿病创面愈合，为局部半乳糖凝集素-3治疗糖尿病足溃疡奠定了基础。","tier":"1区","if":14.7},
{"pmid":"40592840","topic":"糖尿病难愈创面","title":"Dimeric copper peptide incorporated hydrogel for promoting diabetic wound healing.","titleZh":"负载二聚铜肽的水凝胶促进糖尿病创面愈合","journal":"Nature communications","year":"2025","date":"2025-Jul-01","edat":"2025-07-01","authors":"Cong R, Deng C, Li P, Tang Y, Hou J","doi":"10.1016/j.addr.2018.02.002","abstract":"Diabetic wounds require continuous and coordinated modulation of the microenvironment concurrent with tissue regeneration, which remains a significant challenge. As a proof of concept, we herein propose to use dimeric copper peptide (D-CuP) for diabetic wound treatment. The D-CuP is synthesized and then incorporated into a reactive oxygen species (ROS)-responsive hydrogel matrix to improve therapeutic compliance, culminating in the formulation of G/D-CuP. Compared to monomer copper peptide (M-CuP), a wound healing agent, D-CuP exhibits multivalency, enhanced biological stability against proteases, and broad biological activities. Meanwhile, the hydrogel matrix, exhibiting ROS-scavenging capabilities, has been engineered to be an intelligent drug reservoir for wound-responsive release of D-CuP at the wound site while simultaneously attenuating inflammatory responses. Ultimately, the G/D-CuP group demonstrates superior therapeutic efficacy, achieving 97.2% closure of infected wounds.","abstractZh":"糖尿病创面需要在组织再生的同时持续、协调地调控微环境，这仍是一项重大挑战。作为概念验证，我们在此提出使用二聚铜肽（D-CuP）治疗糖尿病创面。合成D-CuP后将其负载于活性氧（ROS）响应性水凝胶基质中以改善治疗依从性，最终形成G/D-CuP制剂。与创面愈合剂单体铜肽（M-CuP）相比，D-CuP具有多价性、增强的抗蛋白酶生物稳定性和广泛的生物活性。同时，具有ROS清除能力的水凝胶基质被设计为智能药物储库，可在创面部位响应性释放D-CuP，同时减轻炎症反应。最终，G/D-CuP组显示出优越的治疗效果，感染创面闭合率达到97.2%。","tier":"1区","if":14.7},
{"pmid":"40263282","topic":"糖尿病难愈创面","title":"Boosting hydrogel conductivity via water-dispersible conducting polymers for injectable bioelectronics.","titleZh":"通过水分散性导电聚合物提升水凝胶导电性用于可注射生物电子器件","journal":"Nature communications","year":"2025","date":"2025-Apr-22","edat":"2025-04-22","authors":"Montazerian H, Davoodi E, Wang C, Lorestani F, Li J","doi":"10.1016/j.carbpol.2010.10.038","abstract":"Bioelectronic devices hold transformative potential for healthcare diagnostics and therapeutics. Yet, traditional electronic implants often require invasive surgeries and are mechanically incompatible with biological tissues. Injectable hydrogel bioelectronics offer a minimally invasive alternative that interfaces with soft tissue seamlessly. A major challenge is the low conductivity of bioelectronic systems, stemming from poor dispersibility of conductive additives in hydrogel mixtures. We address this issue by engineering doping conditions with hydrophilic biomacromolecules, enhancing the dispersibility of conductive polymers in aqueous systems. This approach achieves a 5-fold increase in dispersibility and a 20-fold boost in conductivity compared to conventional methods. The resulting conductive polymers are molecularly and in vivo degradable, making them suitable for transient bioelectronics applications. These additives are compatible with various hydrogel systems, such as alginate, forming ionically cross-linkable conductive inks for 3D-printed wearable electronics toward high-performance physiological monitoring. Furthermore, integrating conductive fillers with gelatin-based bioadhesive hydrogels substantially enhances conductivity for injectable sealants, achieving 250% greater sensitivity in pH sensing for chronic wound monitoring. Our findings indicate that hydrophilic dopants effectively tailor conducting polymers for hydrogel fillers, enhancing their biodegradability and expanding applications in transient implantable biomonitoring.","abstractZh":"生物电子器件在医疗诊断和治疗方面具有变革性潜力。然而，传统电子植入物往往需要侵入性手术，且与生物组织在力学上不相容。可注射水凝胶生物电子器件提供了一种微创替代方案，可与软组织无缝结合。一个主要挑战是生物电子系统电导率低，这源于导电添加剂在水凝胶混合物中分散性差。我们通过利用亲水性生物大分子设计掺杂条件来解决这一问题，增强导电聚合物在水相体系中的分散性。与传统方法相比，该方法使分散性提高5倍，电导率提升20倍。所得导电聚合物在分子层面和体内均可降解，使其适用于瞬态生物电子应用。这些添加剂与海藻酸盐等多种水凝胶体系相容，可形成离子交联导电墨水，用于3D打印可穿戴电子器件，实现高性能生理监测。此外，将导电填料与明胶基生物黏附水凝胶整合可显著提高可注射密封剂的导电性，在慢性创面监测的pH传感中实现250%的灵敏度提升。我们的研究结果表明，亲水性掺杂剂可有效调控导电聚合物用于水凝胶填料，增强其生物降解性，并拓展其在瞬态植入式生物监测中的应用。","tier":"1区","if":14.7},
{"pmid":"38862509","topic":"外泌体","title":"Collection of biospecimens from the inspiration4 mission establishes the standards for the space omics and medical atlas (SOMA).","titleZh":"Inspiration4 任务生物样本采集为太空组学与医学图谱（SOMA）建立标准","journal":"Nature communications","year":"2024","date":"2024-Jun-11","edat":"2024-06-11","authors":"Overbey EG, Ryon K, Kim J, Tierney BT, Klotz R","doi":"10.3389/fgene.2020.610798","abstract":"The SpaceX Inspiration4 mission provided a unique opportunity to study the impact of spaceflight on the human body. Biospecimen samples were collected from four crew members longitudinally before (Launch: L-92, L-44, L-3 days), during (Flight Day: FD1, FD2, FD3), and after (Return: R + 1, R + 45, R + 82, R + 194 days) spaceflight, spanning a total of 289 days across 2021-2022. The collection process included venous whole blood, capillary dried blood spot cards, saliva, urine, stool, body swabs, capsule swabs, SpaceX Dragon capsule HEPA filter, and skin biopsies. Venous whole blood was further processed to obtain aliquots of serum, plasma, extracellular vesicles and particles, and peripheral blood mononuclear cells. In total, 2,911 sample aliquots were shipped to our central lab at Weill Cornell Medicine for downstream assays and biobanking. This paper provides an overview of the extensive biospecimen collection and highlights their processing procedures and long-term biobanking techniques, facilitating future molecular tests and evaluations.As such, this study details a robust framework for obtaining and preserving high-quality human, microbial, and environmental samples for aerospace medicine in the Space Omics and Medical Atlas (SOMA) initiative, which can aid future human spaceflight and space biology experiments.","abstractZh":"SpaceX 的 Inspiration4 任务为研究航天飞行对人体的影响提供了独特机会。研究从四名乘员纵向采集生物样本，时间覆盖航天飞行前（发射前：L-92、L-44、L-3 天）、飞行中（飞行第 1、2、3 天，FD1、FD2、FD3）以及飞行后（返回后：R+1、R+45、R+82、R+194 天），2021—2022 年间累计跨越 289 天。采集过程包括静脉全血、毛细血管干血斑卡、唾液、尿液、粪便、体表拭子、舱体拭子、SpaceX 龙飞船 HEPA 滤器以及皮肤活检。静脉全血进一步处理，获得血清、血浆、细胞外囊泡与颗粒以及外周血单个核细胞的分装样本。共有 2,911 份样本分装被运送至我们位于威尔康奈尔医学院的中心实验室，用于下游检测和生物样本库保存。本文概述了这一大规模生物样本采集工作，重点介绍其处理流程与长期生物样本库保存技术，为未来的分子检测与评估提供便利。因此，本研究详细描述了一个用于获取和保存高质量人类、微生物及环境样本的稳健框架，服务于太空组学与医学图谱（SOMA）计划中的航天医学研究，可助力未来的人类航天飞行与太空生物学实验。","tier":"1区","if":14.7},
{"pmid":"38724502","topic":"糖尿病难愈创面","title":"circCDK13-loaded small extracellular vesicles accelerate healing in preclinical diabetic wound models.","titleZh":"负载 circCDK13 的小细胞外囊泡加速临床前糖尿病创面模型的愈合","journal":"Nature communications","year":"2024","date":"2024-May-09","edat":"2024-05-09","authors":"Huang Q, Chu Z, Wang Z, Li Q, Meng S","doi":"10.1186/s13287-019-1405-8","abstract":"Chronic wounds are a major complication in patients with diabetes. Here, we identify a therapeutic circRNA and load it into small extracellular vesicles (sEVs) to treat diabetic wounds in preclinical models. We show that circCDK13 can stimulate the proliferation and migration of human dermal fibroblasts and human epidermal keratinocytes by interacting with insulin-like growth factor 2 mRNA binding protein 3 in an N6-Methyladenosine-dependent manner to enhance CD44 and c-MYC expression. We engineered sEVs that overexpress circCDK13 and show that local subcutaneous injection into male db/db diabetic mouse wounds and wounds of streptozotocin-induced type I male diabetic rats could accelerate wound healing and skin appendage regeneration. Our study demonstrates that the delivery of circCDK13 in sEVs may present an option for diabetic wound treatment.","abstractZh":"慢性创面是糖尿病患者的主要并发症。在此，我们鉴定出一种具有治疗作用的 circRNA，并将其装载入小细胞外囊泡（sEVs）中，用于在临床前模型中治疗糖尿病创面。我们发现，circCDK13 可通过以 N6-甲基腺苷依赖性方式与胰岛素样生长因子 2 mRNA 结合蛋白 3 相互作用，增强 CD44 和 c-MYC 的表达，从而刺激人真皮成纤维细胞和人表皮角质形成细胞的增殖与迁移。我们构建了过表达 circCDK13 的工程化 sEVs，并显示局部皮下注射至雄性 db/db 糖尿病小鼠创面以及链脲佐菌素诱导的 I 型雄性糖尿病大鼠创面，可加速创面愈合与皮肤附属器再生。我们的研究表明，经 sEVs 递送 circCDK13 可能为糖尿病创面治疗提供一种选择。","tier":"1区","if":14.7},
{"pmid":"38653959","topic":"外泌体","title":"Exosome-coated oxygen nanobubble-laden hydrogel augments intracellular delivery of exosomes for enhanced wound healing.","titleZh":"外泌体包覆的载氧纳米泡水凝胶增强外泌体的细胞内递送以促进创面愈合","journal":"Nature communications","year":"2024","date":"2024-Apr-23","edat":"2024-04-23","authors":"Han X, Saengow C, Ju L, Ren W, Ewoldt RH","doi":"10.1021/acsanm.3c01812","abstract":"Wound healing is an obvious clinical concern that can be hindered by inadequate angiogenesis, inflammation, and chronic hypoxia. While exosomes derived from adipose tissue-derived stem cells have shown promise in accelerating healing by carrying therapeutic growth factors and microRNAs, intracellular cargo delivery is compromised in hypoxic tissues due to activated hypoxia-induced endocytic recycling. To address this challenge, we have developed a strategy to coat oxygen nanobubbles with exosomes and incorporate them into a polyvinyl alcohol/gelatin hybrid hydrogel. This approach not only alleviates wound hypoxia but also offers an efficient means of delivering exosome-coated nanoparticles in hypoxic conditions. The self-healing properties of the hydrogel, along with its component, gelatin, aids in hemostasis, while its crosslinking bonds facilitate hydrogen peroxide decomposition, to ameliorate wound inflammation. Here, we show the potential of this multifunctional hydrogel for enhanced healing, promoting angiogenesis, facilitating exosome delivery, mitigating hypoxia, and inhibiting inflammation in a male rat full-thickness wound model.","abstractZh":"创面愈合是一个显著的临床问题，可因血管新生不足、炎症和慢性缺氧而受阻。尽管脂肪组织来源干细胞衍生的外泌体通过携带治疗性生长因子和 microRNA 在加速愈合方面显示出前景，但在缺氧组织中，由于缺氧诱导的内吞再循环被激活，货物向细胞内的递送受到损害。为应对这一挑战，我们开发了一种策略，用外泌体包覆氧气纳米泡，并将其掺入聚乙烯醇/明胶杂化水凝胶中。该方法不仅缓解创面缺氧，还为在缺氧条件下递送外泌体包覆的纳米颗粒提供了有效手段。水凝胶的自愈合特性及其组分明胶有助于止血，而其交联键可促进过氧化氢分解，从而减轻创面炎症。在此，我们在雄性大鼠全层皮肤创面模型中展示了这种多功能水凝胶促进愈合的潜力：促进血管新生、实现外泌体递送、缓解缺氧并抑制炎症。","tier":"1区","if":14.7},
{"pmid":"38310127","topic":"糖尿病难愈创面","title":"Programmed microalgae-gel promotes chronic wound healing in diabetes.","titleZh":"程序化微藻凝胶促进糖尿病慢性创面愈合","journal":"Nature communications","year":"2024","date":"2024-Feb-03","edat":"2024-02-03","authors":"Kang Y, Xu L, Dong J, Yuan X, Ye J","doi":"10.1016/j.cels.2019.11.004","abstract":"Chronic diabetic wounds are at lifelong risk of developing diabetic foot ulcers owing to severe hypoxia, excessive reactive oxygen species (ROS), a complex inflammatory microenvironment, and the potential for bacterial infection. Here we develop a programmed treatment strategy employing live Haematococcus (HEA). By modulating light intensity, HEA can be programmed to perform a variety of functions, such as antibacterial activity, oxygen supply, ROS scavenging, and immune regulation, suggesting its potential for use in programmed therapy. Under high light intensity (658 nm, 0.5 W/cm2), green HEA (GHEA) with efficient photothermal conversion mediate wound surface disinfection. By decreasing the light intensity (658 nm, 0.1 W/cm2), the photosynthetic system of GHEA can continuously produce oxygen, effectively resolving the problems of hypoxia and promoting vascular regeneration. Continuous light irradiation induces astaxanthin (AST) accumulation in HEA cells, resulting in a gradual transformation from a green to red hue (RHEA). RHEA effectively scavenges excess ROS, enhances the expression of intracellular antioxidant enzymes, and directs polarization to M2 macrophages by secreting AST vesicles via exosomes. The living HEA hydrogel can sterilize and enhance cell proliferation and migration and promote neoangiogenesis, which could improve infected diabetic wound healing in female mice.","abstractZh":"慢性糖尿病创面由于严重缺氧、过量活性氧（ROS）、复杂的炎症微环境以及潜在的细菌感染，终生存在发展为糖尿病足溃疡的风险。在此，我们开发了一种利用活体雨生红球藻（HEA）的程序化治疗策略。通过调节光强，可对 HEA 进行编程以执行多种功能，如抗菌活性、供氧、清除 ROS 和免疫调节，提示其在程序化治疗中的应用潜力。在高光强（658 nm，0.5 W/cm²）下，具有高效光热转换能力的绿色 HEA（GHEA）介导创面表面消毒。通过降低光强（658 nm，0.1 W/cm²），GHEA 的光合系统可持续产生氧气，有效解决缺氧问题并促进血管再生。持续光照诱导 HEA 细胞中虾青素（AST）积累，使其由绿色逐渐转变为红色（RHEA）。RHEA 可有效清除过量 ROS，增强细胞内抗氧化酶的表达，并通过外泌体分泌 AST 囊泡，引导巨噬细胞向 M2 极化。该活体 HEA 水凝胶能够灭菌、增强细胞增殖与迁移并促进新生血管形成，从而改善雌性小鼠感染性糖尿病创面的愈合。","tier":"1区","if":14.7},
{"pmid":"38280863","topic":"外泌体","title":"Generating dual structurally and functionally skin-mimicking hydrogels by crosslinking cell-membrane compartments.","titleZh":"通过交联细胞膜区室构建结构与功能双重仿皮肤水凝胶","journal":"Nature communications","year":"2024","date":"2024-Jan-27","edat":"2024-01-27","authors":"Wu F, Ren Y, Lv W, Liu X, Wang X","doi":"10.1007/s00216-021-03720-x","abstract":"The skin is intrinsically a cell-membrane-compartmentalized hydrogel with high mechanical strength, potent antimicrobial ability, and robust immunological competence, which provide multiple protective effects to the body. Methods capable of preparing hydrogels that can simultaneously mimic the structure and function of the skin are highly desirable but have been proven to be a challenge. Here, dual structurally and functionally skin-mimicking hydrogels are generated by crosslinking cell-membrane compartments. The crosslinked network is formed via free radical polymerization using olefinic double bond-functionalized extracellular vesicles as a crosslinker. Due to the dissipation of stretching energy mediated by vesicular deformation, the obtained compartment-crosslinked network shows enhanced mechanical strength compared to hydrogels crosslinked by regular divinyl monomers. Biomimetic hydrogels also exhibit specific antibacterial activity and adequate ability to promote the maturation and activation of dendritic cells given the existence of numerous extracellular vesicle-associated bioactive substances. In addition, the versatility of this approach to tune both the structure and function of the resulting hydrogels is demonstrated through introducing a second network by catalyst-free click reaction-mediated crosslinking between alkyne-double-ended polymers and azido-decorated extracellular vesicles. This study provides a platform to develop dual structure- and function-controllable skin-inspired biomaterials.","abstractZh":"皮肤本质上是一种由细胞膜区室化的水凝胶，具有高机械强度、强抗菌能力和强大的免疫效能，为机体提供多重保护作用。能够制备同时模拟皮肤结构与功能的水凝胶的方法极为理想，但已被证明是一项挑战。在此，我们通过交联细胞膜区室构建了结构与功能双重仿皮肤的水凝胶。该交联网络通过自由基聚合形成，使用带有烯烃双键官能化的细胞外囊泡作为交联剂。由于囊泡变形介导的拉伸能耗散，所获得的区室交联网络与由常规二乙烯基单体交联的水凝胶相比，显示出更高的机械强度。鉴于存在大量细胞外囊泡相关生物活性物质，仿生水凝胶还表现出特异的抗菌活性以及促进树突状细胞成熟与活化的充分能力。此外，通过炔基双端聚合物与叠氮修饰的细胞外囊泡之间无催化点击反应介导的交联引入第二网络，我们展示了该方法在调节所得水凝胶结构与功能方面的通用性。本研究为开发结构与功能双重可控的仿皮肤生物材料提供了一个平台。","tier":"1区","if":14.7},
