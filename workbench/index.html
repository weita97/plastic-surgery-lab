{"pmid":"41690117","topic":"细胞衰老","title":"Modification of the dermal matrix by senescence associated lipids and its functional consequence.","titleZh":"衰老相关脂质对真皮基质的修饰及其功能后果","journal":"Redox biology","year":"2026","date":"2026-Apr","edat":"2026-02-14","authors":"Jelleschitz S, Kremslehner C, Nagelreiter IM, Mildner M, Salek M","doi":"10.1007/s10787-022-01124-6","abstract":"Senescent dermal fibroblasts accumulate and secrete chemically reactive lipids that are components of the senescence-associated secretory phenotype (SASP). These lipids, including 4-hydroxynonenal (HNE) and reactive oxidized phospholipids (OxPL), covalently bind to and modify proteins via Schiff base formation or Michael adduction. Our study examined lipid-induced collagen modifications and their impact on skin cells to evaluate the long-term consequences of senescent cells on the tissue microenvironment. Using mass spectrometry and biochemical analyses, we identified both high and low molecular-weight modifications to collagen types I, II and IV. Collagen modified by HNE reduced fibroblast proliferation and induced stress responses. In contrast, collagen modified by OxPL provoked inflammatory signaling. Both types of modifications influenced matrix remodeling by increasing proteinase expression while reducing collagen expression. Modified collagen also elevated levels of intracellular reactive oxygen species and lipid peroxidation. Macrophages cultured on modified collagen displayed altered cytokine profiles and Toll-like receptor signaling impairment, that depended on the specific type of lipid modification. Similarly, keratinocytes exposed to modified basal lamina collagen IV showed transient stress responses, increased cytokine expression, and reduced matrix metalloproteinase expression. Furthermore, lipid-modified collagen incorporated into organotypic skin equivalents disturbed keratinocyte differentiation and elevated markers of cellular senescence. These skin models also showed reduced epidermal thickness with HNE-modified collagen and parakeratosis on OxPL-modified matrices. In conclusion, the findings suggest that SASP lipids secreted by senescent fibroblasts alter collagen structure and the fate of residing cells. The responses are likely caused by cell-associated oxidation events upon interaction of cells with a lipid-modified matrix and can be inhibited by antioxidants in macrophages. Given collagen's long half-life in tissues, these modifications may represent a persistent mechanism by which senescent cells affect the tissue microenvironment beyond the lifespan of soluble SASP factors - thereby sustaining an aged phenotype over extended periods.","abstractZh":"衰老的真皮成纤维细胞蓄积并分泌具有化学反应活性的脂质，它们是衰老相关分泌表型（SASP）的组成部分。这些脂质包括4-羟基壬烯醛（HNE）和反应性氧化磷脂（OxPL），通过席夫碱形成或迈克尔加成与蛋白共价结合并对其加以修饰。本研究考察了脂质诱导的胶原修饰及其对皮肤细胞的影响，以评估衰老细胞对组织微环境的长期后果。借助质谱和生化分析，我们鉴定出I、II和IV型胶原上存在高分子量和低分子量两类修饰。HNE修饰的胶原降低成纤维细胞增殖并诱导应激反应。相反，OxPL修饰的胶原引发炎症信号传导。两类修饰均通过增加蛋白酶表达同时降低胶原表达而影响基质重塑。修饰后的胶原还升高了细胞内活性氧水平和脂质过氧化程度。在修饰胶原上培养的巨噬细胞表现出细胞因子谱改变和Toll样受体信号受损，且这种改变取决于脂质修饰的具体类型。类似地，暴露于修饰基底膜IV型胶原的角质形成细胞表现出一过性应激反应、细胞因子表达增加以及基质金属蛋白酶表达降低。此外，掺入器官型皮肤等效物中的脂质修饰胶原扰乱了角质形成细胞分化并升高了细胞衰老标志物。这些皮肤模型还显示，HNE修饰胶原使表皮厚度减少，而OxPL修饰基质上则出现角化不全。总之，这些发现提示衰老成纤维细胞分泌的SASP脂质会改变胶原结构以及驻留细胞的命运。这些反应可能由细胞与脂质修饰基质相互作用时发生的细胞相关氧化事件所致，并且在巨噬细胞中可被抗氧化剂抑制。鉴于胶原在组织中具有较长的半衰期，这些修饰可能代表一种持久机制，使衰老细胞在可溶性SASP因子存续期之外仍能影响组织微环境——从而在较长时间内维持衰老表型。","tier":"1区","if":10.7},
{"pmid":"41996933","topic":"线粒体自噬","title":"Mitochondrial redox homeostasis links organellar stress surveillance to germline and somatic integrity in Caenorhabditis elegans.","titleZh":"线粒体氧化还原稳态将细胞器应激监测与秀丽隐杆线虫的生殖系和体细胞完整性相联系","journal":"Redox biology","year":"2026","date":"2026-Jun","edat":"2026-04-17","authors":"Valenzuela-Villatoro M, de la Cruz-Ruiz P, Guerrero-Gómez D, Gómez-Orte E, Schiavi A","doi":"10.1016/j.redox.2026.104115","abstract":"Mitochondrial redox homeostasis is essential for cellular metabolism and organismal development. To investigate the consequences of disrupting redox homeostasis in this organelle in a metazoan organism, we generated a double mutant lacking mitochondrial glutathione reductase (gsr-1a) and thioredoxin reductase (trxr-2) genes in Caenorhabditis elegans. While gsr-1a or trxr-2 single mutants are phenotypically normal, double gsr-1a trxr-2 mutants displayed small body size, gonadal migration defects, reduced brood size, and prolonged egg-laying period, without developmental delay or lethality. Transcriptomic analysis revealed strong induction of ATFS-1-dependent stress and detoxification genes. Consistent with this, gsr-1a trxr-2 worms exhibited constitutive ATFS-1 nuclear localization and robust Phsp-6::gfp expression. Triple gsr-1a trxr-2; atfs-1 mutants were nonviable, demonstrating that unfolded protein response (UPRmt) activation is essential under mitochondrial redox stress. Despite the induction of a stress response at the transcriptional level, gsr-1a trxr-2 double mutants were not more resistant to oxidative or pathogen stressors. Moreover, these mutants maintained normal respiration, ATP and ROS production while displaying altered mitochondrial morphology in a tissue-specific manner, independent of mitophagy genes but dependent on mitochondrial fission or fusion machinery. Functionally, gsr-1a trxr-2 mutants showed impaired motility, reduced calcium uptake upon carbachol stimulation, enhanced hypodermal wound repair, and decreased fertilization efficiency associated with lower muscle exopher production. Overall, our data show that simultaneous loss of mitochondrial GSR-1a and TRXR-2 compromises growth, fertility and muscle performance and triggers a constitutive ATFS-1-dependent UPRmt that sustains viability revealing mitochondrial redox control as a core determinant of organismal proteostasis.","abstractZh":"线粒体氧化还原稳态对细胞代谢和生物体发育至关重要。为研究在多细胞生物中破坏该细胞器氧化还原稳态的后果，我们在秀丽隐杆线虫中构建了缺失线粒体谷胱甘肽还原酶（gsr-1a）和硫氧还蛋白还原酶（trxr-2）基因的双突变体。gsr-1a或trxr-2单突变体表型正常，而gsr-1a trxr-2双突变体表现为体型小、性腺迁移缺陷、后代数量减少和产卵期延长，但无发育延迟或致死性。转录组分析显示ATFS-1依赖的应激和解毒基因被强烈诱导。与此一致，gsr-1a trxr-2线虫表现出组成性ATFS-1核定位和强烈的Phsp-6::gfp表达。三突变体gsr-1a trxr-2; atfs-1无法存活，表明线粒体氧化还原应激下未折叠蛋白反应（UPRmt）的激活是必需的。尽管在转录水平诱导了应激反应，gsr-1a trxr-2双突变体对氧化应激或病原体应激并未表现出更强的抵抗力。此外，这些突变体维持正常的呼吸、ATP和ROS产生，同时以组织特异性的方式表现出线粒体形态改变，该改变不依赖线粒体自噬基因，而依赖线粒体分裂或融合机制。功能上，gsr-1a trxr-2突变体表现出运动能力受损、卡巴胆碱刺激后钙摄取减少、皮下组织创面修复增强，以及与肌肉外泌体（exopher）产生减少相关的受精效率下降。总体而言，我们的数据表明线粒体GSR-1a和TRXR-2的同时缺失损害生长、生育力和肌肉性能，并触发组成性ATFS-1依赖的UPRmt以维持存活，揭示线粒体氧化还原调控是生物体蛋白质稳态的核心决定因素。","tier":"1区","if":10.7},
{"pmid":"42928785","topic":"创面修复","title":"Impact of Dupilumab Therapy on Skin Barrier Function in Patients With Moderate-to-Severe Atopic Dermatitis: A Phase IV, Non-Randomized, Open-Label, Parallel-Group Clinical Study.","titleZh":"度普利尤单抗治疗对中重度特应性皮炎患者皮肤屏障功能的影响：一项 IV 期、非随机、开放标签、平行组临床研究","journal":"MedComm","year":"2026","date":"2026-Nov","edat":"2026-10-26","authors":"Liu T, Chen S, Zhao W, Di D, Liu J","doi":"10.1093/nar/gkae253","abstract":"Dupilumab improves skin barrier function in patients with atopic dermatitis (AD), but data for Chinese patients are limited. This 16-week, prospective, exploratory study investigated the impact of dupilumab on skin barrier function in Chinese patients with moderate-to-severe AD. Forty-four participants (24 patients with AD and 20 healthy volunteers) were enrolled. Patients with AD received dupilumab treatment every 2 weeks and were followed up to Week 16. Tape-stripped stratum corneum samples were collected from participants at seven specific time points for proteomic and lipidomic profiling, together with transepidermal water loss (TEWL) measurement. At Week 16, TEWL after five tape strips was significantly reduced versus baseline (adjusted p = 0.0006). Proteomics revealed significant upregulation of sphingolipid and other lipid metabolism pathways within the first 2 weeks, coinciding with early TEWL improvement; keratinocyte differentiation and keratinization pathways were enriched from Week 8 through Week 16. Lipidomics revealed that specific dysregulated ceramides-CER(d16:0/16:0), CER(d16:0/20:3), CER(t20:1/23:0), and CER(t20:1/24:1)-showed significant changes by Weeks 2-8 and completely normalized by Week 16. Dupilumab improved skin barrier function in Chinese patients with moderate-to-severe AD, accompanied by dynamic molecular changes; these correlative findings require functional validation to establish causality. Trial Registration: ClinicalTrials.gov NCT05624112.","abstractZh":"度普利尤单抗可改善特应性皮炎（AD）患者的皮肤屏障功能，但中国患者的数据有限。这项为期 16 周的前瞻性探索性研究考察了度普利尤单抗对中国中重度 AD 患者皮肤屏障功能的影响。共纳入 44 名参与者（24 例 AD 患者和 20 名健康志愿者）。AD 患者每 2 周接受一次度普利尤单抗治疗，并随访至第 16 周。在七个特定时间点采集参与者的胶带剥离角质层样本，进行蛋白质组学和脂质组学分析，同时测量经皮水分丢失（TEWL）。第 16 周时，五次胶带剥离后的 TEWL 较基线显著降低（校正 p = 0.0006）。蛋白质组学显示，前 2 周内鞘脂及其他脂质代谢通路显著上调，与早期 TEWL 改善同时出现；从第 8 周到第 16 周，角质形成细胞分化和角化通路富集。脂质组学显示，特定的失调神经酰胺——CER(d16:0/16:0)、CER(d16:0/20:3)、CER(t20:1/23:0) 和 CER(t20:1/24:1)——在第 2—8 周出现显著变化，并在第 16 周完全恢复正常。度普利尤单抗改善了中国中重度 AD 患者的皮肤屏障功能，并伴随动态的分子变化；这些相关性发现需要功能验证以确立因果关系。试验注册：ClinicalTrials.gov NCT05624112。","tier":"1区","if":10.7},
{"pmid":"42856962","topic":"创面修复","title":"Super-Resolution MRI-Derived Tumor-Stroma Ratio Phenotyping for Prognostic and Therapeutic Stratification in Pancreatic Ductal Adenocarcinoma.","titleZh":"超分辨率MRI衍生的肿瘤-间质比表型分型用于胰腺导管腺癌的预后与治疗分层","journal":"MedComm","year":"2026","date":"2026-Oct","edat":"2026-10-10","authors":"Wang X, Xie Z, Li H, Tang Q, Zhou J","doi":"10.1002/mco2.71039","abstract":"Pancreatic ductal adenocarcinoma (PDAC) exhibits profound stromal heterogeneity that influences tumor progression, recurrence risk, and therapeutic response; however, stromal phenotypes are currently assessed by postoperative histopathology. Here, we developed a super-resolution MRI (srMRI)-based radiomics model to enable noninvasive tumor-stroma ratio (TSR) phenotyping in PDAC. Using multicenter cohorts comprising 737 patients, we constructed a srMRI-derived TSR-radscore capable of predicting pathological TSR with high accuracy (AUC = 0.870 and 0.791 in training and external validation cohorts). The TSR-radscore independently stratified recurrence-free survival and, when integrated with clinicopathological variables, improved early recurrence prediction in an independent surgical cohort. In a locally advanced PDAC cohort, srMRI-derived TSR was associated with distinct therapeutic outcomes, with H-TSR tumors showing improved survival under systemic therapy and an association with outcomes following immune checkpoint inhibitor-based combination therapy. Transcriptomic analyses revealed that L-TSR tumors were enriched in extracellular matrix remodeling and TGF-β-related signaling pathways. Single-cell profiling further uncovered distinct cancer-associated fibroblast and T-cell states across TSR phenotypes, linking imaging-derived TSR patterns to underlying stromal and immune microenvironmental programs. Collectively, srMRI-derived TSR phenotyping provides a noninvasive and biologically interpretable biomarker for stromal characterization in PDAC, enabling improved recurrence-risk stratification and pre-treatment clinical assessment.","abstractZh":"胰腺导管腺癌（PDAC）表现出显著的间质异质性，这种异质性影响肿瘤进展、复发风险和治疗反应；然而，目前间质表型是通过术后组织病理学来评估的。在此，我们开发了一种基于超分辨率MRI（srMRI）的影像组学模型，以实现PDAC的无创肿瘤-间质比（TSR）表型分型。利用包含737例患者的多中心队列，我们构建了srMRI衍生的TSR-radscore，其能够以高准确度预测病理学TSR（在训练队列和外部验证队列中AUC分别为0.870和0.791）。TSR-radscore可独立分层无复发生存期，并且当与临床病理学变量整合后，在独立外科队列中改善了早期复发预测。在一个局部晚期PDAC队列中，srMRI衍生的TSR与不同的治疗结局相关，其中H-TSR肿瘤在全身治疗下显示出生存改善，并与基于免疫检查点抑制剂的联合治疗后的结局相关。转录组分析显示，L-TSR肿瘤富集于细胞外基质重塑和TGF-β相关信号通路。单细胞分析进一步揭示了不同TSR表型之间独特的癌相关成纤维细胞和T细胞状态，将影像衍生的TSR模式与潜在的间质和免疫微环境程序联系起来。总之，srMRI衍生的TSR表型分型为PDAC的间质表征提供了一种无创且具有生物学可解释性的生物标志物，有助于改善复发风险分层和治疗前临床评估。","tier":"1区","if":10.7},
{"pmid":"42840622","topic":"创面修复","title":"Multifunctional Hydrogels: Rational Design and Application in Regenerative Medicine.","titleZh":"多功能水凝胶：合理设计及其在再生医学中的应用","journal":"MedComm","year":"2026","date":"2026-Oct","edat":"2026-10-07","authors":"Song L, Silli EK, Xu Y, Lv H, Song R","doi":"10.1002/mco2.71046","abstract":"Multifunctional hydrogels have emerged as advanced biomaterial platforms capable of integrating structural support, therapeutic delivery, and biological regulation to address the complex requirements of regenerative medicine. Their unique ability to mimic native extracellular matrix environments through tunable biochemical and biophysical properties has enabled broad applications in tissue repair and regeneration. This review provides a comprehensive overview of the rational design principles, fabrication strategies, and biomedical applications of multifunctional hydrogels. The fundamental relationships between polymer composition, crosslinking mechanisms, network architecture, and biological performance were firstly discussed, highlighting how these parameters regulate mechanical properties, degradation behavior, and cellular interactions. Subsequently, representative hydrogel systems, including natural polymers, synthetic polymers, and hybrid composites, are critically compared regarding their advantages, limitations, and suitability for different regenerative scenarios. We further examine functional strategies such as controlled therapeutic delivery, immunomodulation, cell encapsulation, and stimuli-responsive regulation, with emphasis on their mechanisms and translational potential. Applications in wound healing, bone and cartilage regeneration, neural repair, and cardiovascular tissue engineering are discussed alongside current clinical challenges. Finally, we highlight key barriers including scalability, standardization, regulatory considerations, and future opportunities toward clinically translatable multifunctional hydrogel technologies.","abstractZh":"多功能水凝胶已作为先进的生物材料平台出现，其能够将结构支撑、治疗性递送和生物学调控整合于一体，从而应对再生医学的复杂需求。这类材料具有通过可调控的生化特性和生物物理特性来模拟天然细胞外基质环境的独特能力，因而在组织修复与再生领域获得了广泛应用。本综述对多功能水凝胶的合理设计原则、制备策略和生物医学应用进行了全面概述。首先讨论了聚合物组成、交联机制、网络结构和生物学性能之间的基本关系，并着重说明这些参数如何调控力学性能、降解行为以及细胞相互作用。随后，对代表性的水凝胶体系——包括天然聚合物、合成聚合物和杂化复合材料——就其优势、局限性以及对不同再生场景的适用性进行了批判性比较。我们进一步考察了诸如受控治疗性递送、免疫调节、细胞封装和刺激响应性调控等功能性策略，并重点阐述其作用机制和转化潜力。文中还讨论了其在创面愈合、骨与软骨再生、神经修复和心血管组织工程中的应用，同时结合当前的临床挑战加以分析。最后，我们着重指出了包括可规模化生产、标准化和监管考量在内的关键障碍，以及迈向临床可转化的多功能水凝胶技术的未来机遇。","tier":"1区","if":10.7},
{"pmid":"42775316","topic":"创面修复","title":"Glycoproteomic Signatures of IgG Subclass N-Glycosylation Reveal Molecular Endotypes in Idiopathic Inflammatory Myopathies.","titleZh":"IgG亚类N-糖基化糖蛋白组学特征揭示特发性炎性肌病的分子内型","journal":"MedComm","year":"2026","date":"2026-Oct","edat":"2026-09-23","authors":"Wu T, Li Y, Ling Y, Wu Y, Zhao J","doi":"10.1002/mco2.70987","abstract":"Idiopathic inflammatory myopathies (IIMs) are heterogeneous autoimmune diseases for which robust molecular classifiers are lacking. In this retrospective cross-sectional study, we profiled immunoglobulin G (IgG) subclass-specific N-glycosylation in IIMs and investigated their associations with clinical phenotypes and histopathological features. Using liquid chromatography-tandem mass spectrometry (LC-MS/MS) with an electron-transfer/higher energy collisional dissociation-stepped collision energy higher energy collisional dissociation (EThcD-sceHCD) fragmentation strategy, we analyzed plasma samples from 145 patients with IIMs and 52 age- and sex-comparable healthy controls (HCs). Compared with HCs, patients with IIMs showed increased core fucosylation and significant alterations in 13 site-specific IgG glycopeptides. Unsupervised clustering identified three glycosylation-defined endotypes with muscle-, cutaneous-, and joint-dominant phenotypes, each characterized by distinct glycoform patterns, clinical manifestations, and serological profiles. Specific IgG2 glycoforms were associated with markers of muscle injury and membrane attack complex (C5b-9) deposition, suggesting a link between IgG glycosylation and complement-mediated tissue damage. A seven-glycopeptide multinomial logistic regression model and endotype-specific nomograms were developed for exploratory cluster assignment, with moderate discrimination in the internal validation cohort (macro-averaged area under the curve [macro-AUC], 0.74). These findings identify IgG subclass-specific N-glycosylation as a molecular layer underlying IIM heterogeneity beyond conventional clinical classification and provide a glycoproteomic framework for biomarker-driven stratification, histopathological interpretation, and future mechanistic investigation.","abstractZh":"特发性炎性肌病（IIM）是一组异质性自身免疫性疾病，缺乏稳健的分子分类器。在这项回顾性横断面研究中，我们分析了IIM中免疫球蛋白G（IgG）亚类特异性N-糖基化，并探讨其与临床表型和组织病理学特征的关联。采用液相色谱-串联质谱（LC-MS/MS）结合电子转移/高能碰撞解离-阶梯碰撞能量高能碰撞解离（EThcD-sceHCD）碎裂策略，我们分析了145例IIM患者和52例年龄、性别相匹配的健康对照（HC）的血浆样本。与HC相比，IIM患者核心岩藻糖基化增加，并有13个位点特异性IgG糖肽发生显著改变。无监督聚类识别出三种糖基化定义的内型，分别以肌肉、皮肤和关节为主表型，每种内型具有不同的糖型模式、临床表现和血清学特征。特定的IgG2糖型与肌肉损伤标志物和膜攻击复合物（C5b-9）沉积相关，提示IgG糖基化与补体介导的组织损伤之间存在联系。我们开发了七糖肽多项逻辑回归模型和内型特异性列线图用于探索性聚类归属，在内部验证队列中具有中等区分度（宏平均曲线下面积[macro-AUC]为0.74）。这些发现表明，IgG亚类特异性N-糖基化是超越传统临床分类的IIM异质性的分子层面，并为生物标志物驱动的分层、组织病理学解读和未来机制研究提供了糖蛋白组学框架。","tier":"1区","if":10.7},
{"pmid":"42707312","topic":"创面修复","title":"Bio-Inspired Skin Reconstruction Using Intraoperative Autologous Epidermal Stem Cell-Enhanced Composite Grafts: A Randomized Trial.","titleZh":"基于术中自体表皮干细胞强化复合移植物的仿生皮肤重建：一项随机试验","journal":"MedComm","year":"2026","date":"2026-Sep","edat":"2026-09-08","authors":"Hu Z, Yang H, Wang P, Cao X, Wang P","doi":"10.1002/mco2.70973","abstract":"Full-thickness wounds remain a major clinical challenge, and tissue-engineered skin using epidermal stem cells (EpiSCs) offers a promising strategy for bio-inspired reconstruction. In this randomized controlled trial, 232 patients with full-thickness defects (≥ 9 cm2) received either standard treatment (acellular dermal matrix [ADM] + split-thickness skin graft [STSG], n = 112) or cell therapy (ADM + STSG + EpiSC suspension, n = 120). Autologous EpiSCs were prepared intraoperatively in a single step, avoiding prolonged in vitro expansion. The primary outcome was 6-month scar quality assessed by the Vancouver Scar Scale (VSS), while secondary outcomes included 2-week healing and 3-month recurrence. Compared with standard treatment, cell therapy produced significantly lower total VSS scores (median 3.0 vs. 6.0, p < 0.001) and improved complete wound healing at 2 weeks (80/120 [66.7%] vs. 61/112 [54.5%]; adjusted odds ratios [OR] = 1.87, 95% confidence interval [CI] 1.06-3.28, p = 0.029). Complete healing at 2 weeks was associated with reduced 3-month recurrence (adjusted OR = 0.26, 95% CI 0.09-0.75, p = 0.012). These findings support intraoperative EpiSC-enhanced composite grafting as an effective and clinically translatable approach for rapid closure and improved long-term scar outcomes.","abstractZh":"全层创面仍是临床上的重大挑战，而利用表皮干细胞（EpiSCs）构建的组织工程皮肤为仿生重建提供了一种有前景的策略。在这项随机对照试验中，232 例全层缺损（≥ 9 cm2）患者分别接受标准治疗（脱细胞真皮基质[ADM]+中厚皮片移植[STSG]，n = 112）或细胞治疗（ADM + STSG + EpiSC 悬液，n = 120）。自体 EpiSCs 于术中一步法制备，避免了长时间的体外扩增。主要结局为采用温哥华瘢痕量表（VSS）评估的 6 个月瘢痕质量，次要结局包括 2 周愈合情况和 3 个月复发。与标准治疗相比，细胞治疗使 VSS 总分显著降低（中位数 3.0 对 6.0，p < 0.001），并改善了 2 周时的创面完全愈合（80/120[66.7%] 对 61/112[54.5%]；校正比值比[OR]=1.87，95% 置信区间[CI]1.06-3.28，p = 0.029）。2 周完全愈合与 3 个月复发减少相关（校正 OR = 0.26，95% CI 0.09-0.75，p = 0.012）。这些结果支持将术中 EpiSC 强化复合移植作为一种有效且具有临床转化价值的方法，用于实现创面快速闭合并改善远期瘢痕结局。","tier":"1区","if":10.7},
{"pmid":"41164797","topic":"外泌体","title":"Molecular Encoding of Ischemic Stroke and its Resolution after Human Neural Stem Cell Therapy by Extracellular Vesicles.","titleZh":"缺血性卒中的分子编码及人神经干细胞治疗后经细胞外囊泡实现的转归","journal":"MedComm","year":"2025","date":"2025-Nov","edat":"2025-10-30","authors":"Chang C, Wang Y, Liang X, Wang R, Bao X","doi":"10.1002/mco2.70400","abstract":"Extracellular vesicles (EVs) can cross the blood-brain barrier and enter the systemic circulation, potentially acting as peripheral biomarkers of stroke neuropathology. Here, we investigated alterations in EV RNA cargoes extracted from rat brain and plasma before and after stroke induction via middle cerebral artery occlusion and subsequent human neural stem cells (hNSCs) transplantation. EV RNA coexpression profiles were assessed, and digital source tracking was used to determine EV origin. The therapeutic effects of intra-arterial delivery of hNSCs on ischemic rat brains were quantified, focusing on functional recovery, resolution of ischemic lesions, and the microenvironment. Stroke induced distinct EV secretion patterns, with a notable increase in EV secretion from non-neuronal cells. hNSCs transplantation caused minimal immune rejection and transplanted cells survived in the brain for over a week. Stem cell-derived EVs were detected in peripheral blood, indicating prolonged systemic distribution after transplantation. Gene regulatory network analyses identified specific EV miRNAs that play crucial roles in neurogenesis, wound healing, angiogenesis, and blood-brain barrier integrity. An integrated analysis of EV RNAs in brain and plasma samples revealed that stroke increased correlations in RNA expression between brain and plasma and that hNSCs transplantation reversed the effect. Brain- and plasma-derived EVs carry similar molecular information after stroke, suggesting that plasma-derived EV RNAs reflect stroke pathophysiology. Intra-arterial transplantation of hNSCs improved outcomes after stroke in rats, by promoting endogenous neurogenesis and maintaining blood-brain barrier integrity. The identified EV miRNAs provided a new mechanism by which hNSCs transplantation regulates neural regeneration through the miR-204-5p/EFNB3 axis.","abstractZh":"细胞外囊泡（EVs）可穿越血脑屏障进入体循环，有可能作为卒中神经病理的外周生物标志物。在此，我们研究了经大脑中动脉闭塞诱导卒中及随后进行人神经干细胞（hNSCs）移植前后，从大鼠脑和血浆中提取的EV RNA货物的改变。我们评估了EV RNA共表达谱，并使用数字化来源追踪确定EV的来源。我们量化了经动脉递送hNSCs对缺血大鼠脑的治疗效果，重点关注功能恢复、缺血病灶消退及微环境。卒中诱导了独特的EV分泌模式，其中非神经元细胞的EV分泌显著增加。hNSCs移植引起的免疫排斥极小，移植细胞在脑内存活超过一周。在外周血中检测到干细胞来源的EVs，表明移植后存在持久的全身分布。基因调控网络分析鉴定出特定的EV miRNAs在神经发生、创伤愈合、血管生成和血脑屏障完整性中发挥关键作用。对脑和血浆样本中EV RNAs的整合分析显示，卒中增加了脑与血浆之间RNA表达的相关性，而hNSCs移植逆转了这一效应。卒中后脑来源和血浆来源的EVs携带相似的分子信息，提示血浆来源的EV RNAs可反映卒中的病理生理。经动脉移植hNSCs通过促进内源性神经发生和维持血脑屏障完整性，改善了大鼠卒中后的结局。所鉴定出的EV miRNAs提供了hNSCs移植通过miR-204-5p/EFNB3轴调控神经再生的新机制。","tier":"1区","if":10.7},
{"pmid":"41127507","topic":"糖尿病难愈创面","title":"Immunomodulatory Mechanisms of Chronic Wound Healing: Translational and Clinical Relevance.","titleZh":"慢性创面愈合的免疫调节机制：转化与临床意义","journal":"MedComm","year":"2025","date":"2025-Nov","edat":"2025-10-23","authors":"Riaz M, Iqbal MZ, Klar AS, Biedermann T","doi":"10.1016/j.jdermsci.2022.01.005","abstract":"Chronic wounds-such as diabetic foot ulcers (DFUs), pressure ulcers (PUs), and venous leg ulcers (VLUs)-pose a serious clinical challenge due to their prolonged inflammatory phase and impaired healing. Increasing evidence reveals that dysregulated immune responses are central to the pathogenesis of chronic wounds. A complex interplay between innate and adaptive immune cells, including macrophages, neutrophils, and T cells, contributes to chronic inflammation, extracellular matrix (ECM) degradation, and tissue repair failure. While current treatments target symptoms, they often overlook the underlying immunopathology. This review provides a comprehensive analysis of the immunomodulatory mechanisms governing chronic wound healing, emphasizing the distinct immune landscapes in DFUs, PUs and VLUs. It explores immunotherapeutic strategies including cytokine-based therapies, protease inhibitors, and biomaterials with immunoregulatory functions. Special attention is given to the emerging roles of mesenchymal stem cells (MSCs) and MSC-derived extracellular vesicles (EVs) in modulating inflammation, promoting angiogenesis, and enhancing tissue regeneration. Recent clinical trials of these therapies are also critically evaluated to bridge preclinical findings with translational relevance. By integrating immunology, regenerative medicine, and clinical insights, this review highlights novel targets and strategies for immunomodulation, providing a valuable framework for advancing precision therapies in chronic wound care.","abstractZh":"慢性创面——如糖尿病足溃疡（DFUs）、压力性溃疡（PUs）和静脉性腿部溃疡（VLUs）——由于炎症期延长和愈合受损，构成严重的临床挑战。越来越多的证据表明，免疫反应失调是慢性创面发病机制的核心。包括巨噬细胞、中性粒细胞和T细胞在内的天然与适应性免疫细胞之间的复杂相互作用，促成了慢性炎症、细胞外基质（ECM）降解和组织修复失败。现有治疗虽针对症状，但常忽视潜在的免疫病理。本综述全面分析了调控慢性创面愈合的免疫调节机制，强调DFUs、PUs和VLUs中不同的免疫景观。综述探讨了免疫治疗策略，包括基于细胞因子的疗法、蛋白酶抑制剂以及具有免疫调节功能的生物材料。特别关注间充质干细胞（MSCs）和MSC来源细胞外囊泡（EVs）在调节炎症、促进血管生成和增强组织再生中的新兴作用。本综述还对这些疗法的近期临床试验进行了批判性评价，以将临床前发现与转化意义相衔接。通过整合免疫学、再生医学和临床见解，本综述突出了免疫调节的新靶点和新策略，为推进慢性创面护理中的精准治疗提供了有价值的框架。","tier":"1区","if":10.7},
{"pmid":"41030912","topic":"糖尿病难愈创面","title":"Diabetic Wound Repair: From Mechanism to Therapeutic Opportunities.","titleZh":"糖尿病创面修复：从机制到治疗机遇","journal":"MedComm","year":"2025","date":"2025-Oct","edat":"2025-10-01","authors":"Wang R, Gu S, Kim YH, Lee A, Lin H","doi":"10.1002/mco2.70406","abstract":"Diabetic wound healing, characterized by persistent inflammation, impaired angiogenesis, and dysfunctional cellular responses, remains a major clinical challenge due to its complex pathophysiology. This challenge is most evident in diabetic foot ulcers (DFUs), which carry high risks of infection, recurrence, and amputation, contributing substantially to patient morbidity, mortality, and healthcare costs. Despite multidisciplinary care, debridement, and advanced dressings, healing outcomes are often suboptimal, highlighting an urgent need for deeper pathophysiological insights and more effective therapeutic strategies. This review synthesizes current understanding of DFU pathogenesis, emphasizing how sustained metabolic dysfunction disrupts fibroblast and immune cell function, thereby perpetuating chronic wounds. We also critically examine commonly used animal models and their limitations in replicating the complexity of human DFUs and discuss emerging therapeutic approaches with translational promise. Advancing our understanding of these mechanisms and validating innovative interventions may ultimately reduce DFU-related amputations and mortality, improve healing outcomes, and enhance patient quality of life. This review aims to catalyze future research and therapeutic innovation in diabetic wound care.","abstractZh":"糖尿病创面愈合以持续炎症、血管生成受损和细胞反应功能障碍为特征，因其复杂的病理生理机制，仍是临床重大挑战。这一挑战在糖尿病足溃疡（DFUs）中最为突出，其感染、复发和截肢风险高，显著增加患者发病率、死亡率和医疗费用。尽管采用多学科诊疗、清创和先进敷料，愈合结局仍常不理想，凸显了对更深入病理生理认识及更有效治疗策略的迫切需求。本综述综合了目前对DFU发病机制的认识，强调持续代谢功能障碍如何破坏成纤维细胞和免疫细胞功能，从而使慢性创面迁延不愈。我们还批判性审视了常用动物模型及其在复制人类DFU复杂性方面的局限，并讨论了具有转化前景的新兴治疗方法。深化对这些机制的理解并验证创新干预措施，最终可能减少DFU相关截肢和死亡、改善愈合结局并提高患者生活质量。本综述旨在推动糖尿病创面护理领域的未来研究和治疗创新。","tier":"1区","if":10.7},
{"pmid":"40276644","topic":"糖尿病难愈创面","title":"Hypoxia-Driven Neurovascular Impairment Underlies Structural-Functional Dissociation in Diabetic Sudomotor Dysfunction.","titleZh":"缺氧驱动的神经血管损伤是糖尿病泌汗功能障碍中结构-功能分离的基础","journal":"MedComm","year":"2025","date":"2025-May","edat":"2025-04-25","authors":"Guo X, Zhang C, Wang Y, Li Z, Tan Y","doi":"10.1002/mco2.70173","abstract":"Sudomotor dysfunction in diabetic patients increases the risk of fissures, infections, and diabetic foot ulcers (DFUs), thereby reducing the quality of life. Despite its clinical importance, the mechanisms underlying this dysfunction remain inadequately elucidated. This study addresses this gap by demonstrating that despite structural integrity, sweat glands (SGs) in diabetic individuals with DFUs, and a murine model of diabetic neuropathy (DN), exhibit functional impairments, as confirmed by histological and functional assays. Integrated transcriptome and proteome analysis revealed significant upregulation of the SG microenvironment in response to hypoxia, highlighting potential underlying pathways involved. In addition, histological staining and tissue clearing techniques provided evidence of impaired neurovascular networks adjacent to SGs. Single-cell RNA sequencing unveiled intricate intercellular communication networks among endothelial cells (ECs), neural cells (NCs), and sweat gland cells (SGCs), emphasizing intricate cellular interactions within the SG microenvironment. Furthermore, an in vitro SGC-NC interaction model (SNIM) was employed to validate the supportive role of NCs in regulating SGC functions, highlighting the neurovascular-SG axis in diabetic pathophysiology. These findings confirm the hypoxia-driven upregulation of the SG microenvironment and underscore the critical role of the neurovascular-SG axis in diabetic pathophysiology, providing insights into potential therapeutic targets for managing diabetic complications and improving patient outcomes.","abstractZh":"糖尿病患者的泌汗功能障碍增加皲裂、感染和糖尿病足溃疡（DFUs）的风险，从而降低生活质量。尽管具有临床重要性，该功能障碍的潜在机制仍未得到充分阐明。本研究填补了这一空白，证明尽管结构完整，DFU糖尿病个体及糖尿病神经病变（DN）小鼠模型中的汗腺（SGs）存在功能损害，并经组织学和功能检测证实。整合转录组和蛋白质组分析显示，SG微环境在缺氧应答中显著上调，提示可能涉及的潜在通路。此外，组织学染色和组织透明技术提供了SGs邻近神经血管网络受损的证据。单细胞RNA测序揭示了内皮细胞（ECs）、神经细胞（NCs）和汗腺细胞（SGCs）之间复杂的细胞间通讯网络，强调了SG微环境内复杂的细胞相互作用。此外，采用体外SGC-NC相互作用模型（SNIM）验证了NCs在调控SGC功能中的支持作用，凸显了糖尿病病理生理中的神经血管-SG轴。这些发现证实了缺氧驱动的SG微环境上调，并强调了神经血管-SG轴在糖尿病病理生理中的关键作用，为管理糖尿病并发症和改善患者预后提供了潜在治疗靶点的见解。","tier":"1区","if":10.7},
{"pmid":"42144642","topic":"细胞衰老","title":"A self-powered chloroplast-driven nanophotosystem for treating skin photoaging through rejuvenating mitochondria and revitalizing senescent fibroblasts.","titleZh":"一种自供能叶绿体驱动纳米光系统：通过恢复线粒体活力与活化衰老成纤维细胞治疗皮肤光老化","journal":"Journal of nanobiotechnology","year":"2026","date":"2026-May-17","edat":"2026-05-18","authors":"Shou X, Chen C, Zeng L, Liao W, Liu Z","doi":"10.1016/j.cej.2024.152252","abstract":"Skin aging is an inevitable biological process caused by cellular senescence and overexposure to harmful environmental factors such as ultraviolet (UV) radiation. Senescent fibroblasts with proliferation arrest, mitochondrial dysfunction and nicotinamide adenine dinucleotide phosphate (NADPH) depletion have been proposed as a major mechanism driving skin photoaging, but the specific therapies are currently lacking. Inspired by the self-powering potential of plant-derived photosynthetic system, we herein fabricated a novel nanophotosynthetic platform that integrated Chlorella-derived nanothylakoid units (NTUs) with hyaluronic acid (HA)-based microneedles (MNs) to specifically target senescent fibroblasts for treating skin photoaging. By equipped with photosynthesis (PS)-I/II and quinolinate phosphoribosyltransferase (QPRT), the NTU-MN photosystem remarkably increased mitochondrial biogenesis and adenosine triphosphate (ATP) generation, resumed NAD(P)H pool and increased cellular anabolism, addressing the heighted bioenergetic and biosynthetic requirement for highly turnover of fibroblasts during photoaging. Furthermore, with skin penetrating ability of MNs and camouflaging of fibroblast membranes, topical application of the nanophotosystem facilitated the intradermal release of NTUs, leading to regeneration of damaged tissues, increased collagen synthesis, decreased senescence-associated secretory phenotype (SASP), and hence alleviated photoaging of skin. Thus, we developed a \"green nanoplatform\" with significantly anti-aging efficacy, biocompatibility, and biosafety, opening new avenues for light-driven therapies for degenerative diseases.","abstractZh":"皮肤衰老是细胞衰老以及过度暴露于紫外线（UV）辐射等有害环境因素所导致的不可避免的生物学过程。增殖停滞、线粒体功能障碍和烟酰胺腺嘌呤二核苷酸磷酸（NADPH）耗竭的衰老成纤维细胞被认为是驱动皮肤光老化的主要机制，但目前仍缺乏特异性疗法。受植物来源光合系统自供能潜力的启发，我们构建了一种新型纳米光合平台，将小球藻来源的纳米类囊体单元（NTUs）与基于透明质酸（HA）的微针（MNs）相整合，以特异性靶向衰老成纤维细胞来治疗皮肤光老化。该NTU-MN光系统装备有光合系统（PS）-I/II和喹啉酸磷酸核糖基转移酶（QPRT），显著增加了线粒体生物发生和三磷酸腺苷（ATP）生成，恢复了NAD(P)H池并增强了细胞合成代谢，从而满足光老化过程中成纤维细胞高更新率所提出的更高生物能量和生物合成需求。此外，借助微针的皮肤穿透能力和成纤维细胞膜的伪装作用，局部应用该纳米光系统促进了NTUs在皮内的释放，进而促进受损组织再生、增加胶原合成、减少衰老相关分泌表型（SASP），从而缓解皮肤光老化。因此，我们开发了一种具有显著抗衰老功效、良好生物相容性和生物安全性的“绿色纳米平台”，为退行性疾病的光驱动疗法开辟了新途径。","tier":"1区","if":10.6},
{"pmid":"42251407","topic":"糖尿病难愈创面","title":"Selenium nanoparticle-loaded microneedle patches promote diabetic oral ulcer healing by regulating the inflammatory microenvironment through upregulation of SELENBP1-mediated mitophagy.","titleZh":"载硒纳米粒微针贴片通过上调SELENBP1介导的线粒体自噬调控炎症微环境，促进糖尿病口腔溃疡愈合","journal":"Journal of nanobiotechnology","year":"2026","date":"2026-Jun-06","edat":"2026-06-06","authors":"Wang X, Wan H, Cui X, Tan B, Wang H","doi":"10.1016/j.redox.2022.102571","abstract":"Diabetes mellitus (DM) is frequently complicated by refractory oral ulcers, which are characterized by persistent inflammation and impaired healing. We first identified that diabetic oral ulcer tissues exhibit significant selenium deficiency, downregulated SELENBP1 expression, and substantial mitochondrial damage - key factors contributing to the pathogenesis. To address this pathological condition, we developed a sericin-selenium nanoparticle-loaded microneedle patch (Ser-SeNPs@MN) for efficient selenium delivery and targeted therapy of diabetic oral ulcers. The Ser-SeNPs were synthesized using a green sericin-based method, demonstrating enhanced stability and biosafety. The Ser-SeNPs@MN enabled mucosal adhesion and sustained release of Ser-SeNPs, significantly improving selenium bioavailability. In vitro experiments revealed that Ser-SeNPs@MN promoted the expression of SELENBP1 and key selenoproteins (GPX1, GPX2, TXNRD1, TXNRD2), activated PINK1/Parkin-mediated mitophagy, and restored mitochondrial function. Consequently, it suppressed pro-inflammatory responses and facilitated M2 macrophage polarization. In both diabetic oral ulcer and skin wound rat models, Ser-SeNPs@MN accelerated wound closure, enhanced collagen deposition, and promoted angiogenesis. These findings underscore the therapeutic potential of Ser-SeNPs@MN as a multifunctional platform for diabetic wound management through selenium-mediated mitochondrial recovery and immune modulation.","abstractZh":"糖尿病（DM）常并发难治性口腔溃疡，其特征为持续性炎症和愈合受损。我们首先发现糖尿病口腔溃疡组织存在显著硒缺乏、SELENBP1表达下调和明显的线粒体损伤——这些是参与其发病机制的关键因素。针对这一病理状态，我们开发了载丝胶—硒纳米粒的微针贴片（Ser-SeNPs@MN），用于高效递送硒并对糖尿病口腔溃疡进行靶向治疗。Ser-SeNPs采用基于丝胶的绿色方法合成，表现出更高的稳定性和生物安全性。Ser-SeNPs@MN可实现黏膜黏附和Ser-SeNPs的持续释放，显著提高硒的生物利用度。体外实验显示，Ser-SeNPs@MN促进SELENBP1及关键硒蛋白（GPX1、GPX2、TXNRD1、TXNRD2）的表达，激活PINK1/Parkin介导的线粒体自噬并恢复线粒体功能。因此，它抑制促炎反应并促进M2巨噬细胞极化。在糖尿病口腔溃疡和皮肤创面大鼠模型中，Ser-SeNPs@MN均加速创面闭合、增强胶原沉积并促进血管生成。这些发现强调了Ser-SeNPs@MN作为多功能平台通过硒介导的线粒体恢复和免疫调节用于糖尿病创面管理的治疗潜力。","tier":"1区","if":10.6},
{"pmid":"42927160","topic":"糖尿病难愈创面","title":"3D-printed fish-skin-derived composite dECM hydrogel patch for immunomodulatory and pro-angiogenic diabetic wound repair.","titleZh":"3D打印鱼皮来源复合dECM水凝胶补片用于免疫调节与促血管生成的糖尿病创面修复","journal":"Materials today. Bio","year":"2026","date":"2026-Dec","edat":"2026-10-25","authors":"Lee SH, Moon JS, Noh S, Yi HS, Lee H","doi":"10.1038/s41467-021-27801-8","abstract":"Diabetic wounds are sustained by persistent inflammation, oxidative stress, infection susceptibility, and impaired angiogenesis, highlighting the need for bioactive dressings with manufacturable architectures. Here, we developed a methacrylation-free and photopolymerization-free fish-derived composite decellularized extracellular matrix (dECM) hydrogel scaffold by blending tilapia skin-derived dECM (TdECM) with carp skin-derived dECM (CdECM). Rheology-guided screening identified TdECM/CdECM-2, a 1:2 (v/v) blend of TdECM and CdECM, as a printable formulation that combined shear-thinning behavior, thermally induced collagen fibrillogenesis, and extrusion printability. Post-print stabilization with 1-ethyl-3-(3-dimethylaminopropyl)carbodiimide (EDC) and N-hydroxysuccinimide (NHS) preserved lattice architecture and generated highly porous scaffolds with a porosity of 90.3 ± 3.9%. In vitro, the composite scaffold (TdECM/CdECM-2) supported fibroblast, keratinocyte, and endothelial cell growth; promoted keratinocyte migration and endothelial network formation; and reduced Staphylococcus aureus and Pseudomonas aeruginosa survival to 10.5 ± 1.3% and 13.3 ± 3.3%, respectively, in direct-contact assays. Macrophage studies indicated attenuated pro-inflammatory gene expression, increased pro-regenerative macrophage-associated markers, and reduced oxidative stress-associated reactive oxygen species accumulation. In mice with streptozotocin-induced diabetes, TdECM/CdECM-2 increased wound closure to 91.2 ± 3.9% at day 14, compared with 73.2 ± 9.7% in the untreated control and 79.3 ± 12.5% in the porcine skin-derived dECM (PdECM) group, together with improved re-epithelialization, collagen deposition, and cluster of differentiation 31 (CD31)-positive neovascularization, and reduced inflammatory myeloid cell accumulation and macrophage activation. Exploratory single-cell transcriptomic profiling suggested treatment-associated modulation of immune and stromal/endothelial gene programs related to inflammation and angiogenesis. These findings support fish-derived composite dECM scaffolds as printable bioactive wound dressing platforms for diabetic wound repair.","abstractZh":"糖尿病创面由持续炎症、氧化应激、感染易感性和血管生成受损所维持，这凸显了对具有可制造结构的生物活性敷料的需求。在此，我们通过将罗非鱼皮来源dECM（TdECM）与鲤皮来源dECM（CdECM）共混，开发了一种免甲基丙烯酰化和免光聚合的鱼源复合脱细胞细胞外基质（dECM）水凝胶支架。流变学引导的筛选确定TdECM/CdECM-2（TdECM与CdECM按1:2（v/v）共混）为可打印配方，其兼具剪切变稀行为、热诱导胶原纤维形成和挤出打印性。打印后采用1-乙基-3-(3-二甲基氨基丙基)碳二亚胺（EDC）和N-羟基琥珀酰亚胺（NHS）进行稳定化处理，可保持晶格结构并生成高度多孔的支架，孔隙率为90.3 ± 3.9%。体外实验中，复合支架（TdECM/CdECM-2）支持成纤维细胞、角质形成细胞和内皮细胞生长；促进角质形成细胞迁移和内皮网络形成；在直接接触实验中使金黄色葡萄球菌和铜绿假单胞菌的存活率分别降至10.5 ± 1.3%和13.3 ± 3.3%。巨噬细胞研究显示促炎基因表达减弱、促再生巨噬细胞相关标志物升高，以及氧化应激相关活性氧蓄积减少。在链脲佐菌素诱导的糖尿病小鼠中，TdECM/CdECM-2使第14天创面闭合率提高至91.2 ± 3.9%，而未处理对照组为73.2 ± 9.7%，猪皮来源dECM（PdECM）组为79.3 ± 12.5%，同时再上皮化、胶原沉积和分化簇31（CD31）阳性新生血管形成均改善，炎性髓系细胞蓄积和巨噬细胞活化减少。探索性单细胞转录组分析提示，该治疗与炎症和血管生成相关的免疫及基质/内皮基因程序的调节有关。这些发现支持鱼源复合dECM支架作为用于糖尿病创面修复的可打印生物活性创面敷料平台。","tier":"1区","if":10.2},
{"pmid":"42903656","topic":"外泌体","title":"Graphene oxide-induced multiple iPSC spheroid formation for enhanced production of angiogenic exosomes accelerating tissue regeneration.","titleZh":"氧化石墨烯诱导多细胞球形成以提升促血管生成外泌体产量并加速组织再生","journal":"Materials today. Bio","year":"2026","date":"2026-Dec","edat":"2026-10-22","authors":"Kim W, Sharma H, Kim D, Lee S, Bhakuni S","doi":"10.1016/j.mtbio.2026.103723","abstract":"Exosome-based therapeutics have emerged as a promising cell-free strategy for tissue regeneration by coordinating angiogenesis and tissue repair. Induced pluripotent stem cell (iPSC)-derived exosomes are particularly attractive because of their regenerative potential and scalability; however, the reproducible and scalable production of functionally potent exosomes remains a major barrier to clinical translation. Here, we developed a graphene oxide (GO)-mediated nanoengineering strategy to establish a multi-spheroid platform that simultaneously regulates spheroid architecture, enhances exosome production, and improves angiogenic functionality in both iPSC spheroids and iPSC-derived vascular endothelial cell (vEC) spheroids. GO reproducibly reorganized cellular aggregation from a single dominant spheroid into multiple uniformly sized spheroids per well and increased exosome production while preserving characteristic vesicle properties. GO-engineered iPSC spheroid-derived exosomes exhibited distinct angiogenesis-related miRNA profiles and significantly enhanced endothelial cell migration and capillary-like network formation in vitro. Extending this strategy to iPSC-vEC spheroids further enhanced endothelial differentiation and generated lineage-specific exosomes with greater pro-angiogenic activity. In a rat full-thickness skin wound model, GO-engineered spheroid-derived exosomes accelerated wound closure and promoted vascularized skin regeneration. Collectively, these findings establish GO-mediated spheroid nanoengineering as a reproducible and potentially scalable strategy for producing therapeutically potent exosomes. By integrating controlled spheroid formation, enhanced exosome productivity, preserved vesicle characteristics, and improved angiogenic efficacy, this platform provides a practical framework for standardized exosome manufacturing and supports its future clinical translation toward vascular regenerative therapies.","abstractZh":"基于外泌体的治疗策略通过协调血管生成与组织修复，已成为一种颇具前景的无细胞组织再生策略。诱导多能干细胞（iPSC）来源的外泌体因其再生潜能和可规模化制备而尤具吸引力；然而，如何可重复、可规模化地生产功能强效的外泌体，仍是其临床转化的主要障碍。在此，我们开发了一种氧化石墨烯（GO）介导的纳米工程策略，构建了多细胞球平台，可同时调控细胞球结构、提高外泌体产量，并增强 iPSC 细胞球与 iPSC 来源血管内皮细胞（vEC）细胞球的促血管生成功能。GO 可重复地将细胞聚集方式由每孔单个优势细胞球重塑为多个尺寸均一的细胞球，并在提高外泌体产量的同时保留囊泡的固有特性。GO 工程化 iPSC 细胞球来源的外泌体呈现出独特的血管生成相关 miRNA 表达谱，并在体外显著促进内皮细胞迁移和毛细血管样网络形成。将该策略拓展应用于 iPSC-vEC 细胞球，进一步增强了内皮分化，并产生了促血管生成活性更强的谱系特异性外泌体。在大鼠全层皮肤创面模型中，GO 工程化细胞球来源的外泌体加速了创面闭合，并促进了血管化皮肤再生。总之，这些发现确立了 GO 介导的细胞球纳米工程作为一种可重复、且具有规模化潜力的策略，用于生产治疗性强效外泌体。该平台将可控的细胞球形成、提高的外泌体产率、保留的囊泡特性以及改善的促血管生成效能整合于一体，为标准化外泌体制造提供了实用框架，并支持其未来向血管再生治疗方向的临床转化。","tier":"1区","if":10.2},
{"pmid":"42899161","topic":"糖尿病难愈创面","title":"AICAR-induced energy supply and paracrine activity of endothelial cells accelerate chronic diabetic wound healing by promoting angiogenesis and modulating macrophage reprogramming.","titleZh":"AICAR 诱导的内皮细胞能量供给与旁分泌活性通过促进血管生成及调控巨噬细胞重编程加速慢性糖尿病创面愈合","journal":"Materials today. Bio","year":"2026","date":"2026-Dec","edat":"2026-10-20","authors":"Su H, Liu C, Cheng Y, Cheng W, Xu A","doi":"10.1016/j.mtbio.2026.103743","abstract":"Chronic diabetic wound healing is severely hampered by endothelial cell (EC) dysfunction, defective angiogenesis, and a persistent inflammatory microenvironment, yet the crosstalk between EC energy metabolism and macrophage polarization in this process remains poorly understood. Here, we identified an AMPK-dependent metabolic pathway in ECs that orchestrated both angiogenic restoration and macrophage immune reprogramming for diabetic wound repair, and translated this mechanism into a functional three-dimensional (3D) scaffold (MEWs + GelMA@AI) fabricated by melt electrospinning writing technology. Acadesine (AICAR) efficiently induced a high-energy state in ECs by activating AMPK, preserving mitochondrial ultrastructure, enhancing respiratory-chain complex activity, and increasing VEGF expression and angiogenic potential. Notably, we discovered that AI-EXO, secreted by these metabolically activated ECs, delivered GAS6 to macrophages as a key paracrine factor, thereby triggering activation of the MER/AKT pathway and driving M1-to-M2 polarization. To our knowledge, this is the first report identifying exosomal GAS6 as a mediator of EC-macrophage crosstalk in diabetic wound healing. The MEWs + GelMA@AI scaffold, characterized by a porous structure and sustained AICAR release, exhibited excellent cytocompatibility and proangiogenic activity in vitro. In vivo, the scaffold significantly accelerated diabetic wound closure by promoting neovascularization, reducing inflammatory infiltration, and increasing the M2/M1 macrophage ratio, without detectable systemic toxicity in major organs. These findings establish a critical link between EC energy metabolism and immune microenvironment remodeling, providing a potentially translatable metabolic-engineering strategy for chronic diabetic wounds. This study opens new avenues for regenerative therapies targeting metabolic-immune interactions.","abstractZh":"慢性糖尿病创面愈合受内皮细胞（EC）功能障碍、血管生成缺陷以及持续性炎症微环境的严重阻碍，然而在此过程中 EC 能量代谢与巨噬细胞极化之间的交互作用仍知之甚少。在此，我们鉴定出 EC 中一条依赖 AMPK 的代谢通路，该通路同时协调血管生成恢复与巨噬细胞免疫重编程以促进糖尿病创面修复，并将这一机制转化为由熔融静电纺丝直写技术制备的功能性三维（3D）支架（MEWs + GelMA@AI）。阿卡地新（AICAR）通过激活 AMPK、维持线粒体超微结构、增强呼吸链复合体活性以及提高 VEGF 表达和血管生成潜能，有效诱导 EC 进入高能量状态。值得注意的是，我们发现由这些代谢激活的 EC 分泌的 AI-EXO 将 GAS6 作为关键旁分泌因子递送至巨噬细胞，从而触发 MER/AKT 通路激活并驱动 M1 向 M2 极化。据我们所知，这是首次报道外泌体 GAS6 作为糖尿病创面愈合中 EC 与巨噬细胞交互作用的中介分子。MEWs + GelMA@AI 支架具有多孔结构和 AICAR 缓释特性，在体外表现出优异的细胞相容性和促血管生成活性。在体内，该支架通过促进新生血管形成、减少炎症浸润和提高 M2/M1 巨噬细胞比值，显著加速糖尿病创面闭合，且未在主要器官中检测到全身毒性。这些发现建立了 EC 能量代谢与免疫微环境重塑之间的关键联系，为慢性糖尿病创面提供了一种具有转化潜力的代谢工程策略。本研究为靶向代谢-免疫相互作用的再生治疗开辟了新途径。","tier":"1区","if":10.2},
{"pmid":"42835614","topic":"创面修复","title":"Contractile hydrogel with NIR-induced spatiotemporally programmed release from core-shell nanoparticles for integrated antibacterial and pro-angiogenic healing.","titleZh":"基于核壳纳米粒近红外诱导时空程序化释放的收缩性水凝胶用于抗菌与促血管生成一体化愈合","journal":"Materials today. Bio","year":"2026","date":"2026-Dec","edat":"2026-10-06","authors":"Zhang MJ, Song J, Song X, Zhang A, Xi H","doi":"10.1016/j.mtbio.2026.103713","abstract":"Bacterial colonization, biofilm formation, and microenvironmental dysregulation collectively impede the healing of infected wounds, highlighting the necessity for multifunctional intelligent dressings capable of promoting wound contraction while simultaneously providing antibacterial and regenerative functions. Therefore, this study reported the fabrication of a contractile MPLG hydrogel via the copolymerization of GelMA, NIPAM, and NAGA with Mg@PDA-Lev. Nanoparticle synthesis was performed through Mg2+-assisted dopamine polymerization followed by levofloxacin conjugation. The developed platform employs a synergistic therapeutic mechanism in which the acidic wound environment triggers pH-responsive degradation of PDA and subsequent levofloxacin release, while NIR irradiation activates the PDA coating to generate photothermal heat capable of disrupting the bacterial membranes. Furthermore, sustained Mg2+ release simultaneously facilitated M2 macrophage polarization and stimulated fibroblast activity along with extracellular matrix (ECM) remodeling. The thermoresponsive properties of PNIPAM and PNAGA enable the hydrogel to undergo controllable self-contraction upon NIR irradiation while facilitating on-demand drug release. In vitro assays demonstrated the potent broad-spectrum antibacterial activity of MPLG hydrogel against both Gram-positive and Gram-negative pathogens, significantly disrupting biofilms with negligible cytotoxicity. The developed hydrogel integrates synergistic antibacterial, antioxidant, angiogenic, and immunomodulatory effects to restore the wound microenvironment and accelerate healing, representing a promising therapeutic platform for the treatment of infected wounds.","abstractZh":"细菌定植、生物膜形成与微环境失调共同阻碍感染创面的愈合，凸显了开发既能促进创面收缩、又能同时提供抗菌与再生功能的多功能智能敷料的必要性。因此，本研究报道了通过 GelMA、NIPAM 和 NAGA 与 Mg@PDA-Lev 共聚制备收缩性 MPLG 水凝胶。纳米颗粒的合成通过 Mg2+ 辅助的多巴胺聚合、随后偶联左氧氟沙星实现。所开发的平台采用协同治疗机制：酸性创面环境触发 PDA 的 pH 响应性降解并随后释放左氧氟沙星，而近红外（NIR）照射激活 PDA 涂层产生光热热量，从而破坏细菌膜。此外，Mg2+ 的持续释放同时促进 M2 巨噬细胞极化，并刺激成纤维细胞活性及细胞外基质（ECM）重塑。PNIPAM 与 PNAGA 的热响应特性使水凝胶在 NIR 照射下可发生可控自收缩，同时实现按需药物释放。体外实验表明，MPLG 水凝胶对革兰阳性与革兰阴性病原体均具有强效广谱抗菌活性，可显著破坏生物膜且细胞毒性可忽略。所开发的水凝胶整合了协同的抗菌、抗氧化、促血管生成与免疫调节作用，以恢复创面微环境并加速愈合，是治疗感染创面颇具前景的治疗平台。","tier":"1区","if":10.2},
{"pmid":"42835239","topic":"创面修复","title":"Amphotericin B-loaded polyphenolic nanoparticles for synchronous fungal eradication and immunomodulation in treating superficial fungal infections.","titleZh":"载两性霉素 B 的多酚纳米粒同步实现真菌清除与免疫调节以治疗浅表真菌感染","journal":"Materials today. Bio","year":"2026","date":"2026-Dec","edat":"2026-10-06","authors":"Chen Y, Chen F, Wang S, Dai W, Jin Q","doi":"10.1186/s12951-025-03578-6","abstract":"Fungal infection represents an escalating global health threat, yet effective treatment remains clinically challenging due to the poor solubility, limited bioavailability, and pronounced cytotoxicity of conventional antifungal agents. To overcome these limitations, a self-assembled nanoparticle (ATE NPs) is developed by integrating amphotericin B (AmB), epigallocatechin gallate (EGCG), and tri(phenylboronic acid)-derived crosslinker pentamethyldiethylenetriamine (T-PBA) for efficient fungal eradication and accelerated tissue repair. Benefiting from the strong affinity of T-PBA towards fungal cell wall polysaccharides, ATE NPs exhibit targeted adhesion and prolonged retention at infected lesions. Within the infection-associated mildly acidic microenvironment, the cleavage of boronate ester bonds triggers the controlled release of AmB, disrupting fungal membranes and eliminating pathogens. Meanwhile, EGCG exerts potent anti-inflammatory and pro-healing effects to promote tissue regeneration. Consequently, ATE NPs exhibit robust mucoadhesion, superior antifungal activity, and remarkable wound-healing capabilities both in vitro and in vivo. In murine models of fungal keratitis and cutaneous mycosis, the multifunctional nanosystem effectively suppresses fungal proliferation, mitigates corneal inflammatory damage and accelerates healing. Furthermore, transcriptomic analysis reveals that ATE NPs induce fungal metabolic dysregulation and oxidative stress while favorably modulating host immune responses. Overall, this work provides a promising, biocompatible nanotherapeutic strategy for the integrated management of severe superficial fungal infections.","abstractZh":"真菌感染已成为不断升级的全球健康威胁，然而由于传统抗真菌药物溶解度差、生物利用度有限且细胞毒性明显，有效治疗在临床上仍具挑战性。为克服这些局限，本研究通过整合两性霉素 B（AmB）、表没食子儿茶素没食子酸酯（EGCG）与三（苯硼酸）衍生交联剂五甲基二乙烯三胺（T-PBA），开发了一种自组装纳米粒（ATE NPs），用于高效清除真菌并加速组织修复。得益于 T-PBA 对真菌细胞壁多糖的强亲和力，ATE NPs 在感染病灶处表现出靶向黏附与延长滞留。在感染相关的弱酸性微环境中，硼酸酯键断裂触发 AmB 的控释，破坏真菌膜并清除病原体。同时，EGCG 发挥强效抗炎与促愈合作用，促进组织再生。因此，ATE NPs 在体外和体内均表现出强黏附性、优异的抗真菌活性和显著的创面愈合能力。在真菌性角膜炎与皮肤真菌病小鼠模型中，该多功能纳米系统有效抑制真菌增殖、减轻角膜炎症损伤并加速愈合。此外，转录组分析显示，ATE NPs 可诱导真菌代谢紊乱与氧化应激，同时良性调控宿主免疫反应。总体而言，本工作为严重浅表真菌感染的整合治疗提供了一种颇具前景、生物相容性良好的纳米治疗策略。","tier":"1区","if":10.2},
{"pmid":"42724653","topic":"糖尿病难愈创面","title":"A biomimetic core-shell nanofibrous dressing for temporally coordinated infection control and mitochondrial protection in diabetic wounds.","titleZh":"仿生核壳纳米纤维敷料在糖尿病创面中实现感染控制与线粒体保护的时序协同","journal":"Materials today. Bio","year":"2026","date":"2026-Oct","edat":"2026-09-11","authors":"Chen Y, Zhang H, Zhao T, Zhou H, Xu Z","doi":"10.1186/s40779-023-00451-1","abstract":"Chronic infected diabetic wounds are driven by a self-reinforcing pathological cycle of bacterial infection, oxidative stress, and immune dysregulation, wherein mitochondrial dysfunction contributes to impaired reparative macrophage polarization and angiogenesis. To address this, a skin-mimetic core-shell nanofibrous dressing (AT@PCS) was fabricated via coaxial electrospinning from a pullulan/quaternized chitosan (QCS) matrix, featuring a tannic acid (TA)-crosslinked shell for rapid barrier defense and an Astragalus polysaccharide (APS)-loaded core for sustained intracellular regulation. In vitro, the TA/QCS shell achieved >99.6% antibacterial efficiency against Escherichia coli and Staphylococcus aureus and rapidly scavenged extracellular reactive oxygen species (ROS). Subsequently, sustained APS release supported the activation of Nrf2-mediated antioxidant signaling, improved mitochondrial membrane potential, improved ATP production and mitochondrial respiratory function, and attenuated oxidative stress-induced glycolytic shift, thereby promoting M2 polarization and upregulating VEGF expression. These findings suggest that extracellular ROS scavenging alone is insufficient to fully reverse mitochondrial oxidative damage, underscoring the potential importance of intracellular redox regulation. In a diabetic rat full-thickness infected wound model, AT@PCS achieved 71.7 ± 4.4% wound closure by day 14, significantly superior to the 54.8 ± 3.4% closure rate of the control group, with markedly enhanced neovascularization and orderly collagen remodeling. This temporally coordinated biomimetic platform offers a strategy for coordinated regulation of redox balance, cellular metabolism, and immune microenvironment and provides a potential design strategy for diabetic wound repair.","abstractZh":"慢性感染性糖尿病创面由细菌感染、氧化应激和免疫失调形成的自我强化病理循环所驱动，其中线粒体功能障碍导致修复型巨噬细胞极化和血管生成受损。为此，我们以普鲁兰多糖/季铵化壳聚糖(QCS)为基质，通过同轴静电纺丝制备了仿皮肤核壳纳米纤维敷料(AT@PCS)，其外壳由单宁酸(TA)交联，用于快速屏障防御；内核负载黄芪多糖(APS)，用于持续的胞内调控。体外实验中，TA/QCS 外壳对大肠杆菌和金黄色葡萄球菌的抗菌效率>99.6%，并能快速清除细胞外活性氧(ROS)。随后，APS 的持续释放支持 Nrf2 介导的抗氧化信号激活，改善线粒体膜电位，改善 ATP 生成和线粒体呼吸功能，并减轻氧化应激诱导的糖酵解偏移，从而促进 M2 极化并上调 VEGF 表达。这些发现提示，仅清除细胞外 ROS 不足以完全逆转线粒体氧化损伤，凸显了细胞内氧化还原调控的潜在重要性。在糖尿病大鼠全层感染创面模型中，AT@PCS 第 14 天创面闭合率达 71.7 ± 4.4%，显著优于对照组的 54.8 ± 3.4%，并明显增强新生血管形成和有序的胶原重塑。这一时序协同的仿生平台为氧化还原平衡、细胞代谢与免疫微环境的协同调控提供了策略，也为糖尿病创面修复提供了潜在的设计思路。","tier":"1区","if":10.2},
{"pmid":"42662935","topic":"糖尿病难愈创面","title":"Bee ovum-inspired hydrogel programs microenvironment remodeling for diabetic wound healing.","titleZh":"仿蜂卵水凝胶编程化重塑微环境促进糖尿病创面愈合","journal":"Materials today. Bio","year":"2026","date":"2026-Oct","edat":"2026-08-28","authors":"Xue Y, Lu Y, Lin Y, Zhou J, Zhan K","doi":"10.1016/j.mtbio.2026.103542","abstract":"Chronic diabetic wounds heal poorly due to a persistently imbalanced microenvironment involving inflammation and bacterial infection. Notably, oxidative stress, driven by mitochondrial damage, perpetuates inflammation and hinders repair. Existing therapeutic materials struggle to simultaneously address infection, inflammation, and oxidative stress through combined drug delivery and targeted activation of mitophagy. To tackle these intertwined challenges, we designed a bee ovum-inspired hydrogel (BOV) that mimics the parasitic wasp egg strategy, firm host adhesion and staged bioactive secretion, to programmatically remodel the wound microenvironment. The BOV consists of a borate-ester-crosslinked hyaluronic acid network providing robust wet adhesion and self-healing properties. It encapsulates gelatin-coated ZIF-8@Myricetin (Myr) nanoparticles and polyhexamethylene biguanide (PHMB), which are released sequentially in response to the wound's acidic, high-reactive oxygen species (ROS), and high-matrix metalloproteinase-9 (MMP-9) microenvironment: PHMB first exerts antibacterial action to control infection, followed by Myricetin release to scavenge ROS and suppress inflammation. Beyond antioxidant effects, BOV further activates the SIRT1/FOXO3a/BNIP3 pathway to promote mitophagy, clearing damaged mitochondria and thereby mitigating oxidative stress at its source. In vivo, BOV reduced bacterial burden, alleviated inflammatory response, and enhanced collagen deposition, and re-epithelialization. This study translates a natural parasitic strategy into a programmable drug-delivery platform, offering a promising approach for refractory diabetic wound therapy through microenvironment-responsive sequential treatment and upstream mitochondrial homeostasis restoration.","abstractZh":"慢性糖尿病创面因涉及炎症和细菌感染的微环境持续失衡而愈合不良。值得注意的是，由线粒体损伤驱动的氧化应激使炎症持续存在并阻碍修复。现有治疗材料难以通过联合给药与靶向激活线粒体自噬来同时应对感染、炎症和氧化应激。为应对这些相互交织的挑战，我们设计了一种仿蜂卵水凝胶(BOV)，其模拟寄生蜂卵策略——牢固黏附宿主并分阶段分泌生物活性物质——以编程化方式重塑创面微环境。BOV 由硼酸酯交联的透明质酸网络构成，提供牢固的湿态黏附和自愈合性能。其包封明胶包覆的 ZIF-8@杨梅素(Myr)纳米粒和聚六亚甲基双胍(PHMB)，二者响应创面酸性、高活性氧(ROS)和高基质金属蛋白酶-9(MMP-9)微环境而依次释放：PHMB 先发挥抗菌作用以控制感染，随后释放杨梅素以清除 ROS 并抑制炎症。除抗氧化作用外，BOV 还激活 SIRT1/FOXO3a/BNIP3 通路以促进线粒体自噬，清除受损线粒体，从而从源头减轻氧化应激。体内实验中，BOV 降低细菌负荷、减轻炎症反应，并增强胶原沉积和再上皮化。本研究将天然寄生策略转化为可编程药物递送平台，通过微环境响应性序贯治疗和上游线粒体稳态恢复，为难治性糖尿病创面治疗提供了有前景的途径。","tier":"1区","if":10.2},
{"pmid":"42643175","topic":"糖尿病难愈创面","title":"Hydrogel microneedles loaded with engineered extracellular vesicles accelerate diabetic wound healing by promoting angiogenesis and modulating macrophage polarization.","titleZh":"负载工程化细胞外囊泡的水凝胶微针通过促进血管生成和调控巨噬细胞极化加速糖尿病创面愈合","journal":"Materials today. Bio","year":"2026","date":"2026-Oct","edat":"2026-08-26","authors":"Fang S, Min J, Chen Z, Li S, Zhou Y","doi":"10.1016/j.mtbio.2026.103555","abstract":"Oxidative stress, impaired angiogenesis, and persistent inflammation contribute to delayed diabetic wound healing. In this study, ALDH2-loaded liposomes were associated with extracellular vesicles derived from human amniotic mesenchymal stem cells to generate an ALDH2@Lipo/EV hybrid formulation, which possess pro-angiogenic, antioxidant, and anti-inflammatory properties that modulate mitochondrial homeostasis in cells within diabetic wounds. To enhance the penetration efficiency of EVs in the wound, ALDH2@Lipo/EV were loaded into methacrylated gelatin (GelMA) hydrogel to fabricate the ALDH2@Lipo/EV-MN patch system. The microneedles technology enabled precise and efficient delivery of ALDH2@Lipo/EV, ensuring an optimal depth of delivery for maximum therapeutic efficacy. Mechanistically, ALDH2@Lipo/EV promoted angiogenesis in vitro and alleviated oxidative damage and inflammation in macrophages by inhibiting the activation of dynamin-related protein 1 (Drp1) and activating the PINK1/Parkin signaling pathway. Furthermore, the ALDH2@Lipo/EV-MN patch was shown to enhance diabetic wound healing in a mouse model. This study explored the functions and mechanisms of the ALDH2@Lipo/EV-MNs system, providing a new strategy for the treatment of refractory diabetic wounds.","abstractZh":"氧化应激、血管生成受损和持续性炎症导致糖尿病创面愈合延迟。本研究将负载 ALDH2 的脂质体与人羊膜间充质干细胞来源的细胞外囊泡结合，构建 ALDH2@Lipo/EV 杂合制剂，其具有促血管生成、抗氧化和抗炎特性，可调控糖尿病创面内细胞的线粒体稳态。为提高 EVs 在创面中的穿透效率，将 ALDH2@Lipo/EV 载入甲基丙烯酰化明胶(GelMA)水凝胶，制备 ALDH2@Lipo/EV-MN 贴片系统。微针技术实现了 ALDH2@Lipo/EV 的精准高效递送，确保最佳递送深度以获得最大疗效。机制上，ALDH2@Lipo/EV 在体外促进血管生成，并通过抑制动力相关蛋白 1(Drp1)活化、激活 PINK1/Parkin 信号通路，减轻巨噬细胞的氧化损伤和炎症。此外，ALDH2@Lipo/EV-MN 贴片在小鼠模型中显示出促进糖尿病创面愈合的作用。本研究探讨了 ALDH2@Lipo/EV-MNs 系统的功能与机制，为难治性糖尿病创面的治疗提供了新策略。","tier":"1区","if":10.2},
{"pmid":"42633382","topic":"糖尿病难愈创面","title":"Phototriggered adhesive hydrogels integrating Mg/Quercetin MOFs for synchronous regulation of inflammation and angiogenesis in diabetic wounds.","titleZh":"整合 Mg/槲皮素 MOF 的光触发黏附水凝胶同步调控糖尿病创面炎症与血管生成","journal":"Materials today. Bio","year":"2026","date":"2026-Oct","edat":"2026-08-23","authors":"Yang Y, Tang B, Zhou M, Sun J, Qiu C","doi":"10.1021/acsabm.3c00205","abstract":"Chronic wounds affect over 20% of diabetic patients, imposing substantial socioeconomic and personal burdens. The diabetic wound microenvironment is characterized by hyperglycaemia, oxidative stress, persistent inflammation, and vascular damage, which disrupt tissue homeostasis and significantly hinder healing. The development of innovative multifunctional hydrogels is essential for treating diabetic wounds within such complex microenvironments. Based on metal-organic framework nanomaterials, this study introduces a dual-network crosslinked adhesive GelNB/HAMA hydrogel incorporating magnesium ions and Quercetin-based metal-organic frameworks (denoted as MgQu@GelNB/HAMA). In vitro experiments revealed that Mg-quercetin metal-organic framework (MgQu) promotes macrophage polarization from M1 to M2 type, scavenges reactive oxygen species, and stimulates neovascularization. Photopolymerization technology is employed to solidify the hydrogel into a dressing, ensuring strong adhesion to the wound site and minimizing secondary tissue damage while facilitating sustained, controlled release of Quercetin and magnesium ions. In a dorsal wound model of diabetic mice, this in situ formed multifunctional hydrogel dressing effectively reduces excessive inflammation, enhances neovascularization, accelerates collagen tissue regeneration, and advances wound healing. By improving the pathological microenvironment of diabetes, this study presents a promising new strategy for diabetic wound repair.","abstractZh":"慢性创面影响超过 20% 的糖尿病患者，造成沉重的社会经济和个人负担。糖尿病创面微环境以高血糖、氧化应激、持续炎症和血管损伤为特征，这些因素破坏组织稳态并显著阻碍愈合。开发创新的多功能水凝胶对于在此类复杂微环境中治疗糖尿病创面至关重要。本研究基于金属-有机框架纳米材料，提出一种双网络交联黏附性 GelNB/HAMA 水凝胶，其掺入镁离子和基于槲皮素的金属-有机框架(记为 MgQu@GelNB/HAMA)。体外实验显示，镁-槲皮素金属-有机框架(MgQu)促进巨噬细胞由 M1 型向 M2 型极化，清除活性氧，并刺激新生血管形成。采用光聚合技术使水凝胶固化为敷料，确保与创面部位牢固黏附并将二次组织损伤降至最低，同时促进槲皮素和镁离子的持续可控释放。在糖尿病小鼠背部创面模型中，这种原位形成的多功能水凝胶敷料有效减轻过度炎症、增强新生血管形成、加速胶原组织再生并推进创面愈合。本研究通过改善糖尿病的病理微环境，为糖尿病创面修复提供了一种有前景的新策略。","tier":"1区","if":10.2},
{"pmid":"42170234","topic":"细胞衰老","title":"Ion-coupled transfersome complexes for enhanced transdermal NAD+ repletion and mitigation of cellular senescence signatures.","titleZh":"离子偶联传递体复合物用于增强经皮NAD+补充并减轻细胞衰老特征","journal":"Materials today. Bio","year":"2026","date":"2026-Jun","edat":"2026-05-22","authors":"Kang S, Wei S, Koo BI, Jo Y, Park J","doi":"10.1038/s41467-024-55015-1","abstract":"Nicotinamide adenine dinucleotide (NAD+) is a pivotal coenzyme whose decline drives mitochondrial dysfunction and senescence. However, NAD+ delivery to skin is limited by poor stability and tissue accessibility. Here, we develop an ion-coupled NAD+ transfersome (ICoN) that stabilizes NAD+ and enables efficient, non-invasive transdermal delivery. ICoN restores intracellular NAD+ levels and reverses transcriptomic programs associated with DNA damage, oxidative stress, and senescence in vitro. Functionally, ICoN promotes mitochondrial functional integrity and sustains proliferative and migratory competence under senescent and NAD+-depleted conditions. In ex vivo porcine and human skin explants, ICoN achieves superior intratissue NAD+ penetration while attenuating senescent signatures compared with free NAD+ or precursors. Integrated high-spatial-resolution transcriptomic profiling and bulk transcriptomic analyses of UV-stressed human skin reveal that ICoN mitigates histological disruption and senescence-associated transcriptional programs at the tissue level. Moreover, ICoN extends lifespan and enhances healthspan in C. elegans. These findings characterize ICoN as a transdermal NAD + delivery platform supporting localized NAD + restoration in the context of skin aging.","abstractZh":"烟酰胺腺嘌呤二核苷酸（NAD+）是一种关键辅酶，其下降驱动线粒体功能障碍和衰老。然而，NAD+向皮肤的递送受限于稳定性差和组织可及性低。在此，我们开发了一种离子偶联NAD+传递体（ICoN），可稳定NAD+并实现高效、无创的经皮递送。体外实验中，ICoN恢复细胞内NAD+水平并逆转与DNA损伤、氧化应激和衰老相关的转录组程序。在功能上，ICoN促进线粒体功能完整性，并在衰老和NAD+耗竭条件下维持增殖与迁移能力。在离体猪和人皮肤外植体中，与游离NAD+或其前体相比，ICoN实现了更优的组织内NAD+渗透并减轻衰老特征。对紫外线应激人皮肤进行的高空间分辨率转录组分析与整体转录组分析的整合结果表明，ICoN在组织水平上减轻组织学结构破坏和衰老相关转录程序。此外，ICoN延长秀丽隐杆线虫（C. elegans）的寿命并提高其健康寿命。这些发现表明ICoN是一种经皮NAD+递送平台，可在皮肤衰老背景下支持局部NAD+补充。","tier":"1区","if":10.2},
{"pmid":"42028282","topic":"细胞衰老","title":"Microcarriers encapsulating COL1A1 mRNA-loaded nanovesicles for skin photoaging treatment.","titleZh":"封装负载COL1A1 mRNA纳米囊泡的微载体用于皮肤光老化治疗","journal":"Materials today. Bio","year":"2026","date":"2026-Jun","edat":"2026-04-24","authors":"Lin X, Filppula AM, Shang L, Zhang H, Wang D","doi":"10.1016/j.mtbio.2026.103126","abstract":"Extracellular vesicles have shown great potential in treating ultraviolet (UV)-induced skin photoaging. However, effective delivery of these bioactive agents to achieve long-term therapeutic effects remains a significant challenge. In this study, we have developed recombinant human collagen (RHC)-based microcarriers loaded with native exosomes as well as Collagen type I alpha 1 chain (COL1A1) mRNA-encapsulating nanovesicles (Emvs) to treat skin photoaging. The microcarriers mitigated UV-induced cellular senescence in HaCaT cells, as evidenced by reduced oxidative stress, decreased apoptosis, and attenuation of senescence-associated markers. In the animal model, the microcarriers not only attenuated wrinkle formation, but also promoted type I collagen deposition in UV-damaged skin. These results together with the demonstrated biocompatibility highlight the potential of the microcarrier delivery system in photoaging treatment.","abstractZh":"细胞外囊泡在治疗紫外线（UV）诱导的皮肤光老化方面已显示出巨大潜力。然而，如何有效递送这些生物活性物质以实现长期疗效仍是一项重大挑战。本研究开发了基于重组人胶原（RHC）的微载体，同时负载天然外泌体以及封装I型胶原α1链（COL1A1）mRNA的纳米囊泡（Emvs），用于治疗皮肤光老化。该微载体减轻了HaCaT细胞中UV诱导的细胞衰老，表现为氧化应激降低、凋亡减少以及衰老相关标志物减弱。在动物模型中，该微载体不仅减轻了皱纹形成，还促进了UV损伤皮肤中I型胶原的沉积。这些结果连同已验证的生物相容性，凸显了该微载体递送系统在光老化治疗中的潜力。","tier":"1区","if":10.2},
{"pmid":"41560809","topic":"糖尿病难愈创面","title":"Senolytic-loaded asymmetric wound dressing for targeted senescent cell clearance in diabetic wound healing.","titleZh":"载衰老细胞清除剂的不对称创面敷料用于糖尿病创面愈合中靶向清除衰老细胞","journal":"Materials today. Bio","year":"2026","date":"2026-Feb","edat":"2026-01-21","authors":"Zhang M, Wang Y, Dai Y, Hu Y, Fu W","doi":"10.1016/j.mtbio.2025.102741","abstract":"Chronic wounds, especially diabetic foot ulcers, pose a major clinical challenge due to persistent inflammation, impaired angiogenesis, and cellular senescence. Senolytic therapies, which selectively eliminate senescent cells, have shown promise in promoting healing, but systemic toxicity limits their application. To address this, we developed an asymmetric fabric-based composite platform for localized senolytic delivery. Using single-cell RNA sequencing, we characterized senescence-associated alterations in human diabetic foot ulcer tissues and screened several senolytic candidates in skin fibroblasts and endothelial cells. Among these, navitoclax (ABT-263) emerged as the most effective senolytic. Incorporating ABT-263 into the fabric-based platform to prepare ABT-263-CGH, we confirmed its ability to reduce senescent cell burden while maintaining biocompatibility. In a diabetic mouse model, the ABT-263-CGH significantly enhanced wound healing, reduced senescence markers, and exhibited no detectable systemic toxicity. These findings highlight the potential of localized senolytic therapy using an asymmetric fabric-based wound dressing as a novel strategy for enhancing chronic wound healing, offering a promising therapeutic avenue for diabetic wound management, and paving the way for future clinical applications.","abstractZh":"慢性创面尤其是糖尿病足溃疡因持续性炎症、血管生成受损和细胞衰老而构成重大临床挑战。选择性清除衰老细胞的衰老细胞清除疗法在促进愈合方面已显示出前景，但全身毒性限制了其应用。为解决这一问题，我们开发了一种基于织物的不对称复合平台，用于局部递送衰老细胞清除剂。利用单细胞RNA测序，我们表征了人糖尿病足溃疡组织中与衰老相关的改变，并在皮肤成纤维细胞和内皮细胞中筛选了若干衰老细胞清除候选药物。其中，navitoclax（ABT-263）成为最有效的衰老细胞清除剂。将ABT-263整合入该织物基平台制备ABT-263-CGH，我们证实其能够在保持生物相容性的同时减轻衰老细胞负荷。在糖尿病小鼠模型中，ABT-263-CGH显著促进创面愈合、降低衰老标志物，且未表现出可检测到的全身毒性。这些发现凸显了使用不对称织物基创面敷料进行局部衰老细胞清除治疗作为促进慢性创面愈合新策略的潜力，为糖尿病创面管理提供了有前景的治疗途径，并为未来的临床应用铺平了道路。","tier":"1区","if":10.2},
{"pmid":"42111764","topic":"糖尿病难愈创面","title":"Mitophagy-activating nanozyme hydrogel for enhanced diabetic wound healing.","titleZh":"激活线粒体自噬的纳米酶水凝胶促进糖尿病创面愈合","journal":"Materials today. Bio","year":"2026","date":"2026-Jun","edat":"2026-05-11","authors":"Zhang J, Tang Z, Zhang X, Zhang H, He W","doi":"10.20517/2347-9264.2024.119","abstract":"Diabetic wound healing remains a formidable clinical challenge. Mitochondrial dysfunction-driven oxidative stress is a central pathological driver of impaired diabetic wound healing, yet targeted interventions for mitochondrial repair and mitophagy modulation are lacking. Herein, we report a mitochondria-targeted selenium-doped carbon dots (Se-CDs) nanozyme hydrogel system (Se-CDs@Gelatin-TA) with potent reactive oxygen species (ROS)-scavenging capacity and PINK1/Parkin-mediated mitophagy-regulating activity for diabetic wound regeneration. The Se-CDs exhibited biocompatibility, broad-spectrum antioxidant activities, specific mitochondrial targeting ability due to selenium doping, and intrinsic blue fluorescence enabled mitochondrial co-localization tracking without external labels. Encapsulation of Se-CDs into a gelatin-tannic acid hydrogel enabled sustained release of the nanozyme. In vitro studies demonstrated that Se-CDs effectively scavenged intracellular and mitochondrial ROS, suppressed high glucose-induced fibroblast apoptosis, and restored mitophagic flux through activation of the PINK1/Parkin pathway an effect abrogated by mitophagy inhibitor 3-MA and siRNA-mediated knockdown of PINK1/Parkin. In vivo, topical application of Se-CDs@Gelatin-TA hydrogel accelerated wound closure, reduced inflammatory infiltration, enhanced collagen deposition, and restored endogenous antioxidant enzyme activity in wound tissues. This work presents a novel nanozyme-based targeted strategy for diabetic wounds, leveraging Se-CDs to modulate mitophagy and redox homeostasis, and provides mechanistic insights into the role of PINK1/Parkin-mediated mitophagy in diabetic wound repair.","abstractZh":"糖尿病创面愈合仍是严峻的临床挑战。线粒体功能障碍驱动的氧化应激是糖尿病创面愈合受损的核心病理驱动因素，然而针对线粒体修复和线粒体自噬调控的干预措施仍然缺乏。在此，我们报道一种线粒体靶向的硒掺杂碳点（Se-CDs）纳米酶水凝胶系统（Se-CDs@Gelatin-TA），具有强效的活性氧（ROS）清除能力和PINK1/Parkin介导的线粒体自噬调控活性，用于糖尿病创面再生。Se-CDs表现出良好的生物相容性、广谱抗氧化活性、因硒掺杂而获得的特异性线粒体靶向能力，以及无需外部标记即可实现线粒体共定位追踪的内源性蓝色荧光。将Se-CDs包封于明胶—单宁酸水凝胶中可实现纳米酶的持续释放。体外研究表明，Se-CDs可有效清除细胞内和线粒体ROS、抑制高糖诱导的成纤维细胞凋亡，并通过激活PINK1/Parkin通路恢复线粒体自噬流，而该效应可被线粒体自噬抑制剂3-MA和siRNA介导的PINK1/Parkin敲低所消除。体内实验中，局部应用Se-CDs@Gelatin-TA水凝胶加速创面闭合、减少炎症浸润、增强胶原沉积并恢复创面组织内源性抗氧化酶活性。本研究提出了一种基于纳米酶的糖尿病创面靶向治疗新策略，利用Se-CDs调控线粒体自噬和氧化还原稳态，并为PINK1/Parkin介导的线粒体自噬在糖尿病创面修复中的作用提供了机制见解。","tier":"1区","if":10.2},
{"pmid":"41938140","topic":"线粒体自噬","title":"Extracellular biogenic nanoscale mitochondria reprogram the wound microenvironment via ROS scavenging independent of cellular uptake.","titleZh":"细胞外生物源性纳米级线粒体通过清除ROS重编程创面微环境，且不依赖细胞摄取","journal":"Materials today. Bio","year":"2026","date":"2026-Jun","edat":"2026-04-06","authors":"Lin F, Liu J, Ding Y, Ma K, Meng Q","doi":"10.1016/j.mtbio.2026.103023","abstract":"Mitochondria are nanoscale organelles essential for cellular metabolism and redox regulation, making them a compelling target for regenerative therapeutics. Analysis of wound-edge tissues from pediatric patients with chronic non-healing ulcers revealed marked metabolic insufficiency and impaired regenerative signaling, underscoring an unmet clinical need for mitochondrial-based interventions. Here, we show that topically applied mesenchymal stem cell-derived mitochondria (MSC-mt), functioning as naturally derived nanoscale organelles, markedly accelerate wound closure in a murine full-thickness skin injury model. MSC-mt enhanced angiogenesis, collagen deposition, and fibroblast survival while reducing oxidative stress and apoptosis. Mechanistically, their cytoprotective effects occur primarily through extracellular scavenging of reactive oxygen species (ROS), independent of cellular internalization. Excessive immobilization of MSC-mt within a thermosensitive hydrogel compromised their efficacy, emphasizing the importance of mitochondrial mobility and microenvironmental access. Under high oxidative stress, internalized MSC-mt activated PINK1-Parkin-mediated mitophagy, indicating a context-dependent intracellular quality-control response. These findings position MSC-mt as a cell-free, organelle-level nano-therapeutic that operates through a dual extracellular-intracellular mechanism and emphasize the importance of delivery strategies that preserve mitochondrial functionality and spatial freedom.","abstractZh":"线粒体是对细胞代谢和氧化还原调控至关重要的纳米级细胞器，因而成为再生治疗的重要靶点。对慢性不愈合溃疡患儿创缘组织的分析显示明显的代谢不足和再生信号受损，凸显了基于线粒体的干预措施尚未满足的临床需求。在此，我们证明局部应用的间充质干细胞来源线粒体（MSC-mt）作为天然来源的纳米级细胞器，可显著加速小鼠全层皮肤损伤模型的创面闭合。MSC-mt增强血管生成、胶原沉积和成纤维细胞存活，同时减少氧化应激和凋亡。机制上，其细胞保护作用主要通过细胞外清除活性氧（ROS）实现，不依赖细胞内化。将MSC-mt过度固定于温敏水凝胶中会削弱其疗效，强调了线粒体流动性和微环境可及性的重要性。在高氧化应激条件下，被内化的MSC-mt激活PINK1-Parkin介导的线粒体自噬，提示一种依赖情境的细胞内质量控制反应。这些发现将MSC-mt定位为一种通过细胞外—细胞内双重机制发挥作用的无细胞、细胞器级纳米治疗剂，并强调了保持线粒体功能性和空间自由度的递送策略的重要性。","tier":"1区","if":10.2},
{"pmid":"42876579","topic":"外泌体","title":"Advances in 3D bioprinting of immunoregulatory biomaterials for bone regeneration.","titleZh":"用于骨再生的免疫调节生物材料三维生物打印研究进展","journal":"Materials today. Bio","year":"2026","date":"2026-Dec","edat":"2026-10-15","authors":"Wang X, Zhang A","doi":"10.1016/j.bioactmat.2024.11.021","abstract":"Bone defects caused by trauma, infection, tumour resection, and degenerative diseases remain major clinical challenges because successful regeneration requires coordinated regulation of inflammation, vascularisation, osteogenesis, and bone remodeling. Advances in osteoimmunology have demonstrated that immune responses are integral to each stage of bone healing, shifting biomaterial design from passive biocompatibility towards active and temporally coordinated immunomodulation. Three dimensional bioprinting provides a versatile platform for integrating material, structural, cellular, and biochemical cues within spatially defined constructs, thereby offering new opportunities to regulate the osteoimmune microenvironment. In this review, we first summarise the immune processes and key immune cell populations involved in the inflammatory, proliferative, and remodeling stages of bone repair, and discuss the major bioprinting technologies and bioink design principles relevant to immunoregulatory bone regeneration. We then examine how material composition, structural and surface cues, and biologically active components, including stem cells, cytokines, exosomes, and decellularised extracellular matrix, regulate immune cell states and their interactions with vascular and osteogenic processes. Particular emphasis is placed on moving beyond static macrophage polarisation towards multicellular, stage specific, and spatiotemporally controlled immunoregulation. Finally, current challenges and future directions are discussed, including responsive and multifunctional bioinks, controlled degradation and delivery, mechanistic evaluation, manufacturing standardisation, and clinical translation. Collectively, immunoregulatory bioprinting provides a promising framework for developing bone regenerative constructs that more closely coordinate with the dynamic biology of tissue repair.","abstractZh":"由创伤、感染、肿瘤切除和退行性疾病引起的骨缺损仍是重大的临床挑战，因为成功再生需要炎症、血管化、成骨和骨重塑的协同调控。骨免疫学的进展表明，免疫应答是骨愈合各阶段不可或缺的组成部分，这使生物材料设计从被动的生物相容性转向主动且具有时间协调性的免疫调节。三维生物打印提供了一个通用平台，可在空间限定的构建体内整合材料、结构、细胞和生化信号，从而为调控骨免疫微环境提供了新机遇。在本综述中，我们首先总结骨修复炎症期、增殖期和重塑期所涉及的免疫过程及关键免疫细胞群，并讨论与免疫调节性骨再生相关的主要生物打印技术和生物墨水设计原则。随后，我们探讨材料组成、结构与表面信号以及生物活性成分（包括干细胞、细胞因子、外泌体和脱细胞细胞外基质）如何调控免疫细胞状态及其与血管生成和成骨过程的相互作用。特别强调应超越静态的巨噬细胞极化，转向多细胞、阶段特异性和时空可控的免疫调节。最后，讨论了当前的挑战与未来方向，包括响应性和多功能生物墨水、可控降解与递送、机制评价、制造标准化以及临床转化。总之，免疫调节性生物打印为开发与组织修复动态生物学更紧密协调的骨再生构建体提供了一个有前景的框架。","tier":"1区","if":10.2},
{"pmid":"41142427","topic":"线粒体自噬","title":"Mitochondria-enriched nanovesicles: A novel approach for treating radiation-induced skin injury.","titleZh":"富线粒体纳米囊泡：治疗放射性皮肤损伤的新途径","journal":"Materials today. Bio","year":"2025","date":"2025-Dec","edat":"2025-10-27","authors":"Zhu M, Xia J, Liu J, Zou W, Guan X","doi":"10.1016/j.mtbio.2025.102377","abstract":"Radiation-induced skin injury (RSI) is characterized by persistent mitochondrial dysfunction and compromised DNA repair mechanisms, posing significant challenges for clinical management. To address this, we engineered mitochondria-enriched nanovesicles (NVs) derived from human umbilical cord mesenchymal stem cells (hUMSCs), designed to deliver bioactive mitochondrial components to irradiated skin tissues. Using established in vitro and in vivo models of X-ray-induced RSI, we demonstrated efficient NV internalization into epidermal and dermal cells, leading to restoration of mitochondrial ultrastructure and metabolic function, attenuation of reactive oxygen species (ROS), and facilitation of DNA damage repair. Data-independent acquisition (DIA) proteomic profiling further indicated that NVs significantly upregulated key DNA repair proteins (including POLD3, POLE4, RFC1, and ERCC6), which were downregulated after irradiation, and activated the PINK1-Parkin mitophagy pathway. Additionally, NVs restored mitochondrial dynamics by suppressing DRP1-mediated fission and enhancing MFN1/2-dependent fusion, collectively promoting cellular homeostasis. These findings support the development of a cell-free, mitochondria-based nanotherapeutic strategy that concurrently targets DNA repair and mitochondrial quality control, presenting a scalable and promising treatment for RSI and potentially other radiation-induced disorders.","abstractZh":"放射性皮肤损伤（RSI）以持续性线粒体功能障碍和DNA修复机制受损为特征，给临床管理带来重大挑战。为此，我们构建了来源于人脐带间充质干细胞（hUMSCs）的富线粒体纳米囊泡（NVs），旨在将具有生物活性的线粒体组分递送至受照射皮肤组织。利用已建立的X射线诱导RSI的体外和体内模型，我们证明NVs可高效内化进入表皮和真皮细胞，从而恢复线粒体超微结构和代谢功能、减轻活性氧（ROS）并促进DNA损伤修复。数据非依赖采集（DIA）蛋白质组学分析进一步表明，NVs显著上调了照射后下调的关键DNA修复蛋白（包括POLD3、POLE4、RFC1和ERCC6），并激活PINK1-Parkin线粒体自噬通路。此外，NVs通过抑制DRP1介导的线粒体分裂和增强MFN1/2依赖的融合来恢复线粒体动力学，共同促进细胞稳态。这些发现支持开发一种同时靶向DNA修复和线粒体质量控制的、基于线粒体的无细胞纳米治疗策略，为RSI及潜在的其他放射性损伤疾病提供了一种可规模化且前景良好的治疗方法。","tier":"1区","if":10.2},
{"pmid":"40755898","topic":"糖尿病难愈创面","title":"AhR deficiency exacerbates inflammation in diabetic wounds via impaired mitophagy and cGAS-STING-NLRP3 activation: Therapeutic potential of hydrogels loaded with FICZ.","titleZh":"AhR缺陷通过线粒体自噬受损及cGAS-STING-NLRP3激活加重糖尿病创面炎症：载FICZ水凝胶的治疗潜力","journal":"Materials today. Bio","year":"2025","date":"2025-Oct","edat":"2025-08-04","authors":"Wang Y, Ni T, Zhang Q, Xu Z, Zhu Z","doi":"10.1016/j.mtbio.2025.102119","abstract":"Delayed healing of diabetic foot ulcers (DFUs) is driven by chronic inflammation and mitochondrial dysfunction. We identify the aryl hydrocarbon receptor (AhR) as a key regulator of immune and mitochondrial homeostasis in diabetic wounds. AhR expression was elevated in macrophages from human and murine DFUs. In AhR knockout mice, loss of AhR impaired M2 macrophage polarization and enhanced NLRP3 inflammasome activation via the cGAS-STING pathway. Mechanistically, AhR deficiency suppressed mitophagy, causing mitochondrial DNA leakage and sustained inflammatory signaling. To target this axis, we developed a FICZ-loaded GelMA hydrogel (GelMA-FICZ). Local application of GelMA-FICZ restored mitochondrial function, inhibited inflammasome activation, and significantly improved wound healing in diabetic mice. This study reveals a critical AhR-mitochondria-inflammasome pathway in DFUs and suggests a novel biomaterial-based immunomodulatory therapy for diabetic wound repair.","abstractZh":"糖尿病足溃疡（DFUs）的延迟愈合由慢性炎症和线粒体功能障碍驱动。我们发现芳香烃受体（AhR）是糖尿病创面免疫和线粒体稳态的关键调控因子。在人和小鼠DFUs来源的巨噬细胞中AhR表达升高。在AhR敲除小鼠中，AhR缺失损害M2巨噬细胞极化，并通过cGAS-STING通路增强NLRP3炎症小体激活。机制上，AhR缺陷抑制线粒体自噬，导致线粒体DNA泄漏和持续性炎症信号。为靶向这一轴，我们开发了载FICZ的GelMA水凝胶（GelMA-FICZ）。局部应用GelMA-FICZ恢复了线粒体功能、抑制炎症小体激活，并显著改善糖尿病小鼠的创面愈合。本研究揭示了DFUs中关键的AhR—线粒体—炎症小体通路，并提出了一种基于生物材料的新型免疫调节疗法用于糖尿病创面修复。","tier":"1区","if":10.2},
{"pmid":"42773598","topic":"整形医学","title":"Cationic Polylysine-Compensated Hydrogels Reduce Scar Formation of Scar-Prone Wounds via Immunomodulation and ECM Remodeling.","titleZh":"阳离子多聚赖氨酸补偿水凝胶通过免疫调节与ECM重塑减少易瘢痕创面的瘢痕形成","journal":"Advanced healthcare materials","year":"2026","date":"2026-Oct","edat":"2026-09-23","authors":"Zhao X, Wei B, Yi B, Li X, Dai W","doi":"10.1002/adhm.71728","abstract":"Abnormal wound healing in scar‑prone sites remains a clinical challenge, primarily due to excessive inflammation and disorganized extracellular matrix (ECM) remodeling. Herein, we developed an injectable, enzyme‑crosslinked hydrogel by incorporating cationic polylysine (PLys) into a transglutaminase‑crosslinked gelatin matrix. Mechanistically, the inclusion of PLys not only accelerated gelation kinetics but also enhanced mechanical performance via macromolecular crosslinking, while concurrently imparting self-healing capacity, robust tissue adhesion, and inherent antibacterial activity to the hydrogel. In vitro characterization demonstrated the hydrogel exhibited satisfactory biocompatibility, promoted fibroblast adhesion and spreading, and modulated ECM remodeling by upregulated expression of matrix metalloproteinase (MMPs). Furthermore, the hydrogel exerted significant immunomodulatory effects, as evidenced by increased expression of anti-inflammatory cytokines (IL-10, TGF-β, Arg-1) and pro-inflammatory mediators (TNF-α, IL-6), consistent with a controlled early inflammatory stimulus that promotes subsequent resolution. In a rabbit ear hypertrophic scar model, the hydrogel effectively improved scar outcome in scar-prone wounds, as reflected by reduced scar elevation, better-organized collagen architecture, suppressed myofibroblast accumulation, and favorable modulation of both inflammation-related and matrix-remodeling signaling pathways. Collectively, these findings indicate that cationic PLys-compensated hydrogels represent a promising therapeutic strategy for improving wound repair in scar‑prone tissues, acting through the coordinated regulation of key cellular and molecular processes.","abstractZh":"易瘢痕部位的异常创面愈合仍是临床难题，主要归因于过度炎症与细胞外基质（ECM）重塑紊乱。在此，我们将阳离子多聚赖氨酸（PLys）引入转谷氨酰胺酶交联的明胶基质，开发出一种可注射的酶交联水凝胶。在机制上，PLys 的引入不仅加快了凝胶化动力学，还通过大分子交联增强了力学性能，同时赋予水凝胶自愈合能力、牢固的组织黏附性和固有抗菌活性。体外表征显示，该水凝胶具有令人满意的生物相容性，促进成纤维细胞黏附与铺展，并通过上调基质金属蛋白酶（MMPs）的表达调控 ECM 重塑。此外，该水凝胶发挥显著的免疫调节作用，表现为抗炎细胞因子（IL-10、TGF-β、Arg-1）与促炎介质（TNF-α、IL-6）表达升高，这与一种可控的早期炎症刺激促进后续炎症消退的过程相一致。在兔耳增生性瘢痕模型中，该水凝胶有效改善了易瘢痕创面的瘢痕结局，表现为瘢痕隆起降低、胶原结构组织更佳、肌成纤维细胞积聚受抑，以及炎症相关与基质重塑信号通路的良好调控。综上，这些发现表明，阳离子 PLys 补偿水凝胶通过协调调控关键细胞与分子过程，是改善易瘢痕组织创面修复的一种有前景的治疗策略。","tier":"1区","if":10.0},
