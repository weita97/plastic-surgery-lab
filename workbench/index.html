{"pmid":"42761476","topic":"糖尿病难愈创面","title":"Electron-rearranged CuMg@ZIF nanoplatform for pH-Responsive sequential therapy: From infection eradication to neuroangiogenesis in diabetic wounds.","titleZh":"电子重排的CuMg@ZIF纳米平台用于pH响应序贯治疗：从糖尿病创面感染清除到神经血管生成","journal":"Bioactive materials","year":"2027","date":"2027-Feb","edat":"2026-09-19","authors":"Xie H, Zhang J, Liu K, Li D, Zhang C","doi":"10.1002/advs.202105650","abstract":"Pathological microenvironment of diabetic wounds greatly increases bacterial infection, hyperinflammation, vasculopathy and neuropathy, impeding wound healing. To address these issues, a Cu and Mg codoped ZIF-8 (CuMg@ZIF) nanoplatform with pH-responsive degradation and multi-enzyme activities (peroxidase (POD)-like activity, superoxide dismutase (SOD)- and catalase (CAT)- activity) was constructed. Density functional theory (DFT) calculations reveal that Cu and Mg doping induce stretching of metal-N bonds and electron rearrangement in ZIF framework, which enhance degradation and subsequent ion releasing in acidic microenvironment, and increase Cu+/Cu2+ ratio to improve multi-enzyme activities. CuMg@ZIF exhibits excellent antibacterial efficiencies (100% against S. aureus and 99.98% against E. coli) at a low concentration (50 μg/ml) via rapid metal ion releasing and •OH generation. After sterilization, the SOD- and CAT-like activities, along with the moderate release of ions from the CuMg@ZIF scavenge ROS and facilitate macrophage recovery and M2 phenotype polarization to inhibit inflammatory reaction and secrete anti-inflammatory cytokines, which further enhance the biofunctions of endothelial cells, neural cells, and fibroblasts. This study provides a promising pH sensitive therapy to eliminate infection, promote immunoregulation, neuroangiogenesis and ECM remodeling, thereby accelerating the diabetic wound repair process.","abstractZh":"糖尿病创面的病理性微环境显著增加了细菌感染、过度炎症、血管病变和神经病变，从而阻碍创面愈合。为解决这些问题，本研究构建了一种Cu与Mg共掺杂ZIF-8（CuMg@ZIF）纳米平台，该平台具有pH响应降解能力和多种酶活性（类过氧化物酶（POD）活性、超氧化物歧化酶（SOD）活性和过氧化氢酶（CAT）活性）。密度泛函理论（DFT）计算揭示，Cu和Mg掺杂诱导ZIF骨架中金属-N键的拉伸与电子重排，从而增强其在酸性微环境中的降解及随后的离子释放，并提高Cu+/Cu2+比值以改善多酶活性。CuMg@ZIF在低浓度（50 μg/ml）下通过快速释放金属离子和生成•OH，表现出优异的抗菌效率（对金黄色葡萄球菌100%，对大肠杆菌99.98%）。杀菌之后，CuMg@ZIF的类SOD和类CAT活性以及离子的适度释放可清除ROS，促进巨噬细胞恢复和M2表型极化，从而抑制炎症反应并分泌抗炎细胞因子，进一步增强内皮细胞、神经细胞和成纤维细胞的生物学功能。本研究提供了一种有前景的pH敏感治疗策略，可清除感染、促进免疫调节、神经血管生成和ECM重塑，从而加速糖尿病创面修复进程。","tier":"1区","if":18.0},
{"pmid":"42741683","topic":"糖尿病难愈创面","title":"Artificial intelligence-guided nanozyme engineering for chronic wound healing: from rational design to precision therapeutics.","titleZh":"人工智能引导的纳米酶工程用于慢性创面愈合：从理性设计到精准治疗","journal":"Bioactive materials","year":"2027","date":"2027-Feb","edat":"2026-09-15","authors":"Yang D, Zheng Z, Wang H, Zhao H, Li Z","doi":"10.1002/adma.202305249","abstract":"Chronic non-healing wounds remain a major clinical challenge, with limited therapeutic efficacy and a huge burden on patients. Nanozymes have emerged as promising bioactive platforms for wound repair by modulating reactive oxygen species, immune responses, angiogenesis, and antimicrobial defense. However, traditional nanozyme development primarily relies on empirical approaches, resulting in limited functional specificity and suboptimal therapeutic outcomes. Recent advances in artificial intelligence (AI) have provided promising alternatives to overcome these limitations and accelerate the rational engineering of nanozymes. This review proposes a pathology-informed design framework that links wound-specific therapeutic needs to nanozyme screening, function optimization, and iterative refinement. We synthesize current progress in AI-enabled material discovery and structure-activity prediction, function-oriented and multiobjective optimization, development of stimuli-responsive systems, and elucidation of biological mechanisms. We further examine how these approaches support pathology-guided functional matching, coordination of multifunctional interventions, treatment monitoring, and closed-loop feedback optimization. Key challenges include heterogeneous and biased datasets, limited model generalizability, weak correlation between in vitro catalytic metrics and in vivo efficacy, insufficient wound-relevant endpoints, and incomplete long-term safety assessments. Future work should strengthen the links among material properties, catalytic behavior, and tissue-repair outcomes, while incorporating pathological conditions, delivery systems, and therapeutic feedback into model optimization.","abstractZh":"慢性难愈创面仍是重大临床挑战，治疗效果有限，给患者带来沉重负担。纳米酶通过调控活性氧、免疫应答、血管生成和抗菌防御，已成为用于创面修复的有前景的生物活性平台。然而，传统纳米酶的开发主要依赖经验性方法，导致功能特异性有限、治疗效果欠佳。人工智能（artificial intelligence，AI）的最新进展为克服这些局限、加速纳米酶的理性工程化提供了有前景的替代途径。本综述提出一个以病理为导向的设计框架，将创面特异性的治疗需求与纳米酶筛选、功能优化和迭代改进相衔接。我们系统总结了AI赋能材料发现与构效关系预测、面向功能的多目标优化、刺激响应系统的开发以及生物学机制阐明等方面的最新进展。我们进一步探讨了这些方法如何支持病理引导的功能匹配、多功能干预的协同、治疗监测和闭环反馈优化。关键挑战包括数据集异质且存在偏倚、模型泛化能力有限、体外催化指标与体内疗效相关性弱、与创面相关的终点指标不足，以及长期安全性评价不完整。未来工作应加强材料性质、催化行为与组织修复结局之间的联系，同时将病理条件、递送系统和治疗反馈纳入模型优化。","tier":"1区","if":18.0},
{"pmid":"42741660","topic":"糖尿病难愈创面","title":"Engineering bioactive citrate-based hydrogels for wound repair: From structure-function design to microenvironmental regulation.","titleZh":"工程化柠檬酸基水凝胶用于创面修复：从结构-功能设计到微环境调控","journal":"Bioactive materials","year":"2027","date":"2027-Feb","edat":"2026-09-15","authors":"Zhang L, Lei B, Zhao H","doi":"10.1038/s41551-025-01440-6","abstract":"Chronic non-healing wounds, characterized by a complex microenvironment of persistent infection, chronic inflammation, and defective angiogenesis, pose a significant hurdle to regenerative medicine. Citrate-based chemistry has emerged as a sophisticated platform for engineering bio-instructive materials due to its versatile crosslinking chemistry and intrinsic metabolic bioactivity. This review provides a comprehensive appraisal of hydrogels constructed from citrate-based polymers (PC hydrogels) as a high-performance therapeutic toolkit for wound orchestration. Guided by the biological imperatives of the skin-healing cascade, we delineate the network construction mechanisms and structure-function relationships of PC hydrogels, together with the molecular mechanisms underlying their regulation of the wound microenvironment. On this basis, a modular classification of PC hydrogels is proposed. It encompasses seven functional paradigms including antimicrobial, antioxidant, and pro-angiogenic activities, with a critical focus on their structure-property-function relationships. Finally, we identify the existing bottlenecks in clinical translation and offer strategic perspectives on next-generation PC platforms, emphasizing precision design, mechanistic elucidation through multi-omics, and standardized manufacturing. This work aims to catalyze the development of intelligent, translation-ready PC wound dressings for complex tissue repair.","abstractZh":"慢性难愈创面以持续感染、慢性炎症和血管生成缺陷构成的复杂微环境为特征，是再生医学面临的重大障碍。柠檬酸基化学凭借其多样的交联化学和内在的代谢生物活性，已成为工程化生物指导性材料的一种精巧平台。本综述对由柠檬酸基聚合物构建的水凝胶（PC水凝胶）作为创面调控的高性能治疗工具进行了全面评价。以皮肤愈合级联反应的生物学需求为导向，我们阐述了PC水凝胶的网络构建机制与结构-功能关系，以及其调控创面微环境的分子机制。在此基础上，提出了PC水凝胶的模块化分类。该分类涵盖七种功能范式，包括抗菌、抗氧化和促血管生成活性，并重点聚焦其结构-性质-功能关系。最后，我们指出了临床转化中存在的瓶颈，并就下一代PC平台提出战略性展望，强调精准设计、通过多组学阐明机制以及标准化制造。本工作旨在推动面向复杂组织修复的智能化、可转化PC创面敷料的开发。","tier":"1区","if":18.0},
{"pmid":"42775102","topic":"糖尿病难愈创面","title":"Zinc silicate microspheres-mediated bacterial metabolic interference and microenvironment remodeling for chronic wound repair.","titleZh":"硅酸锌微球介导细菌代谢干预与微环境重塑促进慢性创面修复","journal":"Bioactive materials","year":"2027","date":"2027-Jan","edat":"2026-09-23","authors":"Deng F, Liu Z, Shao Y, Chen X, Zhang K","doi":"10.1142/S179354582442001x","abstract":"Chronic wounds have presented a significant clinical challenge due to persistent infection, uncontrolled inflammation, and impaired tissue regeneration. Existing therapeutic platforms have failed to integrate these critical aspects into a single, cohesive strategy. To address this, a novel multifaceted agent, zinc silicate flower-like microsphere (ZnSi FMPs), was designed with controlled hierarchical architecture to achieve chronic wound repair by mediating bacterial metabolic interference and microenvironment remodeling. The unique nanosheet structure with sustained Zn2+ release endows ZnSi FMPs with favorable pH-independent antibacterial activity. This activity is mechanistically rooted in metabolic interference against Staphylococcus aureus (S. aureus), including disruption of ABC transporters and inhibition of the biosynthesis of essential amino acids (valine, leucine, isoleucine) and ribosomes. Concurrently, ZnSi FMPs can promote microenvironment remodeling by modulating inflammatory responses and angiogenesis, evidenced by suppressed inflammation mediated by the complement and coagulation cascades pathway and robust activation of the Areg/HB-EGF-mediated ErbB signaling pathway. Hence, in both S. aureus-infected and diabetic wound models (mice and minipigs), ZnSi FMPs exhibited superior chronic wound healing capacity compared with commercial silver sulfadiazine® (AgSD) and 45S5 bioglass®. This improved healing was achieved through enhanced antibacterial activity, anti-inflammatory effects, and angiogenesis, accompanied by elevated expression of CD163, CD206, CD31 and α-SMA. By synergizing bacterial metabolic interference with microenvironment regulation, ZnSi FMPs effectively facilitate tissue healing and provide a promising candidate for clinical wound treatment.","abstractZh":"由于持续感染、失控的炎症和组织再生受损，慢性创面已成为重大临床挑战。现有治疗平台未能将这些关键方面整合为单一、协调的策略。为此，本研究设计了一种新型多功能制剂——硅酸锌花状微球（ZnSi FMPs），其具有可控的多级结构，通过介导细菌代谢干预和微环境重塑实现慢性创面修复。独特的纳米片结构及Zn2+的持续释放赋予ZnSi FMPs良好的非pH依赖性抗菌活性。该活性在机制上源于对金黄色葡萄球菌（S. aureus）的代谢干预，包括破坏ABC转运蛋白以及抑制必需氨基酸（缬氨酸、亮氨酸、异亮氨酸）和核糖体的生物合成。同时，ZnSi FMPs可通过调节炎症反应和血管生成促进微环境重塑，其证据为补体与凝血级联通路介导的炎症受到抑制，以及Areg/HB-EGF介导的ErbB信号通路被强烈激活。因此，在金黄色葡萄球菌感染创面模型和糖尿病创面模型（小鼠与小型猪）中，ZnSi FMPs表现出优于市售磺胺嘧啶银（AgSD）和45S5生物玻璃的慢性创面愈合能力。这种改善的愈合通过增强的抗菌活性、抗炎作用和血管生成实现，并伴随CD163、CD206、CD31和α-SMA表达升高。通过将细菌代谢干预与微环境调控协同起来，ZnSi FMPs有效促进组织愈合，为临床创面治疗提供了有前景的候选材料。","tier":"1区","if":18.0},
{"pmid":"42701667","topic":"外泌体","title":"An adhesive hydrogel enabling spatiotemporal delivery of umbilical cord exosomes for scarless skin regeneration through immunomodulation and ECM remodeling.","titleZh":"黏附性水凝胶时空递送脐带外泌体经免疫调节与ECM重塑实现无瘢痕皮肤再生","journal":"Bioactive materials","year":"2027","date":"2027-Jan","edat":"2026-09-06","authors":"Zhang Y, Xie J, Li J, Li F, Ci Z","doi":"10.1186/s12951-026-04710-w","abstract":"The regenerative repair of full-thickness skin defects remains a formidable clinical challenge, often culminating in pathological scarring because conventional dressings lack the functionality to balance robust adhesion with mechanical compliance and actively direct tissue regeneration. To address this, we propose an adhesive dual-network hydrogel (GelMA-PBA/HANB/HepMA) via the synergistic integration of dynamic boronic ester bonds and photo-triggered imine crosslinking, while serving as a smart depot for sustained delivery of umbilical cord-derived exosomes (uExos). This system orchestrates a pro-regenerative niche by polarizing macrophages to a pro-healing phenotype and enhancing endothelial angiogenesis, thereby accelerating wound closure and re-epithelialization in a mouse full-thickness defect model. Crucially, in a rigorous rabbit ear hypertrophic scar model, treatment significantly reduces the Scar Elevation Index (SEI) and restores a physiological collagen architecture, evidenced by an increased Col III/I ratio and reduced bulge angle. Importantly, uExos promote scarless healing involved in extracellular matrix remodeling and balanced collagen deposition. By strategically combining smart adhesive materials with cell-free exosome therapy, this study offers a promising strategy for regenerative wound healing and scar prevention.","abstractZh":"全层皮肤缺损的再生修复仍是艰巨的临床挑战，常最终导致病理性瘢痕，因为传统敷料缺乏在强黏附与力学顺应性之间取得平衡并主动引导组织再生的功能。为此，我们提出一种黏附性双网络水凝胶（GelMA-PBA/HANB/HepMA），其通过动态硼酸酯键与光触发亚胺交联的协同整合而构建，同时作为持续递送脐带来源外泌体（uExos）的智能储库。该系统通过将巨噬细胞极化为促愈合表型并增强内皮血管生成，营造促再生生态位，从而在小鼠全层缺损模型中加速创面闭合与再上皮化。关键的是，在严格的兔耳增生性瘢痕模型中，该治疗显著降低瘢痕隆起指数（Scar Elevation Index，SEI）并恢复生理性胶原结构，其证据为Col III/I比值升高和隆起角度减小。重要的是，uExos通过参与细胞外基质重塑和胶原沉积平衡促进无瘢痕愈合。通过将智能黏附材料与无细胞外泌体治疗策略性结合，本研究为再生性创面愈合和瘢痕预防提供了一种有前景的策略。","tier":"1区","if":18.0},
{"pmid":"42668467","topic":"创面修复","title":"Supramolecular engineering of fibrinogen into a fibrin matrix with enhanced bioactive properties.","titleZh":"超分子工程化纤维蛋白原构建生物活性增强的纤维蛋白基质","journal":"Bioactive materials","year":"2027","date":"2027-Jan","edat":"2026-08-30","authors":"Laurenza D, Macrae FL, Sapjanskaite I, Hartley A, Pramanik B","doi":"10.1097/jp9.0000000000000024","abstract":"Fibrin, a crucial component in blood coagulation, supports wound healing by providing mechanical support, binding growth factors, and promoting the growth of different cell types. Here, we present an innovative approach to use peptide amphiphiles (PAs) as supramolecular organisers to guide fibrinogen polymerisation into fibrinogen-PA (FibPA) networks with hierarchically ordered morphologies and enhanced bioactive properties. PA-E3 (C15H31CONH-VVVAAAEEE-CONH2) and PA-E3Q (C15H31CONH-VVVAAAEEEQ-CONH2) were used to explore non-covalent PA-fibrinogen interactions to assemble fibrinogen into novel fibrin oligomers, thereby enabling control over the mechanical and functional properties of the resulting network. FibPAs were used to produce hierarchically ordered fibrin-based networks characterised by higher porosity and controllable fibres dimension. These changes, together with the structural modification detected by SDS-PAGE, produce more brittle networks with preserved FXIIIa-mediated cross-linking and stiffness, and enhanced TGF-β1 and VEGF binding capacity compared to natural fibrin. FibPA-derived networks were shown to support the growth of bone marrow-derived mesenchymal stem cells (BM-MSCs) and direct their paracrine signalling towards increased pro-angiogenic potential and enhanced TGF-β1 release. This approach leverages supramolecular interactions to control the structure and bioactivity of fibrin networks, opening new possibilities for the bottom-up engineering of functional fibrin-based matrices.","abstractZh":"纤维蛋白是血液凝固中的关键成分，通过提供机械支撑、结合生长因子和促进多种细胞类型生长来支持创面愈合。在此，我们提出一种创新方法，利用肽两亲分子（peptide amphiphiles，PAs）作为超分子组织者，引导纤维蛋白原聚合形成具有多级有序形貌和增强生物活性的纤维蛋白原-PA（FibPA）网络。采用PA-E3（C15H31CONH-VVVAAAEEE-CONH2）和PA-E3Q（C15H31CONH-VVVAAAEEEQ-CONH2）探究PA与纤维蛋白原之间的非共价相互作用，将纤维蛋白原组装为新型纤维蛋白寡聚体，从而实现对所得网络力学与功能性质的控制。利用FibPAs制备了多级有序的纤维蛋白基网络，其特征为更高的孔隙率和可控的纤维尺寸。这些变化连同SDS-PAGE检测到的结构改变，使网络相比天然纤维蛋白更脆，但保留了FXIIIa介导的交联和刚度，并增强了TGF-β1与VEGF的结合能力。FibPA来源的网络被证明可支持骨髓间充质干细胞（BM-MSCs）生长，并引导其旁分泌信号朝向更强的促血管生成潜能和增强的TGF-β1释放。该方法利用超分子相互作用调控纤维蛋白网络的结构与生物活性，为功能性纤维蛋白基基质自下而上的工程化构建开辟了新可能。","tier":"1区","if":18.0},
{"pmid":"42633435","topic":"糖尿病难愈创面","title":"Photothermal-magnetic dual-activated Janus dressing for microenvironment purification and wireless electrically triggered healing with reduced scar formation.","titleZh":"光热-磁双激活Janus敷料用于微环境净化与无线电触发愈合并减少瘢痕形成","journal":"Bioactive materials","year":"2027","date":"2027-Jan","edat":"2026-08-23","authors":"Zhou F, Zhao W, Zhu Z, Wang S, Tang L","doi":"10.1126/sciadv.adv9895","abstract":"Hypertrophic scarring remains a major clinical challenge that impedes functional wound regeneration. Although electrical stimulation (ES) shows great promise in activating endogenous repair pathways and suppressing fibrosis, excessive exudate and bacterial infection in chronic wounds not only exacerbate inflammation but also disrupt interfacial electrical contact, thereby attenuating the efficacy of in situ-generated ES. To address this, we designed an electroactive and antibacterial Janus dressing that integrated active microenvironmental purification with wireless ES, ultimately inhibiting scar formation during wound healing. The dressing featured electroactive cotton gauze with asymmetric wettability, achieved via SiO2 and AgNPs@poly 5-hydroxytryptamine/polyethyleneimine (AgNPs@PHT/PEI) coatings to form a unidirectional fluidic gate. Enhanced by a near-infrared-driven mild photothermal effect, this design enabled rapid exudate pumping and evaporation while achieving > 99% antibacterial efficacy within 15 min. Leveraging electromagnetic induction, it delivered tunable wireless microcurrents (13.44-43.18 μA) that upregulated endogenous fibroblast growth factor 2 (FGF2) secretion, which contributes to the downregulation of TGF-β1-driven myofibroblast activation, as evidenced by reduced α-SMA expression. This strategy achieved 99.37% closure of large infected full-thickness rat wounds, featuring highly ordered collagen remodeling. Collectively, this study presents an innovative platform for rapid healing and scar inhibition in chronic wounds, holding promise for broader applications in mitigating fibrotic disorders.","abstractZh":"增生性瘢痕仍是阻碍功能性创面再生的重大临床挑战。尽管电刺激（electrical stimulation，ES）在激活内源性修复通路和抑制纤维化方面展现出很大前景，但慢性创面中过多的渗出液和细菌感染不仅加剧炎症，还破坏界面电接触，从而削弱原位生成ES的疗效。为此，我们设计了一种电活性抗菌Janus敷料，将主动微环境净化与无线ES整合，最终在创面愈合过程中抑制瘢痕形成。该敷料以具有不对称润湿性的电活性棉纱布为特征，通过SiO2和AgNPs@聚5-羟色胺/聚乙烯亚胺（AgNPs@PHT/PEI）涂层形成单向流体门控。在近红外驱动的温和光热效应增强下，该设计实现了渗出液的快速泵出与蒸发，同时在15 min内达到> 99%的抗菌效率。借助电磁感应，该敷料可输出可调的无线微电流（13.44-43.18 μA），上调内源性成纤维细胞生长因子2（FGF2）分泌，进而促进TGF-β1驱动的肌成纤维细胞活化下调，其证据为α-SMA表达降低。该策略使大鼠大型感染性全层创面实现99.37%的闭合，并伴有高度有序的胶原重塑。总体而言，本研究提出了一种用于慢性创面快速愈合与瘢痕抑制的创新平台，有望在减轻纤维化疾病方面获得更广泛的应用。","tier":"1区","if":18.0},
{"pmid":"42631109","topic":"创面修复","title":"Magnetically responsive electrospun fibers as programmable bioactive scaffolds: From formulation design to magnetically triggered therapy and regeneration.","titleZh":"磁响应静电纺纤维作为可编程生物活性支架：从配方设计到磁触发治疗与再生","journal":"Bioactive materials","year":"2027","date":"2027-Jan","edat":"2026-08-22","authors":"Trital A, Ates B, Gilbert RJ","doi":"10.3390/nano9101457","abstract":"Magnetically responsive electrospun fibers (MREFs) represent an emerging class of active soft materials designed to control where, when, and how fast a therapeutic agent or biophysical cue is delivered. Unlike conventional electrospun fibers, whose release and mechanical behavior are fixed at fabrication, MREFs can be manipulated after implantation, using an applied magnetic field to generate localized heating, mechanical deformation, structural reorientation, magnetic guidance, or triggers thermoresponsive release. This review compares MREF compositions, fabrication strategies, and magnetothermal, magneto-mechanical, and magnetic-guidance mechanisms across applications in cancer therapy, tissue regeneration, wound healing, and theranostics and critically evaluates key translational barriers, safety, and regulatory requirements. Current evidence suggests that localized and surface-accessible treatments are the most realistic near-term clinical applications.","abstractZh":"磁响应静电纺纤维（magnetically responsive electrospun fibers，MREFs）代表一类新兴的活性软材料，旨在控制治疗药物或生物物理信号在何处、何时以及以多快速度递送。与释放行为和力学行为在制备时即已固定的传统静电纺纤维不同，MREFs可在植入后被操控，利用外加磁场产生局部产热、机械形变、结构重取向、磁引导，或触发温度响应性释放。本综述比较了MREFs的组成、制备策略以及磁热、磁机械和磁引导机制在肿瘤治疗、组织再生、创面愈合和诊疗一体化中的应用，并批判性地评价了关键的转化壁垒、安全性和监管要求。现有证据提示，局部化且表面可及的治疗方式是最具现实可行性的近期临床应用方向。","tier":"1区","if":18.0},
{"pmid":"42620350","topic":"外泌体","title":"A multifunctional DECM/PLMA hydrogel incorporated with engineered PRP-derived exosomes enabling PHD2 silencing for skin wound repair.","titleZh":"负载工程化PRP来源外泌体并沉默PHD2的多功能DECM/PLMA水凝胶用于皮肤创面修复","journal":"Bioactive materials","year":"2027","date":"2027-Jan","edat":"2026-08-20","authors":"Du X, Li D, He H, Yuan G, Liu P","doi":"10.1111/dom.70612","abstract":"Skin defect repair remains a formidable clinical challenge, characterized by persistent infection risk, compromised angiogenesis, and dysregulated inflammatory responses. Existing hydrogel-based wound dressings fail to simultaneously address structural integrity, antimicrobial efficacy, and spatiotemporal coordination of tissue regeneration. Here, we report the development of a multifunctional bioactive hydrogel system fabricated by integrating decellularized tendon extracellular matrix (DECM) with Poly-L-lysine Methacryloyl (PLMA), and further functionalized with engineered platelet-rich plasma exosomes (PRP-Exos) loaded with siRNA targeting prolyl hydroxylase domain protein 2 (PHD2) via electroporation. The inherent cationic nature of PLMA confers robust, broad-spectrum antibacterial activity, while the sustained release of siRNA-PHD2-laden PRP-Exos achieves efficient PHD2 silencing, thereby stabilizing hypoxia-inducible factor-1α (HIF-1α) and potentiating downstream pro-angiogenic signaling. Concurrently, bioactive cues released from the DECM-based matrix promote fibroblast-to-myofibroblast differentiation and type I collagen biosynthesis, fostering a regeneration-permissive microenvironment. In both normal and diabetic murine full-thickness skin defect models, DEPL@E-SI significantly accelerated wound closure by promoting angiogenesis, inflammation resolution, and extracellular matrix remodeling. These findings establish DEPL@E-SI as a promising therapeutic platform with translational potential for skin tissue engineering and clinical wound management.","abstractZh":"皮肤缺损修复仍是艰巨的临床挑战，其特征为持续存在的感染风险、血管生成受损和炎症反应失调。现有的水凝胶类创面敷料无法同时兼顾结构完整性、抗菌效能以及组织再生的时空协调。在此，我们报道一种多功能生物活性水凝胶系统的开发，该系统通过将脱细胞肌腱细胞外基质（DECM）与聚左旋赖氨酸甲基丙烯酰基（PLMA）整合制备，并进一步通过电穿孔负载靶向脯氨酰羟化酶结构域蛋白2（PHD2）的siRNA的工程化富血小板血浆外泌体（PRP-Exos）进行功能化。PLMA固有的阳离子性质赋予其强效广谱抗菌活性，而负载siRNA-PHD2的PRP-Exos的持续释放实现了高效的PHD2沉默，从而稳定缺氧诱导因子-1α（HIF-1α）并增强下游促血管生成信号。同时，DECM基基质释放的生物活性信号促进成纤维细胞向肌成纤维细胞分化及I型胶原生物合成，营造有利于再生的微环境。在正常和糖尿病小鼠全层皮肤缺损模型中，DEPL@E-SI均通过促进血管生成、炎症消退和细胞外基质重塑显著加速创面闭合。这些发现确立了DEPL@E-SI作为一种有前景的治疗平台，在皮肤组织工程和临床创面管理方面具有转化潜力。","tier":"1区","if":18.0},
{"pmid":"42780631","topic":"线粒体自噬","title":"Ultrasound-activated piezoelectric patch enhances mitophagy and synergistic anti-inflammation to promote neurological repair after TBI.","titleZh":"超声激活压电贴片增强线粒体自噬与协同抗炎促进创伤性脑损伤后神经修复","journal":"Bioactive materials","year":"2027","date":"2027-Feb","edat":"2026-09-24","authors":"Li W, Huang R, Wu Q, Zhou P, Ren D","doi":"10.1186/s12964-020-00549-2","abstract":"Mitochondrial dysfunction following traumatic brain injury (TBI) is a central pathological driver of secondary neuronal damage and neuroinflammation. Mitophagy, a key mitochondrial quality control mechanism, is essential for maintaining neuronal homeostasis and promoting injury repair. However, achieving spatiotemporally precise regulation of mitophagy while simultaneously modulating the neuroimmune microenvironment remains a major challenge. Here, we design an implantable piezoelectric patch that, upon activation by low-intensity pulsed ultrasound (LIPUS), generates controllable local electrical signals at the injury site and directly acts on damaged neurons. The patch predominantly upregulates Piezo1-sensitive mechanotransduction and induces a transient elevation of mitochondrial Ca2+, thereby contributing to enhanced PINK1/Parkin-associated mitophagy flux. This facilitates the clearance of damaged mitochondria, restores mitochondrial membrane potential, and alleviates oxidative neuronal injury (apoptosis rate reduced from 30.42% to 11.78%). Concurrently, the treatment reduces mitochondrial DNA (mtDNA) leakage and the release of pro-inflammatory factors, driving microglial polarization toward the protective M2 phenotype and remodeling the neuroimmune microenvironment. In a mouse model of TBI, this synergistic strategy significantly suppresses neuronal apoptosis, reduces brain tissue loss, increases neuronal survival in the peri-lesional area (3.5-fold increase in NeuN mean fluorescence intensity compared to the TBI group), and decreases glial scar formation, ultimately leading to substantial improvements in motor and cognitive functions. This study presents a piezoelectric-based strategy for TBI therapy that couples mitophagy regulation with neuroimmune remodeling, offering new insights into materials design and potential translational avenues for precise repair of central nervous system injuries.","abstractZh":"创伤性脑损伤（TBI）后的线粒体功能障碍是继发性神经元损伤与神经炎症的核心病理驱动因素。线粒体自噬作为一种关键的线粒体质量控制机制，对维持神经元稳态和促进损伤修复至关重要。然而，在时空上精确调控线粒体自噬的同时调节神经免疫微环境仍是一大挑战。在此，我们设计了一种可植入压电贴片，在低强度脉冲超声（LIPUS）激活下，于损伤部位产生可控的局部电信号，并直接作用于受损神经元。该贴片主要上调 Piezo1 敏感的机械转导，并诱导线粒体 Ca2+ 短暂升高，从而促进 PINK1/Parkin 相关线粒体自噬流增强。这有利于清除受损线粒体、恢复线粒体膜电位并减轻氧化性神经元损伤（凋亡率由 30.42% 降至 11.78%）。同时，该治疗减少线粒体 DNA（mtDNA）泄漏和促炎因子释放，驱动小胶质细胞向保护性 M2 表型极化并重塑神经免疫微环境。在 TBI 小鼠模型中，该协同策略显著抑制神经元凋亡、减少脑组织丢失、提高病灶周围区域神经元存活（与 TBI 组相比 NeuN 平均荧光强度增加 3.5 倍），并减少胶质瘢痕形成，最终使运动与认知功能获得显著改善。本研究提出了一种将线粒体自噬调控与神经免疫重塑相耦合的压电基 TBI 治疗策略，为材料设计提供了新思路，并为中枢神经系统损伤的精准修复提供了潜在的转化途径。","tier":"1区","if":18.0},
{"pmid":"42927122","topic":"外泌体","title":"Targeting the lactate/P300/H3K18la epigenetic pathway with a mechanoadaptive biomimetic hydrogel to suppress traumatic tendon heterotopic ossification.","titleZh":"以力学适应性仿生水凝胶靶向乳酸/P300/H3K18la 表观遗传通路抑制创伤性肌腱异位骨化","journal":"Bioactive materials","year":"2027","date":"2027-Mar","edat":"2026-10-25","authors":"Feng H, Ang K, Deng Z, Cui C, Chen J","doi":"10.3390/ijms231810530","abstract":"Traumatic heterotopic ossification (HO) is a debilitating complication of tendon injury, yet its pathogenic mechanisms remain elusive and effective preventive strategies are lacking. Here, we identify a glycometabolic-epigenetic axis that drives HO progression. Single-cell profiling and functional analyses reveal that hypoxic chondrocytes undergo glycolytic reprogramming, leading to lactate accumulation and transfer into tendon-derived mesenchymal stem cells (TD-MSCs) through MCT1. This metabolic coupling promotes P300-dependent histone H3 lysine 18 lactylation (H3K18la), activating osteogenic programs characterized by Col6a1, Zhx3, Lox and Vdr expression and thereby facilitating pathological endochondral ossification. Guided by this mechanism, we develop a tendon-adhesive hydrogel (GelHA-A485@Exos) that integrates mechanical repair with targeted epigenetic modulation. MSC-derived exosomes enable localized delivery of the P300 inhibitor A485, suppressing H3K18la and aberrant osteogenic activation, while the hydrogel scaffold enhances tendon regeneration. In vivo and in vitro studies demonstrate that GelHA-A485@Exos promotes tendon healing while preventing HO formation. Our findings establish metabolic-epigenetic communication as a central regulator of traumatic HO and provide a translational therapeutic strategy for its clinical prevention.","abstractZh":"创伤性异位骨化（HO）是肌腱损伤后一种致残性并发症，但其致病机制仍不清楚，且缺乏有效的预防策略。在此，我们鉴定出一条驱动 HO 进展的糖代谢-表观遗传轴。单细胞图谱分析和功能分析显示，缺氧软骨细胞发生糖酵解重编程，导致乳酸蓄积并通过 MCT1 转运进入肌腱来源间充质干细胞（TD-MSCs）。这种代谢耦联促进 P300 依赖的组蛋白 H3 第 18 位赖氨酸乳酸化（H3K18la），激活以 Col6a1、Zhx3、Lox 和 Vdr 表达为特征的成骨程序，从而促进病理性软骨内成骨。在这一机制指导下，我们开发了一种肌腱黏附性水凝胶（GelHA-A485@Exos），将力学修复与靶向表观遗传调控相结合。MSC 来源外泌体可实现 P300 抑制剂 A485 的局部递送，抑制 H3K18la 和异常成骨激活，而水凝胶支架则促进肌腱再生。体内和体外研究均表明，GelHA-A485@Exos 可促进肌腱愈合，同时防止 HO 形成。我们的研究确立了代谢-表观遗传通讯是创伤性 HO 的核心调控因素，并为其临床预防提供了一种可转化的治疗策略。","tier":"1区","if":18.0},
{"pmid":"42571503","topic":"外泌体","title":"Y-RBCEVs accelerate fracture repair through osteogenesis and VCAN-mediated CD44/PI3K/AKT-dependent macrophage polarization.","titleZh":"年轻红细胞来源细胞外囊泡通过成骨作用及 VCAN 介导的 CD44/PI3K/AKT 依赖性巨噬细胞极化加速骨折修复","journal":"Bioactive materials","year":"2027","date":"2027-Jan","edat":"2026-08-09","authors":"Wang J, Zhang X, Zhang Q, Xiao J, Li S","doi":"10.1016/j.bioactmat.2026.07.047","abstract":"OBJECTIVE: To investigate the effects of young human red blood cell-derived extracellular vesicles (Y-RBCEVs) on fracture healing. METHODS: Associations of RBC-related indicators with bone mineral density and mortality in fracture populations were analyzed using NHANES data (1999-2020). A murine femoral fracture model was established to investigate RBC transfusion effects. Y-RBCEVs and O-RBCEVs were isolated to examine their effects on osteogenic differentiation and BMM polarization in vitro. In vivo distribution was assessed by IVIS, and therapeutic efficacy was evaluated in fracture mice. Proteomic sequencing identified differentially expressed proteins between Y-RBCEVs and O-RBCEVs, and key protein function was investigated by transcriptomic analysis and in vitro validation. RESULTS: The observational study revealed associations between RBC count and bone mineral density with fracture populations mortality. RBC transfusion modulated the expression of osteogenic and M2 macrophage polarization-related genes. In vitro, RBCEVs were efficiently internalized by BMSCs and BMMs, with Y-RBCEVs enhancing osteogenic activity in BMSCs and promoting M2 macrophage polarization, thereby partially restoring osteogenesis impaired by inflammatory conditions. In vivo, Y-RBCEVs accumulated at fracture sites and enhanced bone regeneration without detectable toxicity, accompanied by increased OCN and CD206 expression. Proteomic analysis identified VCAN as one of the potential functional cargos. Mechanistically, Y-RBCEV-derived VCAN interacted with CD44 on macrophages and was associated with activation of the PI3K/AKT pathway, contributing to M2 polarization. CONCLUSION: Y-RBCEVs enhance fracture repair by modulating osteogenesis and macrophage polarization, with VCAN-associated CD44/PI3K/AKT signaling contributing to their osteo-immunomodulatory effects. These findings highlight RBCEVs as a potential therapeutic strategy for bone regeneration.","abstractZh":"目的：探讨年轻人类红细胞来源细胞外囊泡（Y-RBCEVs）对骨折愈合的影响。方法：利用 NHANES 数据（1999—2020 年）分析骨折人群中红细胞相关指标与骨密度及死亡率的关联。建立小鼠股骨骨折模型以研究红细胞输注的影响。分离 Y-RBCEVs 与 O-RBCEVs，在体外考察其对成骨分化和骨髓来源巨噬细胞（BMM）极化的影响。采用 IVIS 评估体内分布，并在骨折小鼠中评价治疗效果。蛋白质组测序鉴定了 Y-RBCEVs 与 O-RBCEVs 之间的差异表达蛋白，并通过转录组分析和体外验证研究了关键蛋白的功能。结果：观察性研究揭示了红细胞计数和骨密度与骨折人群死亡率之间的关联。红细胞输注调节了成骨和 M2 型巨噬细胞极化相关基因的表达。体外实验中，RBCEVs 可被 BMSCs 和 BMMs 高效内化，其中 Y-RBCEVs 增强 BMSCs 的成骨活性并促进 M2 型巨噬细胞极化，从而部分恢复被炎症状态损害的成骨作用。体内实验中，Y-RBCEVs 在骨折部位蓄积并增强骨再生，未检测到毒性，同时伴有 OCN 和 CD206 表达升高。蛋白质组分析确定 VCAN 是潜在的功能性货物分子之一。机制上，Y-RBCEV 来源的 VCAN 与巨噬细胞表面的 CD44 相互作用，并与 PI3K/AKT 通路的激活相关，从而促进 M2 极化。结论：Y-RBCEVs 通过调节成骨和巨噬细胞极化促进骨折修复，其中 VCAN 相关的 CD44/PI3K/AKT 信号参与其骨免疫调节效应。这些发现凸显了 RBCEVs 作为骨再生潜在治疗策略的价值。","tier":"1区","if":18.0},
{"pmid":"42598656","topic":"糖尿病难愈创面","title":"Biomaterial-based extracellular vesicle delivery systems for wound healing: From fabrication to applications.","titleZh":"基于生物材料的细胞外囊泡递送系统用于创面愈合：从制备到应用","journal":"Bioactive materials","year":"2026","date":"2026-Dec","edat":"2026-08-14","authors":"Chen S, Zhao Z, Tian L, Cui S, Liu X","doi":"10.1016/j.bioactmat.2026.06.042","abstract":"Skin damage, especially chronic wounds, imposes a significant clinical burden due to the associated risks of disability and death. Extracellular vesicles (EVs) have received extensive attention due to their potential in wound healing. However, the rapid clearance and short retention time of EVs at wound sites hinder the optimal therapeutic effects. The latest advancements in biomaterial delivery systems have spurred the rapid development of engineered EV delivery systems. These biomaterials can not only prolong the localization and stability of EVs in wounds, but also provide structural and biochemical support for cell growth and tissue regeneration. This review provides a comprehensive overview of EVs and the fabrication strategies of EV delivery systems with diverse application forms. The release mechanisms, release profiles, mathematical kinetic models of EVs from biomaterials are also discussed. The application of these EV-loaded biomaterials in treating various types of wounds is also summarized and discussed. Finally, current challenges and future directions in EV-based wound treatment are proposed. Unlike previous reviews that focused separately on the biology of EVs or biomaterials as wound dressings, this review presents a comprehensive summary of the fabrication strategies and applications of advanced biomaterial-based EV delivery platforms for wound healing.","abstractZh":"皮肤损伤，尤其是慢性创面，因伴随残疾与死亡风险而带来沉重的临床负担。细胞外囊泡（EVs）因其在创面愈合中的潜力而受到广泛关注。然而，EVs 在创面部位被快速清除、滞留时间短，阻碍了其最佳治疗效果的发挥。生物材料递送系统的最新进展推动了工程化 EV 递送系统的快速发展。这些生物材料不仅能延长 EVs 在创面中的滞留与稳定性，还能为细胞生长和组织再生提供结构与生化支持。本综述全面概述了 EVs 以及具有多样应用形式的 EV 递送系统的制备策略。同时讨论了 EVs 从生物材料中释放的释放机制、释放曲线与数学动力学模型。还总结并讨论了这些载 EV 生物材料在治疗各类创面中的应用。最后，提出了基于 EV 的创面治疗当前面临的挑战与未来方向。与以往分别聚焦 EVs 生物学或作为创面敷料的生物材料的综述不同，本综述全面总结了先进生物材料基 EV 递送平台用于创面愈合的制备策略与应用。","tier":"1区","if":18.0},
{"pmid":"42571253","topic":"创面修复","title":"Multimodal smart suture for dynamic postoperative wound monitoring.","titleZh":"用于术后创面动态监测的多模态智能缝合线","journal":"Bioactive materials","year":"2026","date":"2026-Dec","edat":"2026-08-09","authors":"Xiao Y, Gao X, Sun T, Jiang J, Lu J","doi":"10.1016/j.procbio.2020.09.003","abstract":"Postoperative wound management remains challenging, owing to the lack of tools for continuous, localized, and quantitative assessment of wound inflammation. To address this limitation, we advance a device-level integration strategy that enables localized multimodal monitoring within a suturable platform. We develop a multifunctional smart suture by engineering a metal-organic framework (MOF) layer onto a conductive thermoelectric (TE) fiber. This unique structure integrates bifunctional electrochemical and thermoelectric sensing on a single platform for real-time monitoring of wound healing dynamics. The precise deposition of metal organic framework layer is fabricated via atomic layer deposition, which provides a highly active interface for sensitive detection of physiologically relevant hydrogen peroxide (H2O2). This method features ultra-high sensitivity (8450 μA mM-1 cm-2) and a low detection limit (77.44 nM). Meanwhile, the TE fiber enables accurate local temperature monitoring with a sensitivity of 76.60 μV K-1. The smart suture retains sufficient mechanical strength and supports biocompatibility and stable sensing performance for surgical suturing. By fusing multimodal sensing outputs with machine learning-assisted analysis, the system enables classification of inflammation-related states. Evaluated in rat wound models, the suture demonstrates the capability to monitor changes in local inflammatory responses under experimental conditions, highlighting its potential for advanced wound monitoring.","abstractZh":"由于缺乏对创面炎症进行连续、局部、定量评估的工具，术后创面管理仍具挑战性。为克服这一局限，我们提出一种器件级集成策略，可在可缝合平台上实现局部多模态监测。我们通过在导电热电（TE）纤维上构建金属有机框架（MOF）层，开发了一种多功能智能缝合线。这一独特结构将双功能电化学传感与热电传感集成于单一平台，用于实时监测创面愈合动态。金属有机框架层通过原子层沉积精确制备，为灵敏检测生理相关浓度的过氧化氢（H2O2）提供了高活性界面。该方法具有超高灵敏度（8450 μA mM-1 cm-2）和低检测限（77.44 nM）。同时，TE 纤维可实现准确的局部温度监测，灵敏度为 76.60 μV K-1。该智能缝合线保持了足够的机械强度，并具备良好的生物相容性和稳定的传感性能，可满足外科缝合需求。通过将多模态传感输出与机器学习辅助分析融合，该系统可对炎症相关状态进行分类。在大鼠创面模型中评估显示，该缝合线能够在实验条件下监测局部炎症反应的变化，凸显了其在先进创面监测方面的潜力。","tier":"1区","if":18.0},
{"pmid":"42541291","topic":"糖尿病难愈创面","title":"Study on the repair effect of photothermal hydrogel with controllable adhesiveness regulated by melanin and magnesium ions on diabetic wounds.","titleZh":"黑色素与镁离子调控黏附性的光热水凝胶对糖尿病创面修复作用的研究","journal":"Bioactive materials","year":"2026","date":"2026-Dec","edat":"2026-08-01","authors":"Guo L, Wu K, Wang R, Xue Y, Diao Y","doi":"10.1016/j.bioactmat.2026.07.032","abstract":"Chronic non-healing wounds, characterized by prolonged disease duration and low compromised reparative potential, not only cause patients to suffer from persistent physical pain and impaired daily living ability, but also are prone to inducing severe complications such as infection and amputation, posing a serious threat to patients' health and quality of life. In this study, a melanin derivative (M-HPCS) with excellent photothermal properties was successfully prepared through the condensation reaction between natural squid melanin and a chitosan derivative (HPCS). Subsequently, by virtue of charge interaction, M-HPCS was assembled with a hyaluronic acid derivative (HA-PEG) to construct a photothermal hydrogel (M-HPCS/HA-PEG) with controllable adhesion performance. This hydrogel could further enhance its own adhesion capacity by chelating magnesium ions, making it suitable for the repair and treatment of non-healing wounds. The results demonstrated that, relying on the dual regulatory effect of sepia melanin and Mg2+, the hydrogel could achieve controllable adhesion to the wound and non-invasive detachment after use. The combination therapy of hydrogel and photothermal treatment exhibited the optimal repair efficacy by effectively regulating the inflammatory level in the microenvironment of chronic non-healing wounds, promoting angiogenesis, accelerating the epithelialization process, and thereby significantly facilitating wound healing. The photothermal hydrogel possessed ideal adhesion adaptability to different types of wounds and could effectively promote wound repair through hyperthermia. This study provides novel insights and technical support for the clinical treatment of chronic non-healing wounds.","abstractZh":"慢性难愈合创面病程长、修复潜能低下，不仅使患者长期承受躯体疼痛和日常生活能力受损，还易诱发感染、截肢等严重并发症，对患者健康与生活质量构成严重威胁。本研究通过天然鱿鱼墨黑色素与壳聚糖衍生物（HPCS）的缩合反应，成功制备了具有优异光热性能的黑色素衍生物（M-HPCS）。随后，借助电荷相互作用，M-HPCS 与透明质酸衍生物（HA-PEG）组装，构建了具有可控黏附性能的光热水凝胶（M-HPCS/HA-PEG）。该水凝胶可通过螯合镁离子进一步增强自身黏附能力，从而适用于难愈合创面的修复治疗。结果表明，依靠乌贼黑色素与 Mg2+ 的双重调控作用，该水凝胶可实现对创面的可控黏附，并在使用后无创剥离。水凝胶与光热治疗的联合方案通过有效调控慢性难愈合创面微环境的炎症水平、促进血管生成、加速上皮化过程，从而显著促进创面愈合，表现出最佳的修复效果。该光热水凝胶对不同类型创面具有理想的黏附适应性，并可通过热疗有效促进创面修复。本研究为慢性难愈合创面的临床治疗提供了新的思路与技术支持。","tier":"1区","if":18.0},
{"pmid":"42381967","topic":"整形医学","title":"Nanozyme-crosslinked dual-network hydrogel enables multi-stage modulation of the dysregulated repair cascade for regenerative wound healing.","titleZh":"纳米酶交联双网络水凝胶实现修复级联失调的多阶段调控以促进再生性创面愈合","journal":"Bioactive materials","year":"2026","date":"2026-Dec","edat":"2026-07-01","authors":"Gong Y, Chu F, Liu S, Jia L, Liu W","doi":"10.1038/s41467-025-58987-w","abstract":"Adult mammalian wound healing typically results in fibrosis-associated repair rather than regenerative restoration, a process that can be further exacerbated by persistent inflammation, microbial infection, and aberrant mechanotransduction. Here, we present a nanozyme-crosslinked dual-network hydrogel (GPP@VP) that enables multi-stage modulation of this dysregulated repair cascade. The hydrogel integrates a dynamic γ-polyglutamic acid (γ-PGA)/ε-poly-L-lysine (ε-PLL) ionic network with CaP@TGnase-mediated covalent crosslinking, providing mechanical robustness, injectability, and wet-tissue adhesion. Functionally, GPP@VP enables stage-associated regulation across the healing process: Ca2+ release promotes rapid hemostasis at early stages; ε-PLL provides intrinsic bacteriostasis, while verteporfin (VP) enables on-demand photodynamic antibacterial activity under near-infrared (NIR) irradiation; and subsequent modulation of macrophage polarization and mechanotransduction pathways attenuates fibroblast activation and excessive extracellular matrix deposition. In vivo, GPP@VP demonstrated consistent efficacy across methicillin-resistant Staphylococcus aureus (MRSA)-infected burn wounds, a rabbit ear scar model, and postoperative adhesion models, with reduced inflammation, improved tissue remodeling, and a shift toward regenerative healing. Transcriptomic analysis further revealed coordinated regulation of immune and extracellular matrix (ECM)-related pathways. This work highlights a material strategy that enables coordinated modulation of the dysregulated repair cascade, providing a promising approach toward regenerative wound healing.","abstractZh":"成年哺乳动物的创面愈合通常导致纤维化相关修复而非再生性恢复，而持续性炎症、微生物感染和异常机械转导会进一步加剧这一过程。在此，我们提出一种纳米酶交联双网络水凝胶（GPP@VP），可对这一失调的修复级联进行多阶段调控。该水凝胶将动态的 γ-聚谷氨酸（γ-PGA）/ε-聚赖氨酸（ε-PLL）离子网络与 CaP@TGnase 介导的共价交联相结合，兼具机械强度、可注射性与湿组织黏附性。在功能上，GPP@VP 可在整个愈合过程中实现分期调控：Ca2+ 释放在早期促进快速止血；ε-PLL 提供固有抑菌作用，而维替泊芬（VP）在近红外（NIR）照射下实现按需光动力抗菌活性；随后对巨噬细胞极化和机械转导通路的调控减弱成纤维细胞活化与过度细胞外基质沉积。在体内，GPP@VP 在耐甲氧西林金黄色葡萄球菌（MRSA）感染烧伤创面、兔耳瘢痕模型和术后粘连模型中均表现出一致疗效，炎症减轻、组织重塑改善，并转向再生性愈合。转录组分析进一步揭示了免疫与细胞外基质（ECM）相关通路的协同调控。本工作突出了一种能够协同调控失调修复级联的材料策略，为再生性创面愈合提供了颇具前景的途径。","tier":"1区","if":18.0},
{"pmid":"42181168","topic":"创面修复","title":"Topical framework nucleic acid transdermal delivery system for reprogramming cutaneous dendritic cells to maintain graft immune homeostasis.","titleZh":"局部框架核酸透皮递送系统重编程皮肤树突状细胞以维持移植物免疫稳态","journal":"Bioactive materials","year":"2026","date":"2026-Oct","edat":"2026-05-25","authors":"Qin X, Wei T, Zhang Z, Qin H, Lin Y","doi":"10.1038/s41565-020-00810-2","abstract":"Immune rejection is a major challenge for the long-term survival of allogeneic skin grafts. Current immunosuppressive therapies are usually administered systemically to mitigate rejection; however, they have substantial side effects. Therefore, here, a localized immunomodulatory strategy based on tetrahedral framework nucleic acids (tFNAs) is proposed to improve the survival of allogeneic skin grafts. A mircoRNA (miR-23b) and a dendritic cell-targeting aptamer is conjugated to tFNAs to create a complex (termed TR), which is embedded in a four-armed PEG hydrogel (MixPEG) matrix to form MixPEG-TR. TR targets dendritic cells (DCs) in the skin to induce tolerogenic DCs by leveraging the transdermal delivery capability of tFNAs and the sustained release provided by the hydrogel, thereby establishing persistent local immune tolerance. The local application of this formulation reduces inflammatory cell infiltration, promotes uniform dermal collagen deposition, and markedly prolongs graft survival in a mouse allogeneic skin graft model. These findings highlight a transdermal, DC-targeted nucleic acid delivery strategy capable of enhancing local immune tolerance and alleviating inflammatory responses, thereby potentially maintaining graft-associated immune homeostasis and providing a safer, site-specific platform for immunomodulation in skin transplantation and other cutaneous immune-mediated conditions.","abstractZh":"免疫排斥是同种异体皮肤移植物长期存活的主要挑战。目前的免疫抑制治疗通常经全身给药以减轻排斥反应，但具有明显的副作用。因此，我们提出一种基于四面体框架核酸（tFNAs）的局部免疫调节策略，以提高同种异体皮肤移植物的存活率。将一种微小 RNA（miR-23b）与一种树突状细胞靶向适配体偶联到 tFNAs 上构建复合物（称为 TR），再将其嵌入四臂 PEG 水凝胶（MixPEG）基质中形成 MixPEG-TR。TR 借助 tFNAs 的透皮递送能力与水凝胶提供的缓释作用，靶向皮肤中的树突状细胞（DCs），诱导耐受性 DCs，从而建立持久的局部免疫耐受。在小鼠同种异体皮肤移植模型中，该制剂的局部应用可减少炎性细胞浸润、促进真皮胶原均匀沉积，并显著延长移植物存活时间。这些发现凸显了一种透皮的、靶向 DCs 的核酸递送策略，能够增强局部免疫耐受并减轻炎症反应，从而可能维持移植物相关免疫稳态，为皮肤移植及其他皮肤免疫介导疾病的免疫调节提供更安全、部位特异性的平台。","tier":"1区","if":18.0},
{"pmid":"42165000","topic":"糖尿病难愈创面","title":"Microalgae extracellular vesicles-loaded dual antioxidative and anti-inflammatory hydrogel system for wound healing and peripheral nerve repair in diabetes.","titleZh":"负载微藻细胞外囊泡的双重抗氧化抗炎水凝胶系统促进糖尿病创面愈合与周围神经修复","journal":"Bioactive materials","year":"2026","date":"2026-Oct","edat":"2026-05-21","authors":"Dong J, Cheng B, Zhang X, Lang Y, Cui J","doi":"10.1016/j.biomaterials.2024.122841","abstract":"Chronic wound healing and peripheral nerve repair in diabetes remain a major clinical challenge due to persistent oxidative stress, inflammation, and impaired tissue regeneration. Here, we developed a multifunctional hydrogel, mEVs@TAgel, for the synergistic delivery of microalgal extracellular vesicles (mEVs) from Haematococcus pluvialis and tannic acid (TA) to address these barriers. mEVs are rich in astaxanthin and functional proteins that target mitochondrial dysfunction and oxidative stress, while TA itself exhibits intrinsic antioxidant and anti-inflammatory properties. The hydrogel exhibits excellent injectability, tissue adhesion, and sustained release of mEVs. In vitro, mEVs@TAgel significantly reduced ROS levels by activating the Nrf2 signaling pathway, enhanced mitochondrial function in keratinocytes and Schwann cells, and drove M1-to-M2 macrophage polarization via suppression of NF-κB signaling. In diabetic mice, treatment with mEVs@TAgel accelerated full-thickness wound closure, promoted re-epithelialization, angiogenesis, and collagen remodeling, and reduced scar formation through early Col 3 deposition and an improved Col 3/Col 1 ratio. Notably, in a sciatic nerve injury model, mEVs@TAgel enhanced functional recovery, axonal regeneration, remyelination, and muscle preservation. Long-term biosafety evaluations showed no systemic toxicity or inflammatory side effects. Altogether, mEVs@TAgel represents a safe and potent platform that coordinately mitigates oxidative stress, inflammation, and tissue damage, offering a promising strategy for diabetic wound and nerve repair.","abstractZh":"糖尿病患者的慢性创面愈合与周围神经修复仍是重大临床挑战，其原因在于持续的氧化应激、炎症和组织再生受损。在此，我们开发了一种多功能水凝胶 mEVs@TAgel，用于协同递送源自雨生红球藻（Haematococcus pluvialis）的微藻细胞外囊泡（mEVs）与单宁酸（TA），以应对上述障碍。mEVs 富含虾青素和功能性蛋白，可靶向线粒体功能障碍与氧化应激，而 TA 本身具有内在的抗氧化和抗炎特性。该水凝胶具有优异的可注射性、组织黏附性和 mEVs 缓释能力。在体外，mEVs@TAgel 通过激活 Nrf2 信号通路显著降低 ROS 水平，增强角质形成细胞与雪旺细胞的线粒体功能，并通过抑制 NF-κB 信号驱动巨噬细胞由 M1 向 M2 极化。在糖尿病小鼠中，mEVs@TAgel 治疗加速了全层创面闭合，促进再上皮化、血管生成和胶原重塑，并通过早期 Col 3 沉积和改善的 Col 3/Col 1 比值减少瘢痕形成。值得注意的是，在坐骨神经损伤模型中，mEVs@TAgel 增强了功能恢复、轴突再生、髓鞘再生和肌肉保留。长期生物安全性评价显示无全身毒性或炎症副作用。总之，mEVs@TAgel 是一个安全有效的平台，能够协同减轻氧化应激、炎症和组织损伤，为糖尿病创面与神经修复提供了有前景的策略。","tier":"1区","if":18.0},
{"pmid":"42383202","topic":"糖尿病难愈创面","title":"Sprayable bioadhesive microcarriers loaded with Tβ4-Engineered ADSC exosomes for diabetic wound healing.","titleZh":"负载Tβ4工程化ADSC外泌体的可喷涂生物黏附微载体用于糖尿病创面愈合","journal":"Bioactive materials","year":"2026","date":"2026-Nov","edat":"2026-07-01","authors":"Ding Y, Huang D, Zhao Z, Feng H, Zhou S","doi":"10.1016/j.bioactmat.2026.06.024","abstract":"Stem cell-derived therapeutics show strong potential to recalibrate diabetic wound immunity, yet their stability, retention, and practical usability remain major barriers to effective application. Here, we report a novel microcarrier platform loaded with thymosin β4 (Tβ4)-overexpressing stem cell-derived exosomes for a sprayable diabetic wound dressing. Adipose-derived stem cells (ADSCs) were genetically engineered to overexpress Tβ4, generating potent immunoregulatory exosomes that were efficiently encapsulated into uniform, micron-scale hydrogel microcarriers via microfluidic fabrication and further functionalized with a mesoporous polydopamine (mPDA) coating to enhance wet adhesion and tissue retention. The resulting EXOsTβ4/mPDA@MS system stabilizes the exosome payload and enables convenient spray-based wound administration. These microcarriers provide sustained, localized exosome release, significantly enhance macrophage efferocytosis, suppress inflammatory signaling, and accelerate wound repair in diabetic models. Thus, our engineered, sprayable, and adhesive microcarrier platform offers a stable, minimally invasive, and clinically adaptable strategy for advancing stem cell-derived exosome therapies in chronic diabetic wound repair.","abstractZh":"干细胞来源的治疗药物在重调糖尿病创面免疫方面显示出强大潜力，但其稳定性、滞留性和实际使用便捷性仍是有效应用的主要障碍。在此，我们报道了一种负载过表达胸腺素 β4（Tβ4）的干细胞来源外泌体的新型微载体平台，用作可喷涂的糖尿病创面敷料。脂肪来源干细胞（ADSCs）经基因工程改造过表达 Tβ4，产生具有强免疫调节作用的外泌体，并通过微流控制备高效包封于均一的微米级水凝胶微载体中，进一步以介孔聚多巴胺（mPDA）涂层功能化，以增强湿态黏附与组织滞留。所得 EXOsTβ4/mPDA@MS 系统可稳定外泌体载荷，并便于以喷雾方式进行创面给药。这些微载体提供持续、局部的外泌体释放，显著增强巨噬细胞胞葬作用，抑制炎症信号，并在糖尿病模型中加速创面修复。因此，我们构建的可喷涂、具黏附性的工程化微载体平台，为推进干细胞来源外泌体疗法用于慢性糖尿病创面修复提供了一种稳定、微创且临床可适配的策略。","tier":"1区","if":18.0},
{"pmid":"42327495","topic":"糖尿病难愈创面","title":"Sirt1 transgene delivery improves diabetes-impaired wound healing.","titleZh":"Sirt1转基因递送改善糖尿病所致的创面愈合障碍","journal":"Bioactive materials","year":"2026","date":"2026-Nov","edat":"2026-06-22","authors":"Luo R, Wang H, Duan C, Jen M, Kuo HY","doi":"10.1016/j.bioactmat.2026.06.007","abstract":"Diabetes mellitus severely impairs wound healing, in part due to persistent inflammation, impaired angiogenesis, and dysregulated cellular responses. Sirtuin-1 (Sirt1), an NAD+-dependent deacetylase, has emerged as a promising therapeutic target for restoring regenerative capacity in diabetic wounds. However, effective and localized gene delivery remains a major challenge. Here, we report an injectable thermoresponsive poly(polyethylene glycol citrate-co-N-isopropylacrylamide) (PPCN) hydrogel as a localized delivery platform for lentiviruses encoding Sirt1 (LV-Sirt1) to promote sustained gene expression and tissue regeneration in diabetic full-thickness dermal wounds. Encapsulation of LV-Sirt1 within PPCN enabled in situ gelation and significantly accelerated wound closure compared with hydrogel or virus alone. Histological analyses revealed enhanced re-epithelialization, increased granulation tissue formation, and improved epidermal barrier restoration. Immunofluorescence staining demonstrated elevated fibroblast activity, reduced inflammatory response, and a facilitated polarization of macrophage from a pro-inflammatory M1 phenotype toward a regenerative M2 phenotype. Transcriptomic analysis further revealed that Sirt1 modulates key genes associated with immune regulation (Spp1, Ccl24, Ggt1), epithelial migration (Krt8), vascular stabilization (Aspn, Plscr4), and nerve regeneration (Nefm). Collectively, these results demonstrate that thermoresponsive PPCN hydrogels enable effective localized lentiviral gene delivery, and that sustained Sirt1 expression promotes angiogenesis, immune modulation, and tissue regeneration in diabetic wounds. This platform provides a promising strategy for controlled gene therapy in chronic wound management and other regenerative applications.","abstractZh":"糖尿病严重损害创面愈合，部分原因在于持续炎症、血管生成受损和细胞反应失调。Sirtuin-1（Sirt1）是一种 NAD+ 依赖性去乙酰化酶，已成为恢复糖尿病创面再生能力的有前景的治疗靶点。然而，有效且局部的基因递送仍是主要挑战。在此，我们报道了一种可注射的温度响应型聚（聚乙二醇柠檬酸酯-co-N-异丙基丙烯酰胺）（PPCN）水凝胶，作为编码 Sirt1 的慢病毒（LV-Sirt1）的局部递送平台，以促进糖尿病全层真皮创面中持续的基因表达和组织再生。将 LV-Sirt1 包封于 PPCN 中可实现原位凝胶化，与单独使用水凝胶或病毒相比显著加速创面闭合。组织学分析显示再上皮化增强、肉芽组织形成增多、表皮屏障恢复改善。免疫荧光染色显示成纤维细胞活性升高、炎症反应减轻，并促进巨噬细胞由促炎 M1 表型向再生性 M2 表型极化。转录组分析进一步揭示，Sirt1 调控与免疫调节（Spp1、Ccl24、Ggt1）、上皮迁移（Krt8）、血管稳定（Aspn、Plscr4）和神经再生（Nefm）相关的关键基因。总之，这些结果表明温度响应型 PPCN 水凝胶可实现有效的局部慢病毒基因递送，且持续的 Sirt1 表达促进糖尿病创面的血管生成、免疫调节和组织再生。该平台为慢性创面管理及其他再生应用中的可控基因治疗提供了有前景的策略。","tier":"1区","if":18.0},
{"pmid":"42256885","topic":"糖尿病难愈创面","title":"A BAI1-PSTB-Hydrogel promotes diabetic wound healing by targeting mtDNA leakage and the cGAS-STING axis to alleviate endothelial senescence.","titleZh":"BAI1-PSTB水凝胶通过靶向mtDNA泄漏及cGAS-STING轴缓解内皮细胞衰老促进糖尿病创面愈合","journal":"Bioactive materials","year":"2026","date":"2026-Nov","edat":"2026-06-08","authors":"Wang X, Zheng R, Cheng W, Xu Y, Xu XJ","doi":"10.64898/2025.12.31.697191","abstract":"BACKGROUND: Diabetic Wound (DW) is one of the most prevalent complications in diabetes patients, impairing patient wellbeing and quality of life severely. The pathogenesis of DW remains incompletely understood, hindering the development of targeted therapies. METHODS: We analyzed single-cell RNA sequencing data and tissue samples from DW patients and healthy controls to investigate characteristic of DW. A high-glucose (30 mM) stimulation model was used to mimic Vascular endothelial cells （VECs) injury in vitro. We evaluated the effects of BAI1 on high-glucose-induced VECs dysfunction, cellular senescence, mitochondrial DNA (mtDNA) leakage, and cGAS-STING pathway activation. To enable topical wound delivery, BAI1 was loaded into mesoporous silica nanoparticles and encapsulated within a polyvinyl alcohol-alginate-tannic acid-borax composite hydrogel. A diabetic mouse wound model was established to assess the therapeutic efficacy of the BAI1-loaded hydrogel. RESULTS: Single-cell sequencing and histopathological analyses revealed severe VECs injury in diabetic wounds, accompanied by STING activation and cellular senescence. In vitro, high glucose induced mtDNA leakage, cGAS-STING activation, and senescence in VECs. BAI1 treatment attenuated mtDNA leakage, suppressed STING activation, reduced senescence, and restored VECs function. The BAI1-loaded hydrogel significantly accelerated wound closure and improved healing quality in diabetic mice. Tissue analysis further demonstrated that the hydrogel reduced STING activation and senescence markers in wounds. CONCLUSION: mtDNA leakage in VECs drive cellular senescence and contribute to impaired healing in diabetic wounds. BAI1 alleviates senescence by inhibiting BAX, thereby reducing mtDNA release and subsequent cGAS-STING activation. The BAI1-PSTB-Hydrogel is a promising topical dressing for DW, with broad clinical translation potential.","abstractZh":"背景：糖尿病创面（DW）是糖尿病患者最常见的并发症之一，严重损害患者的健康与生活质量。DW 的发病机制尚未完全阐明，阻碍了靶向治疗的发展。方法：我们分析了 DW 患者与健康对照的单细胞 RNA 测序数据和组织样本，以探究 DW 的特征。采用高糖（30 mM）刺激模型在体外模拟血管内皮细胞（VECs）损伤。我们评估了 BAI1 对高糖诱导的 VECs 功能障碍、细胞衰老、线粒体 DNA（mtDNA）泄漏和 cGAS-STING 通路激活的影响。为实现创面局部递送，将 BAI1 负载于介孔二氧化硅纳米颗粒，并封装于聚乙烯醇-海藻酸盐-单宁酸-硼砂复合水凝胶中。建立糖尿病小鼠创面模型以评估载 BAI1 水凝胶的治疗效果。结果：单细胞测序与组织病理学分析显示，糖尿病创面存在严重的 VECs 损伤，并伴有 STING 激活和细胞衰老。在体外，高糖诱导 VECs 发生 mtDNA 泄漏、cGAS-STING 激活和衰老。BAI1 处理可减轻 mtDNA 泄漏、抑制 STING 激活、减少衰老并恢复 VECs 功能。载 BAI1 水凝胶显著加速糖尿病小鼠的创面闭合并改善愈合质量。组织分析进一步表明，该水凝胶减少了创面中 STING 激活与衰老标志物。结论：VECs 中的 mtDNA 泄漏驱动细胞衰老，并导致糖尿病创面愈合受损。BAI1 通过抑制 BAX 减轻衰老，从而减少 mtDNA 释放及随后的 cGAS-STING 激活。BAI1-PSTB 水凝胶是一种有前景的糖尿病创面局部敷料，具有广泛的临床转化潜力。","tier":"1区","if":18.0},
{"pmid":"42232749","topic":"糖尿病难愈创面","title":"Astaxanthin-metformin conjugate nanomicelles-loaded hydrogel reprograms macrophage metabolism via mitochondrion-targeted regulation for diabetic wound healing.","titleZh":"负载虾青素-二甲双胍偶联物纳米胶束的水凝胶通过线粒体靶向调控重编程巨噬细胞代谢促进糖尿病创面愈合","journal":"Bioactive materials","year":"2026","date":"2026-Oct","edat":"2026-06-03","authors":"Teng XN, Wang H, Zhu Y, Wang SC, Pan RL","doi":"10.1007/s13770-025-00766-1","abstract":"Diabetic wounds struggle to heal because of ROS-mediated immune dysfunction, in which the mitochondrial metabolic reprogramming of macrophages is critical for inflammation resolution and tissue repair. Here, we innovatively combine the antioxidant astaxanthin (Ast) and the metabolic activator metformin (Met) via pH-responsive dynamic Schiff base linkages to form amphiphilic Ast-PEG-Met conjugates, which self-assemble into nanomicelles (NMs). This strategy effectively improves the solubility of Ast and enables synergistic delivery of the two complementary drugs. NMs target macrophage mitochondria, where Ast scavenges mtROS and Met activates energy metabolism pathways in a synergistic manner. The two drugs synergistically activate the AMPK-PPARγ axis and promote mitophagy, thereby restoring mitochondrial function and regulating immunometabolic reprogramming. For on-demand release, the NMs were further encapsulated into a ROS-responsive self-healing hydrogel crosslinked by dynamic phenylboronate ester bonds. This system responds to high levels of ROS and an acidic wound microenvironment with favorable biocompatibility. In a diabetic full-thickness skin defect model, this integrated platform markedly accelerated wound healing, promoted collagen deposition and angiogenesis, and alleviated chronic inflammation. This work provides a promising combined strategy involving antioxidant-metabolic regulation for chronic diabetic wound therapy via a dual-responsive hydrogel drug delivery system.","abstractZh":"糖尿病创面因 ROS 介导的免疫功能障碍而难以愈合，其中巨噬细胞的线粒体代谢重编程对炎症消退和组织修复至关重要。在此，我们创新性地通过 pH 响应性动态席夫碱键将抗氧化剂虾青素(Ast)与代谢激活剂二甲双胍(Met)偶联，形成两亲性 Ast-PEG-Met 偶联物，其自组装为纳米胶束(NMs)。该策略有效改善了 Ast 的溶解度，并实现了两种互补药物的协同递送。NMs 靶向巨噬细胞线粒体，在其中 Ast 清除线粒体 ROS(mtROS)，Met 则以协同方式激活能量代谢通路。两种药物协同激活 AMPK-PPARγ 轴并促进线粒体自噬，从而恢复线粒体功能并调控免疫代谢重编程。为实现按需释放，NMs 被进一步包封于由动态苯硼酸酯键交联的 ROS 响应性自愈合水凝胶中。该系统可对高水平 ROS 和酸性创面微环境作出响应，且具有良好的生物相容性。在糖尿病全层皮肤缺损模型中，该集成平台显著加速创面愈合、促进胶原沉积和血管生成，并减轻慢性炎症。本工作通过双响应水凝胶药物递送系统，为慢性糖尿病创面治疗提供了一种涉及抗氧化-代谢调控的有前景的联合策略。","tier":"1区","if":18.0},
{"pmid":"41799953","topic":"细胞衰老","title":"A multimodal ROS logic-gated therapeutic platform disrupts the vicious cycle of senescence to promote aged bone defect repair.","titleZh":"多模式ROS逻辑门控治疗平台打破衰老恶性循环以促进老龄骨缺损修复","journal":"Bioactive materials","year":"2026","date":"2026-Jul","edat":"2026-03-09","authors":"Sun X, Xie S, Fang Y, Zhang D, Wang W","doi":"10.1016/j.cmet.2020.06.004","abstract":"The impaired regeneration of aged individuals presents major challenges for repairing bone defects. Within the senescent microenvironment (SME), excessive reactive oxygen species (ROS), chronic inflammation, the accumulation of senescent cells and local infection form a self-reinforcing vicious cycle that hinders healing. Here, we developed a multimodal ROS logic-gated therapeutic platform by integrating magnesium- and manganese-doped bismuth oxide with oxygen vacancies nanoparticles (MMBOx) embedded in a rapamycin (Rapa)-loaded, 3D-printed hydrogel scaffold. In vitro study, this platform combines pH-responsive peroxidase, oxidase-like activity and photothermal-enhanced sonodynamic effects, enabling on-demand ROS generation for efficient antibacterial elimination. Simultaneously, MMBOx and the hydrogel scavenge excess ROS, while Rapa promotes cellular autophagy to remove damaged mitochondria, enhances ROS regulation, and delays stem cell senescence. Moreover, MMBOx enhances glutathione (GSH) synthesis and metabolism by modulating the Keap1-Nrf2 signaling pathway, thereby boosting the intracellular GSH pool and increasing ROS tolerance to support a more youthful cellular phenotype. In vivo studies confirm that this platform alleviates infection in the infected skin defect model. Furthermore, it attenuates SME-associated chronic inflammation and cellular senescence, and promotes bone regeneration in the aged rat calvarial defect model. These findings offer a promising strategy for addressing deteriorated SME and enhancing bone repair in the elderly.","abstractZh":"老龄个体再生能力受损给骨缺损修复带来重大挑战。在衰老微环境（SME）中，过量活性氧（ROS）、慢性炎症、衰老细胞蓄积和局部感染共同形成一个自我强化的恶性循环，阻碍愈合进程。在此，我们构建了一种多模式ROS逻辑门控治疗平台，将镁、锰共掺杂且富含氧空位的氧化铋纳米颗粒（MMBOx）嵌入负载雷帕霉素（Rapa）的3D打印水凝胶支架中。在体外研究中，该平台结合了pH响应性过氧化物酶样活性、氧化酶样活性以及光热增强的声动力效应，能够按需产生ROS以实现高效的抗菌清除。与此同时，MMBOx和水凝胶清除过量ROS，而Rapa促进细胞自噬以清除受损线粒体、增强ROS调控并延缓干细胞衰老。此外，MMBOx通过调控Keap1-Nrf2信号通路增强谷胱甘肽（GSH）的合成与代谢，从而提高细胞内GSH池并增强ROS耐受性，以支持更年轻的细胞表型。体内研究证实，该平台在感染性皮肤缺损模型中可减轻感染。此外，它在老龄大鼠颅骨缺损模型中减轻SME相关的慢性炎症和细胞衰老，并促进骨再生。这些发现为改善老龄个体恶化的SME并促进骨修复提供了一种有前景的策略。","tier":"1区","if":18.0},
{"pmid":"41551197","topic":"细胞衰老","title":"Silk Fibroin Counteracts Fibroblast Senescence to Restore ECM Homeostasis in Aged Skin.","titleZh":"丝素蛋白拮抗成纤维细胞衰老以恢复老龄皮肤的细胞外基质稳态","journal":"Bioactive materials","year":"2026","date":"2026-Apr","edat":"2026-01-19","authors":"Cheng J, Bao G, Lin D, Wang H, Yang Y","doi":"10.1016/j.bioactmat.2025.12.006","abstract":"Skin aging is characterized by a progressive decline in regenerative capacity, primarily driven by fibroblast senescence, oxidative stress, chronic inflammation, and the degradation of type I/III collagen, culminating in an extracellular matrix (ECM) imbalance. Current injectable fillers-such as hyaluronic acid, collagen, and PLLA-provide temporary structural support but fail to address the underlying cellular senescence or restore ECM homeostasis, highlighting the need for regenerative biomaterials. Silk fibroin (SF), a natural protein, self-assembles into a β-sheet-rich scaffold that structurally supports fibroblasts in depositing collagen and elastin, thereby improving the skin's ECM, accelerating wound healing, and promoting tissue regeneration. However, its role in modulating fibroblast senescence and ECM remodeling remains unclear. This study demonstrates that SF provides a suitable microenvironment for the adhesion and proliferation of fibroblasts, reducing the accumulation of SASP factors and facilitating the transition of fibroblasts from a senescent to a functional state. Furthermore, SF improves the skin microenvironment by reducing reactive oxygen species (ROS) and matrix metalloproteinase (MMP) expression through modulation of the ROS-MAPK-AP-1-MMP signal pathway, thereby delaying collagen degradation in aged skin. These findings reveal that SF uniquely rejuvenates fibroblasts and restores ECM homeostasis through a non-inflammatory mechanism, distinguishing it from conventional fillers that rely on inflammatory pathways for collagen induction. This work establishes SF as a next-generation injectable biomaterial with dual targeting of cellular senescence and ECM imbalance, offering a transformative strategy for regenerative dermatology and personalized anti-aging approaches.","abstractZh":"皮肤衰老以再生能力进行性下降为特征，主要由成纤维细胞衰老、氧化应激、慢性炎症以及I/III型胶原降解驱动，最终导致细胞外基质（ECM）失衡。现有的可注射填充剂——如透明质酸、胶原和PLLA——仅能提供临时性结构支撑，却无法解决潜在的细胞衰老问题或恢复ECM稳态，凸显了对再生型生物材料的需求。丝素蛋白（SF）是一种天然蛋白，可自组装形成富含β-折叠的支架，在结构上支持成纤维细胞沉积胶原和弹性蛋白，从而改善皮肤ECM、加速创面愈合并促进组织再生。然而，其在调控成纤维细胞衰老和ECM重塑中的作用仍不清楚。本研究表明，SF为成纤维细胞的黏附和增殖提供了适宜的微环境，减少SASP因子的蓄积，并促进成纤维细胞从衰老状态向功能状态转变。此外，SF通过调控ROS-MAPK-AP-1-MMP信号通路降低活性氧（ROS）和基质金属蛋白酶（MMP）表达，从而改善皮肤微环境，延缓老龄皮肤中的胶原降解。这些发现揭示，SF以非炎症机制独特地使成纤维细胞年轻化并恢复ECM稳态，使其区别于依赖炎症通路诱导胶原的传统填充剂。本工作确立SF为一种同时靶向细胞衰老和ECM失衡的新一代可注射生物材料，为再生皮肤科和个性化抗衰老策略提供了变革性方案。","tier":"1区","if":18.0},
{"pmid":"42164059","topic":"糖尿病难愈创面","title":"Mitochondrial micro-nano reactors via enhancing mitochondrial transfer and mitophagy for alleviating metabolic crisis.","titleZh":"通过增强线粒体转移和线粒体自噬缓解代谢危机的线粒体微纳反应器","journal":"Bioactive materials","year":"2026","date":"2026-Sep","edat":"2026-05-21","authors":"Mao J, Xia W, Li M, Huang X, Zhao Y","doi":"10.1016/j.bioactmat.2026.03.048","abstract":"Energy metabolic dysfunction is a major cause of impaired chronic wounds healing, in which disrupted mitochondrial transfer and autophagy imbalance further aggravate the cellular energy crisis. In this study, single-cell RNA sequencing (scRNA-seq) of clinical diabetic wound samples first identified a pivotal role for macrophage-to-fibroblast mitochondrial transfer in wound healing. This finding was further validated using diabetic wound models and histological analyses, highlighting these processes as potential therapeutic targets for alleviating energy metabolic stress. Based on these findings, we innovatively developed a mitochondrial micro-nano reactor (MtNR) that alleviates the energy metabolic crisis by concurrently enhancing mitochondrial transfer and autophagy. First, hypoxic-preconditioning combined with gene-edited techniques was used to generate M2 macrophage-derived mitochondria-trained apoptotic bodies (mABs). Subsequently, mABs were conjugated with piezoelectric short fibers (PSFS) via copper-free strain-promoted azide-alkyne cycloaddition (SPAAC) click chemistry to self-assemble into MtNR. This system promotes intercellular mitochondrial transport through the Miro1-mitochondria-dynein-microtubule complex. It also generates bionic electrical signals via mechano-electrical conversion, thereby restoring Pink1-Parkin-P62/SQSTM1-LC3-mediated mitophagy and mitochondrial homeostasis. In a diabetic mouse wound model, MtNR restored mitochondrial morphology, enhanced cellular energy biogenesis, reduced p62 accumulation, increased LC3 expression, and significantly promoted tissue repair, providing a promising therapeutic strategy for addressing the energy deficit in diabetic wounds.","abstractZh":"能量代谢功能障碍是慢性创面愈合受损的主要原因，其中线粒体转移受阻和自噬失衡进一步加剧细胞能量危机。本研究首先通过对临床糖尿病创面样本进行单细胞RNA测序（scRNA-seq），发现巨噬细胞向成纤维细胞的线粒体转移在创面愈合中发挥关键作用。该发现进一步通过糖尿病创面模型和组织学分析得到验证，凸显这些过程作为缓解能量代谢应激潜在治疗靶点的价值。基于这些发现，我们创新性地开发了一种线粒体微纳反应器（MtNR），通过同时增强线粒体转移和自噬来缓解能量代谢危机。首先，采用低氧预处理结合基因编辑技术制备M2巨噬细胞来源的线粒体训练凋亡小体（mABs）。随后，通过无铜应变促进的叠氮—炔环加成（SPAAC）点击化学将mABs与压电短纤维（PSFS）偶联，自组装形成MtNR。该系统通过Miro1—线粒体—动力蛋白—微管复合体促进细胞间线粒体运输。它还通过机电转换产生仿生电信号，从而恢复Pink1-Parkin-P62/SQSTM1-LC3介导的线粒体自噬和线粒体稳态。在糖尿病小鼠创面模型中，MtNR恢复线粒体形态、增强细胞能量生成、减少p62蓄积、增加LC3表达并显著促进组织修复，为解决糖尿病创面能量不足提供了有前景的治疗策略。","tier":"1区","if":18.0},
{"pmid":"42518656","topic":"外泌体","title":"Machine learning-guided discovery of a bioactive hydrogel for spatiotemporally orchestrated tendon-to-bone healing.","titleZh":"机器学习引导发现用于时空协同调控腱-骨愈合的生物活性水凝胶","journal":"Bioactive materials","year":"2026","date":"2026-Dec","edat":"2026-07-28","authors":"Liu W, Yu Y, Xu H, Lin W, Wang X","doi":"10.48550/arXiv.2505.20003","abstract":"The rational design of biomaterials for complex tissue regeneration, such as the tendon-to-bone interface (TBI), is hindered by an immense combinatorial space that makes empirical optimization impractical. To address this challenge, a machine learning (ML) framework was developed to navigate this landscape. Leveraging a high-fidelity Tabular Pre-trained Transformer (TabPFN) model, a high-throughput virtual screen of over 137 million candidates identifies an optimal injectable microgranule-assembled macroporous hydrogel (MMH). The hydrogel is engineered to spatiotemporally deliver macrophage (Mϕ)-targeting small extracellular vesicles (CRV-sEVs) alongside Kartogenin (KGN)-loaded PLGA microspheres. In the initial phase, the release of CRV-sEVs reprograms the immune microenvironment toward a pro-reparative M2 phenotype by suppressing NF-κB signaling in M1 Mϕ. Subsequently, the sustained KGN release promotes endogenous stem cell chondrogenesis and fibrocartilage reconstruction. In a rat rotator cuff repair model, the ML-optimized hydrogel restores the structural integrity, biomechanical strength, and functional performance of the TBI, supporting the practical utility of the ML-guided discovery framework. This work offers a promising therapeutic strategy for TBI healing and establishes a data-driven paradigm for accelerating the discovery of complex multifunctional biomaterials for broad regenerative applications.","abstractZh":"针对复杂组织再生（如腱-骨界面，TBI）的生物材料理性设计受到巨大组合空间的制约，使经验性优化难以实施。为应对这一挑战，我们开发了一个机器学习（ML）框架来导航这一设计空间。借助高保真表格预训练 Transformer（TabPFN）模型，对超过 1.37 亿个候选材料进行高通量虚拟筛选，鉴定出一种最优的可注射微颗粒组装大孔水凝胶（MMH）。该水凝胶经过工程设计，可时空递送靶向巨噬细胞（Mϕ）的小细胞外囊泡（CRV-sEVs）以及负载 Kartogenin（KGN）的 PLGA 微球。在初始阶段，CRV-sEVs 的释放通过抑制 M1 型 Mϕ 中的 NF-κB 信号，将免疫微环境重编程为促修复的 M2 表型。随后，KGN 的持续释放促进内源性干细胞成软骨分化及纤维软骨重建。在大鼠肩袖修复模型中，经 ML 优化的水凝胶恢复了 TBI 的结构完整性、生物力学强度和功能表现，验证了 ML 引导发现框架的实际效用。本研究为 TBI 愈合提供了一种有前景的治疗策略，并建立了数据驱动的范式，以加速面向广泛再生应用的复杂多功能生物材料的发现。","tier":"1区","if":18.0},
{"pmid":"42518654","topic":"外泌体","title":"Chitosan-based nerve guidance conduits functionalized with fibroblast-derived extracellular vesicles promote peripheral nerve regeneration via miR-143-3p delivery.","titleZh":"成纤维细胞来源细胞外囊泡功能化的壳聚糖神经导管通过递送 miR-143-3p 促进周围神经再生","journal":"Bioactive materials","year":"2026","date":"2026-Dec","edat":"2026-07-28","authors":"Shen D, He J, Yu M, Cheng Z, Liu J","doi":"10.1523/jneurosci.0648-19.2019","abstract":"Fibroblasts, one of the core cellular components of peripheral nerves, play a pivotal role during peripheral nerve regeneration; however, whether extracellular vesicles (EVs) derived from peripheral nerve fibroblasts promote nerve regeneration remains unclear. In this study, we first demonstrated that EVs derived from peripheral nerve fibroblasts (fibroblasts-EVs) significantly promoted the growth and regeneration of motor and sensory neurons in vitro. In order to assess the application of fibroblasts-EVs in nerve grafting, we constructed a chitosan-based, fibroblast-EV-loaded nerve guidance conduit (NGC) and utilized it to bridge a 12-mm long sciatic nerve defect in rats. A series of functional and morphological assessments showed that EV-loaded NGCs significantly accelerated the recovery of sensory, motor, and electrophysiological functions, stimulated the growth and remyelination of regenerated axons, and alleviated denervation-induced atrophy of target muscles. To elucidate the underlying molecular mechanisms, we screened miRNAs enriched in fibroblast-EVs through miRNA sequencing. Among these miRNAs, miR-143-3p with the highest abundance was identified as a potential regulator of axon regeneration. Further investigations revealed that miR-143-3p promoted nerve regeneration by targeting Limk1, a negative regulator of axonal growth. This study expands our understanding of the role of fibroblasts in peripheral nerve regeneration and suggests that our developed bioactive material-based NGCs may present a promising design of tissue-engineered nerve grafts for peripheral nerve repair.","abstractZh":"成纤维细胞是周围神经的核心细胞成分之一，在周围神经再生过程中发挥关键作用；然而，周围神经成纤维细胞来源的细胞外囊泡（EVs）是否促进神经再生仍不清楚。在本研究中，我们首先证明周围神经成纤维细胞来源的 EVs（fibroblasts-EVs）在体外显著促进运动神经元和感觉神经元的生长与再生。为评估 fibroblasts-EVs 在神经移植中的应用，我们构建了负载成纤维细胞 EV 的壳聚糖基神经导管（NGC），并用其桥接大鼠 12 mm 长的坐骨神经缺损。一系列功能与形态学评估显示，负载 EV 的 NGC 显著加速了感觉、运动和电生理功能的恢复，促进再生轴突的生长与髓鞘再生，并减轻去神经支配导致的靶肌肉萎缩。为阐明潜在分子机制，我们通过 miRNA 测序筛选了在 fibroblast-EVs 中富集的 miRNA。在这些 miRNA 中，丰度最高的 miR-143-3p 被鉴定为轴突再生的潜在调控因子。进一步研究显示，miR-143-3p 通过靶向轴突生长负调控因子 Limk1 促进神经再生。本研究拓展了对成纤维细胞在周围神经再生中作用的认识，并提示我们开发的基于生物活性材料的 NGC 可能为周围神经修复提供一种有前景的组织工程神经移植物设计。","tier":"1区","if":18.0},
{"pmid":"42472088","topic":"外泌体","title":"Injectable microsphere-based delivery strategies for stem cells and their derivatives in tissue regeneration.","titleZh":"用于组织再生中干细胞及其衍生物递送的可注射微球策略","journal":"Bioactive materials","year":"2026","date":"2026-Dec","edat":"2026-07-19","authors":"Liang R, Chen J, Huang J, Fu P, Shi Z","doi":"10.1002/adhm.202503713","abstract":"Tissue and organ injury, degeneration, and functional loss represent a growing global health challenge, exacerbated by an aging population and the limitations of current clinical interventions. Regenerative medicine offers a promising alternative by restoring tissue function through the delivery of stem cells and their bioactive derivatives, particularly exosomes. However, direct administration of these therapeutic agents faces significant hurdles, including low retention, rapid clearance, and poor spatiotemporal control. Injectable microsphere-based delivery systems have emerged as a versatile and minimally invasive platform to overcome these limitations. This review systematically outlines the latest advances in microsphere-mediated strategies for delivering stem cells and their derivatives across multiple tissue types, including bone, cartilage, neural, skin, dental pulp, cardiac and lung. We critically evaluate the design principles of natural and synthetic polymers, fabrication techniques such as microfluidics and electrospray, and the biological functions of microspheres in providing three-dimensional (3D) scaffolds, immune protection, and sustained release. Furthermore, we highlight emerging frontiers, including the delivery of novel regenerative cues such as apoptotic bodies and the integration of microsphere-based organoid models. This comprehensive analysis aims to accelerate the clinical translation of next-generation microsphere-enabled regenerative therapies.","abstractZh":"组织与器官损伤、退变及功能丧失构成日益严峻的全球健康挑战，人口老龄化与现有临床干预手段的局限使其进一步加剧。再生医学通过递送干细胞及其生物活性衍生物（尤其是外泌体）来恢复组织功能，提供了一种有前景的替代方案。然而，这些治疗药物的直接给药面临显著障碍，包括滞留率低、清除迅速以及时空控制性差。可注射微球递送系统已成为克服这些局限的多功能、微创平台。本综述系统概述了微球介导的干细胞及其衍生物递送策略在多种组织类型中的最新进展，包括骨、软骨、神经、皮肤、牙髓、心脏和肺。我们批判性评价了天然与合成聚合物的设计原则、微流控和电喷雾等制备技术，以及微球在提供三维（3D）支架、免疫保护和持续释放方面的生物学功能。此外，我们强调了新兴前沿，包括递送凋亡小体等新型再生信号，以及微球基类器官模型的整合。这一综合分析旨在加速新一代微球赋能再生疗法的临床转化。","tier":"1区","if":18.0},
{"pmid":"42383196","topic":"外泌体","title":"Spatiotemporal delivery of exosomes and alendronate orchestrates osteoblastic and osteoclastic activity for osteoporotic bone regeneration.","titleZh":"外泌体与阿仑膦酸钠的时空递送协同调控成骨与破骨活性促进骨质疏松性骨再生","journal":"Bioactive materials","year":"2026","date":"2026-Nov","edat":"2026-07-01","authors":"Anjum S, Saeed M, Zhang W, Yu T, Yang Z","doi":"10.1016/j.bioactmat.2026.06.019","abstract":"The treatment of bone defects in osteoporotic (OP) patients remain a significant clinical challenge. The most important and challenging task is to promote sufficient bone formation in the early stage and effectively inhibit bone resorption all period of bone healing. Unfortunately, the efficacy of current strategies falls short of meeting this requirement. In this study, we developed a dual-delivery system that allows spatiotemporal release of bone marrow stem cell-derived exosomes (BMSC-Exo) and alendronate (Aln) by core-shell nanofiber to match the spatiotemporal dynamics of bone healing and effectively treat OP bone defects. Core-shell polycaprolactone/polyvinyl alcohol (P/PVA) nanofibers were fabricated through coaxial electrospinning, incorporating Aln within the core layer and BMSC-Exo functionalized onto the surface of nanofiber via chemical modification with polyethyleneimine (PEI). Physicochemical characterization confirmed the successful fabrication of PEI@P/PVA-Aln nanofibers, which exhibited excellent mechanical strength (22.77 MPa), hydrophilicity (9.66°), and enabled the spatiotemporal release of BMSC-Exo and Aln. In vitro experiments showed that Exo-PEI@P/PVA-Aln scaffold effectively promoted osteogenic differentiation by miR-486 in the BMSC-Exo through regulation of the PTEN/AKT signaling axis and significantly reduced osteoclastic differentiation. Under a rat OP cranial defect model, the Exo-PEI@P/PVA-Aln scaffold demonstrated substantially enhanced bone repair efficiency after 4 and 10 weeks. To conclude, our results showed that the dual delivery of BMSC-Exo and Aln with spatiotemporal release orchestrates osteoblastic and osteoclastic activity, providing a potential strategy to facilitate the regeneration of OP bone defects.","abstractZh":"骨质疏松（OP）患者骨缺损的治疗仍是重大临床挑战。最重要且最具挑战性的任务是在早期促进充分的骨形成，并在整个骨愈合期间有效抑制骨吸收。遗憾的是，现有策略的疗效难以满足这一要求。在本研究中，我们开发了一种双递送系统，通过核-壳纳米纤维实现骨髓干细胞来源外泌体（BMSC-Exo）与阿仑膦酸钠（Aln）的时空释放，以匹配骨愈合的时空动态并有效治疗 OP 骨缺损。采用同轴静电纺丝制备核-壳聚己内酯/聚乙烯醇（P/PVA）纳米纤维，将 Aln 包载于核层，并通过聚乙烯亚胺（PEI）化学修饰将 BMSC-Exo 功能化于纳米纤维表面。理化表征证实 PEI@P/PVA-Aln 纳米纤维制备成功，其具有优异的力学强度（22.77 MPa）、亲水性（9.66°），并可实现 BMSC-Exo 与 Aln 的时空释放。体外实验显示，Exo-PEI@P/PVA-Aln 支架通过 BMSC-Exo 中的 miR-486 调控 PTEN/AKT 信号轴，有效促进成骨分化，并显著减少破骨细胞分化。在大鼠 OP 颅骨缺损模型中，Exo-PEI@P/PVA-Aln 支架在 4 周和 10 周后均显示出显著增强的骨修复效率。总之，我们的结果表明，BMSC-Exo 与 Aln 的时空释放双递送可协同调控成骨与破骨活性，为促进 OP 骨缺损再生提供了一种潜在策略。","tier":"1区","if":18.0},
{"pmid":"40487244","topic":"细胞衰老","title":"HydroWrap for T2DM-Related Fractures: A smart H2S-delivery controller modulating Macrophage senescence.","titleZh":"HydroWrap 用于 2 型糖尿病相关骨折：一种调控巨噬细胞衰老的智能 H2S 递送控制器","journal":"Bioactive materials","year":"2025","date":"2025-Sep","edat":"2025-06-09","authors":"Zhang S, Cui H, Wang J, Zhou J, Chen H","doi":"10.1038/s41586-024-07634-3","abstract":"Impaired fracture healing in type 2 diabetes mellitus (T2DM) poses a significant clinical challenge, primarily due to a compromised bone microenvironment driven by senescent macrophages and their amplifying effects. Reduced hydrogen sulfide (H2S) levels are a critical contributor to this pathology. To address this, we developed HydroWrap, an advanced H2S-delivery controller designed to modulate distinct stages of macrophage senescence. Under near-infrared (NIR) irradiation, HydroWrap underwent an increase in temperature, causing the hydrogel network to contract and accelerate H2S generation. This rapid delivery restores H2S levels, alleviating mitochondrial dysfunction and suppressing senescence-associated secretory phenotypes (SASP), thereby interrupting the senescence cascade. In T2DM's hyperglycemic bone microenvironment, HydroWrap provides sustained, glucose-responsive H2S release, promoting mitophagy and preventing macrophage senescence progression. This dual mechanism addresses both acute and chronic dysfunctions associated with senescence. In vivo studies demonstrated that HydroWrap significantly improved fracture healing by reducing recovery time and enhancing bone quality. These findings underscore the therapeutic potential of modulating macrophage senescence in T2DM using a biocompatible drug delivery system. HydroWrap offers a promising strategy for improving fracture outcomes in diabetic patients and may hold broader applications in senescence-related diseases.","abstractZh":"2 型糖尿病（T2DM）患者骨折愈合受损是一项重大临床挑战，其主要原因在于衰老巨噬细胞及其放大效应所导致的骨微环境受损。硫化氢（H2S）水平降低是这一病理过程的关键因素。为解决这一问题，我们开发了 HydroWrap，一种先进的 H2S 递送控制器，旨在调控巨噬细胞衰老的不同阶段。在近红外（NIR）照射下，HydroWrap 温度升高，使水凝胶网络收缩并加速 H2S 生成。这种快速递送可恢复 H2S 水平，减轻线粒体功能障碍并抑制衰老相关分泌表型（SASP），从而阻断衰老级联反应。在 T2DM 的高血糖骨微环境中，HydroWrap 提供持续、葡萄糖响应性的 H2S 释放，促进线粒体自噬并阻止巨噬细胞衰老进展。这一双重机制可同时应对与衰老相关的急性和慢性功能障碍。体内研究显示，HydroWrap 通过缩短恢复时间并改善骨质量，显著促进骨折愈合。这些发现凸显了使用生物相容性药物递送系统调控 T2DM 中巨噬细胞衰老的治疗潜力。HydroWrap 为改善糖尿病患者的骨折结局提供了一种有前景的策略，并可能在衰老相关疾病中具有更广泛的应用。","tier":"1区","if":18.0},
{"pmid":"42209725","topic":"细胞衰老","title":"Transcription-independent induction of rapid-onset senescence is integral to healing.","titleZh":"不依赖转录的快速起始衰老诱导是愈合过程的必要组成","journal":"Nature cell biology","year":"2026","date":"2026-Jun","edat":"2026-05-28","authors":"Valdivieso K, Rozmaric T, Victorelli S, Jadhav V, Ring NAR","doi":"10.1093/nar/gkae1011","abstract":"Cellular senescence plays key roles in tissue repair, tumour suppression and ageing. Here we identify a rapid, transcription‑independent senescence response in skin following injury. Within minutes to hours after wounding, skin cells at the edge of injury display hallmark features of senescence. This response involves the utilization of pre‑existing Cdkn1a mRNA through the removal of nuclear export inhibitors, which enables Cdkn1a transcript translation and rapid p21 protein accumulation. These cells enter stable cell‑cycle arrest and secrete pro‑migratory and pro‑inflammatory factors that promote tissue repair, including re‑epithelialization. Experimental suppression of this rapid senescence, either genetically or pharmacologically, markedly delays wound closure, whereas inhibition during later phases of repair has no effect. Our findings establish rapid‑onset senescence as a mechanistic requirement for efficient tissue regeneration.","abstractZh":"细胞衰老在组织修复、肿瘤抑制和机体衰老中发挥关键作用。在此，我们确认皮肤在损伤后存在一种快速的、不依赖转录的衰老应答。在创伤后数分钟至数小时内，损伤边缘的皮肤细胞即表现出衰老的典型特征。该应答涉及通过解除核输出抑制因子来利用预先存在的Cdkn1a mRNA，从而使Cdkn1a转录本得以翻译并快速蓄积p21蛋白。这些细胞随后进入稳定的细胞周期停滞，并分泌促迁移和促炎因子以促进组织修复，包括再上皮化。通过遗传学或药理学手段实验性抑制这种快速衰老，会显著延迟创面闭合，而在修复后期进行抑制则无任何影响。我们的发现确立快速起始衰老是高效组织再生所必需的机制性环节。","tier":"1区","if":17.3},
{"pmid":"42918816","topic":"创面修复","title":"Keratin 9 regulates mechanosensitive YAP1 signalling in palmoplantar epidermis.","titleZh":"角蛋白9调控掌跖表皮机械敏感性YAP1信号","journal":"Nature cell biology","year":"2026","date":"2026-Oct-22","edat":"2026-10-23","authors":"Steiner SN, Horst EN, Chiu ES, Athaiya M, Johnson CN","doi":"10.1186/gb-2014-15-2-r29","abstract":"The palmoplantar epidermis, in adapting to the exceptional mechanical strain it bears during locomotion, is histologically and molecularly distinct from other skin body sites. The mechanisms specifying and maintaining its unique identity remain incompletely defined. Here we identify the type I keratin 9 (KRT9/K9), a protein uniquely expressed in palmoplantar epidermis, as a key modulator of mechanosensitive YAP1 signalling in response to postnatal mechanical compression. K9 loss-of-function variants driving KRT9-pEDD, a palmoplantar epidermal differentiation disorder, result in aberrant YAP1 subcellular partitioning and elevated levels of the stress-induced keratin 16 (KRT16/K16). Krt9 null mice recapitulate these molecular phenotypes as early as postnatal day 3. We further identify dynamic, YAP1-dependent regulation of Krt16/K16, upstream of and necessary for Krt9/K9 expression, during early postnatal development in situ and in response to mechanical compression of keratinocytes ex vivo, highlighting the role of mechanical stress in epidermal specification. Mechanistically, K9 interacts with the YAP1 binding protein 14-3-3σ and sequesters YAP1 in the cytoplasm, inhibiting its transcriptional activity; these functions are disrupted by KRT9-pEDD-causing variants in K9. Finally, we show that genetic or pharmacological inhibition of YAP1 ameliorates palmoplantar keratoderma in Krt9 null mice. These findings reveal a role for mechanical cues in specification and maintenance of palmoplantar skin and suggest new therapeutic interventions for inherited palmoplantar epidermal differentiation disorders.","abstractZh":"掌跖表皮为适应其在运动过程中承受的异常机械应变，在组织学和分子层面均与其他皮肤部位不同。决定并维持其独特身份的机制仍未被完全阐明。在此，我们鉴定出I型角蛋白9（KRT9/K9）——一种仅在掌跖表皮中独特表达的蛋白——是响应出生后机械压缩的机械敏感性YAP1信号的关键调节因子。导致KRT9-pEDD（一种掌跖表皮分化障碍）的K9功能缺失变异会引起YAP1亚细胞分布异常以及应激诱导的角蛋白16（KRT16/K16）水平升高。Krt9缺失小鼠早在出生后第3天即可重现这些分子表型。我们进一步发现，在出生后早期发育过程中，Krt16/K16在体内受YAP1依赖的动态调控，且位于Krt9/K9表达的上游并为其所必需；在离体角质形成细胞对机械压缩的响应中亦如此，突显了机械应激在表皮特化中的作用。在机制上，K9与YAP1结合蛋白14-3-3σ相互作用，并将YAP1隔离于细胞质中，抑制其转录活性；这些功能被导致KRT9-pEDD的K9变异所破坏。最后，我们显示遗传学或药理学抑制YAP1可改善Krt9缺失小鼠的掌跖角化病。这些发现揭示了机械线索在掌跖皮肤特化与维持中的作用，并为遗传性掌跖表皮分化障碍提示了新的治疗干预手段。","tier":"1区","if":17.3},
