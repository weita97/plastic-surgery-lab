<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1565C0">
<meta name="description" content="每日学习工作台 · 语录 / 英语 / 科研进展 / 时间安排 / 账本 / 复盘">
<title>每日学习工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<style>
/* ================= 每日学习工作台 · 样式 ================= */
:root{
  --brand:#1565C0; --brand-2:#0D47A1; --brand-3:#42A5F5; --brand-soft:#E8F1FB;
  --ink:#1A2230; --ink-2:#43506B; --ink-3:#7B8AA3;
  --line:#DDE5F0; --line-2:#EDF2F9; --bg:#F2F6FC; --card:#FFFFFF;
  --ok:#12855B; --ok-soft:#E6F6EF; --warn:#B26A00; --warn-soft:#FFF5E5;
  --bad:#C62828; --bad-soft:#FDECEC;
  --r:14px; --r-sm:10px;
  --sh:0 1px 2px rgba(21,101,192,.06), 0 6px 18px rgba(21,101,192,.07);
  --sh-2:0 2px 6px rgba(21,101,192,.10), 0 14px 34px rgba(21,101,192,.12);
  --side:232px; --gap:12px;
  --fs:13.5px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  background:var(--bg); color:var(--ink); font-size:var(--fs); line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C6D5E8;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#A8BFDC}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 布局 ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--side); flex:0 0 var(--side); background:#fff; border-right:1px solid var(--line);
  position:sticky; top:0; height:100vh; overflow-y:auto; z-index:40;
  display:flex; flex-direction:column;
}
.brand{padding:14px 16px 12px;border-bottom:1px solid var(--line-2)}
.brand h1{margin:0;font-size:15.5px;letter-spacing:.3px;color:var(--brand-2);display:flex;align-items:center;gap:7px}
.brand .sub{margin-top:3px;font-size:11.5px;color:var(--ink-3);line-height:1.5}
.brand .today{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--brand);background:var(--brand-soft);border-radius:8px;padding:5px 9px}
.nav{padding:8px 8px 20px;flex:1}
.nav-group{font-size:10.5px;letter-spacing:.8px;color:var(--ink-3);padding:10px 10px 5px;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;
  padding:8px 10px;border-radius:9px;color:var(--ink-2);text-align:left;line-height:1.35;
  transition:background .16s,color .16s; font-size:13px;
}
.nav-item .ico{font-size:15px;width:18px;text-align:center;flex:0 0 18px}
.nav-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:var(--brand-3);opacity:0;flex:0 0 6px}
.nav-item:hover{background:var(--brand-soft);color:var(--brand-2)}
.nav-item.active{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(21,101,192,.28)}
.nav-item.active .dot{opacity:1;background:#fff}
.nav-foot{padding:10px 14px 14px;border-top:1px solid var(--line-2);font-size:11px;color:var(--ink-3);line-height:1.7}
.nav-foot .row{display:flex;justify-content:space-between;gap:8px}
.nav-foot b{color:var(--brand);font-weight:600}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:9px 18px;display:flex;align-items:center;gap:12px;
}
.hamburger{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;width:36px;height:34px;font-size:16px;color:var(--brand);align-items:center;justify-content:center}
.topbar .tt{font-size:15px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px;min-width:0}
.topbar .tt span.tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sp{flex:1}
.topbar .tools{display:flex;align-items:center;gap:7px;flex-wrap:nowrap}
.content{padding:var(--gap) 18px 40px;max-width:1500px;width:100%;margin:0 auto}
.page{display:none}
.page.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.overlay{display:none;position:fixed;inset:0;background:rgba(16,32,56,.42);z-index:35}

/* ---------- 通用组件 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-bottom:var(--gap)}
.card.tight{padding:10px 12px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:13.5px;font-weight:650;color:var(--ink);display:flex;align-items:center;gap:6px}
.card-h .sp{flex:1}
.card-sub{font-size:11.5px;color:var(--ink-3);margin:-4px 0 9px}
.grid{display:grid;gap:var(--gap)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb0{margin-bottom:0}.mb8{margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.sp{flex:1}
.muted{color:var(--ink-3)}
.small{font-size:11.5px}
.tiny{font-size:10.5px}
.center{text-align:center}
.nowrap{white-space:nowrap}
.hr{height:1px;background:var(--line-2);margin:9px 0}

.btn{
  border:1px solid var(--line);background:#fff;color:var(--brand-2);border-radius:9px;
  padding:5px 11px;font-size:12.5px;line-height:1.5;display:inline-flex;align-items:center;gap:5px;
  transition:.15s;white-space:nowrap;font-weight:500;
}
.btn:hover{background:var(--brand-soft);border-color:#BFD6F2}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.sm{padding:2px 8px;font-size:11.5px;border-radius:7px}
.btn.xs{padding:1px 7px;font-size:11px;border-radius:6px}
.btn.danger{color:var(--bad);border-color:#F3C9C9}
.btn.danger:hover{background:var(--bad-soft)}
.btn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;justify-content:center}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1.5px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand-2);border:1px solid #CFE0F5;line-height:1.6;white-space:nowrap}
.tag.dark{background:#16324F;color:#E7F1FF;border-color:#16324F}
.tag.g{background:var(--ok-soft);color:var(--ok);border-color:#C9EADB}
.tag.o{background:var(--warn-soft);color:var(--warn);border-color:#F5DEB6}
.tag.r{background:var(--bad-soft);color:var(--bad);border-color:#F5C9C9}
.tag.n{background:#F1F4F9;color:var(--ink-2);border-color:var(--line)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-3)}
.chip{
  border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:999px;
  padding:3px 11px;font-size:12px;transition:.15s;white-space:nowrap
}
.chip:hover{border-color:#BFD6F2;color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:0;background:transparent;padding:7px 12px;font-size:12.5px;color:var(--ink-3);
  border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px;font-weight:500;
}
.tab:hover{color:var(--brand)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:650}

.seg{display:inline-flex;background:#EFF4FB;border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:3px 10px;border-radius:7px;font-size:12px;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(21,101,192,.16);font-weight:600}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11.5px;color:var(--ink-3)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
  border:1px solid var(--line);border-radius:9px;padding:6px 9px;background:#fff;outline:none;transition:.15s;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand-3);box-shadow:0 0 0 3px rgba(66,165,245,.16)}
textarea{resize:vertical;min-height:64px;line-height:1.6}

.progress{height:6px;border-radius:999px;background:#EAF0F8;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-3),var(--brand));border-radius:999px;transition:width .35s}
.bar-row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.bar-row .nm{width:52px;flex:0 0 52px;color:var(--ink-2)}
.bar-row .track{flex:1;height:9px;background:#EEF3FA;border-radius:999px;overflow:hidden;min-width:30px}
.bar-row .track>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#64B5F6,#1565C0)}
.bar-row .vv{width:56px;text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:0 0 56px}

.empty{text-align:center;color:var(--ink-3);padding:22px 10px;font-size:12.5px}
.empty .e-ico{font-size:26px;display:block;margin-bottom:6px;opacity:.7}

.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:#fff;transition:.15s}
.item:hover{border-color:#C7DCF5;box-shadow:0 3px 12px rgba(21,101,192,.07)}
.item .it-h{display:flex;gap:8px;align-items:flex-start}
.item .it-h .sp{flex:1}
.item h4{margin:0;font-size:13px;font-weight:600;line-height:1.5}
.item .meta{font-size:11px;color:var(--ink-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 语录 */
.quote{border-radius:var(--r);padding:14px 16px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh)}
.quote::after{content:"";position:absolute;right:-24px;top:-24px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.13)}
.quote .qmark{font-size:26px;line-height:1;opacity:.5;font-family:Georgia,serif}
.quote .qt{font-size:14.5px;line-height:1.7;font-weight:600;margin:2px 0 6px;position:relative;z-index:1}
.quote .qa{font-size:11.5px;opacity:.9}
.quote .qn{font-size:12px;line-height:1.65;margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.28);position:relative;z-index:1}
.quote .qbtns{display:flex;gap:6px;margin-top:9px;position:relative;z-index:1;flex-wrap:wrap}
.quote .qbtns button{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.16);color:#fff;border-radius:8px;padding:2px 9px;font-size:11.5px}
.quote .qbtns button:hover{background:rgba(255,255,255,.3)}
.q1{background:linear-gradient(135deg,#7E57C2,#4527A0)}
.q2{background:linear-gradient(135deg,#1E88E5,#0D47A1)}
.q3{background:linear-gradient(135deg,#26A69A,#00695C)}

/* 单词卡 */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:8px}
.wcard{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;background:#fff;transition:.15s}
.wcard:hover{border-color:#C7DCF5;box-shadow:0 3px 12px rgba(21,101,192,.07)}
.wcard .w{display:flex;align-items:center;gap:6px}
.wcard .w b{font-size:13.5px;color:var(--brand-2);letter-spacing:.2px;word-break:break-word}
.wcard .ph{font-size:11px;color:var(--ink-3);font-family:"Segoe UI",Georgia,serif}
.wcard .mean{font-size:12.5px;color:var(--ink-2);margin-top:4px;border-top:1px dashed var(--line-2);padding-top:4px}
.wcard .mean.hide{display:none}
.wcard.learned{background:linear-gradient(180deg,#F7FBF8,#fff);border-color:#CFE9DC}
.wcard .wbtns{display:flex;gap:4px;margin-top:5px}

/* 文献 */
.paper{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:#fff;margin-bottom:8px;transition:.15s}
.paper:hover{border-color:#C7DCF5;box-shadow:0 3px 12px rgba(21,101,192,.07)}
.paper .pt{font-size:13px;font-weight:600;line-height:1.5;margin:0}
.paper .pt a{color:var(--ink)}
.paper .pt a:hover{color:var(--brand)}
.paper.fresh{border-left:3px solid #41BA41}
.paper .zh{font-size:12px;color:var(--brand-2);margin-top:3px;display:block}
.paper .pm{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--ink-3);margin-top:5px}
.paper .ab{font-size:12px;color:var(--ink-2);line-height:1.7;margin-top:6px;padding:8px 10px;background:#F7FAFE;border-radius:8px;border-left:3px solid var(--brand-3);display:none;max-height:420px;overflow:auto}
.paper .ab.show{display:block}
.paper .ab .ab-en{color:var(--ink-2)}
.paper .ab .zh-ab{margin-top:8px;padding-top:8px;border-top:1px dashed #DCE7F5;color:var(--brand-2);display:block;line-height:1.8}
.jq{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;padding:0 6px;border-radius:5px;background:#EAF2FD;color:var(--brand-2);font-weight:600}

/* 测验 */
.quiz{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:12px 14px;margin-bottom:10px}
.quiz .qh{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.quiz .qn2{flex:0 0 22px;height:22px;border-radius:7px;background:var(--brand-soft);color:var(--brand-2);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.quiz .qtext{flex:1;font-size:13px;font-weight:550;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:5px;margin-left:30px}
.opt{
  display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);background:#fff;border-radius:9px;
  padding:6px 10px;text-align:left;font-size:12.5px;color:var(--ink-2);transition:.14s;line-height:1.6;width:100%
}
.opt:hover{border-color:#BFD6F2;background:#F8FBFF}
.opt .k{flex:0 0 17px;height:17px;border-radius:50%;background:#EEF3FA;color:var(--ink-2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt.sel{border-color:var(--brand);background:#F1F7FF}
.opt.sel .k{background:var(--brand);color:#fff}
.opt.right{border-color:#8FD4B4;background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:#F0B4B4;background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;opacity:1}
.explain{margin:7px 0 0 30px;font-size:12px;line-height:1.7;color:var(--ink-2);background:#F7FAFE;border-left:3px solid var(--brand-3);border-radius:0 8px 8px 0;padding:7px 10px;display:none}
.explain.show{display:block}
.explain b{color:var(--brand-2)}
.score{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#E8F1FB,#F7FBFF);border:1px solid #CFE0F5;border-radius:var(--r);padding:11px 14px;margin-bottom:10px}
.score .big{font-size:24px;font-weight:800;color:var(--brand);line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:12px;font-weight:600;color:var(--ink-3)}

/* 日历 */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.cal-head .ym{font-size:14px;font-weight:700;color:var(--ink);min-width:118px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{text-align:center;font-size:11px;color:var(--ink-3);padding:2px 0;font-weight:600}
.cal-cell{
  min-height:66px;border:1px solid var(--line-2);border-radius:9px;padding:4px 5px;background:#fff;
  display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:.14s;position:relative;overflow:hidden
}
.cal-cell:hover{border-color:var(--brand-3);background:#F8FBFF}
.cal-cell.dim{background:#FAFCFE;color:#B9C6D8}
.cal-cell.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:#F1F7FF}
.cal-cell.sel{border-color:var(--brand);box-shadow:0 0 0 3px rgba(21,101,192,.16)}
.cal-cell .d{font-size:11.5px;font-weight:650;color:var(--ink-2)}
.cal-cell.today .d{color:var(--brand)}
.cal-cell .ev{font-size:10px;line-height:1.35;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-lab{background:#E3F0FF;color:#0D47A1}
.ev-trip{background:#E6F6EF;color:#0F6B48}
.ev-remind{background:#FFF3E0;color:#9A5B00}
.cal-cell .more{font-size:9.5px;color:var(--ink-3)}
.evlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.evrow{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff}
.evrow .sp{flex:1;min-width:0}
.evrow h5{margin:0;font-size:12.5px;font-weight:600}
.evrow p{margin:2px 0 0;font-size:11.5px;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}

/* 账本 */
.stat{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;background:linear-gradient(180deg,#F8FBFF,#fff)}
.stat .lb{font-size:11px;color:var(--ink-3)}
.stat .vl{font-size:18px;font-weight:800;color:var(--brand-2);line-height:1.3;font-variant-numeric:tabular-nums}
.stat .vl small{font-size:11px;font-weight:600;color:var(--ink-3)}
.stat.g .vl{color:var(--ok)}
.stat.o .vl{color:var(--warn)}
table.tb{width:100%;border-collapse:collapse;font-size:12px}
table.tb th{text-align:left;font-weight:600;color:var(--ink-3);font-size:11px;padding:5px 7px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFCFF}
table.tb td{padding:5px 7px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tb tr:hover td{background:#FAFCFF}
table.tb td.num{text-align:right;font-variant-numeric:tabular-nums}
.tb-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}

/* 链接卡 */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.lcard{
  display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;
  background:#fff;transition:.15s;color:inherit;text-decoration:none;min-width:0
}
.lcard:hover{border-color:var(--brand-3);background:#F8FBFF;box-shadow:0 4px 14px rgba(21,101,192,.10);text-decoration:none;transform:translateY(-1px)}
.lcard .li{width:32px;height:32px;flex:0 0 32px;border-radius:9px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:16px}
.lcard .lt{min-width:0;flex:1}
.lcard .lt b{display:block;font-size:12.5px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard .lt span{display:block;font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 选题 */
.idea{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:#fff;transition:.15s}
.idea:hover{border-color:#C7DCF5;box-shadow:0 3px 12px rgba(21,101,192,.07)}
.idea h4{margin:0 0 4px;font-size:13px;font-weight:600;line-height:1.5}
.idea .kv{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.6}
.idea .kv b{color:var(--ink-3);font-weight:500}
.idea .isrc{margin-top:4px;display:flex;flex-direction:column;gap:3px}
.idea .ilink{display:block;font-size:11px;line-height:1.5;color:var(--brand-2);text-decoration:none;background:#F6FAFF;
  border:1px solid #E3EEFA;border-radius:7px;padding:4px 7px;transition:.15s}
.idea .ilink:hover{background:var(--brand-soft);border-color:#C7DCF5;color:var(--brand)}
.idea .ilink b{color:var(--brand-3);font-weight:600}
.idea .ij{display:block;font-size:10px;color:var(--ink-3);margin-top:1px}

/* 提示条 */
.hint{font-size:11.5px;color:var(--warn);background:var(--warn-soft);border:1px solid #F5DEB6;border-radius:9px;padding:6px 10px;line-height:1.6}
.hint.b{color:var(--brand-2);background:var(--brand-soft);border-color:#CFE0F5}
.hint.g{color:var(--ok);background:var(--ok-soft);border-color:#C9EADB}

/* toast */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);z-index:99;
  background:#16324F;color:#fff;border-radius:10px;padding:8px 16px;font-size:12.5px;
  box-shadow:0 10px 28px rgba(0,0,0,.24);opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 抽屉（移动端） */
@media (max-width:900px){
  :root{--gap:10px}
  .sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-102%);transition:transform .24s ease;box-shadow:0 0 40px rgba(0,0,0,.18)}
  .sidebar.open{transform:none}
  .overlay.show{display:block}
  .hamburger{display:flex}
  .content{padding:10px 10px 34px}
  .topbar{padding:7px 10px;gap:8px}
  .g2,.g3,.g4,.g5{grid-template-columns:1fr}
  .g3.half,.g4.half,.g5.half{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
  .lgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cal-cell{min-height:52px;padding:3px 3px;border-radius:7px}
  .cal-cell .ev{font-size:9px;padding:0 2px}
  .quote .qt{font-size:13.5px}
  .opts{margin-left:0}
  .explain{margin-left:0}
  .topbar .tt{font-size:13.5px}
  .topbar .tools .btn{padding:4px 8px;font-size:11.5px}
  .topbar .hide-sm{display:none}
}
@media (max-width:420px){
  .lgrid{grid-template-columns:1fr}
  .wgrid{grid-template-columns:1fr}
}
@media print{
  .sidebar,.topbar,.overlay{display:none}
  .content{padding:0}
  body{background:#fff}
  .page{display:block!important}
}

function parseCards(raw) {
  var out = {};
  Object.keys(raw).forEach(function (band) {
    out[band] = raw[band].trim().split('\n').map(function (line, i) {
      var p = line.split('|');
      return {
        id: band + '_' + i,
        band: band,
        t: p[0], d: p[1],
        q: { q: p[2], o: p[3].split(';;'), a: parseInt(p[4], 10), e: p[5] }
      };
    });
  });
  return out;
}

{"pmid":"41781486","topic":"创面修复","title":"Neural crest gene regulatory networks as drivers of development, diversification and disease.","titleZh":"神经嵴基因调控网络驱动发育、多样化与疾病","journal":"Nature reviews. Molecular cell biology","year":"2026","date":"2026-Jun","edat":"2026-03-04","authors":"Stundl J, Desingu Rajan AR, Bronner ME","doi":"10.1016/B978-0-12-088563-3.X5018-4","abstract":"The neural crest is an important stem cell population characterized by its multipotency, migratory behaviour and broad ability to differentiate into numerous derivatives throughout the vertebrate body, as diverse as cell types contributing to the cardiovascular system, craniofacial skeleton, peripheral nervous system and pigmentation of the skin. The developmental trajectory of the neural crest is governed by a complex gene regulatory network (GRN) that mediates induction and specification at the neural plate border, emergence of neural crest cells (NCCs) from the neural tube, their migration through the periphery and cell fate determination en route to different final destinations. In this Review, we discuss the significant progress in investigating the neural crest GRN, which has increased our understanding of how NCCs impact vertebrate development and evolution, their role in adult tissue regeneration and their contribution to diseases derived from abnormalities in NCCs.","abstractZh":"神经嵴是一个重要的干细胞群体，其特征为多能性、迁移行为以及在整个脊椎动物体内分化为众多衍生物的广泛能力，这些衍生物涵盖参与心血管系统、颅面骨骼、周围神经系统和皮肤色素沉着的各类细胞类型。神经嵴的发育轨迹受一个复杂的基因调控网络（GRN）支配，该网络介导神经板边界的诱导与特化、神经嵴细胞（NCCs）从神经管中涌现、其在周围组织中的迁移，以及前往不同最终目的地途中的细胞命运决定。在本综述中，我们讨论神经嵴 GRN 研究的重要进展，这些进展加深了我们对 NCCs 如何影响脊椎动物发育与演化、其在成体组织再生中的作用，以及其对由 NCCs 异常所致疾病的贡献的理解。","tier":"1区","if":81.3},
{"pmid":"42875501","topic":"创面修复","title":"Sexual dimorphism in epidermal stem cell dynamics.","titleZh":"表皮干细胞动力学的性别二态性","journal":"Nature","year":"2026","date":"2026-Oct-14","edat":"2026-10-14","authors":"Engelman D, Hochstetter J, Bauduin A, Patil S, Valenti M","doi":"10.1093/nar/gkaf018","abstract":"The epidermis is a stratified epithelium comprising proliferative basal cells and differentiated suprabasal cells that are continuously renewed throughout life. Conflicting theories have been proposed regarding the heterogeneity of the basal cell layer, with some studies proposing that all proliferative cells have self-renewal potential during homeostasis1-5. Meanwhile, others posit a model in which stem cell differentiation occurs through an intermediate transit-amplifying-like progenitor state with strictly limited proliferative potential6-10. Here, to determine the heterogeneity and pattern of cell fate, we performed intravital time-lapse imaging to track the fate of lineage-labelled cells in the skin interfollicular epidermis. Results from quantitative analyses of clonal dynamics support a two-compartment model of epidermal homeostasis, whereby basal cells are organized in a stem cell-transit-amplifying cell hierarchy. Critical to these conclusions was the discovery of sexual dimorphism in epidermal fate, with female mice showing a highly synchronized pattern of cell division, differentiation and delamination that contributes to accelerated wound healing. Single-cell RNA sequencing, transcriptional profiling and clonal analyses of castrated mice revealed that male sex hormones promote stem cell differentiation and delamination. In summary, our study provides insight into the functional identity of the stem cell population and identifies sex-specific differences in the regulation of epidermal stem cells and transit-amplifying cell fate.","abstractZh":"表皮是一种复层上皮，由增殖性的基底层细胞和分化性的基底上层细胞组成，并在整个生命过程中不断更新。关于基底层细胞的异质性，此前已提出相互冲突的理论：一些研究提出，在稳态条件下所有增殖细胞都具有自我更新潜能1-5；而另一些研究则提出一种模型，认为干细胞的分化是通过一个中间性的、类似短暂扩增的祖细胞状态发生的，该状态的增殖潜能严格受限6-10。在此，为确定细胞命运的异质性及其模式，我们采用活体延时成像技术，追踪皮肤毛间表皮中谱系标记细胞的命运。对克隆动力学进行定量分析的结果支持表皮稳态的双区室模型，即基底层细胞以干细胞-短暂扩增细胞的层级方式组织。这些结论的关键在于发现了表皮细胞命运的性别二态性：雌性小鼠表现出高度同步的细胞分裂、分化和脱层模式，从而有助于加速创面愈合。对去势小鼠进行的单细胞RNA测序、转录谱分析和克隆分析显示，雄激素促进干细胞的分化和脱层。总之，我们的研究为了解干细胞群体的功能身份提供了见解，并识别出表皮干细胞和短暂扩增细胞命运调控中的性别特异性差异。","tier":"1区","if":50.5},
{"pmid":"42649302","topic":"创面修复","title":"A binding-to-release strategy for targeted anticancer drug delivery.","titleZh":"一种用于靶向抗癌药物递送的“结合即释放”策略","journal":"Nature","year":"2026","date":"2026-Oct","edat":"2026-08-26","authors":"Wen Z, Xu M, Yan Z, Kong Z, Wang Y","doi":"10.2967/jnumed.121.262533","abstract":"Drug conjugates, such as antibody-drug conjugates (ADCs) and small molecule-drug conjugates (SMDCs), are often dependent on efficient receptor-mediated endocytosis for payload release1-3-supported by about 10% of targets4-7. For poorly internalizing targets, drug conjugates dissociate and clear rapidly, limiting efficacy. To overcome the limitation in the internalization-to-release (ITR) pattern, we introduce a binding-to-release (BTR) strategy that decouples drug release from endocytosis by positioning an electrophile for direct cleavage by a proximal nucleophilic residue within the binding pocket. To realize this, we developed phosphorus(V)-phenol exchange (PhoPEx), a sulfur(VI) fluoride exchange-inspired chemistry enabling release of various payloads. This platform demonstrated high specificity from in vitro to clinical specimens, achieving precise detection of fibroblast activation protein (FAP) expression in patient-derived lymph nodes. In therapeutic settings, the FAP-BTR-SMDC achieved 5.9-fold higher monomethyl auristatin E exposure (AUC0-120 h) in tumours than internalization-dependent FAP-ITR-SMDC, matching FAP-ITR-ADC levels while minimizing off-target release. This led to improved ratios: the tumour-to-blood ratio was 14.7- and 3.6-fold higher than that of FAP-ITR-SMDC and FAP-ITR-ADC, respectively, and the tumour-to-liver ratio was 55.1- and 58.7-fold higher, respectively. This biodistribution increased the maximum tolerated dose and led to near-complete tumour regression in various tumour models. We further extended BTR to programmed cell death ligand 1 (PD-L1) and an mRNA-display-derived FAP peptide, suggesting potential broad applicability. This work establishes a framework that overcomes the internalization barrier, broadening the target scope for therapeutic and diagnostic conjugates.","abstractZh":"药物偶联物，如抗体-药物偶联物（ADC）和小分子-药物偶联物（SMDC），往往依赖高效的受体介导内吞来释放载荷1-3——这仅由约10%的靶点所支持4-7。对于内吞能力差的靶点，药物偶联物会迅速解离和清除，从而限制疗效。为克服内化-释放（ITR）模式的局限，我们引入了一种“结合即释放”（BTR）策略，通过在结合口袋内放置一个亲电基团以供邻近的亲核残基直接切割，从而使药物释放与内吞脱钩。为实现这一点，我们开发了磷(V)-酚交换（PhoPEx）化学，这是一种受硫(VI)氟交换启发、能够释放多种载荷的化学方法。该平台从体外到临床标本均表现出高特异性，实现了对患者来源淋巴结中成纤维细胞活化蛋白（FAP）表达的精准检测。在治疗场景中，FAP-BTR-SMDC在肿瘤中达到的单甲基澳瑞他汀E暴露量（AUC0-120 h）比依赖内吞的FAP-ITR-SMDC高5.9倍，与FAP-ITR-ADC水平相当，同时将脱靶释放降至最低。这带来了改善的比值：肿瘤/血液比值分别比FAP-ITR-SMDC和FAP-ITR-ADC高14.7倍和3.6倍，肿瘤/肝脏比值分别高55.1倍和58.7倍。这种生物分布提高了最大耐受剂量，并在多种肿瘤模型中导致近乎完全的肿瘤消退。我们进一步将BTR拓展至程序性细胞死亡配体1（PD-L1）和一种mRNA展示衍生的FAP肽，提示其可能具有广泛的适用性。本工作建立了一个克服内化障碍的框架，拓宽了治疗性和诊断性偶联物的靶点范围。","tier":"1区","if":50.5},
{"pmid":"42816609","topic":"创面修复","title":"A two-hit mechanism triggers autoimmune hair loss.","titleZh":"「二次打击」机制触发自身免疫性脱发","journal":"Nature","year":"2026","date":"2026-Sep-30","edat":"2026-09-30","authors":"Cui J, Wu P, Chang Y, Yu Y, Gao Z","doi":"10.1038/s41467-019-09234-6","abstract":"Autoimmune diseases arise from a breakdown of immune tolerance, yet the mechanisms that initiate tissue-specific autoimmunity remain poorly understood1-4. Here we identify a two-hit mechanism in which immune dysregulation and physiological neural activation converge to trigger autoimmune alopecia. We show that transient depletion of regulatory T (Treg) cells during the anagen phase of the hair cycle, but not during telogen, induces CD8+ T-cell-mediated destruction of immune-privileged hair follicle stem cells (HFSCs), resulting in hair loss. This anagen-restricted susceptibility depends on sympathetic nerve activity, which is physiologically elevated during anagen: sympathetic denervation prevents disease, whereas psychological stress or optogenetic activation of sympathetic nerves renders otherwise resistant telogen skin susceptible to autoimmune attack after Treg cell depletion. Mechanistically, sympathetic noradrenaline signalling through HFSC-intrinsic ADRB2 promotes physiological reactivation of endogenous retroviruses (ERVs) in anagen HFSCs. Under conditions of Treg cell depletion, this ERV-associated state drives autoimmune pathology by engaging AIM2-dependent innate immune activation and pathogenic CD8+ T cell responses. Accordingly, genetic ablation of Aim2 or pharmacological inhibition of ERV reverse transcription protects against disease development. Together, these findings show that physiological sympathetic activity establishes a transiently vulnerable epithelial state, whereas Treg cells prevent this state from progressing to tissue-specific autoimmunity. This neuro-epithelial-immune circuit links hair-cycle state to the breach of HFSC immune privilege and the initiation of autoimmune alopecia.","abstractZh":"自身免疫性疾病源于免疫耐受的破坏，然而启动组织特异性自身免疫的机制仍知之甚少1-4。在此，我们鉴定出一种「二次打击」机制，即免疫失调与生理性神经激活共同作用触发自身免疫性脱发。我们证明，在毛发周期的生长期（anagen）而非休止期（telogen）短暂清除调节性T（Treg）细胞，可诱导CD8+ T细胞介导的对免疫豁免性毛囊干细胞（HFSCs）的破坏，从而导致脱发。这种生长期限定的易感性依赖于交感神经活动，而交感神经活动在生长期呈生理性升高：交感神经去支配可预防疾病，而心理应激或光遗传学激活交感神经则使原本具有抵抗力的休止期皮肤在Treg细胞清除后易受自身免疫攻击。在机制上，交感去甲肾上腺素通过HFSC内在的ADRB2传递信号，促进生长期HFSCs中内源性逆转录病毒（ERVs）的生理性再激活。在Treg细胞清除的条件下，这种ERV相关状态通过启动AIM2依赖性天然免疫激活和致病性CD8+ T细胞反应来驱动自身免疫病理。相应地，基因敲除Aim2或药物抑制ERV逆转录可防止疾病发生。总之，这些发现表明生理性交感活动建立了一种短暂易感的上皮状态，而Treg细胞阻止该状态进展为组织特异性自身免疫。这一神经-上皮-免疫环路将毛发周期状态与HFSC免疫豁免的破坏及自身免疫性脱发的启动联系起来。","tier":"1区","if":50.5},
{"pmid":"42772280","topic":"创面修复","title":"Switching of transcriptional control from interferon regulatory factor 2 to interferon regulatory factor 1 drives innate immune cell activation.","titleZh":"转录调控由干扰素调节因子2向干扰素调节因子1的切换驱动天然免疫细胞活化","journal":"Cell","year":"2026","date":"2026-Oct-15","edat":"2026-09-22","authors":"Cadena C, Reja R, Bolech E, Webster JD, Kameswaran V","doi":"10.1016/j.cell.2026.08.049","abstract":"Interferon regulatory factor 2 (IRF2) is a transcription factor that prevents skin inflammation in mice and humans but, paradoxically, promotes pyroptosis by upregulating gasdermin D. How IRF2 activates some proinflammatory genes but suppresses inflammation is unclear. We show that skin inflammation in Irf2-deficient mice is driven by IRF1 activation of interferon-stimulated genes (ISGs). Chromatin profiling reveals that IRF1 and IRF2 occupy the same ISG regulatory sites, but as a weaker transcriptional activator, IRF2 limits ISG transcription by IRF1. Toll-like receptor (TLR) signaling favors IRF1-driven transcription by inducing Irf1. In addition, IRF1 recruits the ubiquitin ligase SPOP to ISG sites, resulting in proteasomal degradation of IRF2. This shift from IRF2 to IRF1 occupancy enhances ISG transcription. Collectively, these findings define a hierarchical transcriptional circuit in which IRF2 limits IRF1 activity under homeostatic conditions but is displaced during an immune response, allowing IRF1-dependent gene programs central to innate immunity and autoinflammation.","abstractZh":"干扰素调节因子2（IRF2）是一种转录因子，可在小鼠和人类中防止皮肤炎症，但矛盾的是，它通过上调gasdermin D促进焦亡。IRF2如何既激活某些促炎基因又抑制炎症尚不清楚。我们显示，Irf2缺陷小鼠的皮肤炎症是由IRF1激活干扰素刺激基因（ISGs）所驱动的。染色质分析显示，IRF1和IRF2占据相同的ISG调控位点，但作为较弱的转录激活因子，IRF2限制了IRF1对ISG的转录。Toll样受体（TLR）信号通过诱导Irf1而有利于IRF1驱动的转录。此外，IRF1将泛素连接酶SPOP募集到ISG位点，导致IRF2经蛋白酶体降解。这种从IRF2到IRF1占据的转变增强了ISG转录。总之，这些发现界定了一个层级转录回路：在稳态条件下IRF2限制IRF1活性，但在免疫应答期间IRF2被置换，从而使对天然免疫和自身炎症至关重要的IRF1依赖性基因程序得以启动。","tier":"1区","if":45.5},
{"pmid":"42468523","topic":"细胞衰老","title":"Skin-innervating glutamatergic neurons modulate aging.","titleZh":"支配皮肤的谷氨酸能神经元调节衰老","journal":"Cell","year":"2026","date":"2026-Sep-03","edat":"2026-07-17","authors":"Wang Z, Jin X, Wu Y, Ding W, Zhang F","doi":"10.1016/j.cell.2026.06.032","abstract":"Peripheral nerves regulate skin homeostasis by secreting neurotransmitters, but their role during skin aging remains incompletely understood. Here, we report that cutaneous denervation accelerates skin aging, as evidenced by collagen reduction. Neurofilament heavy chain (Nefh) is decreased in aged skin and is predominantly expressed in vesicular glutamate transporter 2-positive (Vglut2+) skin-innervating glutamatergic neurons. Notably, dermal fibroblasts, the primary producers of collagen, frequently contact Nefh+ nerve fibers. Moreover, Nefh deletion in Vglut2+ glutamatergic neurons drives skin fibroblast senescence and collagen loss, whereas additional glutamate improves skin aging phenotypes. Mechanistically, cyclin-dependent kinase 5 (Cdk5) interacts with both Nefh and Vglut2 and maintains glutamate release and collagen homeostasis. Additionally, in skin fibroblasts, solute carrier family 1 member 3 (Slc1a3) governs the collagen-promoting and anti-senescence functions of glutamate. Together, these findings reveal Nefh-mediated glutamatergic neuromodulation of skin aging and provide therapeutic targets for aging-related skin disorders.","abstractZh":"外周神经通过分泌神经递质调节皮肤稳态，但其在皮肤衰老过程中的作用仍未被完全了解。在此，我们报道皮肤去神经支配可加速皮肤衰老，表现为胶原减少。神经丝重链（Nefh）在衰老皮肤中减少，并主要表达于囊泡谷氨酸转运体2阳性（Vglut2+）的支配皮肤谷氨酸能神经元。值得注意的是，作为胶原主要产生者的真皮成纤维细胞常与Nefh+神经纤维接触。此外，在Vglut2+谷氨酸能神经元中敲除Nefh可驱动皮肤成纤维细胞衰老和胶原丢失，而补充谷氨酸可改善皮肤衰老表型。在机制上，细胞周期蛋白依赖性激酶5（Cdk5）与Nefh和Vglut2均发生相互作用，并维持谷氨酸释放和胶原稳态。此外，在皮肤成纤维细胞中，溶质载体家族1成员3（Slc1a3）调控谷氨酸的促胶原和抗衰老功能。总之，这些发现揭示了Nefh介导的谷氨酸能神经调节对皮肤衰老的作用，并为衰老相关皮肤疾病提供了治疗靶点。","tier":"1区","if":45.5},
{"pmid":"42385701","topic":"创面修复","title":"Four-dimensional molecular mapping from a spatial snapshot reveals the dynamics of hair follicle organogenesis.","titleZh":"基于空间快照的四维分子图谱揭示毛囊器官发生的动态过程","journal":"Cell","year":"2026","date":"2026-Sep-03","edat":"2026-07-01","authors":"Asami S, Yin C, Fan J, Garza LA, Kalhor R","doi":"10.1038/nbt.3192","abstract":"Understanding organ formation requires capturing molecular information simultaneously in three-dimensional (3D) space and across developmental time. To this end, we developed 3D DNase-Enhanced Expression Profiling (3DEEP), a tissue-clearing approach that removes genomic DNA to extend spatial transcriptomic profiling hundreds of microns into intact tissues. We applied 3DEEP to neonatal mouse skin, capturing hundreds of developing hair follicles across their organogenesis trajectory. Ordering follicles by molecularly inferred developmental age transformed this single spatial snapshot into a four-dimensional (3D + time) molecular map of organogenesis. This map revealed developmental dynamics spanning stem cell compartment stratification, emergence of new cell subtypes within the follicle, and cascading structural transformations leading to hair canal formation. Comparative analysis of Foxn1-deficient nude mice, a hairlessness model, revealed organ-wide changes in developmental dynamics, including delayed molecular progression, reduced coordination, and increased developmental instability, preceding overt structural defects. This work demonstrates how deep-tissue spatial transcriptomics can uncover hidden dynamics of organ formation.","abstractZh":"理解器官形成需要在三维（3D）空间以及发育时间维度上同时获取分子信息。为此，我们开发了三维 DNase 增强表达谱分析（3DEEP），这是一种通过去除基因组 DNA 使空间转录组分析深入完整组织数百微米深度的组织透明化方法。我们将 3DEEP 应用于新生小鼠皮肤，捕获了处于器官发生轨迹上的数百个发育中毛囊。按分子推断的发育年龄对毛囊进行排序，将这一单一空间快照转化为器官发生的四维（3D+时间）分子图谱。该图谱揭示了涵盖干细胞区室分层、毛囊内新细胞亚型出现以及导致毛管形成的级联结构转变等发育动态。对无毛模型 Foxn1 缺陷裸鼠的比较分析显示，在明显结构缺陷出现之前，其发育动态已发生全器官范围的变化，包括分子进程延迟、协调性下降和发育不稳定性增加。本研究展示了深部组织空间转录组学如何揭示器官形成中隐藏的动态过程。","tier":"1区","if":45.5},
{"pmid":"42784676","topic":"创面修复","title":"Targeting an atypical G protein-coupled receptor signaling pathway for cardiac fibrosis therapy.","titleZh":"靶向非典型G蛋白偶联受体信号通路治疗心脏纤维化","journal":"Science (New York, N.Y.)","year":"2026","date":"2026-Sep-24","edat":"2026-09-24","authors":"Zhang H, Shivnaraine RV, Ren L, Thai PN, Janicot R","doi":"10.1126/science.aej5896","abstract":"Cardiac fibrosis independently predicts adverse outcomes in heart failure (HF), yet no Food and Drug Administration-approved therapy directly targets fibrotic remodeling in the heart. To address this unmet clinical need, we used a multidimensional drug discovery pipeline centered on a human induced pluripotent stem cell (iPSC)-based platform. Through high-throughput screening, we identified CGS15943 (CGS) as the lead antifibrotic compound and validated its activity in human cardiac fibroblasts, three-dimensional engineered heart tissues, and animal models of HF. Mechanistic studies revealed an atypical adenosine receptor (AR)-dependent signaling pathway in which AR subtypes converge on Gβγ (the βγ subunits of heterotrimeric GTP-binding proteins) to activate phosphoinositide 3-kinase (PI3K)-AKT and yes-associated protein (YAP). CGS suppressed this signaling axis, thereby reducing fibrotic gene expression and fibroblast activation. These findings establish AR-driven Gβγ signaling as a potential therapeutic target for cardiac fibrosis.","abstractZh":"心脏纤维化可独立预测心力衰竭（HF）的不良结局，然而尚无美国食品药品监督管理局批准的疗法直接靶向心脏的纤维化重构。为应对这一未被满足的临床需求，我们采用以人类诱导多能干细胞（iPSC）平台为核心的多维度药物发现流程。通过高通量筛选，我们鉴定出CGS15943（CGS）为先导抗纤维化化合物，并在人心脏成纤维细胞、三维工程化心脏组织和HF动物模型中验证了其活性。机制研究揭示了一条非典型的腺苷受体（AR）依赖性信号通路，其中AR各亚型汇聚于Gβγ（异三聚体GTP结合蛋白的βγ亚基）以激活磷脂酰肌醇3-激酶（PI3K）-AKT和yes相关蛋白（YAP）。CGS抑制了该信号轴，从而减少纤维化基因表达和成纤维细胞活化。这些发现确立了AR驱动的Gβγ信号作为心脏纤维化的潜在治疗靶点。","tier":"1区","if":44.7},
{"pmid":"42275467","topic":"创面修复","title":"Chemically induced skin tumors arise from long-lived stem cells of the upper hair follicle.","titleZh":"化学诱导的皮肤肿瘤起源于毛囊上部的长寿干细胞","journal":"Science (New York, N.Y.)","year":"2026","date":"2026-Aug-06","edat":"2026-06-11","authors":"Kandyba E, Jabouille A, Calvet F, Li YR, Curtabbi A","doi":"10.5281/zenodo.20076432","abstract":"The identification of the cancer cell of origin is a fundamental issue in cancer biology. We used fluorescent lineage tracing of independent mouse skin stem cell populations, single-cell transcriptomics, and duplex sequencing to identify the origin of chemically induced skin tumors. Tumors arose predominantly from Lgr6+ and/or Lrig1+ stem cells of the upper hair follicle but only very rarely from the Lgr5+ and Krt19+ hair follicle bulge. Lgr6+ stem cells initiated by dimethylbenzanthracene responded to tumor promoter treatment, resulting in clonal expansion of initiated cells carrying the canonical Hras Q61L mutation. Spontaneous mutations in Kras also clonally expanded but did not generate tumors unless the Hras gene was deleted, thus revealing a competitive interaction between the Hras and Kras pathways that influences clonal selection.","abstractZh":"确定肿瘤起始细胞是肿瘤生物学的根本问题。我们采用小鼠皮肤独立干细胞群的荧光谱系示踪、单细胞转录组学和双链测序来确定化学诱导皮肤肿瘤的起源。肿瘤主要起源于毛囊上部的 Lgr6+ 和/或 Lrig1+ 干细胞，而极少起源于 Lgr5+ 和 Krt19+ 的毛囊隆突。由二甲基苯并蒽启动的 Lgr6+ 干细胞对肿瘤促进剂处理产生应答，导致携带经典 Hras Q61L 突变的启动细胞发生克隆性扩增。Kras 的自发突变同样发生克隆性扩增，但除非缺失 Hras 基因，否则并不产生肿瘤，从而揭示了 Hras 与 Kras 通路之间影响克隆选择的竞争性相互作用。","tier":"1区","if":44.7},
{"pmid":"42869884","topic":"糖尿病难愈创面","title":"Rhein-induced free fatty acid generation cooperates with silver ions for biofilm-infected diabetic wound healing.","titleZh":"大黄酸诱导的游离脂肪酸生成与银离子协同促进生物膜感染的糖尿病创面愈合","journal":"Signal transduction and targeted therapy","year":"2026","date":"2026-Oct-14","edat":"2026-10-13","authors":"Du T, Cui M, Shan J, Wang S, Chen S","doi":"10.1016/j.chom.2019.11.003","abstract":"Diabetic foot infection (DFI) significantly increases the risks of hospitalization and amputation, with biofilm infections caused by methicillin-resistant Staphylococcus aureus (MRSA) and carbapenem-resistant Escherichia coli (CREC) being key drivers of treatment failure. Here, we analyzed MRSA/CREC biofilm-infected ulcer tissues from patients using proteomics and metabolomics. Compared with nonhealing tissues, healed tissues exhibit activation of low-density lipoprotein receptor (LDLR)-mediated low-density lipoprotein cholesterol (LDL-C) endocytosis and increased free fatty acid production; thus, we hypothesize a potential countermeasure against biofilms. However, the oxidative instability of free fatty acids limits their therapeutic use. Building on our findings demonstrating the potent anti-MRSA/CREC activity of rhein and its synergy with Ag⁺, we developed an injectable hydrogel for sustained codelivery of both agents. This formulation outperforms Ag⁺ monotherapy, accelerating wound closure in biofilm-infected diabetic wounds. Mechanistically, rhein binds to LDLR, upregulates its expression, and enhances the LDL-C endocytosis pathway in vascular endothelial cells to generate more free fatty acids. Among these, eicosapentaenoic acid (EPA) is identified as the most critical free fatty acid that promotes healing, as it inhibits biofilm formation and synergizes with Ag⁺ to exert antibacterial and pro-healing effects. In summary, this study identifies endogenous host lipid metabolites as \"metabolic antibiotics\" and establishes a synergistic therapeutic strategy that concurrently suppresses biofilm formation, inhibits planktonic bacteria, alleviates inflammation, and promotes tissue repair in drug-resistant biofilm-infected diabetic wounds.","abstractZh":"糖尿病足感染（DFI）显著增加住院和截肢风险，其中耐甲氧西林金黄色葡萄球菌（MRSA）和耐碳青霉烯大肠埃希菌（CREC）引起的生物膜感染是治疗失败的关键驱动因素。在此，我们采用蛋白质组学和代谢组学分析了患者的 MRSA/CREC 生物膜感染溃疡组织。与未愈合组织相比，愈合组织表现出低密度脂蛋白受体（LDLR）介导的低密度脂蛋白胆固醇（LDL-C）内吞激活以及游离脂肪酸产生增加；因此，我们推测这是一种潜在的可对抗生物膜的对策。然而，游离脂肪酸的氧化不稳定性限制了其治疗应用。基于我们先前发现大黄酸具有强效抗 MRSA/CREC 活性并与 Ag⁺ 具有协同作用，我们开发了一种可注射水凝胶用于两种药物的持续共递送。该制剂优于 Ag⁺ 单药治疗，可加速生物膜感染的糖尿病创面闭合。在机制上，大黄酸与 LDLR 结合，上调其表达，并增强血管内皮细胞中的 LDL-C 内吞通路以产生更多游离脂肪酸。其中，二十碳五烯酸（EPA）被确定为促进愈合的最关键游离脂肪酸，因为它抑制生物膜形成并与 Ag⁺ 协同发挥抗菌与促愈合作用。总之，本研究将内源性宿主脂质代谢物鉴定为“代谢性抗生素”，并建立了一种协同治疗策略，可同时抑制生物膜形成、抑制浮游细菌、减轻炎症并促进耐药生物膜感染的糖尿病创面组织修复。","tier":"1区","if":40.8},
{"pmid":"42869887","topic":"创面修复","title":"Targeting an IL-17/IL-36 pathogenic hub in hidradenitis suppurativa with a bispecific antibody.","titleZh":"以双特异性抗体靶向化脓性汗腺炎中IL-17/IL-36致病枢纽","journal":"Signal transduction and targeted therapy","year":"2026","date":"2026-Oct-14","edat":"2026-10-13","authors":"Sun Y, Mi Z, Yu Y, Wang Z, Sun L","doi":"10.1093/gpbjnl/qzaf072","abstract":"Hidradenitis suppurativa (HS) is a chronic inflammatory skin disorder with a high unmet need, particularly for treatment-resistant tunnels. Integrated multiomics analysis revealed that HS tunnels are spatially organized, self-amplifying inflammatory circuits driven by synergistic IL-17/IL-36γ activation of a unique keratinocyte subset, which activates neutrophils and inflammatory fibroblasts. This mechanistic insight coupled with spatial coenrichment of IL-17A and IL-36R provided the rationale for HB0043, a bispecific antibody that leverages IL-36R binding to locally dual-block both cytokines. HB0043 outperformed IL-17A/IL-17F bispecific and parental antibodies in vitro. In a proof-of-concept trial (NCT06895499) involving severe, tunnel-dominant Hurley Stage III HS patients, HB0043 induced promising clinical responses. At week 16, patients demonstrated an 82.13% mean percentage reduction from baseline in total abscess and inflammatory nodule count (AN), while 100% and 80% achieved HiSCR50 and HiSCR75, respectively, alongside ultrasound-confirmed tunnel regression and no major short-term safety signals. Longitudinal plasma proteomics showed suppressed inflammation and restored metabolic homeostasis. By tracking these dynamic systemic alterations alongside local structural changes, our multiomics approach bridges the gap between focal tissue lesions and global systemic disease activity. These findings establish dual blockade of IL-17A and IL-36R as a potential therapeutic strategy, offering a targeted strategy for recalcitrant disease that effectively improves the anatomical therapeutic barriers of advanced hidradenitis suppurativa, thereby demonstrating that cross-pathway bispecific antibodies can dismantle complex inflammatory circuits to achieve structural tissue healing where traditional monotherapies consistently fail.","abstractZh":"化脓性汗腺炎（HS）是一种慢性炎症性皮肤病，存在高度未满足的需求，尤其是对难治性隧道病变。整合多组学分析显示，HS隧道是空间组织化的、自我放大的炎症回路，由IL-17/IL-36γ协同激活一个独特的角质形成细胞亚群所驱动，该亚群进而激活中性粒细胞和炎症性成纤维细胞。这一机制见解，结合IL-17A与IL-36R的空间共富集，为HB0043提供了依据——HB0043是一种双特异性抗体，利用IL-36R结合在局部双重阻断这两种细胞因子。HB0043在体外优于IL-17A/IL-17F双特异性抗体和亲本抗体。在一项纳入严重、以隧道为主的Hurley III期HS患者的概念验证试验（NCT06895499）中，HB0043诱导了令人鼓舞的临床应答。第16周时，患者脓肿和炎性结节总数（AN）较基线平均下降82.13%，分别有100%和80%的患者达到HiSCR50和HiSCR75，同时超声证实隧道消退，且无重大短期安全性信号。纵向血浆蛋白质组学显示炎症受抑、代谢稳态恢复。通过追踪这些动态的系统性改变与局部结构变化，我们的多组学方法弥合了局灶性组织病变与整体系统性疾病活动之间的鸿沟。这些发现确立IL-17A与IL-36R的双重阻断作为一种潜在治疗策略，为难治性疾病提供了一种靶向策略，有效改善了晚期化脓性汗腺炎的解剖学治疗屏障，从而证明跨通路双特异性抗体能够拆解复杂的炎症回路，在传统单药治疗屡屡失败之处实现结构性组织愈合。","tier":"1区","if":40.8},
{"pmid":"42864314","topic":"创面修复","title":"Acne: epidemiology, risk factors, pathogenesis, management and cutting-edge research.","titleZh":"痤疮：流行病学、危险因素、发病机制、管理与前沿研究","journal":"Signal transduction and targeted therapy","year":"2026","date":"2026-Oct-13","edat":"2026-10-12","authors":"Li Y, Li G, Wang L, Du D, Li J","doi":"10.1111/ced.14792","abstract":"Acne vulgaris is a widespread chronic inflammatory skin condition particularly affecting the pilosebaceous unit, with its pathogenesis intricately linked to excessive sebum production, abnormal follicular keratinization, overcolonization by Cutibacterium acnes (C. acnes), and dysregulated host immune responses. Beyond its dermatological manifestations, the disorder is frequently associated with psychological comorbidities such as anxiety and depression, significantly impacting patients' quality of life. A genetic predisposition is evident, with associated polymorphisms involving pathways related to sebaceous gland activity, inflammatory regulation, and hormonal metabolism. Interactions among immune cells, including macrophages and dendritic cells, along with underlying molecular mechanisms, further contribute to its pathogenesis. Conventional acne treatments face challenges such as increasing antibiotic resistance and limited patient adherence. As a result, clinical research and practice are increasingly focusing on targeted, mechanism-based precision strategies. Recent advances in targeted biologics and vaccines directed against C. acnes have demonstrated promise in clinical studies, offering new avenues for acne management. This review provides a systematic overview of the epidemiology, risk factors, diagnostic classifications, and comorbidities associated with acne, with a particular focus on contemporary insights into its immunopathogenesis and molecular mechanisms. Additionally, it synthesizes current treatment modalities and explores emerging directions, such as acne vaccines and biologics, to serve as a reference for further mechanistic investigation and therapeutic advancement.","abstractZh":"寻常痤疮是一种广泛存在的慢性炎症性皮肤疾病，尤其累及毛囊皮脂腺单位，其发病机制与皮脂分泌过多、毛囊角化异常、痤疮丙酸杆菌（C. acnes）过度定植以及宿主免疫应答失调等因素错综复杂地联系在一起。除皮肤科表现之外，该病还经常伴发焦虑和抑郁等心理共病，从而显著影响患者的生活质量。遗传易感性显而易见，相关的基因多态性涉及与皮脂腺活性、炎症调控以及激素代谢有关的通路。包括巨噬细胞和树突状细胞在内的各类免疫细胞之间的相互作用，连同其潜在的分子机制，进一步促成了该病的发生。传统痤疮治疗面临抗生素耐药性日益增加和患者依从性有限等挑战。因此，临床研究和临床实践正日益聚焦于靶向的、基于机制的精准策略。针对痤疮丙酸杆菌的靶向生物制剂和疫苗方面的最新进展已在临床研究中显示出良好前景，为痤疮的管理提供了新的途径。本综述系统概述了痤疮的流行病学、危险因素、诊断分类以及相关共病，并特别关注有关其免疫发病机制和分子机制的当代认识。此外，本综述还综合了当前的治疗方式，并探讨了诸如痤疮疫苗和生物制剂等新兴方向，以期为进一步的机制研究和治疗进展提供参考。","tier":"1区","if":40.8},
{"pmid":"42768017","topic":"外泌体","title":"Fracture healing: from molecular and cellular mechanisms to therapeutic strategies.","titleZh":"骨折愈合：从分子与细胞机制到治疗策略","journal":"Signal transduction and targeted therapy","year":"2026","date":"2026-Sep-22","edat":"2026-09-21","authors":"Staubli F, Ten Ham RMT, Bergsma JE, Gawlitta D, Man K","doi":"10.1172/JCI133473","abstract":"Fracture healing is a highly orchestrated regenerative process that depends on precise temporal and spatial coordination of immune, vascular, neural, and skeletal signaling programs. Disruption of these interconnected pathways, whether due to local injury factors, systemic disease, aging, or metabolic dysregulation, can impair repair and result in delayed union or nonunion. Understanding the molecular mechanisms that integrate inflammation resolution, progenitor cell fate decisions, neurovascular coupling, and endochondral bone formation is therefore essential for improving clinical outcomes. Recent advances show that fracture repair is governed by dynamic signaling networks linking immune cells, mesenchymal progenitors, endothelial and neural components, and the extracellular matrix. Key pathways regulating cytokine signaling, angiogenesis, mechanotransduction, hypoxia sensing, and osteochondral differentiation have emerged as critical determinants of healing efficiency and quality. These insights have reshaped therapeutic strategies, enabling the development of targeted interventions, including growth factor and anabolic therapies, immunomodulatory agents, cell- and gene-based approaches, extracellular vesicles, and biomaterial-assisted delivery systems. In this review, we synthesize current mechanistic understanding of both physiological and impaired fracture healing, with an emphasis on intercellular signaling and pathway-level regulation. We critically evaluate emerging targeted regenerative therapies in terms of their biological rationale, precision, and translational limitations, and discuss key barriers to clinical implementation. By shifting focus from descriptive pathology to actionable signaling frameworks, this review aims to guide the rational design of next-generation therapies for bone regeneration.","abstractZh":"骨折愈合是一个高度协调的再生过程，依赖于免疫、血管、神经和骨骼信号程序在时间和空间上的精确协调。这些相互关联通路的破坏，无论源于局部损伤因素、全身性疾病、衰老还是代谢失调，均可损害修复并导致延迟愈合或不愈合。因此，理解整合炎症消退、祖细胞命运决定、神经血管耦联和软骨内成骨的分子机制，对于改善临床结局至关重要。近期进展表明，骨折修复受动态信号网络调控，该网络将免疫细胞、间充质祖细胞、内皮与神经成分以及细胞外基质联系起来。调控细胞因子信号、血管生成、机械转导、缺氧感知和骨软骨分化的关键通路已成为愈合效率和质量的关键决定因素。这些认识重塑了治疗策略，促成靶向干预措施的发展，包括生长因子和合成代谢疗法、免疫调节剂、细胞与基因治疗方法、细胞外囊泡以及生物材料辅助递送系统。在本综述中，我们综合了目前对生理性和受损骨折愈合的机制认识，重点阐述细胞间信号传导和通路水平的调控。我们从生物学依据、精确性和转化局限性方面批判性评价新兴的靶向再生疗法，并讨论临床实施的主要障碍。通过将焦点从描述性病理学转向可操作的信号框架，本综述旨在指导下一代骨再生疗法的合理设计。","tier":"1区","if":40.8},
{"pmid":"42020375","topic":"糖尿病难愈创面","title":"Macrophage metabolic reprogramming by vanadium released from glucose-responsive bio-gel accelerates diabetic wound repair.","titleZh":"葡萄糖响应性生物凝胶释放的钒通过重编程巨噬细胞代谢加速糖尿病创面修复","journal":"Signal transduction and targeted therapy","year":"2026","date":"2026-Apr-23","edat":"2026-04-22","authors":"Li J, Li Z, Han L, Xu N, Jia J","doi":"10.1016/j.heliyon.2024.e41465","abstract":"Dysregulated glucose metabolism in diabetic wound macrophages impairs polarization toward the reparative M2 phenotype, leading to compromised innate immunity, chronic inflammation, and delayed wound healing. However, effective strategies to restore macrophage metabolic function remain limited. Here, inspired by vanadium's potential to modulate glucose metabolism and the immunomodulatory properties of bioactive glasses, we developed vanadium-doped mesoporous bioactive glass nanospheres (V-MBG) to regulate macrophage-mediated inflammation in diabetic wounds. V-MBG reprogrammed the metabolic environment, promoted M2 polarization, suppressed inflammation, and significantly enhanced wound healing in diabetic models. Mechanistically, V-MBG remodeled the glycolysis-dependent energy pathway in LPS-stimulated M1 macrophages by enhancing glucose-driven oxidative phosphorylation (OXPHOS). This metabolic shift was mediated by activation of the INSR-PI3K signaling axis, which increased glucose uptake and rescued tricarboxylic acid (TCA) cycle suppression. Furthermore, V-MBG-induced citrate/acetyl-CoA metabolism contributed to M2 polarization. To achieve responsive and sustained delivery, V-MBG was incorporated into glucose-sensitive GCP hydrogels, which further accelerated wound repair by enhancing M2 macrophage polarization and mitigating inflammation. Our findings demonstrate that V-MBG is a metabolically active nanomaterial capable of reprogramming macrophage energy metabolism to improve diabetic wound regeneration. This work offers new insight into immune-metabolic regulation via material design and establishes a promising vanadium-based strategy for clinical diabetic wound therapy.","abstractZh":"糖尿病创面巨噬细胞的糖代谢失调会损害其向修复型 M2 表型的极化，导致先天免疫受损、慢性炎症和创面愈合延迟。然而，恢复巨噬细胞代谢功能的有效策略仍然有限。在此，受钒调节糖代谢的潜力以及生物活性玻璃免疫调节特性的启发，我们开发了掺钒介孔生物活性玻璃纳米球（V-MBG），用于调控糖尿病创面中巨噬细胞介导的炎症。V-MBG 重编程了代谢环境，促进 M2 极化，抑制炎症，并在糖尿病模型中显著增强创面愈合。机制上，V-MBG 通过增强葡萄糖驱动的氧化磷酸化（OXPHOS），重塑了 LPS 刺激的 M1 巨噬细胞中依赖糖酵解的能量通路。这种代谢转变由 INSR-PI3K 信号轴的激活所介导，该轴增加葡萄糖摄取并逆转三羧酸（TCA）循环的抑制。此外，V-MBG 诱导的柠檬酸/乙酰辅酶 A 代谢有助于 M2 极化。为实现响应性与持续性递送，V-MBG 被整合入葡萄糖敏感性 GCP 水凝胶中，通过增强 M2 巨噬细胞极化和减轻炎症进一步加速创面修复。我们的发现表明，V-MBG 是一种具有代谢活性的纳米材料，能够重编程巨噬细胞能量代谢以改善糖尿病创面再生。这项工作通过材料设计为免疫-代谢调控提供了新见解，并建立了一种有前景的基于钒的临床糖尿病创面治疗策略。","tier":"1区","if":40.8},
{"pmid":"40274830","topic":"糖尿病难愈创面","title":"Diabetic neuropathy: cutting-edge research and future directions.","titleZh":"糖尿病神经病变：前沿研究与未来方向","journal":"Signal transduction and targeted therapy","year":"2025","date":"2025-Apr-25","edat":"2025-04-24","authors":"Yang Y, Zhao B, Wang Y, Lan H, Liu X","doi":"10.1038/s41746-024-01224-3","abstract":"Diabetic neuropathy (DN) is a prevalent and debilitating complication of diabetes mellitus, significantly impacting patient quality of life and contributing to morbidity and mortality. Affecting approximately 50% of patients with diabetes, DN is predominantly characterized by distal symmetric polyneuropathy, leading to sensory loss, pain, and motor dysfunction, often resulting in diabetic foot ulcers and lower-limb amputations. The pathogenesis of DN is multifaceted, involving hyperglycemia, dyslipidemia, oxidative stress, mitochondrial dysfunction, and inflammation, which collectively damage peripheral nerves. Despite extensive research, disease-modifying treatments remain elusive, with current management primarily focusing on symptom control. This review explores the complex mechanisms underlying DN and highlights recent advances in diagnostic and therapeutic strategies. Emerging insights into the molecular and cellular pathways have unveiled potential targets for intervention, including neuroprotective agents, gene and stem cell therapies, and innovative pharmacological approaches. Additionally, novel diagnostic tools, such as corneal confocal microscopy and biomarker-based tests, have improved early detection and intervention. Lifestyle modifications and multidisciplinary care strategies can enhance patient outcomes. While significant progress has been made, further research is required to develop therapies that can effectively halt or reverse disease progression, ultimately improving the lives of individuals with DN. This review provides a comprehensive overview of current understanding and future directions in DN research and management.","abstractZh":"糖尿病神经病变（DN）是糖尿病一种常见且使人衰弱的并发症，显著影响患者的生活质量，并导致发病率和死亡率增加。DN影响约50%的糖尿病患者，主要以远端对称性多发性神经病变为特征，导致感觉丧失、疼痛和运动功能障碍，常引起糖尿病足溃疡和下肢截肢。DN的发病机制是多方面的，涉及高血糖、血脂异常、氧化应激、线粒体功能障碍和炎症，这些因素共同损害周围神经。尽管开展了大量研究，但能够改变疾病进程的治疗方法仍难以实现，目前的处理主要集中于症状控制。本综述探讨了DN背后的复杂机制，并重点介绍诊断和治疗策略的最新进展。对分子和细胞通路的新认识揭示了潜在的干预靶点，包括神经保护剂、基因治疗和干细胞治疗以及创新的药理学方法。此外，角膜共聚焦显微镜和基于生物标志物的检测等新型诊断工具改善了疾病的早期发现和干预。生活方式的调整和多学科护理策略可以改善患者的预后。尽管已取得重大进展，仍需进一步研究以开发能够有效阻止或逆转疾病进展的疗法，最终改善DN患者的生活。本综述全面概述了DN研究与管理领域的当前认识和未来方向。","tier":"1区","if":40.8},
{"pmid":"39472581","topic":"外泌体","title":"Human adipose and umbilical cord mesenchymal stem cell-derived extracellular vesicles mitigate photoaging via TIMP1/Notch1.","titleZh":"人脂肪和脐带间充质干细胞来源的细胞外囊泡通过TIMP1/Notch1减轻光老化","journal":"Signal transduction and targeted therapy","year":"2024","date":"2024-Oct-30","edat":"2024-10-30","authors":"Zhang H, Xiao X, Wang L, Shi X, Fu N","doi":"10.4103/1673-5374.385839","abstract":"UVB radiation induces oxidative stress, DNA damage, and inflammation, leading to skin wrinkling, compromised barrier function, and an increased risk of carcinogenesis. Addressing or preventing photoaging may offer a promising therapeutic avenue for these conditions. Recent research indicated that mesenchymal stem cells (MSCs) exhibit significant therapeutic potential for various skin diseases. Given that extracellular vesicles (EV) can deliver diverse cargo to recipient cells and elicit similar therapeutic effects, we investigated the roles and underlying mechanisms of both adipose-derived MSC-derived EV (AMSC-EV) and umbilical cord-derived MSC-derived EV (HUMSC-EV) in photoaging. Our findings indicated that in vivo, treatment with AMSC-EV and HUMSC-EV resulted in improvements in wrinkles and skin hydration while also mitigating skin inflammation and thickness alterations in both the epidermis and dermis. Additionally, in vitro studies using human keratinocytes (HaCaTs), human dermal fibroblast cells (HDFs), and T-Skin models revealed that AMSC-EV and HUMSC-EV attenuated senescence, reduced levels of reactive oxygen species (ROS) and DNA damage, and alleviated inflammation induced by UVB. Furthermore, EV treatment enhanced cell viability and migration capacity in the epidermis and promoted extracellular matrix (ECM) remodeling in the dermis in photoaged cell models. Mechanistically, proteomics results showed that TIMP1 was highly expressed in both AMSC-EV and HUMSC-EV and could exert similar effects as MSC-EV. In addition, we found that EV and TIMP1 could inhibit Notch1 and downstream targets Hes1, P16, P21, and P53. Collectively, our data suggests that both AMSC-EV and HUMSC-EV attenuate skin photoaging through TIMP1/Notch1.","abstractZh":"UVB辐射诱导氧化应激、DNA损伤和炎症，导致皮肤皱纹、屏障功能受损以及致癌风险增加。针对或预防光老化可能为这些情况提供有前景的治疗途径。近期研究表明，间充质干细胞（MSCs）对多种皮肤疾病具有显著的治疗潜力。鉴于细胞外囊泡（EV）可将多种货物递送至受体细胞并引发相似的治疗效应，我们研究了脂肪来源MSC来源EV（AMSC-EV）和脐带来源MSC来源EV（HUMSC-EV）在光老化中的作用及潜在机制。我们的发现表明，在体内，AMSC-EV和HUMSC-EV治疗改善了皱纹和皮肤水合，同时减轻了皮肤炎症以及表皮和真皮的厚度改变。此外，使用人角质形成细胞（HaCaTs）、人真皮成纤维细胞（HDFs）和T-Skin模型的体外研究显示，AMSC-EV和HUMSC-EV可减轻衰老、降低活性氧（ROS）水平和DNA损伤，并缓解UVB诱导的炎症。此外，在光老化细胞模型中，EV处理增强了表皮的细胞活力和迁移能力，并促进了真皮的细胞外基质（ECM）重塑。在机制上，蛋白质组学结果显示TIMP1在AMSC-EV和HUMSC-EV中均高表达，并可发挥与MSC-EV相似的效应。此外，我们发现EV和TIMP1可抑制Notch1及其下游靶点Hes1、P16、P21和P53。总之，我们的数据提示AMSC-EV和HUMSC-EV均通过TIMP1/Notch1减轻皮肤光老化。","tier":"1区","if":40.8},
{"pmid":"39468355","topic":"外泌体","title":"Harnessing extracellular vesicle heterogeneity for diagnostic and therapeutic applications.","titleZh":"利用细胞外囊泡异质性实现诊断与治疗应用","journal":"Nature nanotechnology","year":"2025","date":"2025-Jan","edat":"2024-10-29","authors":"Carney RP, Mizenko RR, Bozkurt BT, Lowe N, Henson T","doi":"10.1038/s41596-021-00551-z","abstract":"Extracellular vesicles (EVs) are diverse nanoparticles with large heterogeneity in size and molecular composition. Although this heterogeneity provides high diagnostic value for liquid biopsy and confers many exploitable functions for therapeutic applications in cancer detection, wound healing and neurodegenerative and cardiovascular diseases, it has also impeded their clinical translation-hence heterogeneity acts as a double-edged sword. Here we review the impact of subpopulation heterogeneity on EV function and identify key cornerstones for addressing heterogeneity in the context of modern analytical platforms with single-particle resolution. We outline concrete steps towards the identification of key active biomolecules that determine EV mechanisms of action across different EV subtypes. We describe how such knowledge could accelerate EV-based therapies and engineering approaches for mimetic artificial nanovesicle formulations. This approach blunts one edge of the sword, leaving only a single razor-sharp edge on which EV heterogeneity can be exploited for therapeutic applications across many diseases.","abstractZh":"细胞外囊泡（EVs）是多样化的纳米颗粒，在大小和分子组成上具有高度异质性。尽管这种异质性为液体活检提供了高诊断价值，并在癌症检测、创面愈合以及神经退行性疾病和心血管疾病的治疗应用中赋予了许多可利用的功能，但它也阻碍了其临床转化——因此异质性犹如一把双刃剑。在此，我们综述亚群异质性对EV功能的影响，并确定在具有单颗粒分辨率的现代分析平台背景下应对异质性的关键基石。我们概述了鉴定关键活性生物分子的具体步骤，这些分子决定不同EV亚型的作用机制。我们描述了此类知识如何加速基于EV的疗法以及模拟人工纳米囊泡制剂的工程化方法。这一方法磨钝了剑的一刃，只留下一道锋利的刃，使EV异质性可被用于多种疾病的治疗应用。","tier":"1区","if":38.1},
{"pmid":"38740936","topic":"糖尿病难愈创面","title":"Janus liposozyme for the modulation of redox and immune homeostasis in infected diabetic wounds.","titleZh":"Janus脂质酶体用于调节感染性糖尿病创面的氧化还原与免疫稳态","journal":"Nature nanotechnology","year":"2024","date":"2024-Aug","edat":"2024-05-13","authors":"Wei T, Pan T, Peng X, Zhang M, Guo R","doi":"10.1038/s41565-024-01660-y","abstract":"Diabetic foot ulcers often become infected, leading to treatment complications and increased risk of loss of limb. Therapeutics to manage infection and simultaneously promote healing are needed. Here we report on the development of a Janus liposozyme that treats infections and promotes wound closure and re-epithelialization. The Janus liposozyme consists of liposome-like selenoenzymes for reactive oxygen species (ROS) scavenging to restore tissue redox and immune homeostasis. The liposozymes are used to encapsulate photosensitizers for photodynamic therapy of infections. We demonstrate application in methicillin-resistant Staphylococcus aureus-infected diabetic wounds showing high ROS levels for antibacterial function from the photosensitizer and nanozyme ROS scavenging from the liposozyme to restore redox and immune homeostasis. We demonstrate that the liposozyme can directly regulate macrophage polarization and induce a pro-regenerative response. By employing single-cell RNA sequencing, T cell-deficient Rag1-/- mice and skin-infiltrated immune cell analysis, we further reveal that IL-17-producing γδ T cells are critical for mediating M1/M2 macrophage transition. Manipulating the local immune homeostasis using the liposozyme is shown to be effective for skin wound repair and tissue regeneration in mice and mini pigs.","abstractZh":"糖尿病足溃疡常发生感染，导致治疗复杂化并增加截肢风险。亟需既能控制感染又能同时促进愈合的治疗手段。在此我们报道一种Janus脂质酶体的开发，其可治疗感染并促进创面闭合和再上皮化。Janus脂质酶体由类脂质体硒酶组成，用于清除活性氧（ROS）以恢复组织氧化还原和免疫稳态。该脂质酶体用于包封光敏剂，以实现感染的光动力治疗。我们展示了其在耐甲氧西林金黄色葡萄球菌感染的糖尿病创面中的应用，该创面ROS水平高，光敏剂发挥抗菌功能，脂质酶体的纳米酶清除ROS以恢复氧化还原和免疫稳态。我们证明该脂质酶体可直接调控巨噬细胞极化并诱导促再生反应。通过单细胞RNA测序、T细胞缺陷Rag1-/-小鼠及皮肤浸润免疫细胞分析，我们进一步揭示产生IL-17的γδ T细胞对介导M1/M2巨噬细胞转换至关重要。使用该脂质酶体调控局部免疫稳态被证明对小鼠和迷你猪的皮肤创面修复及组织再生有效。","tier":"1区","if":38.1},
{"pmid":"42816584","topic":"创面修复","title":"Prefibrotic bone marrow microenvironment is a hallmark of clonal hematopoiesis.","titleZh":"纤维化前骨髓微环境是克隆性造血的标志性特征","journal":"Nature immunology","year":"2026","date":"2026-Nov","edat":"2026-09-30","authors":"Aguilar-Navarro AG, Edun G, Gower M, Kant J, Li X","doi":"10.1038/s41596-023-00881-0","abstract":"Clonal hematopoiesis of indeterminate potential is associated with systemic inflammation and increased malignant risk in humans, yet understanding of how it reshapes the bone marrow (BM) microenvironment has been limited. Using single-cell transcriptomic profiling of freshly isolated BM samples, combined with histological and spatial transcriptomic analyses, we identified fibro-inflammatory remodeling as a hallmark of clonal hematopoiesis of indeterminate potential. Fibroblasts were markedly expanded and acquired cancer-associated fibroblast-like transcriptional states, while mesenchymal and vascular cells upregulated collagen production and extracellular matrix remodeling pathways. Spatial transcriptomics revealed discrete fiber-enriched regions populated by active and CXCL12+ fibroblasts, macrophages and lymphoid cells. These regions exhibited major enrichment of proinflammatory pathways, including transforming growth factor-beta and tumor necrosis factor signaling, identifying them as spatially confined inflammatory hubs within the BM. Collectively, these findings establish fibro-inflammatory BM remodeling as a defining feature of clonal hematopoiesis of indeterminate potential, linking it to prefibrotic stromal changes and niche reorganization that may facilitate progression to overt malignancy.","abstractZh":"意义未明的克隆性造血与人类系统性炎症及恶性肿瘤风险增加相关，但对其如何重塑骨髓（BM）微环境的认识仍然有限。通过对新鲜分离的 BM 样本进行单细胞转录组分析，并结合组织学和空间转录组分析，我们确定纤维炎症性重塑是意义未明克隆性造血的标志性特征。成纤维细胞显著扩增并获得类癌相关成纤维细胞的转录状态，同时间充质细胞和血管细胞上调胶原产生及细胞外基质重塑通路。空间转录组学揭示了离散的纤维富集区域，其中分布着活化成纤维细胞和 CXCL12+ 成纤维细胞、巨噬细胞及淋巴样细胞。这些区域表现出促炎通路的显著富集，包括转化生长因子-β 和肿瘤坏死因子信号，表明它们是 BM 内空间局限的炎症枢纽。总之，这些发现确立了纤维炎症性 BM 重塑是意义未明克隆性造血的界定性特征，并将其与纤维化前基质改变和龛重塑联系起来，后者可能促进向显性恶性肿瘤的进展。","tier":"1区","if":27.7},
{"pmid":"42717253","topic":"创面修复","title":"Microbial adhesion promotes Piezo1 activation to initiate innate immunity.","titleZh":"微生物黏附促进 Piezo1 激活从而启动固有免疫","journal":"Nature immunology","year":"2026","date":"2026-Nov","edat":"2026-09-10","authors":"Stucchi G, Galli M, Cozzi S, Celant A, Marongiu L","doi":"10.1073/pnas.2018488117","abstract":"How mammals mount an effective immune response against infectious agents remains unresolved. Here we identify microbial adhesion to myeloid cells as a critical initiating event that precedes pattern recognition receptor (PRR) engagement. Using a skin infection model with pathogenic bacteria and fungi, we demonstrate that neutrophil recruitment occurs in two sequential phases. The early phase is PRR-independent and instead driven by microbial adhesion, which engages the mechanosensitive ion channel Piezo1 to promote leukotriene (LT)B4 production. Together with interleukin-1α, LTB4 induces CXCL1 release, triggering neutrophil infiltration via the same circuit at play during sterile inflammation. By contrast, the late phase is toll-like receptor (TLR)- and CXCL2-dependent, marking a transition to the canonical, pathogen-driven response. Our findings uncover microbial adhesion as a previously unrecognized danger signal that activates innate immunity via mechanotransduction, revealing a paradigm of how immune responses to infection are initiated.","abstractZh":"哺乳动物如何对感染因子发起有效的免疫应答仍未阐明。在此，我们确定微生物对髓系细胞的黏附是发生于模式识别受体（PRR）参与之前的关键启动事件。利用致病细菌和真菌的皮肤感染模型，我们证明中性粒细胞募集按两个连续阶段发生。早期阶段不依赖 PRR，而由微生物黏附驱动，后者激活机械敏感性离子通道 Piezo1 以促进白三烯（LT）B4 产生。LTB4 与白细胞介素-1α 共同诱导 CXCL1 释放，通过与无菌性炎症中相同的环路触发中性粒细胞浸润。相比之下，晚期阶段依赖 Toll 样受体（TLR）和 CXCL2，标志着向经典病原体驱动应答的转变。我们的发现揭示了微生物黏附是一种此前未被认识的危险信号，它通过机械转导激活固有免疫，从而揭示了对感染免疫应答如何启动的新范式。","tier":"1区","if":27.7},
{"pmid":"42919907","topic":"创面修复","title":"Hydrogel for sustained and localized delivery of a regulatory T cell-inducing agent promotes bone regeneration.","titleZh":"持续局部递送调节性 T 细胞诱导剂的水凝胶促进骨再生","journal":"Nature biomedical engineering","year":"2026","date":"2026-Oct-23","edat":"2026-10-23","authors":"Nasello G, Lafuente-Gómez N, Krajnovic L, Wu DT, Dacus MT","doi":"10.12688/f1000research.11622.4","abstract":"Local activation of regulatory T (Treg) cells represents a promising strategy for wound repair and tissue regeneration. However, current Treg-based therapies rely on adoptive cell transfer, which requires ex vivo expansion and reinfusion, posing challenges to donor variability and tissue specificity. Here we engineer a hydrogel-based system for in situ Treg activation at injury sites through the controlled release of AS2863619 (AS), a cyclin-dependent kinase inhibitor. AS is incorporated into collagen hydrogels at concentrations exceeding its solubility limit, reducing burst release and extending the release half-life. This continuous exposure to Treg-inducing agents stabilizes Foxp3 expression in CD4+ T cells, thereby enabling Treg induction and stabilization. The incorporation of laponite nanoparticles further slows AS release and prolongs drug retention. In a calvarial bone-defect model, AS-loaded hydrogels induce dose-dependent Treg cell activation, reduce pro-inflammatory macrophage responses and enhance bone regeneration. Notably, AS-laponite hydrogels achieve complete defect bridging in some cases. By providing spatiotemporal control over Treg populations without the need for cell isolation and expansion, this approach offers a scalable alternative for immunomodulation and tissue repair.","abstractZh":"调节性 T（Treg）细胞的局部激活是创面修复与组织再生的一种有前景的策略。然而，现有的基于 Treg 的疗法依赖过继性细胞转移，需要体外扩增和回输，在供者差异和组织特异性方面存在挑战。在此，我们设计了一种基于水凝胶的系统，通过控释细胞周期蛋白依赖性激酶抑制剂 AS2863619（AS）在损伤部位原位激活 Treg。将 AS 以超过其溶解度极限的浓度掺入胶原水凝胶，可减少突释并延长释放半衰期。这种对 Treg 诱导剂的持续暴露稳定了 CD4+ T 细胞中 Foxp3 的表达，从而实现 Treg 的诱导与稳定。掺入锂皂石纳米颗粒可进一步减缓 AS 释放并延长药物滞留。在颅骨缺损模型中，负载 AS 的水凝胶诱导剂量依赖性的 Treg 细胞激活，减少促炎性巨噬细胞反应并增强骨再生。值得注意的是，AS-锂皂石水凝胶在部分病例中实现了缺损的完全桥接。该方法无需细胞分离和扩增即可实现对 Treg 群体的时空控制，为免疫调节和组织修复提供了一种可规模化的替代方案。","tier":"1区","if":26.8},
{"pmid":"42880288","topic":"整形医学","title":"Skin fibroblast lineage tracing reveals layer-specific cooperation in wound repair.","titleZh":"皮肤成纤维细胞谱系示踪揭示创面修复中的分层协同作用","journal":"Cell stem cell","year":"2026","date":"2026-Oct-15","edat":"2026-10-15","authors":"Guo Z, Xia T, Zhang Z, Wang H, He S","doi":"10.1016/j.stem.2026.09.010","abstract":"Skin fibroblasts exhibit remarkable heterogeneity across their multilayered cutaneous architecture, yet their roles during wound repair remain elusive, mainly due to the lack of layer-specific genetic tools. Here, we employed a dual-recombinase strategy to develop genetic lineage-tracing tools for all five layers of skin fibroblasts: papillary, reticular, hypodermal, panniculus carnosus (PC), and fascia fibroblasts. Our study revealed an intricate spatiotemporal pattern of fibroblast contributions across different wound severities. Temporally, deep wounds elicited a sequential contribution of these fibroblasts in three stages, while superficial wounds involved two. The early-contributing fibroblasts predominantly occupied the wound bed during the closure stage, while subsequently recruited populations mainly entered during tissue remodeling and scar formation. Spatially, as remodeling progressed, fibroblasts reorganized into a hierarchical arrangement closely mirroring their pre-injury spatial distribution. Our study elucidates the coordinated spatiotemporal interplay of fibroblasts during wound repair and may spur novel therapeutic modalities and interventions for cutaneous healing.","abstractZh":"皮肤成纤维细胞在其多层皮肤结构中表现出显著的异质性，然而由于缺乏层特异性的遗传学工具，它们在创面修复过程中的作用仍不清楚。在此，我们采用双重组酶策略，为全部五层皮肤成纤维细胞——乳头层、网状层、皮下层、肉膜肌（panniculus carnosus, PC）和筋膜层成纤维细胞——开发了遗传谱系示踪工具。我们的研究揭示了成纤维细胞在不同创面严重程度下复杂的时空贡献模式。在时间上，深层创面引发这些成纤维细胞分三个阶段的序贯贡献，而浅层创面仅涉及两个阶段。早期贡献的成纤维细胞在闭合阶段主要占据创面床，而后续招募的细胞群主要在组织重塑和瘢痕形成期间进入。在空间上，随着重塑进展，成纤维细胞重组为层级排列，与其损伤前的空间分布高度一致。我们的研究阐明了成纤维细胞在创面修复过程中的协同时空互作，并可能促进皮肤愈合的新型治疗方式与干预措施的开发。","tier":"1区","if":19.8},
{"pmid":"39729995","topic":"糖尿病难愈创面","title":"Spatiotemporal single-cell roadmap of human skin wound healing.","titleZh":"人皮肤创面愈合的时空单细胞图谱","journal":"Cell stem cell","year":"2025","date":"2025-Mar-06","edat":"2024-12-27","authors":"Liu Z, Bian X, Luo L, Björklund ÅK, Li L","doi":"10.1016/j.stem.2024.11.013","abstract":"Wound healing is vital for human health, yet the details of cellular dynamics and coordination in human wound repair remain largely unexplored. To address this, we conducted single-cell multi-omics analyses on human skin wound tissues through inflammation, proliferation, and remodeling phases of wound repair from the same individuals, monitoring the cellular and molecular dynamics of human skin wound healing at an unprecedented spatiotemporal resolution. This singular roadmap reveals the cellular architecture of the wound margin and identifies FOSL1 as a critical driver of re-epithelialization. It shows that pro-inflammatory macrophages and fibroblasts sequentially support keratinocyte migration like a relay race across different healing stages. Comparison with single-cell data from venous and diabetic foot ulcers uncovers a link between failed keratinocyte migration and impaired inflammatory response in chronic wounds. Additionally, comparing human and mouse acute wound transcriptomes underscores the indispensable value of this roadmap in bridging basic research with clinical innovations.","abstractZh":"创面愈合对人类健康至关重要，但人类创面修复中细胞动态与协调的细节在很大程度上仍未被探索。为此，我们对来自同一个体的炎症期、增殖期和重塑期创面修复阶段的人皮肤创面组织进行了单细胞多组学分析，以前所未有的时空分辨率监测人皮肤创面愈合的细胞和分子动态。这一独特的图谱揭示了创面边缘的细胞结构，并确定FOSL1是再上皮化的关键驱动因子。它显示促炎巨噬细胞和成纤维细胞在不同愈合阶段像接力赛一样依次支持角质形成细胞迁移。与静脉性溃疡和糖尿病足溃疡的单细胞数据比较，揭示了慢性创面中角质形成细胞迁移失败与炎症反应受损之间的联系。此外，比较人和小鼠急性创面转录组，凸显了该图谱在连接基础研究与临床创新方面不可或缺的价值。","tier":"1区","if":19.8},
{"pmid":"42910095","topic":"细胞衰老","title":"Microenvironmental barriers to healing in osteoradionecrosis and opportunities for regenerative intervention.","titleZh":"骨放射性坏死中阻碍愈合的微环境屏障及再生干预的机遇","journal":"Bioactive materials","year":"2027","date":"2027-Mar","edat":"2026-10-23","authors":"La Croix AE, Torres Gouveia ME, Bertone PM, Nemanic NM, Bahney CS","doi":"10.2217/RME-2020-0042","abstract":"Osteoradionecrosis (ORN) is a debilitating sequela of radiotherapy (RT) for head and neck cancer (HNC), characterized by persistent bone exposure or radiographic non-viability and profound tissue repair failure. Despite advances in radiation delivery and clinical management, ORN remains challenging to treat, with therapeutic strategies largely focused on symptom control, infection mitigation, or surgical reconstruction rather than restoration of regenerative capacity. Emerging evidence suggests that radiation-induced cellular senescence represents a central and underrecognized driver of ORN pathophysiology. Ionizing radiation disrupts the bone microenvironment through sustained vascular injury, impaired osteogenic-angiogenic coupling, chronic inflammation, and the accumulation of senescent bone-resident and stromal cells that secrete a pro-inflammatory senescence-associated secretory phenotype (SASP). Together, these changes create a hostile niche that suppresses bone remodeling and wound healing long after radiation exposure. This review synthesizes current understanding of radiation-induced injury to the bone microenvironment, critically evaluates existing classification systems and treatment strategies for ORN, and examines emerging regenerative approaches. We further propose senotherapeutic strategies targeting radiation-induced cellular senescence as a complementary and potentially transformative avenue to restore tissue repair capacity. By integrating regenerative biomaterials with targeted modulation of senescence, future therapies may move beyond palliation toward true biological resolution of ORN. Biomaterial delivery systems (e.g., injectable hydrogels, mineral composite scaffolds, and cryogel platforms) are emerging as promising vehicles for spatiotemporally controlled senotherapeutic delivery within the irradiated bone niche.","abstractZh":"骨放射性坏死（osteoradionecrosis，ORN）是头颈部肿瘤（head and neck cancer，HNC）放疗（radiotherapy，RT）后一种严重致残的后遗症，其特征为持续性骨暴露或影像学上骨组织失去活性，以及严重的组织修复失败。尽管放射投照技术与临床管理已取得进步，ORN的治疗仍具挑战性，现有治疗策略主要集中于症状控制、感染控制或手术重建，而非恢复再生能力。新出现的证据提示，放射诱导的细胞衰老是ORN病理生理学中一个核心却未被充分认识的驱动因素。电离辐射通过持续存在的血管损伤、成骨-血管生成偶联受损、慢性炎症，以及衰老的骨驻留细胞和基质细胞蓄积（这些细胞分泌促炎的衰老相关分泌表型，senescence-associated secretory phenotype，SASP）而破坏骨微环境。上述改变共同形成一个恶劣的微环境生态位，在放射暴露后很长时间内持续抑制骨重塑与创面愈合。本综述总结了目前对放射所致骨微环境损伤的认识，批判性地评价了ORN现有的分类体系与治疗策略，并探讨了新兴的再生方法。我们进一步提出以放射诱导的细胞衰老为靶点的衰老治疗（senotherapeutic）策略，作为恢复组织修复能力的一种补充性、且可能具有变革意义的途径。通过将再生生物材料与衰老的靶向调控相结合，未来的治疗有望超越姑息治疗，实现ORN真正的生物学转归。生物材料递送系统（如可注射水凝胶、矿物复合支架和冷冻凝胶平台）正逐渐成为在受照射骨微环境内实现时空可控衰老治疗递送的有前景的载体。","tier":"1区","if":18.0},
{"pmid":"42898399","topic":"糖尿病难愈创面","title":"Theranostic peptide-selenium hydrogel targeting NETs-mitochondrial dysfunction-pyroptosis axis for chronic diabetic wound repair.","titleZh":"靶向NETs-线粒体功能障碍-细胞焦亡轴的诊疗一体化肽-硒水凝胶用于慢性糖尿病创面修复","journal":"Bioactive materials","year":"2027","date":"2027-Mar","edat":"2026-10-20","authors":"Dan X, Chen H, Li S, Yang P, Ju Y","doi":"10.1002/adma.202511804","abstract":"Chronic diabetic wounds are characterized by persistent inflammation, elevated oxidative stress, and impaired angiogenesis. However, effective strategies that simultaneously elucidate the underlying mechanisms and enable precise interventions remain scarce. This study aims to identify the neutrophil extracellular traps (NETs)-mitochondrial dysfunction-pyroptosis pathway as a key driver of impaired angiogenesis in diabetic wounds and to construct an intelligent composite hydrogel with pH-responsiveness and monitoring functions. The system utilizes a pH-responsive oxidized astragalus polysaccharide-gelatin hydrogel matrix that loads and enables the on-demand release of composite particles containing selenium and the antimicrobial peptide Andersonin-W1. These particles inhibit NETs formation, improve mitochondrial function, and reduce pyroptosis. Additionally, the system incorporates pH-responsive fluorescent carbon dots for visual monitoring of the wound microenvironment. In vitro and in vivo experiments demonstrate that the composite hydrogel effectively modulates the pathological axis, accelerates diabetic wound healing, and simultaneously enables visualization of the wound microenvironment. Overall, by integrating clinical single-cell transcriptomic analyses with in vitro and in vivo experiments, this study elucidates the critical role of the NETs-mitochondrial dysfunction-pyroptosis axis in diabetic nonhealing wounds and proposes an integrated platform for visual surveillance and precision treatment.","abstractZh":"慢性糖尿病创面的特征为持续性炎症、氧化应激升高和血管生成受损。然而，能够同时阐明其内在机制并实现精准干预的有效策略仍然匮乏。本研究旨在确定中性粒细胞胞外诱捕网（neutrophil extracellular traps，NETs）-线粒体功能障碍-细胞焦亡通路是糖尿病创面血管生成受损的关键驱动因素，并构建一种具有pH响应性和监测功能的智能复合水凝胶。该系统采用pH响应的氧化黄芪多糖-明胶水凝胶基质，负载并实现含硒复合颗粒与抗菌肽Andersonin-W1的按需释放。这些颗粒可抑制NETs形成、改善线粒体功能并减少细胞焦亡。此外，该系统还掺入pH响应荧光碳点，用于对创面微环境进行可视化监测。体外和体内实验表明，该复合水凝胶可有效调控上述病理轴、加速糖尿病创面愈合，同时实现对创面微环境的可视化。总体而言，本研究通过将临床单细胞转录组分析与体外、体内实验相结合，阐明了NETs-线粒体功能障碍-细胞焦亡轴在糖尿病难愈创面中的关键作用，并提出了一种用于可视化监测与精准治疗的一体化平台。","tier":"1区","if":18.0},
